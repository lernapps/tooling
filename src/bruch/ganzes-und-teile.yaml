# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Ganzes und Teile
description: Du erkennst, wann ein Teil zu einem Bruch gehört, und nennst Halbe, Drittel und Viertel.
competencies: [brueche-begriff]
blocks:
  - type: section
    id: einstieg
    title: Gerecht teilen
    blocks:
      - type: text
        text: |
          Nach dieser Seite weißt du, wann ein Teil von einem Ganzen einen Namen wie „ein Viertel“ bekommt. Du brauchst
          nur Zahlen bis 12 und das Teilen im Alltag
          ([natürliche Zahlen auf der Lernkarte](https://lernapps.net/apps/map/mathematik/c/natuerliche-zahlen/)).
      - type: text
        text: |
          Drei Kinder teilen eine Pizza. Gerecht ist es nur, wenn jedes Kind ein gleich großes Stück bekommt. Dann
          kannst du sagen, welchen Teil der Pizza jedes Kind hat.
  - type: section
    id: erklaerung
    title: Das Ganze in gleich große Teile
    blocks:
      - type: text
        text: |
          Ein **Ganzes** kann eine Pizza, eine Tafel Schokolade oder ein Streifen Papier sein. Teilst du es in
          **gleich große Teile**, hat jedes Teil einen Namen. Die Bilder zeigen dasselbe Muster. Das Ganze ist jeweils
          die ganze Form. Der gestreifte Teil ist das, was gemeint ist.
      - type: figure
        image: images/halb.svg
        source: eigene Zeichnung
        licence: CC-BY-4.0
        alt: Ein Rechteck in zwei gleich große Teile geteilt, ein Teil ist blau gestreift.
        caption: "Zwei gleich große Teile, einer gestreift: ein Halb."
      - type: figure
        image: images/drittel.svg
        source: eigene Zeichnung
        licence: CC-BY-4.0
        alt: Ein Kreis in drei gleich große Teile geteilt, ein Teil ist blau gestreift.
        caption: "Drei gleich große Teile, einer gestreift: ein Drittel."
      - type: figure
        image: images/viertel.svg
        source: eigene Zeichnung
        licence: CC-BY-4.0
        alt: Ein Rechteck in vier gleich große Teile geteilt, ein Teil ist blau gestreift.
        caption: "Vier gleich große Teile, einer gestreift: ein Viertel."
      - type: text
        text: |
          Der Name sagt, in wie viele gleich große Teile das Ganze geteilt ist: ein Halb bei 2 Teilen, ein Drittel bei
          3 Teilen, ein Viertel bei 4 Teilen, ein Fünftel bei 5 Teilen und so weiter. Wichtig ist das Wort „gleich
          groß“. Sind die Teile verschieden groß, ist keiner davon ein Drittel, auch wenn es drei Teile sind.
  - type: section
    id: beispiel
    title: Beispiel mit einem Kuchen
    blocks:
      - type: example
        title: Ein Kuchen für vier
        blocks:
          - type: text
            text: |
              Ein Kuchen wird in 4 gleich große Stücke geschnitten, für jedes Kind eins. Jedes Kind bekommt also ein
              Viertel. Wären die Stücke verschieden groß, bekäme kein Kind ein Viertel.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: drittel-oder-nicht
        text: Der Streifen ist in drei Teile geteilt, ein Teil ist gestreift. Ist der gestreifte Teil ein Drittel?
        material:
          - type: figure
            image: images/ungleiche-teile.svg
            source: eigene Zeichnung
            licence: CC-BY-4.0
            alt: Ein Rechteck, das in drei Teile geteilt ist. Die Teile sind verschieden breit. Der linke Teil ist gestreift.
            caption: "Vergleiche die Breite der drei Teile."
        options:
          - text: Ja, es sind drei Teile und einer ist gestreift.
            correct: false
            info: "Es sind zwar drei Teile, aber sie sind verschieden breit. Ein Drittel braucht drei gleich große Teile."
          - text: Nein, die drei Teile sind nicht gleich groß.
            correct: true
            info: "Richtig: Nur bei gleich großen Teilen heißt ein Teil ein Drittel."
          - text: Nein, es müssten vier Teile sein.
            correct: false
            info: "Bei vier gleich großen Teilen wäre jeder ein Viertel. Für ein Drittel braucht man drei gleich große Teile."
        hint: Vergleiche, ob alle drei Teile gleich breit sind.
        explanation: Die Teile sind verschieden breit. Darum ist der gestreifte Teil kein Drittel.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
      - type: number
        id: teile-aus-namen
        text: Eine Pizza ist so in gleich große Stücke geschnitten, dass jedes Stück ein Fünftel ist. In wie viele Stücke ist die Pizza geteilt?
        answer: 5
        tolerance: 0
        mistakes:
          - answer: 4
            message: "Ein Viertel gehört zu 4 Teilen. Ein Fünftel gehört zu der Zahl, die im Namen steckt."
        hint: Die Zahl steckt im Namen des Teils.
        explanation: Fünftel kommt von fünf. Die Pizza ist in 5 gleich große Stücke geteilt.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
      - type: single-choice
        id: kuchen-gerecht
        text: Sechs Kinder teilen einen Kuchen gerecht. Welchen Teil des Kuchens bekommt jedes Kind?
        options:
          - text: ein Sechstel
            correct: true
            info: "Richtig: 6 gleich große Stücke, jedes ist ein Sechstel."
          - text: ein Fünftel
            correct: false
            info: "Ein Fünftel gehört zu 5 gleich großen Stücken. Hier sind es 6 Kinder, also 6 Stücke."
          - text: ein Halb
            correct: false
            info: "Ein Halb gehört zu 2 gleich großen Stücken, nicht zu 6."
        hint: Wie viele gleich große Stücke braucht man?
        explanation: Für 6 Kinder braucht man 6 gleich große Stücke. Jedes Stück ist ein Sechstel des Kuchens.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
