# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Einen Bruch darstellen
description: "Einen gegebenen Bruch an einem Streifen färben: Der Nenner sagt, wie viele Teile es gibt, der Zähler, wie viele du färbst."
competencies: [brueche-begriff]
blocks:
  - type: section
    id: einstieg
    title: Einstieg
    blocks:
      - type: text
        text: |
          Auf der letzten Seite hast du aus einem Bild einen Bruch gemacht. Jetzt drehst du es um: Du bekommst einen
          Bruch und zeichnest den Anteil. Im Text schreiben wir einen Bruch manchmal mit Schrägstrich, zum Beispiel
          5/6. Das ist derselbe Bruch wie $\frac{5}{6}$: „fünf Sechstel“. Du brauchst nur natürliche Zahlen und das Teilen
          ([natürliche Zahlen auf der Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/natuerliche-zahlen/)).
  - type: section
    id: regel
    title: So gehst du vor
    blocks:
      - type: text
        text: |
          1. Lies den **Nenner**: Er sagt, in wie viele gleich große Teile das Ganze geteilt ist.
          2. Lies den **Zähler**: Er sagt, wie viele dieser Teile du färbst.
          3. Färbe genau so viele Teile. Welche es sind, ist egal, sie müssen nur zum selben Streifen gehören.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: 5/6 färben
        blocks:
          - type: text
            text: "Der Nenner ist 6: Der Streifen hat 6 gleich große Teile. Der Zähler ist 5: Du färbst 5 davon."
          - type: figure
            image: images/streifen-5-von-6.svg
            alt: Ein Streifen, in sechs gleich große Teile geteilt. Fünf Teile sind gefärbt, eins ist weiß.
            caption: So sieht der Bruch fünf Sechstel am Streifen aus.
            source: eigene Zeichnung
            licence: CC-BY-4.0
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: text
        text: |
          Gleich siehst du einen Streifen. Er ist schon in gleich große Teile geteilt. Tippe auf die Teile, die du
          färben willst, und drücke dann „Prüfen“. Mit „Neue Aufgabe“ bekommst du andere Zahlen.
      - type: vue-component
        id: bruch-faerben
        component: BruchFaerben
        props:
          task: "Der Streifen hat {n} gleich große Teile. Färbe den Bruch {z}/{n}."
          cell: Teil {c}
          mistakes:
            - "Du hast {c} Teile gefärbt. Das ist der Rest. Der Zähler sagt, wie viele Teile du färbst, nicht wie viele übrig bleiben."
            - "Du hast alle {n} Teile gefärbt. Die Zahl unter dem Bruchstrich sagt nur, wie viele Teile der Streifen hat."
        examples:
          accepted:
            - { answer: 1, seed: 1 }
          rejected:
            - { answer: 7, seed: 1 }
            - { answer: 8, seed: 1 }
            - { answer: 0 }
      - type: generated
        id: bruch-schokolade
        given:
          n: { int: [5, 12] }
          z: { int: [2, 8] }
        where: ["z < n", "n != 2 * z"]
        task:
          text: "Eine Tafel Schokolade hat {{n}} gleich große Stücke. Du isst $\\frac{{{z}}}{{{n}}}$ der Tafel. Wie viele Stücke hast du gegessen?"
        answer: { value: "z", compare: number }
        mistakes:
          - {
              value: "n - z",
              message: "Das sind die Stücke, die übrig bleiben. Gefragt sind die, die du gegessen hast.",
            }
          - { value: "n", message: "Das sind alle Stücke der Tafel. Der Nenner sagt nur, wie viele es sind." }
        hint: "Der Zähler sagt, wie viele Teile gemeint sind."
        steps:
          - "Der Nenner {{n}} sagt: Die Tafel hat {{n}} gleich große Stücke."
          - "Der Zähler {{z}} sagt: Du hast {{z}} davon gegessen."
      - type: generated
        id: bruch-pizza-uebrig
        given:
          n: { int: [5, 12] }
          z: { int: [2, 8] }
        where: ["z < n", "n != 2 * z"]
        task:
          text: "Eine Pizza ist in {{n}} gleich große Stücke geschnitten. Du isst $\\frac{{{z}}}{{{n}}}$ der Pizza. Wie viele Stücke sind noch übrig?"
        answer: { value: "n - z", compare: number }
        mistakes:
          - { value: "z", message: "Das sind die Stücke, die du gegessen hast. Gefragt sind die, die noch da sind." }
          - { value: "n", message: "Das sind alle Stücke der Pizza, auch die gegessenen." }
        hint: "Wie viele Stücke gab es am Anfang? Wie viele davon hast du gegessen?"
        steps:
          - "Die Pizza hat {{n}} Stücke, davon hast du {{z}} gegessen."
          - "Übrig sind {{n}} − {{z}} = {{answer}} Stücke."
      - type: single-choice
        id: bruch-bedeutung
        text: Was sagt der Bruch 5/6 über einen Streifen?
        options:
          - text: Der Streifen hat 5 gleich große Teile, 6 davon sind gefärbt.
            correct: false
            info: Das geht nicht. Man kann nicht mehr Teile färben, als der Streifen hat.
          - text: Der Streifen hat 6 gleich große Teile, 5 davon sind gefärbt.
            correct: true
            info: Der Nenner 6 zählt die Teile des Ganzen, der Zähler 5 die gefärbten.
          - text: Der Streifen hat 11 gleich große Teile.
            correct: false
            info: Zähler und Nenner werden nicht addiert. Die Teile des Ganzen zählt allein der Nenner.
        explanation: Fünf Sechstel heißt, das Ganze ist in 6 gleich große Teile geteilt und 5 davon sind gemeint.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
      - type: true-false
        id: bruch-sechstel
        text: Für den Bruch 2/6 teilst du das Ganze in 6 gleich große Teile und färbst 2 davon.
        answer: true
        explanation: Der Nenner 6 sagt, wie viele gleich große Teile es sind. Der Zähler 2 sagt, wie viele davon du färbst.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
      - type: true-false
        id: bruch-zaehler-teile
        text: Für den Bruch 3/8 teilst du das Ganze in 3 gleich große Teile und färbst 8 davon.
        answer: false
        explanation: Es ist umgekehrt. Der Nenner 8 sagt, in wie viele Teile das Ganze geteilt ist, der Zähler 3, wie viele du färbst.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
