# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Messen in der Reihenschaltung
description: "Stromstärke und Spannungen in der Reihenschaltung messen und vergleichen."
competencies: [reihenschaltung]
blocks:
  - type: section
    id: einstieg
    title: Was messen wir in der Reihenschaltung?
    blocks:
      - type: text
        text: |
          Du kennst die Reihenschaltung und weißt, wie man Stromstärke und Spannung misst. Jetzt misst du in einer
          Reihenschaltung an mehreren Stellen und vergleichst die Werte.
  - type: section
    id: erklaerung
    title: Messwerte vergleichen
    blocks:
      - type: figure
        image: images/reihenschaltung-3.svg
        alt: Zeichnung eines Stromkreises mit Batterie und zwei Lampen L1 und L2 hintereinander. Die Stellen 1, 2 und 3 liegen in der Leitung, 1 vor L1, 2 zwischen den Lampen, 3 nach L2.
        caption: Die Stromstärke wird an den Stellen 1, 2 und 3 gemessen, die Spannung an L1 und an L2.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Messwerte einer Reihenschaltung mit zwei gleichen Lampen (Beispielwerte)
        header: [Messgröße, Wert]
        rowHeaders: true
        rows:
          - ["Stromstärke an Stelle 1", "0,30 A"]
          - ["Stromstärke an Stelle 2", "0,30 A"]
          - ["Stromstärke an Stelle 3", "0,30 A"]
          - ["Spannung an L1", "1,5 V"]
          - ["Spannung an L2", "1,5 V"]
          - ["Spannung der Batterie", "3,0 V"]
      - type: text
        text: |
          **Die Stromstärke** ist an allen Stellen gleich groß, vor, zwischen und nach den Lampen. Das hast du schon
          bei der Stromstärke gesehen: Der Strom wird nicht weniger.

          **Die Spannungen** an den einzelnen Lampen ergeben zusammen die Spannung der Batterie: Die Batterie treibt den
          Strom durch beide Lampen, und jede Lampe bekommt einen Teil davon.
      - type: note
        title: Ohne Rechnen mit Widerstand
        blocks:
          - type: text
            text: |
              Mit gleichen Lampen sind die Teilspannungen gleich groß. Bei verschiedenen Lampen sind sie verschieden. Wie
              genau sie sich verteilen, lernst du später. Das Muster bleibt: Die Teilspannungen ergeben zusammen die
              Gesamtspannung.
  - type: section
    id: beispiel
    title: Eine Spannung ergänzen
    blocks:
      - type: example
        title: Gesamtspannung und eine Teilspannung sind bekannt
        blocks:
          - type: text
            text: |
              Die Batterie hat $4{,}5\,\text{V}$. Am Voltmeter an L1 liest du $1{,}5\,\text{V}$ ab. An L2 liegt dann
              der Rest: $4{,}5\,\text{V} - 1{,}5\,\text{V} = 3{,}0\,\text{V}$.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: reihenschaltung-messen-1
        text: An Stelle 1 misst du 0,30 A. Was zeigt das Amperemeter an Stelle 3?
        material:
          - type: figure
            image: images/reihenschaltung-3.svg
            alt: Zeichnung eines Stromkreises mit Batterie und zwei Lampen hintereinander mit den Stellen 1, 2 und 3.
            caption: Stelle 1 liegt vor L1, Stelle 3 nach L2.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: Ebenfalls 0,30 A.
            correct: true
            info: In der Reihenschaltung ist die Stromstärke überall gleich.
          - text: Weniger als 0,30 A, weil die Lampen Strom verbrauchen.
            correct: false
            info: Lampen wandeln Energie um. Der Strom wird nicht weniger.
          - text: Mehr als 0,30 A.
            correct: false
            info: Es kommt nichts dazu, die Stromstärke bleibt gleich.
        explanation: Die Stromstärke ist an jeder Stelle der Reihenschaltung gleich.
        links:
          - title: Reihenschaltung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Reihenschaltung
      - type: generated
        id: reihenschaltung-messen-2
        given:
          U: { oneOf: [3, 4.5, 6, 9] }
          U1: { oneOf: [1, 1.5, 2] }
        where: ["U != 2 * U1"]
        task:
          text: "Eine Batterie hat {{U}} V. In einer Reihenschaltung liegen an der ersten Lampe {{U1}} V. Wie viel Volt liegen an der zweiten Lampe?"
        answer: { value: "U - U1", compare: { number: { format: decimal, decimals: 1, unit: V } } }
        mistakes:
          - {
              value: "U + U1",
              message: "Du hast die Teilspannung zur Gesamtspannung addiert. Die Teilspannungen ergeben zusammen die Gesamtspannung.",
            }
          - { value: "U1", message: "Das ist die Spannung an der ersten Lampe. Für die zweite bleibt der Rest übrig." }
        hint: "Die Spannungen an den Lampen ergeben zusammen die Spannung der Batterie. Ziehe die bekannte Teilspannung ab."
        steps:
          - "$U_2 = U - U_1$"
          - '$U_2 = {{U}}\,\text{V} - {{U1}}\,\text{V} = {{answer}}$'
      - type: true-false
        id: reihenschaltung-messen-3
        text: Hinter der zweiten Lampe ist die Stromstärke kleiner als vor der ersten.
        answer: false
        explanation: In der Reihenschaltung fließt überall gleich viel Strom. Der Strom wird in den Lampen nicht weniger.
        links:
          - title: Reihenschaltung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Reihenschaltung
      - type: single-choice
        id: reihenschaltung-messen-4
        text: Eine Batterie hat 6 V. Zwei gleiche Lampen sind in Reihe geschaltet. Welche Spannung erwartest du an jeder Lampe?
        options:
          - text: 3 V an jeder Lampe.
            correct: true
            info: Bei gleichen Lampen verteilt sich die Spannung gleichmäßig. 3 V und 3 V ergeben zusammen 6 V.
          - text: 6 V an jeder Lampe.
            correct: false
            info: Zusammen wären das 12 V, mehr als die Batterie liefert.
          - text: 12 V an jeder Lampe.
            correct: false
            info: Das ist mehr als die Gesamtspannung der Batterie.
        explanation: Die Spannungen der Lampen ergeben zusammen die Spannung der Batterie, bei gleichen Lampen je die Hälfte.
        links:
          - title: Reihenschaltung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Reihenschaltung
