# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Die Reihenschaltung
description: Wie Lampen hintereinander geschaltet sind, was bei einem Ausfall geschieht und wie sich Stromstärke und Spannung verhalten.
competencies: [reihenschaltung]
blocks:
  - type: section
    id: einstieg
    title: Zwei Lampen an einer Batterie
    blocks:
      - type: text
        text: |
          Bisher hatte jeder Stromkreis eine Lampe. Was geschieht, wenn du zwei Lampen an eine Batterie hängst? Dafür
          gibt es zwei Möglichkeiten. Die erste lernst du hier kennen: die **Reihenschaltung**. Du nutzt dabei, was du
          über Schaltpläne, Stromstärke und Spannung weißt.

          Danach kannst du **eine Reihenschaltung aufbauen und erklären, was passiert, wenn ein Bauteil ausfällt**.
  - type: section
    id: erklaerung
    title: Ein einziger Weg für den Strom
    blocks:
      - type: text
        text: |
          In der Reihenschaltung liegen die Lampen **hintereinander**. Der Strom hat nur einen Weg: von der Batterie
          durch die erste Lampe, durch die zweite Lampe und zurück zur Batterie. Es gibt keine Abzweigung.
      - type: figure
        image: images/reihe-1.svg
        alt: Schaltplan mit einer Batterie links und zwei Lampen L1 und L2, die im oberen Kabel hintereinander liegen. Es gibt nur einen Weg von der Batterie durch beide Lampen und zurück.
        caption: Die Lampen L1 und L2 liegen hintereinander. Zähle die möglichen Wege des Stroms.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: Reihenschaltung
        explanation: In einer Reihenschaltung liegen die Bauteile hintereinander, sodass der Strom nur einen einzigen Weg hat.
      - type: text
        text: |
          **Ausfall:** Fällt eine Lampe aus, zum Beispiel weil ihr Draht durchbrennt, ist der einzige Weg des Stroms
          unterbrochen. Das ist wie ein offener Schalter: Es fließt nirgends Strom, **beide** Lampen gehen aus.

          **Messwerte:** Die Tabelle zeigt Beispielwerte, die man bei zwei gleichen Lampen und einer 6-V-Batterie misst.
      - type: table
        caption: Messwerte einer Reihenschaltung mit zwei gleichen Lampen (Beispielwerte)
        header: [Messstelle, Messwert]
        rows:
          - [Stromstärke vor L1, "0,2 A"]
          - [Stromstärke zwischen L1 und L2, "0,2 A"]
          - [Stromstärke hinter L2, "0,2 A"]
          - [Spannung an der Batterie, 6 V]
          - [Spannung an L1, 3 V]
          - [Spannung an L2, 3 V]
      - type: text
        text: |
          Aus der Tabelle liest du zwei Regeln ab:
          - Die **Stromstärke** ist an jeder Stelle gleich. Es gibt nur einen Weg, und der Strom wird nicht verbraucht.
          - Die **Spannung** der Batterie teilt sich auf die Lampen auf: 3 V und 3 V ergeben zusammen die 6 V der Batterie.
  - type: section
    id: beispiel
    title: "Beispiel: Die Lichterkette"
    blocks:
      - type: example
        title: Warum geht die ganze Kette aus?
        blocks:
          - type: text
            text: |
              Eine alte Lichterkette hat die Lämpchen in Reihe. Eine Birne ist kaputt, und die ganze Kette ist dunkel.

              1. Alle Lämpchen liegen hintereinander. Es gibt nur einen Weg für den Strom.
              2. Die kaputte Birne unterbricht diesen Weg an einer Stelle.
              3. Ein unterbrochener Weg heißt: Es fließt nirgends Strom.
              4. Darum sind alle Lämpchen aus, nicht nur das kaputte.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: reihe-1
        text: Die Lampe L2 brennt durch. Was geschieht mit L1 und L3?
        material:
          - type: figure
            image: images/reihe-2.svg
            alt: Schaltplan mit einer Batterie und drei Lampen L1, L2 und L3, die hintereinander im oberen Kabel liegen.
            caption: Drei Lampen in Reihe
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: Beide gehen aus.
            correct: true
            info: Der einzige Weg des Stroms ist an L2 unterbrochen. Damit fließt in der ganzen Schaltung kein Strom.
          - text: Beide leuchten weiter.
            correct: false
            info: Ohne Strom leuchtet keine Lampe. Der Strom hat nur den einen Weg, und der ist unterbrochen.
          - text: Nur L1 leuchtet weiter, weil sie vor L2 liegt.
            correct: false
            info: Die Lage vor der defekten Lampe hilft nicht. Der Weg ist ein Kreis, an einer Stelle unterbrochen, und dann fließt nirgends Strom.
        explanation: In der Reihenschaltung gibt es nur einen Weg. Fällt ein Bauteil aus, fließt in der ganzen Schaltung kein Strom.
        links:
          - { title: Reihenschaltung (Wikipedia), url: "https://de.wikipedia.org/wiki/Reihenschaltung" }
      - type: true-false
        id: reihe-2
        text: In einer Reihenschaltung ist die Stromstärke nach der ersten Lampe kleiner als davor, weil die Lampe Strom verbraucht.
        answer: false
        explanation: Die Stromstärke ist an jeder Stelle gleich. Der Strom wird nicht verbraucht, er hat nur einen Weg.
        links:
          - { title: Reihenschaltung (Wikipedia), url: "https://de.wikipedia.org/wiki/Reihenschaltung" }
      - type: single-choice
        id: reihe-3
        text: Zwei gleiche Lampen liegen in Reihe an einer Batterie. Wie ist die Spannung der Batterie verteilt?
        options:
          - text: Sie teilt sich auf beide Lampen auf.
            correct: true
            info: Die Spannungen an den Lampen ergeben zusammen die Spannung der Batterie, wie 3 V und 3 V die 6 V.
          - text: Jede Lampe bekommt die volle Spannung der Batterie.
            correct: false
            info: Dann wären die Spannungen zusammen größer als die der Batterie. In der Reihenschaltung verteilt sich die Spannung.
          - text: Nur die erste Lampe bekommt Spannung.
            correct: false
            info: Beide Lampen leuchten, also liegt an beiden eine Spannung.
        explanation: In der Reihenschaltung teilt sich die Spannung der Batterie auf die Bauteile auf.
        links:
          - { title: Reihenschaltung (Wikipedia), url: "https://de.wikipedia.org/wiki/Reihenschaltung" }
      - type: single-choice
        id: reihe-4
        text: Warum ist ein Schalter, der alle Lampen eines Zimmers ausschalten soll, in Reihe zu ihnen?
        options:
          - text: Weil er den einen Weg unterbricht und damit alle Lampen aus sind.
            correct: true
            info: Ein Schalter im einzigen Weg des Stroms unterbricht den ganzen Kreis.
          - text: Weil nur so Strom durch den Schalter fließen kann.
            correct: false
            info: Strom fließt auch durch einen Schalter, der neben anderen Bauteilen liegt.
          - text: Weil der Schalter die Lampen heller macht.
            correct: false
            info: Ein Schalter öffnet und schließt den Weg, er macht nichts heller.
        explanation: Ein Schalter in Reihe öffnet den einzigen Weg und schaltet damit alles aus, was in diesem Weg liegt.
        links:
          - { title: Reihenschaltung (Wikipedia), url: "https://de.wikipedia.org/wiki/Reihenschaltung" }
