    <circle cx="110" cy="272" r="22" fill="#fff"/><path d="M94 256 L126 288 M126 256 L94 288"/>
    <circle cx="200" cy="272" r="22" fill="#fff"/><path d="M184 256 L216 288 M216 256 L184 288"/>
  </g>
  <text x="60" y="262" font-size="11">Lampe 1</text><text x="206" y="262" font-size="11">Lampe 2</text>
  <text x="16" y="338" fill="#555">Zwei Wege: jede Lampe hat ihren eigenen Zweig.</text>
</svg>
