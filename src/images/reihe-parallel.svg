    <path d="M40 50 H108 M152 50 H208 M252 50 H320 V130 H40 V92 M40 76 V50"/>
    <path d="M26 76 H54" stroke-width="3"/><path d="M33 88 H47" stroke-width="5"/><path d="M40 88 V92"/>
    <circle cx="130" cy="50" r="22" fill="#fff"/><path d="M114 34 L146 66 M146 34 L114 66"/>
    <circle cx="230" cy="50" r="22" fill="#fff"/><path d="M214 34 L246 66 M246 34 L214 66"/>
  </g>
