<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 76"><title>Zwei gleich lange Streifen untereinander: oben in vier gleich große Teile geteilt mit einem ausgemalten, unten in acht gleich große Teile mit einem ausgemalten</title><defs><pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#2f5fb3"/><rect width="1.5" height="4" fill="#ffffff" opacity=".45"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><text x="0" y="8" font-size="7" font-family="sans-serif">Oben: 1 Teil von 4</text><rect x="0" y="11" width="25" height="30" fill="url(#s)" stroke="#1a1a1a" stroke-width=".8"/><rect x="25" y="11" width="25" height="30" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/><rect x="50" y="11" width="25" height="30" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/><rect x="75" y="11" width="25" height="30" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/><text x="0" y="55" font-size="7" font-family="sans-serif">Unten: 1 Teil von 8</text><rect x="0" y="58" width="12.5" height="30" fill="url(#s)" stroke="#1a1a1a" stroke-width=".8"/><rect x="12.5" y="58" width="12.5" height="30" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/><rect x="25" y="58" width="12.5" height="30" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/><rect x="37.5" y="58" width="12.5" height="30" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/><rect x="50" y="58" width="12.5" height="30" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/><rect x="62.5" y="58" width="12.5" height="30" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/><rect x="75" y="58" width="12.5" height="30" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/><rect x="87.5" y="58" width="12.5" height="30" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/></svg>
