<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-labelledby="t d">
  <title id="t">Strommesser in Reihe zur Lampe</title>
  <desc id="d">Ein Stromkreis aus Batterie und Lampe. In der oberen Leitung, vor der Lampe, ist ein Strommesser eingebaut, so dass der ganze Strom durch ihn fließt.</desc>
  <g fill="none" stroke="#222" stroke-width="3" stroke-linecap="round">
    <path d="M60 40 H80 M120 40 H180 M220 40 H340 V160 H60 V110 M60 90 V40"/>
    <circle cx="100" cy="40" r="20"/>
    <circle cx="200" cy="40" r="20"/><path d="M186 26 L214 54 M214 26 L186 54"/>
    <path d="M45 110 H75"/><path d="M52 90 H68" stroke-width="7"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#222">
    <text x="94" y="46" font-weight="bold">A</text>
    <text x="70" y="112">+</text><text x="70" y="98">−</text>
    <text x="150" y="190">Strommesser (A) liegt in der Leitung</text>
  </g>
</svg>
