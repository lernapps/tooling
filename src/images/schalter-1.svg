<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="t d">
  <title id="t">Stromkreis mit geschlossenem Schalter</title>
  <desc id="d">Batterie, Schalter und Lampe in einem Stromkreis. Der Schalter ist geschlossen, die Leitung ist dort durchgehend. Der Kreis ist geschlossen.</desc>
