    <text x="106" y="148" font-family="sans-serif" font-size="20" fill="#1a1a1a" stroke="none" text-anchor="start">−</text>
    <text x="12" y="228" font-family="sans-serif" font-size="18" fill="#1a1a1a" stroke="none" text-anchor="start">Batterie</text>
    <text x="262" y="228" font-family="sans-serif" font-size="18" fill="#1a1a1a" stroke="none" text-anchor="start">Lampe</text>
    <text x="168" y="22" font-family="sans-serif" font-size="18" fill="#1a1a1a" stroke="none" text-anchor="start">Schalter zu</text>
  </g>
</svg>
