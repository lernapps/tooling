  <g fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 40 H150" />
    <circle cx="150" cy="40" r="5" fill="#1a1a1a"/>,    <circle cx="250" cy="40" r="5" fill="#1a1a1a"/>,    <path d="M150 40 H250" />
    <path d="M250 40 H320" />
    <path d="M80 40 V112 M80 128 V200 H320 V146 M320 40 V94" />
    <path d="M60 112 H100" />
    <path d="M70 128 H90" stroke-width="7"/>
    <circle cx="320" cy="120" r="24"/>
    <path d="M303.2 103.2 L336.8 136.8 M336.8 103.2 L303.2 136.8" />
