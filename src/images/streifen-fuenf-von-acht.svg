<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" role="img">
  <title>Streifen mit 8 gleich großen Stücken, 5 gefärbt</title>
  <defs>
    <pattern id="schraffur" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#2f5fb3"/>
      <rect y="6" width="9" height="3" fill="#7f9fd6"/>
    </pattern>
  </defs>
  <g stroke="#1a1a1a" stroke-width="2">
    <rect x="20" y="20" width="70" height="60" fill="url(#schraffur)"/>
    <rect x="90" y="20" width="70" height="60" fill="url(#schraffur)"/>
    <rect x="160" y="20" width="70" height="60" fill="url(#schraffur)"/>
    <rect x="230" y="20" width="70" height="60" fill="url(#schraffur)"/>
    <rect x="300" y="20" width="70" height="60" fill="url(#schraffur)"/>
    <rect x="370" y="20" width="70" height="60" fill="#ffffff"/>
    <rect x="440" y="20" width="70" height="60" fill="#ffffff"/>
    <rect x="510" y="20" width="70" height="60" fill="#ffffff"/>
  </g>
</svg>
