<svg xmlns="http://www.w3.org/2000/svg" width="500" height="80" viewBox="0 0 500 80">
  <title>Streifen in 4 Teile, davon ein Teil schmal und drei breit; das schmale ist gefärbt</title>
  <defs>
    <pattern id="schraffur" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#4a90d9"/>
      <rect width="3" height="8" fill="#1f5a99"/>
    </pattern>
  </defs>
  <rect width="500" height="80" fill="#ffffff"/>
  <rect x="10.00" y="10" width="48.00" height="60" fill="url(#schraffur)" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="58.00" y="10" width="144.00" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="202.00" y="10" width="144.00" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="346.00" y="10" width="144.00" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
</svg>
