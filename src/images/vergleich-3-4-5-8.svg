<svg xmlns="http://www.w3.org/2000/svg" width="500" height="170" viewBox="0 0 500 170">
  <title>Zwei gleich lange Streifen: 3 von 4 Teilen und 5 von 8 Teilen gefärbt</title>
  <defs>
    <pattern id="schraffur" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#4a90d9"/>
      <rect width="3" height="8" fill="#1f5a99"/>
    </pattern>
  </defs>
  <rect width="500" height="170" fill="#ffffff"/>
  <text x="10" y="22" font-family="sans-serif" font-size="18" fill="#1a1a1a">drei Viertel</text>
  <rect x="10.00" y="30" width="120.00" height="40" fill="url(#schraffur)" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="130.00" y="30" width="120.00" height="40" fill="url(#schraffur)" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="250.00" y="30" width="120.00" height="40" fill="url(#schraffur)" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="370.00" y="30" width="120.00" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="10" y="102" font-family="sans-serif" font-size="18" fill="#1a1a1a">fünf Achtel</text>
  <rect x="10.00" y="110" width="60.00" height="40" fill="url(#schraffur)" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="70.00" y="110" width="60.00" height="40" fill="url(#schraffur)" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="130.00" y="110" width="60.00" height="40" fill="url(#schraffur)" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="190.00" y="110" width="60.00" height="40" fill="url(#schraffur)" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="250.00" y="110" width="60.00" height="40" fill="url(#schraffur)" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="310.00" y="110" width="60.00" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="370.00" y="110" width="60.00" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="430.00" y="110" width="60.00" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
</svg>
