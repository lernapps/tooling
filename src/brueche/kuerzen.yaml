# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Brüche kürzen
description: Beim Kürzen fasst du Stücke zusammen. Der Anteil bleibt gleich, aber Zähler und Nenner werden kleiner.
competencies: [brueche-kuerzen-erweitern]
blocks:
  - type: section
    id: einstieg
    title: Stücke zusammenfassen
    blocks:
      - type: text
        text: |
          Nach dieser Seite kannst du Brüche kürzen und erkennst, wann ein Bruch vollständig gekürzt ist.
          Auf der letzten Seite hast du Brüche erweitert: Das Ganze wird feiner eingeteilt. Kürzen ist der Weg zurück.
          Stell dir eine Tafel Schokolade mit 12 Stücken vor, von der 8 Stücke übrig sind. Immer 4 Stücke kannst du
          zu einer Reihe zusammenfassen. Dann hat die Tafel 3 Reihen, und 2 davon sind übrig.
  - type: section
    id: erklaerung
    title: Kürzen heißt gröber einteilen
    blocks:
      - type: definition
        term: kürzen
        explanation: Beim Kürzen teilst du Zähler und Nenner durch dieselbe Zahl. Das Ganze wird gröber eingeteilt, der Anteil bleibt gleich.
      - type: formula
        formula: '\frac{8}{12} = \frac{8 : 4}{12 : 4} = \frac{2}{3}'
      - type: text
        text: |
          Kürzen geht nur, wenn sich **beide** Zahlen ohne Rest durch dieselbe Zahl teilen lassen. Wie du das siehst,
          steht auf der Seite [Teilbarkeit – kurz wiederholt](/brueche/teilbarkeit-wiederholung/). Bei $\frac{8}{12}$ geht das mit 2 und mit 4, aber
          nicht mit 3, denn 8 ist nicht durch 3 teilbar.
      - type: definition
        term: vollständig gekürzt
        explanation: Ein Bruch ist vollständig gekürzt, wenn es keine Zahl außer der 1 gibt, durch die sich Zähler und Nenner beide teilen lassen.
      - type: text
        text: |
          $\frac{8}{12}$ kannst du mit 2 zu $\frac{4}{6}$ kürzen. Das ist noch nicht fertig, denn 4 und 6 sind beide durch
          2 teilbar. Du kannst nochmal kürzen und kommst auf $\frac{2}{3}$. Hier geht nichts mehr: Der Bruch ist
          vollständig gekürzt. Mit der größten möglichen Zahl, hier 4, kommst du in einem Schritt dorthin.
  - type: section
    id: ausprobieren
    title: Selbst ausprobieren
    blocks:
      - type: text
        text: |
          Oben siehst du den Streifen für $\frac{8}{12}$. Mit den Knöpfen fasst du immer 2, 3 oder 4 Stücke zu einem
          größeren Stück zusammen. Nicht jeder Knopf geht: Ein Knopf ist grau, wenn sich 8 und 12 nicht beide durch diese
          Zahl teilen lassen. Schau, was gleich bleibt (die gefärbte Länge) und was sich ändert (Zähler und Nenner).
      - type: vue-component
        component: BruchUmteilen
        props:
          mode: kuerzen
          a: 8
          b: 12
          factors: [2, 3, 4]
          button: "Immer {k} Stücke zusammenfassen"
          reset: Zurück zum Anfang
          startText: "Der Streifen zeigt {a}/{b}: {b} gleich große Stücke, {a} sind gefärbt."
          stepText: "Immer {k} Stücke sind zusammengefasst. Jetzt sind {a2} von {b2} Stücken gefärbt: {a}/{b} = {a2}/{b2}. Zähler und Nenner sind beide durch {k} geteilt."
          stripLabel: "Streifen mit {a} von {b} gefärbten Stücken"
        nojs: |
          Ein Streifen zeigt 8/12. Fasst du immer 2 Stücke zusammen, sind es 6 Stücke, und 4 sind gefärbt: 8/12 = 4/6.
          Fasst du immer 4 Stücke zusammen, sind es 3 Stücke, und 2 sind gefärbt: 8/12 = 2/3. Mit 3 geht es nicht, denn 8 ist
          nicht durch 3 teilbar.
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: $\frac{18}{24}$ vollständig kürzen
        blocks:
          - type: text
            text: |
              18 und 24 sind beide durch 2 teilbar, durch 3 und durch 6. Die größte Zahl ist 6.
              Du teilst Zähler und Nenner durch 6: 18 : 6 = 3 und 24 : 6 = 4.
          - type: formula
            formula: '\frac{18}{24} = \frac{18 : 6}{24 : 6} = \frac{3}{4}'
          - type: text
            text: Bei 3 und 4 gibt es keine Zahl außer der 1, durch die beide teilbar sind. Der Bruch ist vollständig gekürzt.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: kuerzen-ueben
        given:
          e: { pick: 1, from: { data: kuerzen } }
        task:
          text: "Du kürzt {{e.zaehler}}/{{e.nenner}} mit {{e.faktor}}. Wie heißt der neue Zähler?"
        answer: { value: "e.zaehler / e.faktor", compare: number }
        mistakes:
          - { value: "e.zaehler - e.faktor", message: "Du hast {{e.faktor}} abgezogen. Beim Kürzen teilst du." }
          - {
              value: "e.zaehler",
              message: "Der Zähler muss auch durch {{e.faktor}} geteilt werden, nicht nur der Nenner.",
            }
          - { value: "e.nenner / e.faktor", message: "Das ist der neue Nenner. Gefragt ist der Zähler." }
        hint: Teile den Zähler durch dieselbe Zahl, durch die du den Nenner teilst.
        steps:
          - "Beim Kürzen mit {{e.faktor}} teilst du Zähler und Nenner durch {{e.faktor}}."
          - "Zähler: {{e.zaehler}} : {{e.faktor}} = {{answer}}."
      - type: true-false
        id: vollstaendig-gekuerzt
        text: $\frac{8}{12}$ ist vollständig gekürzt.
        answer: false
        explanation: 8 und 12 sind beide durch 4 teilbar. Du kannst zu $\frac{2}{3}$ kürzen. Erst bei 2 und 3 gibt es keine gemeinsame Zahl außer der 1.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
      - type: number
        id: groesster-teiler
        text: "Durch welche größte Zahl kannst du $\\frac{18}{24}$ kürzen, sodass der Bruch danach vollständig gekürzt ist?"
        answer: 6
        tolerance: 0
        explanation: "18 und 24 sind beide durch 6 teilbar, und 18 : 6 = 3, 24 : 6 = 4. Bei 3 und 4 ist nichts mehr zu kürzen."
        hint: Schreibe die Zahlen auf, durch die 18 teilbar ist, und such die größte, die auch 24 teilt.
        mistakes:
          - {
              answer: 2,
              message: "Mit 2 kannst du kürzen, du bekommst 9/12. Der Bruch ist noch nicht vollständig gekürzt, denn 9 und 12 sind beide durch 3 teilbar.",
            }
          - {
              answer: 3,
              message: "Mit 3 kannst du kürzen, du bekommst 6/8. Der Bruch ist noch nicht vollständig gekürzt, denn 6 und 8 sind beide durch 2 teilbar.",
            }
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
