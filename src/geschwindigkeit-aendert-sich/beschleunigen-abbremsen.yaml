# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Beschleunigen und Abbremsen
description: Du erkennst an einem Blitzbild mit Punkten, ob eine Bewegung schneller wird, gleich schnell bleibt oder langsamer wird.
competencies: [geschwindigkeitsaenderung]
blocks:
  - type: section
    id: einstieg
    title: Anfahren und Bremsen
    blocks:
      - type: text
        text: >-
          Du stehst mit dem Fahrrad an der Ampel. Es wird grün und du trittst an: Du fährst immer schneller. Vor der
          nächsten roten Ampel bremst du: Du fährst immer langsamer. Dazwischen fährst du eine Zeit lang gleich schnell.
          In der Physik gibt es dafür zwei Wörter. Wenn eine Bewegung **schneller** wird, sagt man, der Körper
          **beschleunigt**. Wenn sie **langsamer** wird, **bremst** er **ab**.
  - type: section
    id: erklaert
    title: Das Blitzbild
    blocks:
      - type: definition
        term: beschleunigen
        explanation: Ein Körper beschleunigt, wenn seine Geschwindigkeit größer wird, er also schneller wird.
      - type: definition
        term: abbremsen
        explanation: Ein Körper bremst ab, wenn seine Geschwindigkeit kleiner wird, er also langsamer wird.
      - type: text
        text: >-
          Woran erkennst du, ob jemand schneller oder langsamer wird, ohne auf einen Tacho zu schauen? Stell dir eine
          Kamera vor, die jede Sekunde ein Blitzfoto macht. Auf dem **Blitzbild** setzt du für jedes Foto einen Punkt dorthin,
          wo der Wagen gerade ist. Die Punkte liegen auf einer Bahn, die in Metern von 0 bis 40 beschriftet ist. Unter
          jedem Punkt steht die Sekunde, zu der er gehört.
      - type: text
        text: >-
          Der **Abstand** zwischen zwei Punkten ist der Weg, den der Wagen in genau einer Sekunde schafft. Die Zeit
          zwischen zwei Punkten ist immer gleich lang. Ein größerer Abstand bedeutet deshalb: mehr Weg in der gleichen
          Zeit, also eine größere Geschwindigkeit. Das ist dasselbe wie bei $v = \frac{s}{t}$ mit $t = 1\,\text{s}$: Der Abstand ist der Weg in
          einer Sekunde.
  - type: section
    id: ausprobieren
    title: Lass den Wagen fahren
    blocks:
      - type: text
        text: >-
          Wähle eine Bewegung aus und drücke „Start“. Der Wagen fährt los, und jede Sekunde kommt ein Punkt dazu.
          Unter dem Bild steht, wie groß jeder Abstand ist. Mit „Pause“ hältst du an. Wechselst du die Bewegung, beginnt
          alles von vorn. Das Bild und die Bahn bleiben gleich, nur die Bewegung ändert sich. Schau bei jeder Bewegung:
          Werden die Abstände größer, bleiben sie gleich oder werden sie kleiner?
      - type: vue-component
        id: spur-ausprobieren
        component: Bewegungsspur
        props:
          bewegungen:
            - { name: "schneller werden", orte: [0, 2, 6, 12, 20, 30] }
            - { name: "gleich schnell", orte: [0, 6, 12, 18, 24, 30] }
            - { name: "langsamer werden", orte: [0, 10, 18, 24, 28, 30] }
          alt: "Eine Bahn von 0 bis 40 m mit einem Wagen. Darunter ein Punkt für jede Sekunde, an der Stelle, an der der Wagen zu dieser Sekunde war."
          bahn: "Bahn in m"
          auswahl: "Bewegung wählen"
          abstand: "Von {n} s bis {m} s: {d} m"
          zurueck: " (zurück)"
          abstandUeberschrift: "Abstände zwischen den Punkten"
          sekunde: "{t} s"
          startKnopf: "Start"
          pauseKnopf: "Pause"
        nojs: >-
          Eine Bahn von 0 bis 40 m. Der Wagen ist zu jeder Sekunde an einer anderen Stelle, und für jede Sekunde gibt es
          einen Punkt. Bewegung „schneller werden“: Der Wagen ist bei 0 s, 1 s, 2 s, 3 s, 4 s und 5 s an den Stellen 0 m,
          2 m, 6 m, 12 m, 20 m und 30 m, die Abstände wachsen von 2 m auf 10 m. Bewegung „gleich schnell“: 0 m, 6 m,
          12 m, 18 m, 24 m, 30 m, alle Abstände sind 6 m. Bewegung „langsamer werden“: 0 m, 10 m, 18 m, 24 m, 28 m,
          30 m, die Abstände sinken von 10 m auf 2 m.
  - type: section
    id: beispiel
    title: Abstände lesen
    blocks:
      - type: example
        title: Eine Radfahrerin fährt los
        blocks:
          - type: text
            text: >-
              Beim Anfahren legt eine Radfahrerin in den ersten Sekunden 1 m, 2 m, 3 m und 4 m zurück. Die Abstände der
              Punkte wachsen, jede Sekunde schafft sie mehr Weg als in der Sekunde davor. Also wird sie schneller: Sie
              beschleunigt. Beim Bremsen ist es umgekehrt: Die Abstände werden kleiner, sie wird langsamer. Erst wenn
              kein Abstand mehr dazukommt, steht sie.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: spur-deuten
        text: Was zeigt dieses Blitzbild?
        material:
          - type: figure
            image: images/spur-schneller.svg
            alt: Ein Blitzbild mit sechs Punkten für 0 bis 5 Sekunden. Die Punkte liegen bei 0, 2, 6, 12, 20 und 30 Metern.
            caption: Ein Punkt je Sekunde auf der Bahn.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: Der Wagen wird schneller.
            correct: true
            info: Die Abstände zwischen den Punkten wachsen. In jeder Sekunde schafft der Wagen mehr Weg als in der Sekunde davor.
          - text: Der Wagen fährt gleich schnell.
            correct: false
            info: Bei gleich schneller Fahrt wären alle Abstände gleich groß. Hier wachsen sie.
          - text: Der Wagen wird langsamer.
            correct: false
            info: Beim Langsamerwerden werden die Abstände kleiner. Hier werden sie größer.
          - text: Der Wagen steht.
            correct: false
            info: Ein stehender Wagen hätte an jeder Sekunde denselben Punkt. Die Punkte hier liegen auseinander.
        explanation: Wachsende Abstände bei gleichen Zeitabständen bedeuten, dass der Wagen schneller wird.
        links:
          - title: Beschleunigung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Beschleunigung
      - type: single-choice
        id: abbremsen-stillstand
        text: Dieses Blitzbild zeigt einen Wagen beim Abbremsen. Welche Aussage stimmt?
        material:
          - type: figure
            image: images/spur-langsamer.svg
            alt: Ein Blitzbild mit sechs Punkten für 0 bis 5 Sekunden. Die Punkte liegen bei 0, 10, 18, 24, 28 und 30 Metern.
            caption: Ein Punkt je Sekunde auf der Bahn.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: Der Wagen steht schon bei 1 s.
            correct: false
            info: Die Punkte bei 0 s und 1 s liegen 10 m auseinander. Der Wagen bewegt sich dort noch.
          - text: Der Wagen fährt noch, schafft aber in jeder Sekunde weniger Weg.
            correct: true
            info: Die Abstände werden kleiner, sie sind aber nicht null. Der Wagen ist also langsamer, bewegt sich aber noch.
          - text: Der Wagen fährt gleich schnell weiter.
            correct: false
            info: Bei gleicher Geschwindigkeit wären alle Abstände gleich. Hier werden sie kleiner.
          - text: Der Wagen fährt zurück.
            correct: false
            info: Alle Punkte liegen weiter rechts als der davor. Der Wagen fährt immer in dieselbe Richtung.
        explanation: Abbremsen heißt langsamer werden, nicht stehen. Der Wagen kommt in jeder Sekunde weniger weit.
        links:
          - title: Beschleunigung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Beschleunigung
      - type: true-false
        id: bremsen-wahr-falsch
        text: Wenn ein Auto abbremst, steht es still.
        answer: false
        explanation: Abbremsen heißt nur, dass das Auto langsamer wird. Es kann bis zum Stillstand bremsen, aber das gehört nicht dazu. Auch ein Auto, das von 50 auf 30 km/h bremst, bremst ab.
        links:
          - title: Beschleunigung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Beschleunigung
