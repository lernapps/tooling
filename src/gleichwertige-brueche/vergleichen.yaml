# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Brüche vergleichen
description: Du findest heraus, welcher von zwei Brüchen größer ist. Dazu machst du die Nenner gleich.
competencies: [brueche-kuerzen-erweitern]
blocks:
  - type: section
    id: einstieg
    title: Wer hat mehr?
    blocks:
      - type: text
        text: |
          Anna isst $\frac{3}{4}$ einer Pizza, Ben isst $\frac{2}{3}$ einer gleich großen Pizza. Wer hat mehr gegessen?
          Das kannst du nicht sofort sehen. Mit gleichwertigen Brüchen findest du es heraus.
  - type: section
    id: gleichnamig
    title: Gleicher Nenner, einfach zu vergleichen
    blocks:
      - type: text
        text: |
          Brüche mit demselben Nenner heißen **gleichnamig**. Ihre Felder sind gleich groß. Dann ist der Bruch mit dem
          größeren Zähler größer, denn er hat mehr Felder.

          Unten sind zwei gleich lange Streifen, beide sind das Ganze. Gestreifte Felder sind gefärbt.
      - type: figure
        image: images/streifen-gleichnamig.svg
        alt: Zwei gleich lange Streifen, jeder in 8 gleich große Felder geteilt. Im oberen Streifen sind 3 Felder gestreift, im unteren 5. Über dem oberen steht 3/8, über dem unteren 5/8.
        caption: Beide Streifen haben gleich große Felder. Schau, welcher Streifen mehr gestreifte Felder hat.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: gleichnamig
        explanation: "Brüche sind gleichnamig, wenn sie denselben Nenner haben, zum Beispiel $\\frac{3}{8}$ und $\\frac{5}{8}$."
      - type: text
        text: Also ist $\frac{5}{8}$ größer als $\frac{3}{8}$.
      - type: note
        title: Ein größerer Nenner heißt nicht, dass der Bruch größer ist
        blocks:
          - type: text
            text: Der Nenner sagt, in wie viele Felder das Ganze geteilt ist. Ein größerer Nenner bedeutet kleinere Felder. $\frac{1}{8}$ ist deshalb kleiner als $\frac{1}{4}$.
  - type: section
    id: ungleichnamig
    title: Verschiedene Nenner gleich machen
    blocks:
      - type: text
        text: |
          Bei $\frac{3}{4}$ und $\frac{2}{3}$ sind die Felder verschieden groß. Du erweiterst beide Brüche so, dass sie
          denselben Nenner haben. Als gemeinsamen Nenner nimmst du $4 \cdot 3 = 12$.
      - type: formula
        formula: '\frac{3}{4} = \frac{3 \cdot 3}{4 \cdot 3} = \frac{9}{12} \qquad \frac{2}{3} = \frac{2 \cdot 4}{3 \cdot 4} = \frac{8}{12}'
      - type: figure
        image: images/streifen-zwoelftel.svg
        alt: Zwei gleich lange Streifen, jeder in 12 gleich große Felder geteilt. Im oberen Streifen sind 9 Felder gestreift, im unteren 8. Über dem oberen steht 3/4 = 9/12, über dem unteren 2/3 = 8/12.
        caption: Beide Streifen sind jetzt in Zwölftel geteilt. Der obere hat ein gestreiftes Feld mehr.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: Weil $\frac{9}{12}$ größer ist als $\frac{8}{12}$, ist auch $\frac{3}{4}$ größer als $\frac{2}{3}$. Anna hat mehr gegessen.
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: $\frac{1}{2}$ oder $\frac{2}{5}$?
        blocks:
          - type: text
            text: |
              Gemeinsamer Nenner: $2 \cdot 5 = 10$.

              $\frac{1}{2} = \frac{5}{10}$ und $\frac{2}{5} = \frac{4}{10}$.

              Weil $\frac{5}{10}$ größer ist als $\frac{4}{10}$, ist $\frac{1}{2}$ größer als $\frac{2}{5}$.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: vergleichen-gleicher-zaehler
        text: Welcher Bruch ist größer, $\frac{2}{3}$ oder $\frac{2}{5}$?
        options:
          - text: $\frac{2}{3}$ ist größer.
            correct: true
            info: "Richtig: Beide haben 2 Felder, aber die Drittel sind größer als die Fünftel."
          - text: $\frac{2}{5}$ ist größer.
            correct: false
            info: "Falsch: Die 5 im Nenner heißt, dass das Ganze in kleinere Felder geteilt ist. Zwei kleine Felder sind weniger als zwei große."
          - text: Beide sind gleich groß.
            correct: false
            info: "Falsch: Die Felder sind verschieden groß, darum sind auch die Brüche verschieden groß."
        explanation: Bei gleichem Zähler ist der Bruch mit dem kleineren Nenner größer, weil seine Felder größer sind.
        hint: Stell dir eine Pizza vor, die in 3 oder in 5 gleich große Stücke geschnitten wird.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
      - type: generated
        id: vergleichen-gemeinsamer-nenner
        given:
          e: { pick: 1, from: { data: vergleichspaare } }
        task:
          text: "Du vergleichst $\\frac{{{e.z1}}}{{{e.n1}}}$ und $\\frac{{{e.z2}}}{{{e.n2}}}$. Beide Brüche werden auf den Nenner {{e.nn}} erweitert. Welchen Zähler hat der erste Bruch danach?"
        answer: { value: "e.a", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "e.z1",
              message: "Das ist der alte Zähler. Beim Erweitern wird auch der Zähler mit der Zahl malgenommen.",
            }
          - {
              value: "e.b",
              message: "Das ist der Zähler des zweiten Bruchs nach dem Erweitern. Gefragt ist der erste Bruch.",
            }
        hint: "Mit welcher Zahl musst du den ersten Nenner malnehmen, damit {{e.nn}} herauskommt?"
        steps:
          - "Du erweiterst mit der Zahl, die vom ersten Nenner zu {{e.nn}} führt."
          - "Der erste Zähler wird mit derselben Zahl malgenommen: {{answer}}."
      - type: single-choice
        id: vergleichen-ungleichnamig
        text: Welcher Bruch ist größer, $\frac{5}{6}$ oder $\frac{3}{4}$?
        options:
          - text: $\frac{5}{6}$ ist größer.
            correct: true
            info: "Richtig: Auf den Nenner 12 erweitert sind es $\\frac{10}{12}$ und $\\frac{9}{12}$."
          - text: $\frac{3}{4}$ ist größer.
            correct: false
            info: "Falsch: Auf den Nenner 12 erweitert ist $\\frac{3}{4}$ gleich $\\frac{9}{12}$. Das ist kleiner als $\\frac{10}{12}$."
          - text: Beide sind gleich groß.
            correct: false
            info: "Falsch: Auf den Nenner 12 erweitert sind es $\\frac{10}{12}$ und $\\frac{9}{12}$, und die sind verschieden groß."
        explanation: Du machst die Nenner gleich und vergleichst dann die Zähler.
        hint: Ein gemeinsamer Nenner von 6 und 4 ist 12.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
      - type: true-false
        id: vergleichen-nenner-groesser
        text: "Bei zwei Brüchen mit gleichem Zähler ist der Bruch mit dem größeren Nenner immer der größere."
        answer: false
        explanation: Es ist umgekehrt. Ein größerer Nenner bedeutet kleinere Felder. Bei gleichem Zähler ist deshalb der Bruch mit dem kleineren Nenner größer.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
      - type: ordering
        id: vergleichen-ordnen
        text: Ordne die Brüche, der kleinste zuerst.
        items: ["1/4", "1/3", "1/2", "2/3", "3/4"]
        explanation: Auf den gemeinsamen Nenner 12 erweitert sind es 3/12, 4/12, 6/12, 8/12 und 9/12.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
