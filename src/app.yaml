title: Beschleunigte Bewegung
intro: |
  Wie bewegt sich ein Fahrrad, wenn es losfährt, bremst oder um die Kurve fährt? Du lernst, Bewegungen zu beschreiben
  und in Weg-Zeit- und Geschwindigkeit-Zeit-Diagrammen darzustellen. Du kannst die Diagramme selbst verändern und
  siehst sofort, was passiert. Nach jedem Teil gibt es Aufgaben zum Üben. Für Klasse 9.
languages: [de]
chapters: [beschleunigte-bewegung]
