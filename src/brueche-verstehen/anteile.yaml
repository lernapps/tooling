# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Was ist ein Bruch?
description: Ein Bruch sagt, welchen Teil eines Ganzen du meinst. Du färbst Teile und liest den Bruch ab.
competencies: [brueche-begriff]
blocks:
  - type: section
    id: einstieg
    title: Eine Tafel Schokolade
    blocks:
      - type: text
        text: |
          Eine Tafel Schokolade hat 8 gleich große Stücke. Du isst 3 davon. Wie sagst du, wie viel von der Tafel
          du gegessen hast? „Drei von acht Stücken“ ist richtig, aber lang. Mathematiker schreiben dafür einen
          **Bruch**. Vorher solltest du die [natürlichen Zahlen](https://lernapps.net/apps/map/mathematik/c/natuerliche-zahlen/) kennen, also Zahlen wie 3 und 8.
  - type: section
    id: erklaerung
    title: So liest du einen Bruch
    blocks:
      - type: text
        text: |
          Das **Ganze** ist hier die ganze Tafel. Sie ist in 8 gleich große Teile geteilt. Die 3 gegessenen Teile
          sind gefärbt und gestreift, die übrigen 5 sind weiß.
      - type: figure
        image: images/schokolade-drei-von-acht.svg
        alt: Ein Rechteck aus 8 gleich großen Feldern in zwei Reihen mit je 4 Feldern. Die ersten 3 Felder der oberen Reihe sind blau gestreift, die anderen 5 Felder sind weiß.
        caption: Die Tafel hat 8 gleich große Teile. Schau, wie viele davon gestreift sind.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: formula
        formula: '\frac{3}{8}'
      - type: definition
        term: Nenner
        explanation: Die Zahl unter dem Bruchstrich. Der Nenner sagt, in wie viele gleich große Teile das Ganze geteilt ist.
      - type: definition
        term: Zähler
        explanation: Die Zahl über dem Bruchstrich. Der Zähler sagt, wie viele dieser Teile gemeint sind, hier die gefärbten.
      - type: definition
        term: Bruch
        explanation: Ein Bruch wie $\frac{3}{8}$ beschreibt einen Teil eines Ganzen. Der Nenner nennt die Zahl der gleich großen Teile, der Zähler die Zahl der gemeinten Teile.
      - type: text
        text: |
          Der Strich in der Mitte heißt **Bruchstrich**. Du liest $\frac{3}{8}$ als „drei Achtel“. Der Nenner 8 zählt **alle** Teile, auch die gefärbten.
          Der Zähler 3 zählt nur die gefärbten.
      - type: note
        title: Die Teile müssen gleich groß sein
        blocks:
          - type: figure
            image: images/ungleiche-teile.svg
            alt: Ein Rechteck, in vier Teile geteilt, die nicht alle gleich breit sind. Der breiteste Teil links ist blau gestreift, die drei schmalen Teile rechts sind weiß.
            caption: Hier sind 4 Teile, die nicht alle gleich groß sind. Der gestreifte Teil ist kein Viertel.
            source: eigene Zeichnung
            licence: CC-BY-4.0
          - type: text
            text: Ein Bruch passt nur, wenn alle Teile gleich groß sind. Hier ist ein Teil von 4 Teilen deutlich mehr als ein Viertel des Ganzen.
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: 2 von 5 Feldern
        blocks:
          - type: text
            text: |
              Ein Rechteck besteht aus 5 gleich großen Feldern. 2 Felder sind gefärbt.

              Der Nenner ist 5, denn das Ganze hat 5 gleich große Teile. Der Zähler ist 2, denn 2 Teile sind gefärbt.
              Der Bruch heißt $\frac{2}{5}$.

              Nicht $\frac{2}{3}$: Die 3 ungefärbten Felder sind auch Teile des Ganzen. Sie gehören zum Nenner 5, der alle Felder zählt.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: text
        text: |
          Gleich bekommst du ein Rechteck aus gleich großen Feldern. Das ganze Rechteck ist das Ganze. Tippe auf ein
          Feld, dann wird es gefärbt und gestreift; tippe noch einmal, dann ist es wieder weiß. Färbe so viele Felder,
          wie der Bruch verlangt, und drücke dann „Prüfen“. Mit „Neue Aufgabe“ bekommst du andere Zahlen.
      - type: vue-component
        id: anteile-faerben
        component: BruchFeld
        props:
          task: "Das Rechteck hat {N} gleich große Felder. Färbe den Bruch {Z}/{N}, gelesen: {Z} von {N}."
          cell: "Feld {n}"
          mistakes:
            - "Du hast die Felder gefärbt, die nicht zum Bruch gehören. Lies noch einmal: Welche Zahl steht im Zähler?"
            - "Du hast das ganze Rechteck gefärbt. Der Nenner sagt nur, in wie viele Felder das Ganze geteilt ist. Gefärbt wird die Zahl, die im Zähler steht."
        examples:
          accepted:
            - { answer: 1, seed: 1 }
          rejected:
            - { answer: 7, seed: 1 }
            - { answer: 8, seed: 1 }
            - { answer: 0 }
      - type: single-choice
        id: anteile-ablesen
        text: Welcher Bruch gehört zu dem gefärbten Teil des Streifens?
        material:
          - type: figure
            image: images/streifen-drei-von-fuenf.svg
            alt: Ein Streifen aus 5 gleich großen Feldern. Die ersten 3 Felder von links sind blau gestreift, die letzten 2 sind weiß.
            caption: Der ganze Streifen ist das Ganze.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: $\frac{3}{5}$
            correct: true
            info: "Richtig: Das Ganze hat 5 gleich große Felder, 3 davon sind gefärbt."
          - text: $\frac{3}{2}$
            correct: false
            info: "Falsch: 2 ist die Zahl der weißen Felder. Der Nenner zählt alle Felder des Ganzen."
          - text: $\frac{2}{5}$
            correct: false
            info: "Falsch: 2 Felder sind weiß, die gefärbten sind 3. Der Zähler zählt die gefärbten Felder."
          - text: $\frac{5}{3}$
            correct: false
            info: "Falsch: Zähler und Nenner sind vertauscht. Der Nenner steht unten und zählt alle Felder."
        explanation: Der Nenner zählt alle gleich großen Felder, hier 5. Der Zähler zählt die gefärbten, hier 3.
        hint: Zähle erst alle Felder, dann die gefärbten.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
      - type: true-false
        id: anteile-gleich-gross
        text: "Ein Rechteck ist in 4 Teile geteilt, die nicht alle gleich groß sind. 1 Teil ist gefärbt. Dann sind $\\frac{1}{4}$ des Rechtecks gefärbt."
        answer: false
        explanation: Ein Bruch wie $\frac{1}{4}$ passt nur, wenn alle 4 Teile gleich groß sind. Bei verschieden großen Teilen sagt der Nenner nicht, wie viel vom Ganzen ein Teil ist.
        links:
          - title: Bruchrechnung (Wikipedia)
            url: https://de.wikipedia.org/wiki/Bruchrechnung
      - type: generated
        id: anteile-weisser-teil
        given:
          N: { oneOf: [4, 5, 6, 8, 10, 12] }
          Z: { int: [1, 11] }
        where: ["Z < N", "Z * 2 != N"]
        task:
          text: "Ein Rechteck ist in {{N}} gleich große Felder geteilt. {{Z}} davon sind gefärbt, die übrigen sind weiß. Der Bruch für den weißen Teil hat den Nenner {{N}}. Wie heißt sein Zähler?"
        answer: { value: "N - Z", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "Z",
              message: "{{Z}} ist die Zahl der gefärbten Felder. Gefragt ist der weiße Teil: Der Zähler zählt die weißen Felder.",
            }
          - { value: "N", message: "{{N}} ist der Nenner und zählt alle Felder. Der Zähler zählt nur die weißen." }
        hint: "Zähle, wie viele Felder weiß sind."
        steps:
          - "Von {{N}} Feldern sind {{Z}} gefärbt. Die übrigen sind weiß."
          - "Der Zähler zählt die weißen Felder: {{answer}}. Der Bruch für den weißen Teil heißt $\\frac{{{answer}}}{{{N}}}$."
