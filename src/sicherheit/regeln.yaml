# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Sicher mit Strom umgehen
description: Regeln für den sicheren Umgang mit Strom im Alltag und bei Versuchen.
competencies: [sicher-mit-strom-umgehen]
blocks:
  - type: section
    id: warum
    title: Warum?
    blocks:
      - type: text
        text: |
          Du weißt jetzt, warum Strom aus der Steckdose gefährlich ist. Welche Regeln schützen dich im Alltag?
  - type: section
    id: erklaerung
    title: Erklärung
    blocks:
      - type: text
        text: |
          Diese Regeln solltest du kennen und anwenden:
      - type: text
        text: |
          - Experimentiere nie mit der Steckdose. Für Versuche nimmst du Batterien oder Netzgeräte mit kleiner Spannung.
          - Stecke nie Gegenstände in eine Steckdose, auch keine Nadeln oder Kabel.
          - Benutze keine Geräte mit beschädigtem Kabel oder beschädigter Isolierung.
          - Halte elektrische Geräte von Wasser fern, zum Beispiel in der Badewanne.
          - Fasse Geräte nie mit nassen Händen an, wenn sie am Netz hängen.
          - Ziehe zum Ausstecken am Stecker, nie am Kabel.
      - type: note
        title: Im Notfall
        blocks:
          - type: text
            text: |
              Hat jemand einen Stromschlag erhalten, berühre die Person nicht, solange sie noch am Strom hängt. Rufe
              sofort Erwachsene und den Notruf 112.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Ein Föhn mit Kabelschaden
        blocks:
          - type: text
            text: |
              Das Kabel deines Föhns hat einen Riss, und innen ist ein Draht zu sehen.

              1. Die Isolierung ist beschädigt, der Leiter ist freigelegt.
              2. Du könntest den Draht berühren, und dein Körper würde Teil des Stromkreises.
              3. Du benutzt den Föhn nicht mehr und sagst Erwachsenen Bescheid.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: multiple-choice
        id: regeln-anwenden
        text: Welche Verhaltensweisen sind sicher? Wähle alle richtigen aus.
        options:
          - text: Zum Ausstecken am Stecker ziehen.
            correct: true
            info: So bleibt das Kabel unbeschädigt, und die Isolierung hält.
          - text: Ein Gerät mit sichtbar beschädigtem Kabel nicht benutzen.
            correct: true
            info: Ein freigelegter Draht ist gefährlich. Das Gerät muss repariert oder ersetzt werden.
          - text: Mit nassen Händen einen Stecker anfassen.
            correct: false
            info: Nasse Haut leitet den Strom besser. Das erhöht die Gefahr.
          - text: Ein Experiment mit der Steckdose statt der Batterie aufbauen.
            correct: false
            info: Die Steckdose liefert 230 V. Das ist lebensgefährlich, auch bei einem einfachen Versuch.
        explanation: Sicher ist, wer am Stecker zieht und beschädigte Geräte nicht benutzt. Nasse Hände und die Steckdose für Versuche sind gefährlich.
        links:
          - title: Stromunfall (Wikipedia)
            url: https://de.wikipedia.org/wiki/Stromunfall
      - type: single-choice
        id: notfall
        text: Eine Person hat einen Stromschlag erhalten und hängt noch am Gerät. Was tust du zuerst?
        options:
          - text: Sie nicht berühren und sofort Erwachsene und den Notruf 112 holen.
            correct: true
            info: Berührst du die Person, kann der Strom auch durch dich fließen. Hilfe zu holen ist der sichere Weg.
          - text: Die Person sofort an der Hand wegziehen.
            correct: false
            info: Dabei wirst du selbst Teil des Stromkreises und kannst verletzt werden.
          - text: Abwarten, ob es von allein besser wird.
            correct: false
            info: Ein Stromschlag kann das Herz stören. Die Person braucht sofort Hilfe.
        explanation: Zuerst die eigene Sicherheit, dann Hilfe holen. Eine Person unter Strom berührst du nicht.
        links:
          - title: Stromunfall (Wikipedia)
            url: https://de.wikipedia.org/wiki/Stromunfall
