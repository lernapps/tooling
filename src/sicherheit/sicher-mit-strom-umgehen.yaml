# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Sicher mit Strom umgehen
description: Welche Regeln für den sicheren Umgang mit Strom gelten, warum sie gelten und wie man sie anwendet.
competencies: [sicher-mit-strom-umgehen]
blocks:
  - type: section
    id: einstieg
    title: Aus Gefahren werden Regeln
    blocks:
      - type: text
        text: |
          Du weißt jetzt, wann Strom gefährlich wird: bei großer Spannung und wenn der Körper Teil eines Stromkreises
          wird. Daraus lassen sich Regeln ableiten. Du lernst sie nicht auswendig, sondern erkennst, warum jede
          einzelne gilt.

          Danach kannst du **Regeln für den sicheren Umgang mit Strom nennen und anwenden**.
  - type: section
    id: erklaerung
    title: Vier Regeln und ihr Grund
    blocks:
      - type: text
        text: |
          Als häufige Ursachen für Stromunfälle gelten: Kontakt von stromführenden Teilen mit Wasser, fehlerhafte
          Verkabelungen, Versuche, elektrische Geräte selbst zu reparieren, Kabel ohne Isolierung und beschädigte
          Stecker. Aus diesen Ursachen und dem, was du über Leiter weißt, folgen die Regeln:
      - type: table
        caption: Regeln für den sicheren Umgang mit Strom
        header: [Regel, Grund]
        rows:
          - [
              "Halte Geräte, die an der Steckdose hängen, von Wasser fern und fasse sie nicht mit nassen Händen an.",
              "Wasser und feuchte Haut leiten den Strom gut und schaffen einen Weg zum Körper.",
            ]
          - [
              "Benutze keine Kabel mit beschädigter Hülle und keine beschädigten Stecker.",
              "Wo die Isolierung fehlt, liegt der Draht frei.",
            ]
          - [
              "Repariere elektrische Geräte nicht selbst.",
              "Im Inneren liegen Teile unter Spannung, die du nicht erkennst.",
            ]
          - [
              "Stecke nichts in eine Steckdose, außer einem Stecker.",
              "Metallgegenstände leiten den Strom und stellen einen Weg zur Spannung von 230 V her.",
            ]
      - type: note
        title: Bei einem Schaden gilt
        blocks:
          - type: text
            text: |
              Bemerkst du ein beschädigtes Kabel oder einen defekten Stecker, benutzt du das Gerät nicht mehr und
              sagst einer erwachsenen Person Bescheid.
  - type: section
    id: beispiel
    title: "Beispiel: Der Föhn im Bad"
    blocks:
      - type: example
        title: Warum der Föhn nicht neben die Badewanne gehört
        blocks:
          - type: text
            text: |
              Ein Föhn steckt in einer Steckdose und liegt am Rand einer gefüllten Badewanne.

              1. Der Föhn steht unter der Netzspannung von 230 V, also unter einer Spannung, die gefährlich ist.
              2. Fällt der Föhn ins Wasser, kann das Wasser den Strom leiten. Es schafft einen Weg zu dir.
              3. Wasser und feuchte Haut leiten gut, darum kann ein gefährlich starker Strom durch den Körper fließen.
              4. Regel: Geräte, die an der Steckdose hängen, gehören nicht in die Nähe von Wasser.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: multiple-choice
        id: sicher-1
        text: Welche Situationen sind gefährlich?
        options:
          - text: Ein Föhn liegt neben einer gefüllten Badewanne und ist an der Steckdose angeschlossen.
            correct: true
            info: Fällt er ins Wasser, kann das Wasser den Strom zum Körper leiten.
          - text: Das Ladekabel eines Handys hat eine aufgeriebene Stelle, an der der blanke Draht zu sehen ist.
            correct: true
            info: Der blanke Draht ist nicht mehr isoliert und kann unter Spannung stehen.
          - text: Du wechselst die Mignon-Batterien in einer Taschenlampe.
            correct: false
            info: Mit 1,5 V ist das ungefährlich.
          - text: Du hältst einen Stecker am Gehäuse fest, wenn du ihn aus der Steckdose ziehst.
            correct: false
            info: Das Gehäuse des Steckers ist ein Nichtleiter und das richtige Anfassen. Am Kabel zu ziehen, würde das Kabel beschädigen.
        explanation: Wasser an Geräten unter Netzspannung und freiliegende Drähte sind gefährlich. Batterien und das richtige Anfassen des Steckers sind es nicht.
        links:
          - { title: Elektrischer Schlag (Wikipedia), url: "https://de.wikipedia.org/wiki/Elektrischer_Schlag" }
      - type: true-false
        id: sicher-2
        text: Man darf ein Gerät, das an der Steckdose hängt, mit nassen Händen anfassen, wenn man es nur kurz benutzt.
        answer: false
        explanation: Auch eine kurze Berührung ist gefährlich. Nasse Haut leitet den Strom gut und macht einen Stromunfall wahrscheinlicher.
        links:
          - { title: Elektrischer Schlag (Wikipedia), url: "https://de.wikipedia.org/wiki/Elektrischer_Schlag" }
      - type: single-choice
        id: sicher-3
        text: Beim Kabel deiner Schreibtischlampe ist die Hülle aufgerissen, man sieht den Draht. Was tust du?
        options:
          - text: Ich benutze die Lampe nicht mehr und sage einer erwachsenen Person Bescheid.
            correct: true
            info: Wo die Isolierung fehlt, liegt der Draht frei. Das Gerät darf nicht weiter benutzt werden.
          - text: Ich wickele Papier um die Stelle und benutze die Lampe weiter.
            correct: false
            info: Papier ist kein sicherer Ersatz für die Isolierung, besonders nicht bei Feuchtigkeit.
          - text: Ich fasse die Stelle an, um zu prüfen, ob dort Strom fließt.
            correct: false
            info: Das ist gerade die gefährliche Berührung. Prüfe nie mit der Hand, ob Strom fließt.
        explanation: Beschädigte Kabel werden nicht benutzt. Erwachsene sorgen dafür, dass sie repariert oder ersetzt werden.
        links:
          - { title: Elektrischer Schlag (Wikipedia), url: "https://de.wikipedia.org/wiki/Elektrischer_Schlag" }
      - type: true-false
        id: sicher-4
        text: Wenn ein Gerät nicht angeschlossen ist, darf man einen Metallnagel in die Steckdose stecken.
        answer: false
        explanation: In der Steckdose liegen 230 V an. Ein Metallnagel leitet den Strom und kann einen Weg zu deinem Körper schaffen. In Steckdosen steckt man nur Stecker.
        links:
          - { title: Elektrischer Schlag (Wikipedia), url: "https://de.wikipedia.org/wiki/Elektrischer_Schlag" }
