# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Hin und zurück: Richtungsänderung im Diagramm"
description: Du erkennst im Diagramm, wann ein Wagen vorwärts und wann er rückwärts fährt.
competencies: [bewegungsdiagramme]
blocks:
  - type: section
    id: einstieg
    title: Vorwärts und rückwärts
    blocks:
      - type: text
        text: |
          Ein Wagen kann vorwärts fahren und dann rückwärts. Dabei ändert sich seine Richtung. Auf der letzten Seite fuhr der Bus immer in dieselbe Richtung. Wie zeigt das Diagramm den Wechsel?
  - type: section
    id: erklaerung
    title: Das Minuszeichen
    blocks:
      - type: text
        text: |
          Wir legen fest: Vorwärts ist die **positive** Richtung. Fährt der Wagen rückwärts, schreiben wir ein **Minus** vor das Tempo.

          - **+2 m/s** heißt: vorwärts mit 2 m/s.
          - **−2 m/s** heißt: rückwärts mit 2 m/s. Er ist genauso schnell, nur in die andere Richtung.

          Im Geschwindigkeit-Zeit-Diagramm liegt die Linie dann **unter der Null-Linie**. Beim Wechsel von vorwärts zu rückwärts geht sie durch die Null. Dort steht der Wagen für einen Moment.
      - type: example
        title: Ein Beispiel
        blocks:
          - type: text
            text: |
              Ein Wagen fährt mit 2 m/s vorwärts. Er bremst ab bis 0 m/s, steht kurz und fährt dann rückwärts. Sein Tempo geht von 2 über 0 nach −2.
              Die Linie fällt durch die Null und liegt danach unter der Achse.
  - type: section
    id: ausprobieren
    title: Ausprobieren
    blocks:
      - type: text
        text: |
          Der Wagen fährt hin und zurück. Das Quadrat auf der Bahn ist der Start. Darunter siehst du zwei Diagramme: das Geschwindigkeit-Zeit-Diagramm und das Weg-Zeit-Diagramm. Ihre Achsen bleiben gleich.

          Mit **+** und **−** stellst du das Tempo für jede Sekunde ein, von −2 bis 4 m/s. Am Anfang ist die Fahrt hin und zurück eingestellt. Mit **Zurücksetzen** kommst du dahin zurück.
          Mach das Tempo bei 4 s kleiner, bis es unter 0 liegt. Was machen die Punkte auf der Bahn? Was macht die Linie im Weg-Zeit-Diagramm?
      - type: vue-component
        id: richtung-ausprobieren
        component: BewegungsDiagramm
        props:
          fahrten: { data: fahrten }
          start: hin-zurueck
          ansicht: beide
          rueckwaerts: true
          bahnTitel: Der Wagen auf der Bahn
          geschwindigkeitTitel: Geschwindigkeit-Zeit-Diagramm
          wegTitel: Weg-Zeit-Diagramm
          tempoTitel: Tempo einstellen
          tempoLabel: Tempo bei {t} s
          tempoKonstantLabel: "Tempo: {v} m/s"
          mehr: Tempo bei {t} s erhöhen
          weniger: Tempo bei {t} s verringern
          zuruecksetzen: Zurücksetzen
          achseZeit: t in s
          achseGeschwindigkeit: v in m/s
          achseWeg: s in m
          bildBahn: "Ein Wagen auf der Bahn. Sein Abstand vom Start nach 0 bis 6 Sekunden in Metern: {s}."
          bildGeschwindigkeit: "Geschwindigkeit-Zeit-Diagramm. Das Tempo in m/s bei 0 bis 6 Sekunden: {v}."
          bildWeg: "Weg-Zeit-Diagramm. Der Weg in Metern nach 0 bis 6 Sekunden: {s}."
          tabelleTitel: Werte als Tabelle
          spalteZeit: Zeit t in s
          spalteGeschwindigkeit: Tempo v in m/s
          spalteWeg: Weg s in m
        nojs: |
          Ein Wagen fährt 6 Sekunden lang. Du kannst sein Tempo bei jeder Sekunde zwischen −2 und 4 m/s einstellen. Minus heißt rückwärts. Du siehst dazu die Bahn, das Geschwindigkeit-Zeit-Diagramm und das Weg-Zeit-Diagramm.

          Am Anfang gilt die Fahrt hin und zurück: 0, 2, 2, 0, −2, −2 und 0 m/s bei 0 bis 6 s. Der Wagen fährt vorwärts, steht kurz und fährt dann rückwärts zum Start zurück. Das Geschwindigkeit-Zeit-Diagramm geht dabei unter die Null-Linie, und das Weg-Zeit-Diagramm sinkt wieder.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: wann-rueckwaerts
        text: Wann fährt der Wagen rückwärts?
        material:
          - type: figure
            image: images/geschw-zeit-rueckwaerts.svg
            alt: Ein Geschwindigkeit-Zeit-Diagramm mit einer orangen Linie und einem Punkt bei jeder Sekunde. Die Zeit läuft von 0 bis 6 Sekunden, das Tempo von minus 2 bis 4 Metern pro Sekunde. Eine dicke schwarze Linie liegt bei 0.
            caption: Die dicke schwarze Linie ist die Null-Linie. Das Gitter ist 1 s breit und 1 m/s hoch.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: Von 0 s bis 2 s
            correct: false
            info: "In dieser Zeit liegt die Linie über der Null-Linie. Der Wagen fährt vorwärts und wird schneller."
          - text: Von 2 s bis 4 s
            correct: false
            info: "Die Linie liegt noch über der Null-Linie. Der Wagen fährt vorwärts, wird aber langsamer."
          - text: Von 4 s bis 6 s
            correct: true
            info: "Hier liegt die Linie unter der Null-Linie. Das Tempo hat ein Minus, der Wagen fährt rückwärts."
        explanation: Liegt die Linie im Geschwindigkeit-Zeit-Diagramm unter der Null-Linie, fährt der Wagen rückwärts.
        hint: Such den Teil der Linie, der unter der dicken schwarzen Linie liegt.
        links:
          - title: Bewegungsdiagramme auf der Lernlandkarte
            url: https://lernapps.net/apps/map/physik/c/bewegungsdiagramme/
      - type: true-false
        id: minus-langsamer
        text: Ein Wagen mit −2 m/s ist langsamer als ein Wagen mit 1 m/s.
        answer: false
        explanation: Das Minus sagt nur die Richtung. Der Wagen mit −2 m/s fährt rückwärts, aber mit einem Tempo von 2 m/s. Das ist mehr als 1 m/s.
        links:
          - title: Bewegungsdiagramme auf der Lernlandkarte
            url: https://lernapps.net/apps/map/physik/c/bewegungsdiagramme/
      - type: vue-component
        id: richtung-einstellen
        component: DiagrammZeichnen
        props:
          rueckwaerts: true
          aufgaben:
            - text: Ein Wagen fährt mit 2 m/s vorwärts. Er bremst vier Sekunden lang ab und fährt am Ende mit 2 m/s rückwärts. Danach behält er sein Tempo.
              verlauf: "----00"
              start: 2
              ende: -2
          mistakes:
            - "Deine Linie ist waagerecht. Dann bleibt das Tempo immer gleich. In der Aufgabe ändert es sich."
            - "Schau noch einmal: Beschleunigen und Abbremsen sind vertauscht. Beim Beschleunigen steigt die Linie, beim Abbremsen fällt sie."
          abschnitt: "Schau dir den Abschnitt zwischen {a} s und {b} s an. Passt die Linie dort zur Aufgabe?"
          endeFalsch: "Der Anfang oder das Ende der Linie passt nicht zur Aufgabe. Lies die Aufgabe noch einmal."
          anweisung: Stelle das Geschwindigkeit-Zeit-Diagramm ein.
          startText: Das Tempo bei 0 s ist {v} m/s.
          tempoTitel: Tempo einstellen
          tempoLabel: Tempo bei {t} s
          mehr: Tempo bei {t} s erhöhen
          weniger: Tempo bei {t} s verringern
          zuruecksetzen: Zurücksetzen
          diagrammTitel: Dein Geschwindigkeit-Zeit-Diagramm
          achseZeit: t in s
          achseGeschwindigkeit: v in m/s
          bild: "Dein Geschwindigkeit-Zeit-Diagramm. Das Tempo in m/s bei 0 bis 6 Sekunden: {v}."
        examples:
          accepted:
            - { answer: [2, 1, 0, -1, -2, -2, -2], seed: 1 }
          rejected:
            - { answer: [2, 2, 2, 2, 2, 2, 2], seed: 1 }
            - { answer: [2, 1, 0, -1, -1, -1, -1], seed: 1 }
            - { answer: [2, 1, 0, 1, 2, 2, 2], seed: 1 }
      - type: text
        text: "**Knobeln:** Für alle, die mehr wollen."
      - type: vue-component
        id: richtung-knobeln
        component: DiagrammZeichnen
        props:
          rueckwaerts: true
          aufgaben:
            - text: Ein Wagen fährt mit 2 m/s rückwärts. Er bremst vier Sekunden lang ab und fährt am Ende mit 2 m/s vorwärts. Danach behält er sein Tempo.
              verlauf: "++++00"
              start: -2
              ende: 2
          mistakes:
            - "Deine Linie ist waagerecht. Dann bleibt das Tempo immer gleich. In der Aufgabe ändert es sich."
            - "Schau noch einmal: Beschleunigen und Abbremsen sind vertauscht. Beim Beschleunigen steigt die Linie, beim Abbremsen fällt sie."
          abschnitt: "Schau dir den Abschnitt zwischen {a} s und {b} s an. Passt die Linie dort zur Aufgabe?"
          endeFalsch: "Der Anfang oder das Ende der Linie passt nicht zur Aufgabe. Lies die Aufgabe noch einmal."
          anweisung: Stelle das Geschwindigkeit-Zeit-Diagramm ein.
          startText: Das Tempo bei 0 s ist {v} m/s.
          tempoTitel: Tempo einstellen
          tempoLabel: Tempo bei {t} s
          mehr: Tempo bei {t} s erhöhen
          weniger: Tempo bei {t} s verringern
          zuruecksetzen: Zurücksetzen
          diagrammTitel: Dein Geschwindigkeit-Zeit-Diagramm
          achseZeit: t in s
          achseGeschwindigkeit: v in m/s
          bild: "Dein Geschwindigkeit-Zeit-Diagramm. Das Tempo in m/s bei 0 bis 6 Sekunden: {v}."
        examples:
          accepted:
            - { answer: [-2, -1, 0, 1, 2, 2, 2], seed: 1 }
          rejected:
            - { answer: [-2, -2, -2, -2, -2, -2, -2], seed: 1 }
            - { answer: [-2, -1, 0, 1, 1, 1, 1], seed: 1 }
