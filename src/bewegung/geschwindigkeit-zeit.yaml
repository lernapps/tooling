# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das Geschwindigkeit-Zeit-Diagramm
description: Du erkennst im Geschwindigkeit-Zeit-Diagramm, wann ein Körper schneller wird, gleich schnell bleibt und abbremst.
competencies: [bewegungsdiagramme]
blocks:
  - type: section
    id: einstieg
    title: Das Tempo über der Zeit
    blocks:
      - type: text
        text: |
          Im Weg-Zeit-Diagramm hast du gesehen, wie weit ein Wagen vom Start entfernt ist. Jetzt zeichnen wir etwas anderes auf: **wie schnell** er zu jedem Zeitpunkt ist.
      - type: definition
        term: Geschwindigkeit-Zeit-Diagramm
        explanation: Ein Geschwindigkeit-Zeit-Diagramm zeigt, wie schnell ein Körper zu jedem Zeitpunkt ist. Die Zeit steht waagerecht, die Geschwindigkeit senkrecht.
      - type: text
        text: |
          Ein Bus fährt an, fährt eine Weile gleichmäßig und bremst dann bis zum Halt. Die Tabelle zeigt sein Tempo.
      - type: table
        caption: Das Tempo des Busses in jeder Sekunde
        header: [Zeit t in s, Tempo v in m/s]
        rows:
          - ["0", "0"]
          - ["1", "2"]
          - ["2", "4"]
          - ["3", "4"]
          - ["4", "4"]
          - ["5", "2"]
          - ["6", "0"]
      - type: figure
        image: images/geschw-zeit-bus.svg
        alt: Ein Geschwindigkeit-Zeit-Diagramm. Die Zeit läuft von 0 bis 6 Sekunden, das Tempo von 0 bis 4 Metern pro Sekunde. Eine orange Linie mit Punkten steigt von 0 auf 4, bleibt dann waagerecht und fällt wieder auf 0.
        caption: Jeder Punkt gehört zu einer Zeile der Tabelle. Die Linie verbindet die Punkte.
        source: eigene Zeichnung
        licence: CC-BY-4.0
  - type: section
    id: erklaerung
    title: Was die Linie dir sagt
    blocks:
      - type: text
        text: |
          Du liest die Linie von links nach rechts.

          - **Die Linie steigt.** Das Tempo wird größer. Der Bus **beschleunigt**.
          - **Die Linie ist waagerecht.** Das Tempo bleibt gleich. Der Bus fährt gleichmäßig.
          - **Die Linie fällt.** Das Tempo wird kleiner. Der Bus **bremst ab**.
      - type: note
        title: Vorsicht
        blocks:
          - type: text
            text: |
              Im Weg-Zeit-Diagramm hieß waagerecht: Der Wagen steht. Hier ist es anders. Eine waagerechte Linie heißt: **Das Tempo bleibt gleich**, der Bus fährt weiter.
              Steht der Bus, liegt die Linie auf der Null.
              Eine fallende Linie heißt auch nicht, dass der Bus zurückfährt. Er wird nur langsamer.
  - type: section
    id: ausprobieren
    title: Ausprobieren
    blocks:
      - type: text
        text: |
          Oben fährt der Bus auf der Bahn. Die Punkte zeigen seinen Ort nach 0, 1 bis 6 Sekunden. Darunter siehst du sein Geschwindigkeit-Zeit-Diagramm. Die Achsen bleiben gleich.

          Mit **+** und **−** stellst du das Tempo für jede Sekunde ein, von 0 bis 4 m/s. Am Anfang ist die Fahrt des Busses eingestellt. Mit **Zurücksetzen** kommst du dahin zurück.
          Ändere zum Beispiel das Tempo bei 4 s. Wie ändert sich die Linie? Wie ändern sich die Abstände der Punkte auf der Bahn?
      - type: vue-component
        id: geschw-zeit-ausprobieren
        component: BewegungsDiagramm
        props:
          fahrten: { data: fahrten }
          start: bus
          ansicht: geschwindigkeit
          bahnTitel: Der Bus auf der Bahn
          geschwindigkeitTitel: Geschwindigkeit-Zeit-Diagramm
          wegTitel: Weg-Zeit-Diagramm
          tempoTitel: Tempo einstellen
          tempoLabel: Tempo bei {t} s
          tempoKonstantLabel: "Tempo: {v} m/s"
          mehr: Tempo bei {t} s erhöhen
          weniger: Tempo bei {t} s verringern
          zuruecksetzen: Zurücksetzen
          achseZeit: t in s
          achseGeschwindigkeit: v in m/s
          achseWeg: s in m
          bildBahn: "Ein Bus auf der Bahn. Sein Abstand vom Start nach 0 bis 6 Sekunden in Metern: {s}."
          bildGeschwindigkeit: "Geschwindigkeit-Zeit-Diagramm. Das Tempo in m/s bei 0 bis 6 Sekunden: {v}."
          bildWeg: "Weg-Zeit-Diagramm. Der Weg in Metern nach 0 bis 6 Sekunden: {s}."
          tabelleTitel: Werte als Tabelle
          spalteZeit: Zeit t in s
          spalteGeschwindigkeit: Tempo v in m/s
          spalteWeg: Weg s in m
        nojs: |
          Ein Bus fährt 6 Sekunden lang. Du kannst sein Tempo bei jeder Sekunde zwischen 0 und 4 m/s einstellen und siehst dazu die Bahn und das Geschwindigkeit-Zeit-Diagramm.

          Am Anfang gilt die Fahrt aus der Tabelle oben: 0, 2, 4, 4, 4, 2 und 0 m/s bei 0 bis 6 s. Die Linie steigt, ist dann waagerecht und fällt.

          Macht man das Tempo bei einer Sekunde größer, steigt die Linie dort höher. Macht man es kleiner, sinkt sie.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: vue-component
        id: geschw-zeit-einstellen
        component: DiagrammZeichnen
        props:
          aufgaben:
            - text: Ein Auto steht an der Ampel. Dann fährt es los und wird vier Sekunden lang immer schneller. Danach behält es sein Tempo.
              verlauf: "++++00"
              start: 0
            - text: Ein Fahrrad fährt mit 4 m/s. Es bremst vier Sekunden lang immer weiter ab, bis es steht. Dann bleibt es stehen.
              verlauf: "----00"
              start: 4
              ende: 0
          mistakes:
            - "Deine Linie ist waagerecht. Dann bleibt das Tempo immer gleich. In der Aufgabe ändert es sich."
            - "Schau noch einmal: Beschleunigen und Abbremsen sind vertauscht. Beim Beschleunigen steigt die Linie, beim Abbremsen fällt sie."
          abschnitt: "Schau dir den Abschnitt zwischen {a} s und {b} s an. Passt die Linie dort zur Aufgabe?"
          endeFalsch: "Der Anfang oder das Ende der Linie passt nicht zur Aufgabe. Lies die Aufgabe noch einmal."
          anweisung: Stelle das Geschwindigkeit-Zeit-Diagramm ein.
          startText: Das Tempo bei 0 s ist {v} m/s.
          tempoTitel: Tempo einstellen
          tempoLabel: Tempo bei {t} s
          mehr: Tempo bei {t} s erhöhen
          weniger: Tempo bei {t} s verringern
          zuruecksetzen: Zurücksetzen
          diagrammTitel: Dein Geschwindigkeit-Zeit-Diagramm
          achseZeit: t in s
          achseGeschwindigkeit: v in m/s
          bild: "Dein Geschwindigkeit-Zeit-Diagramm. Das Tempo in m/s bei 0 bis 6 Sekunden: {v}."
        examples:
          accepted:
            - { answer: [0, 1, 2, 3, 4, 4, 4], seed: 1 }
            - { answer: [4, 3, 2, 1, 0, 0, 0], seed: 2 }
          rejected:
            - { answer: [0, 0, 0, 0, 0, 0, 0], seed: 1 }
            - { answer: [0, 1, 2, 3, 3, 3, 3], seed: 1 }
            - { answer: [4, 4, 4, 4, 4, 4, 4], seed: 2 }
            - { answer: [4, 3, 2, 1, 0, 1, 2], seed: 2 }
      - type: single-choice
        id: wann-gleichmaessig
        text: Wann fährt der Wagen mit gleichem Tempo?
        material:
          - type: figure
            image: images/geschw-zeit-ablesen.svg
            alt: Ein Geschwindigkeit-Zeit-Diagramm mit einer orangen Linie und einem Punkt bei jeder Sekunde. Die Zeit läuft von 0 bis 6 Sekunden, das Tempo von 0 bis 4 Metern pro Sekunde.
            caption: Das Gitter hilft beim Ablesen. Eine Gitterlinie ist 1 s breit und 1 m/s hoch.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: Von 0 s bis 2 s
            correct: false
            info: "In dieser Zeit steigt die Linie. Das Tempo wird größer, der Wagen beschleunigt."
          - text: Von 2 s bis 4 s
            correct: true
            info: "Hier ist die Linie waagerecht. Das Tempo bleibt gleich."
          - text: Von 4 s bis 6 s
            correct: false
            info: "In dieser Zeit fällt die Linie. Das Tempo wird kleiner, der Wagen bremst ab."
        explanation: Bei gleichem Tempo ist die Linie im Geschwindigkeit-Zeit-Diagramm waagerecht.
        hint: Such den Teil der Linie, der weder steigt noch fällt.
        links:
          - title: Bewegungsdiagramme auf der Lernlandkarte
            url: https://lernapps.net/apps/map/physik/c/bewegungsdiagramme/
      - type: number
        id: tempo-ablesen
        text: Lies im Diagramm ab, wie schnell der Wagen nach 5 s ist. Antworte in m/s.
        material:
          - type: figure
            image: images/geschw-zeit-ablesen.svg
            alt: Ein Geschwindigkeit-Zeit-Diagramm mit einer orangen Linie und einem Punkt bei jeder Sekunde. Die Zeit läuft von 0 bis 6 Sekunden, das Tempo von 0 bis 4 Metern pro Sekunde.
            caption: Das Gitter hilft beim Ablesen. Eine Gitterlinie ist 1 s breit und 1 m/s hoch.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        answer: 2
        tolerance: 0
        unit: m/s
        mistakes:
          - answer: 5
            message: "5 ist die Zeit. Das Tempo steht an der senkrechten Achse."
          - answer: 3
            message: "3 m/s fährt der Wagen von 2 s bis 4 s. Gefragt ist nach 5 s."
        explanation: Bei 5 s liegt der Punkt auf der Höhe von 2 m/s. Der Wagen fährt dann mit 2 m/s.
        hint: Such 5 auf der Zeitachse. Geh senkrecht nach oben bis zur Linie. Dann geh nach links und lies das Tempo ab.
        links:
          - title: Bewegungsdiagramme auf der Lernlandkarte
            url: https://lernapps.net/apps/map/physik/c/bewegungsdiagramme/
      - type: true-false
        id: fallende-linie
        text: Eine fallende Linie im Geschwindigkeit-Zeit-Diagramm bedeutet, dass der Wagen rückwärts fährt.
        answer: false
        explanation: Eine fallende Linie bedeutet, dass das Tempo kleiner wird. Der Wagen bremst ab, fährt aber weiter in dieselbe Richtung.
        links:
          - title: Bewegungsdiagramme auf der Lernlandkarte
            url: https://lernapps.net/apps/map/physik/c/bewegungsdiagramme/
      - type: text
        text: "**Knobeln:** Für alle, die mehr wollen."
      - type: vue-component
        id: geschw-zeit-knobeln
        component: DiagrammZeichnen
        props:
          aufgaben:
            - text: Ein Zug fährt zwei Sekunden lang gleichmäßig mit 3 m/s. Dann bremst er zwei Sekunden lang ab. Danach fährt er gleichmäßig weiter.
              verlauf: "00--00"
              start: 3
          mistakes:
            - "Deine Linie ist waagerecht. Dann bleibt das Tempo immer gleich. In der Aufgabe ändert es sich."
            - "Schau noch einmal: Beschleunigen und Abbremsen sind vertauscht. Beim Beschleunigen steigt die Linie, beim Abbremsen fällt sie."
          abschnitt: "Schau dir den Abschnitt zwischen {a} s und {b} s an. Passt die Linie dort zur Aufgabe?"
          endeFalsch: "Der Anfang oder das Ende der Linie passt nicht zur Aufgabe. Lies die Aufgabe noch einmal."
          anweisung: Stelle das Geschwindigkeit-Zeit-Diagramm ein.
          startText: Das Tempo bei 0 s ist {v} m/s.
          tempoTitel: Tempo einstellen
          tempoLabel: Tempo bei {t} s
          mehr: Tempo bei {t} s erhöhen
          weniger: Tempo bei {t} s verringern
          zuruecksetzen: Zurücksetzen
          diagrammTitel: Dein Geschwindigkeit-Zeit-Diagramm
          achseZeit: t in s
          achseGeschwindigkeit: v in m/s
          bild: "Dein Geschwindigkeit-Zeit-Diagramm. Das Tempo in m/s bei 0 bis 6 Sekunden: {v}."
        examples:
          accepted:
            - { answer: [3, 3, 3, 2, 1, 1, 1], seed: 1 }
            - { answer: [3, 3, 3, 1, 0, 0, 0], seed: 1 }
          rejected:
            - { answer: [3, 3, 3, 3, 3, 3, 3], seed: 1 }
            - { answer: [3, 3, 3, 4, 4, 4, 4], seed: 1 }
