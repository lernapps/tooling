# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Geschwindigkeit berechnen – kurz wiederholt
description: Du wiederholst, wie du Geschwindigkeit, Weg oder Zeit aus den anderen beiden Größen berechnest.
recap: physik/geschwindigkeit-berechnen
blocks:
  - type: section
    id: einstieg
    title: Das kennst du schon
    blocks:
      - type: text
        text: >-
          Aus Klasse 7 kannst du mit $v = \frac{s}{t}$ rechnen. Gleich brauchst du das, um aus einem Diagramm eine
          Geschwindigkeit zu bestimmen. Hier siehst du kurz, wie du die Formel umstellst und Einheiten umrechnest.
  - type: section
    id: erklaert
    title: Die Formel in drei Richtungen
    blocks:
      - type: formula
        formula: 'v = \frac{s}{t} \qquad s = v \cdot t \qquad t = \frac{s}{v}'
      - type: text
        text: >-
          Gesucht ist die Geschwindigkeit: Weg durch Zeit. Gesucht ist der Weg: Geschwindigkeit mal Zeit. Gesucht ist die
          Zeit: Weg durch Geschwindigkeit. Achte auf die Einheiten: Meter und Sekunden ergeben m/s. Von m/s kommst du zu
          km/h, indem du mit 3,6 malnimmst. Zurück teilst du durch 3,6.
  - type: section
    id: beispiel
    title: Zwei Beispiele
    blocks:
      - type: example
        title: Geschwindigkeit und Weg
        blocks:
          - type: text
            text: >-
              Ein Scooter legt in 8 s genau 24 m zurück: $v = \frac{24\,\text{m}}{8\,\text{s}} = 3\,\frac{\text{m}}{\text{s}}$,
              das sind $3 \cdot 3{,}6 = 10{,}8$ km/h. Fährt er mit diesen 3 m/s noch 5 s weiter, legt er
              $s = 3\,\frac{\text{m}}{\text{s}} \cdot 5\,\text{s} = 15\,\text{m}$ zurück.
