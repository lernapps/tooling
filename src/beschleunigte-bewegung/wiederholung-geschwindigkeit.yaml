# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Wiederholung Geschwindigkeit
description: "Kurz wiederholt aus Klasse 7: Geschwindigkeit ist Weg durch Zeit, v = s : t."
recap: physik/geschwindigkeit-berechnen
blocks:
  - type: section
    id: einstieg
    title: Was du schon weißt
    blocks:
      - type: text
        text: |
          Wenn ein Fahrrad schnell fährt, kommt es in kurzer Zeit weit. Die Geschwindigkeit sagt, **wie weit** ein
          Körper in einer bestimmten **Zeit** kommt. Du kennst sie vom Tacho und vom Navi.
  - type: section
    id: erklaert
    title: Die Formel und ihre Einheit
    blocks:
      - type: definition
        term: Geschwindigkeit
        explanation: |
          Die Geschwindigkeit $v$ ist der Weg $s$, den ein Körper in der Zeit $t$ zurücklegt, geteilt durch diese Zeit.
      - type: formula
        formula: 'v = \frac{s}{t}'
      - type: text
        text: |
          Weg in Metern (m), Zeit in Sekunden (s), Geschwindigkeit in Metern pro Sekunde (m/s). Ein Rad, das in 4 s
          genau 20 m zurücklegt, fährt mit 5 m/s. Von km/h kommst du so zu m/s: durch 3,6 teilen. 36 km/h sind also
          10 m/s.
      - type: note
        title: Gleichmäßig oder nicht
        blocks:
          - type: text
            text: |
              Die Formel gilt für ein Stück der Fahrt. Fährt ein Körper nicht die ganze Zeit gleich schnell, sagt
              $v = \frac{s}{t}$ die mittlere Geschwindigkeit dieses Stücks. Wie sich die Geschwindigkeit im Lauf der
              Zeit ändert, ist das Thema dieses Kapitels.
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: Ein Fahrrad auf dem Radweg
        blocks:
          - type: text
            text: Ein Fahrrad fährt in 12 s genau 60 m. Seine Geschwindigkeit ist $v = \frac{60\,\text{m}}{12\,\text{s}} = 5\,\frac{\text{m}}{\text{s}}$.
