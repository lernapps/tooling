<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Der Streifen ist in drei Teile geteilt, ein Teil ist gestreift. Ist der gestreifte Teil ein Drittel?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/ungleiche-teile.svg" alt="Ein Rechteck, das in drei Teile geteilt ist. Die Teile sind verschieden breit. Der linke Teil ist gestreift." loading="lazy" decoding="async"><figcaption><p>Vergleiche die Breite der drei Teile.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Ja, es sind drei Teile und einer ist gestreift.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Nein, die drei Teile sind nicht gleich groß.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Nein, es müssten vier Teile sein.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Ja, es sind drei Teile und einer ist gestreift.</strong></p><p>Es sind zwar drei Teile, aber sie sind verschieden breit. Ein Drittel braucht drei gleich große Teile.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Nein, die drei Teile sind nicht gleich groß.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig: Nur bei gleich großen Teilen heißt ein Teil ein Drittel.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Nein, es müssten vier Teile sein.</strong></p><p>Bei vier gleich großen Teilen wäre jeder ein Viertel. Für ein Drittel braucht man drei gleich große Teile.</p></li>
</ul>
<p class="question-explanation">Die Teile sind verschieden breit. Darum ist der gestreifte Teil kein Drittel.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Eine Pizza ist so in gleich große Stücke geschnitten, dass jedes Stück ein Fünftel ist. In wie viele Stücke ist die Pizza geteilt?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a2">  </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 5</p>
<p class="question-explanation">Fünftel kommt von fünf. Die Pizza ist in 5 gleich große Stücke geteilt.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Sechs Kinder teilen einen Kuchen gerecht. Welchen Teil des Kuchens bekommt jedes Kind?</legend>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>ein Sechstel</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>ein Fünftel</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>ein Halb</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>ein Sechstel</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig: 6 gleich große Stücke, jedes ist ein Sechstel.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>ein Fünftel</strong></p><p>Ein Fünftel gehört zu 5 gleich großen Stücken. Hier sind es 6 Kinder, also 6 Stücke.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>ein Halb</strong></p><p>Ein Halb gehört zu 2 gleich großen Stücken, nicht zu 6.</p></li>
</ul>
<p class="question-explanation">Für 6 Kinder braucht man 6 gleich große Stücke. Jedes Stück ist ein Sechstel des Kuchens.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
