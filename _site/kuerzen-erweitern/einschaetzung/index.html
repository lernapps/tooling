<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 9 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<h2 id="teil-1" tabindex="-1">Seite 1 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Bruch ist <math><mfrac><mn>2</mn><mn>3</mn></mfrac></math>, mit 2 erweitert?</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="0" aria-label="vier sechstel"> <span><math><mfrac><mn>4</mn><mn>6</mn></mfrac></math></span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1" aria-label="zwei sechstel"> <span><math><mfrac><mn>2</mn><mn>6</mn></mfrac></math></span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2" aria-label="drei viertel"> <span><math><mfrac><mn>3</mn><mn>4</mn></mfrac></math></span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong><math><mfrac><mn>4</mn><mn>6</mn></mfrac></math></strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig: 2 · 2 = 4 und 3 · 2 = 6. Beide Zahlen werden mit 2 malgenommen.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong><math><mfrac><mn>2</mn><mn>6</mn></mfrac></math></strong></p><p>Hier wurde nur der Nenner mal 2 genommen. Der Zähler muss auch mit 2 malgenommen werden, sonst ist es weniger Pizza.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong><math><mfrac><mn>3</mn><mn>4</mn></mfrac></math></strong></p><p>Hier wurde zu Zähler und Nenner 1 addiert. Beim Erweitern wird malgenommen, nicht addiert.</p></li>
</ul>
<p class="question-explanation">Beim Erweitern nimmst du Zähler und Nenner mit derselben Zahl mal. Aus <math><mfrac><mn>2</mn><mn>3</mn></mfrac></math> wird so <math><mfrac><mn>4</mn><mn>6</mn></mfrac></math>.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-assessment-live"></div></li>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Du willst <math><mfrac><mn>8</mn><mn>12</mn></mfrac></math> in einem Schritt so weit wie möglich kürzen. Durch welche Zahl teilst du Zähler und Nenner?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>durch 4</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>durch 2</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>durch 3</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>durch 4</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig: 4 geht in 8 und in 12 auf. Es wird <math><mfrac><mn>2</mn><mn>3</mn></mfrac></math>, das ist fertig gekürzt.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>durch 2</strong></p><p>Auch 2 geht in beiden auf. Es wird <math><mfrac><mn>4</mn><mn>6</mn></mfrac></math>, und das lässt sich noch weiter kürzen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>durch 3</strong></p><p>3 geht in 12 auf, aber nicht in 8. Du darfst nur durch eine Zahl kürzen, die in beiden aufgeht.</p></li>
</ul>
<p class="question-explanation">4 ist die größte Zahl, die in 8 und in 12 aufgeht. Mit ihr kürzt du in einem Schritt zu <math><mfrac><mn>2</mn><mn>3</mn></mfrac></math>.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="explainer-assessment-live"></div></li>

<section class="explainer-assessment-step" data-step="2" aria-labelledby="teil-3" hidden>
<h2 id="teil-3" tabindex="-1">Seite 3 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="question" id="frage-a7" data-id="a7" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Bruch ist größer, <math><mfrac><mn>1</mn><mn>6</mn></mfrac></math> oder <math><mfrac><mn>1</mn><mn>9</mn></mfrac></math>?</legend>
<label class="question-option"><input type="radio" name="frage-a7" value="0" aria-label="ein sechstel"> <span><math><mfrac><mn>1</mn><mn>6</mn></mfrac></math></span></label>
<label class="question-option"><input type="radio" name="frage-a7" value="1" aria-label="ein neuntel"> <span><math><mfrac><mn>1</mn><mn>9</mn></mfrac></math></span></label>
<label class="question-option"><input type="radio" name="frage-a7" value="2"> <span>Beide sind gleich groß.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong><math><mfrac><mn>1</mn><mn>6</mn></mfrac></math></strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig: Ein Sechstel hat weniger, also größere Teile als ein Neuntel.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong><math><mfrac><mn>1</mn><mn>9</mn></mfrac></math></strong></p><p>9 ist zwar größer als 6, aber der Nenner zählt die Teile. Je mehr Teile, desto kleiner ist jedes Teil.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Beide sind gleich groß.</strong></p><p>Ein Sechstel und ein Neuntel sind nicht gleich groß. Mit mehr Teilen wird jedes Teil kleiner.</p></li>
</ul>
<p class="question-explanation">Bei 6 Stücken ist jedes Stück größer als bei 9 Stücken. Darum ist <math><mfrac><mn>1</mn><mn>6</mn></mfrac></math> größer als <math><mfrac><mn>1</mn><mn>9</mn></mfrac></math>.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a9"><p class="explainer-assessment-label">Aufgabe 9</p><div class="question" id="frage-a9" data-id="a9" data-type="single-choice">

<fieldset>

<label class="question-option"><input type="radio" name="frage-a9" value="0" aria-label="fünf sechstel"> <span><math><mfrac><mn>5</mn><mn>6</mn></mfrac></math></span></label>
<label class="question-option"><input type="radio" name="frage-a9" value="1" aria-label="drei viertel"> <span><math><mfrac><mn>3</mn><mn>4</mn></mfrac></math></span></label>
<label class="question-option"><input type="radio" name="frage-a9" value="2"> <span>Beide sind gleich groß.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong><math><mfrac><mn>5</mn><mn>6</mn></mfrac></math></strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig: Gleichnamig mit Nenner 12 ist <math><mrow><mfrac><mn>5</mn><mn>6</mn></mfrac><mo>=</mo><mfrac><mn>10</mn><mn>12</mn></mfrac></mrow></math> und <math><mrow><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>9</mn><mn>12</mn></mfrac></mrow></math>.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong><math><mfrac><mn>3</mn><mn>4</mn></mfrac></math></strong></p><p>Gleichnamig mit Nenner 12 ist <math><mrow><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>9</mn><mn>12</mn></mfrac></mrow></math>, und <math><mrow><mfrac><mn>5</mn><mn>6</mn></mfrac><mo>=</mo><mfrac><mn>10</mn><mn>12</mn></mfrac></mrow></math> ist größer.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Beide sind gleich groß.</strong></p><p>Mit Nenner 12 sind es 10 Zwölftel und 9 Zwölftel. Das ist nicht dasselbe.</p></li>
</ul>
<p class="question-explanation">Mit Nenner 12 sind es <math><mfrac><mn>10</mn><mn>12</mn></mfrac></math> und <math><mfrac><mn>9</mn><mn>12</mn></mfrac></math>. Weil 10 größer ist als 9, ist <math><mfrac><mn>5</mn><mn>6</mn></mfrac></math> größer.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
