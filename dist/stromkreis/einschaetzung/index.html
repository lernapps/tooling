<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Die Lampe leuchtet nicht. Woran liegt das?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/einfacher-stromkreis-2.svg" alt="Schaltplan mit Batterie und Lampe. Die obere Leitung ist durchgehend, die untere Leitung hat in der Mitte eine Lücke." loading="lazy" decoding="async"><figcaption><p>Batterie, Lampe und Leitungen. Suche die Stelle, an der der Weg nicht durchgeht.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Der Weg ist unterbrochen, deshalb fließt nirgends Strom.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Der Strom ist in der oberen Leitung schon verbraucht.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Der Strom kommt nur bis zur Lücke und bleibt dort.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="3"> <span>Die Lampe braucht ein zweites Kabel zum Pluspol.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Der Weg ist unterbrochen, deshalb fließt nirgends Strom.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Durch die Lücke fehlt der Rückweg zur Batterie. Ohne geschlossenen Weg fließt in keiner Leitung Strom.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Der Strom ist in der oberen Leitung schon verbraucht.</strong></p><p>Strom wird in einer Leitung nicht verbraucht. Er fließt nur, wenn der ganze Weg geschlossen ist.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Der Strom kommt nur bis zur Lücke und bleibt dort.</strong></p><p>Wo der Weg endet, fließt auch davor kein Strom, denn der Strom braucht den ganzen Kreis.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Die Lampe braucht ein zweites Kabel zum Pluspol.</strong></p><p>Die Lampe hat schon zwei Anschlüsse. Es fehlt nur das Stück der unteren Leitung.</p></li>
</ul>
<p class="question-explanation">Eine Lücke in der Leitung öffnet den Stromkreis. Dann fließt nirgends Strom, und die Lampe bleibt dunkel.</p>

<ul class="question-pairs">
<li><label><span>obere Leitung</span> <select name="frage-a2-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Minuspol der Batterie</span> <select name="frage-a2-4" data-item="4"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Pluspol der Batterie</span> <select name="frage-a2-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Lampe</span> <select name="frage-a2-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>untere Leitung</span> <select name="frage-a2-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>

<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>Ja, aber nur schwach.</span></label>
</fieldset>

<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Nein, der Schalter ist offen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der abgehobene Hebel bedeutet eine Lücke. Der Weg ist nicht geschlossen.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Ja, denn alle Bauteile sind gezeichnet.</strong></p><p>Dass die Bauteile da sind, genügt nicht. Der Weg muss auch ohne Lücke sein.</p></li>
