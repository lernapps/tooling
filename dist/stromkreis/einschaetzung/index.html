<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Die Lampe in einem einfachen Stromkreis leuchtet nicht. Welche Ursache passt?</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Ein Kabel ist nicht richtig verbunden, der Kreis ist offen.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Der Strom ist in der Lampe schon aufgebraucht.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Der Strom kommt von beiden Seiten in die Lampe und stößt dort zusammen.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Ein Kabel ist nicht richtig verbunden, der Kreis ist offen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ist der Weg an einer Stelle unterbrochen, kann kein Strom fließen.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Der Strom ist in der Lampe schon aufgebraucht.</strong></p><p>Strom wird nicht aufgebraucht. Er fließt im Kreis, und nur Energie wird umgewandelt.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Der Strom kommt von beiden Seiten in die Lampe und stößt dort zusammen.</strong></p><p>Im Stromkreis gibt es einen Umlauf in eine Richtung. Es kommt nichts von beiden Seiten.</p></li>
</ul>
<p class="question-explanation">Die Lampe leuchtet nur, wenn der Stromkreis geschlossen ist.</p>
<p class="question-more">Mehr dazu:</p>

</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Stimmt die Aussage? Die Stromstärke ist nach der Lampe kleiner als davor, weil die Lampe Strom verbraucht.</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="true"> <span>Stimmt</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="false"> <span>Stimmt nicht</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Aussage stimmt nicht.</p>
<p class="question-explanation">Falsch. Im geschlossenen Kreis fließt überall derselbe Strom. Die Lampe verbraucht keinen Strom, sie wandelt elektrische Energie um.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Stromkreis" rel="noopener">Stromkreis (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Stoffe sind Leiter? Wähle alle richtigen aus.</legend>
<label class="question-option"><input type="checkbox" name="frage-a3" value="0"> <span>Kupfer</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="1"> <span>Aluminiumfolie</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="2"> <span>Glas</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="3"> <span>Gummi</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Kupfer</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Kupfer ist ein Metall und leitet den Strom sehr gut.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Aluminiumfolie</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Aluminium ist ein Metall, also ein Leiter.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Glas</strong></p><p>Glas ist ein Nichtleiter und wird als Isolator verwendet.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Gummi</strong></p><p>Gummi leitet nicht. Deshalb sind Griffe von Werkzeugen für Elektriker aus Gummi.</p></li>
</ul>
<p class="question-explanation">Metalle wie Kupfer und Aluminium sind Leiter. Glas und Gummi sind Nichtleiter.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrischer_Leiter" rel="noopener">Elektrischer Leiter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

<h2 id="teil-2" tabindex="-1">Seite 2 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Warum sind Kabel außen mit Kunststoff umgeben?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Kunststoff ist ein Nichtleiter und schützt vor dem Strom.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Kunststoff leitet den Strom besser als Kupfer.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Kunststoff macht die Lampe heller.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Kunststoff ist ein Nichtleiter und schützt vor dem Strom.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Hülle isoliert den Kern. So berührst du nicht den leitenden Draht.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Kunststoff leitet den Strom besser als Kupfer.</strong></p><p>Es ist umgekehrt. Kupfer ist ein sehr guter Leiter, Kunststoff leitet nicht.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Kunststoff macht die Lampe heller.</strong></p><p>Die Hülle hat keinen Einfluss auf die Helligkeit. Sie dient nur der Isolierung.</p></li>
</ul>
<p class="question-explanation">Die Kunststoffhülle isoliert das Kabel. Der Kupferkern leitet den Strom.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Isolator_(Elektrotechnik)" rel="noopener">Isolator (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Der Schalter in einem Stromkreis ist offen. Was gilt?</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Der Stromkreis ist unterbrochen, die Lampe leuchtet nicht.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Die Lampe leuchtet schwächer.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Der Strom fließt nur von der Batterie bis zum Schalter und bleibt dort stehen.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Der Stromkreis ist unterbrochen, die Lampe leuchtet nicht.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Lücke im Schalter unterbricht den Weg. Es fließt kein Strom.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Die Lampe leuchtet schwächer.</strong></p><p>Es gibt kein „ein bisschen“ bei einem offenen Kreis. Ist er offen, fließt gar kein Strom.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Der Strom fließt nur von der Batterie bis zum Schalter und bleibt dort stehen.</strong></p><p>Im offenen Kreis fließt der Strom nirgends im Kreis. Auch vor dem Schalter bewegt sich nichts.</p></li>
</ul>
<p class="question-explanation">Ein offener Schalter unterbricht den Stromkreis. Deshalb ist die Lampe aus.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrischer_Schalter" rel="noopener">Elektrischer Schalter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>

<label class="question-option"><input type="radio" name="frage-a6" value="false"> <span>Stimmt nicht</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Aussage stimmt.</p>
<p class="question-explanation">Richtig. Trockene Luft ist ein Nichtleiter, deshalb ist der Kreis unterbrochen.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrischer_Schalter" rel="noopener">Elektrischer Schalter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="single-choice">

<script type="application/json" class="explainer-assessment-data">{"key":"self-assessment:stromkreis","storage":"strom-im-kreis","steps":3,"items":[{"key":"a1","ref":"/stromkreis/einfacher-stromkreis/#stromkreis-geschlossen","page":"stromkreis/einfacher-stromkreis/","exercise":"stromkreis-geschlossen","step":0,"data":{"kind":"question","lang":"de","question":{"id":"a1","text":"Die Lampe in einem einfachen Stromkreis leuchtet nicht. Welche Ursache passt?","explanation":"Die Lampe leuchtet nur, wenn der Stromkreis geschlossen ist.","links":[{"title":"Stromkreis (Wikipedia)","url":"https://de.wikipedia.org/wiki/Stromkreis"}],"type":"single-choice","options":[{"text":"Ein Kabel ist nicht richtig verbunden, der Kreis ist offen.","correct":true,"info":"Ist der Weg an einer Stelle unterbrochen, kann kein Strom fließen."},{"text":"Der Strom ist in der Lampe schon aufgebraucht.","correct":false,"info":"Strom wird nicht aufgebraucht. Er fließt im Kreis, und nur Energie wird umgewandelt."},{"text":"Der Strom kommt von beiden Seiten in die Lampe und stößt dort zusammen.","correct":false,"info":"Im Stromkreis gibt es einen Umlauf in eine Richtung. Es kommt nichts von beiden Seiten."}]},"rendered":{}}},{"key":"a2","ref":"/stromkreis/einfacher-stromkreis/#strom-wird-verbraucht","page":"stromkreis/einfacher-stromkreis/","exercise":"strom-wird-verbraucht","step":0,"data":{"kind":"question","lang":"de","question":{"id":"a2","text":"Stimmt die Aussage? Die Stromstärke ist nach der Lampe kleiner als davor, weil die Lampe Strom verbraucht.","explanation":"Falsch. Im geschlossenen Kreis fließt überall derselbe Strom. Die Lampe verbraucht keinen Strom, sie wandelt elektrische Energie um.","links":[{"title":"Stromkreis (Wikipedia)","url":"https://de.wikipedia.org/wiki/Stromkreis"}],"type":"true-false","answer":false},"rendered":{}}},{"key":"a3","ref":"/stromkreis/leiter-nichtleiter/#stoffe-leiter","page":"stromkreis/leiter-nichtleiter/","exercise":"stoffe-leiter","step":0,"data":{"kind":"question","lang":"de","question":{"id":"a3","text":"Welche Stoffe sind Leiter? Wähle alle richtigen aus.","explanation":"Metalle wie Kupfer und Aluminium sind Leiter. Glas und Gummi sind Nichtleiter.","links":[{"title":"Elektrischer Leiter (Wikipedia)","url":"https://de.wikipedia.org/wiki/Elektrischer_Leiter"}],"type":"multiple-choice","options":[{"text":"Kupfer","correct":true,"info":"Kupfer ist ein Metall und leitet den Strom sehr gut."},{"text":"Aluminiumfolie","correct":true,"info":"Aluminium ist ein Metall, also ein Leiter."},{"text":"Glas","correct":false,"info":"Glas ist ein Nichtleiter und wird als Isolator verwendet."},{"text":"Gummi","correct":false,"info":"Gummi leitet nicht. Deshalb sind Griffe von Werkzeugen für Elektriker aus Gummi."}]},"rendered":{}}},{"key":"a4","ref":"/stromkreis/leiter-nichtleiter/#kabel-huelle","page":"stromkreis/leiter-nichtleiter/","exercise":"kabel-huelle","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a4","text":"Warum sind Kabel außen mit Kunststoff umgeben?","explanation":"Die Kunststoffhülle isoliert das Kabel. Der Kupferkern leitet den Strom.","links":[{"title":"Isolator (Wikipedia)","url":"https://de.wikipedia.org/wiki/Isolator_(Elektrotechnik)"}],"type":"single-choice","options":[{"text":"Kunststoff ist ein Nichtleiter und schützt vor dem Strom.","correct":true,"info":"Die Hülle isoliert den Kern. So berührst du nicht den leitenden Draht."},{"text":"Kunststoff leitet den Strom besser als Kupfer.","correct":false,"info":"Es ist umgekehrt. Kupfer ist ein sehr guter Leiter, Kunststoff leitet nicht."},{"text":"Kunststoff macht die Lampe heller.","correct":false,"info":"Die Hülle hat keinen Einfluss auf die Helligkeit. Sie dient nur der Isolierung."}]},"rendered":{}}},{"key":"a5","ref":"/stromkreis/schalter/#schalter-offen","page":"stromkreis/schalter/","exercise":"schalter-offen","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a5","text":"Der Schalter in einem Stromkreis ist offen. Was gilt?","explanation":"Ein offener Schalter unterbricht den Stromkreis. Deshalb ist die Lampe aus.","links":[{"title":"Elektrischer Schalter (Wikipedia)","url":"https://de.wikipedia.org/wiki/Elektrischer_Schalter"}],"type":"single-choice","options":[{"text":"Der Stromkreis ist unterbrochen, die Lampe leuchtet nicht.","correct":true,"info":"Die Lücke im Schalter unterbricht den Weg. Es fließt kein Strom."},{"text":"Die Lampe leuchtet schwächer.","correct":false,"info":"Es gibt kein „ein bisschen“ bei einem offenen Kreis. Ist er offen, fließt gar kein Strom."},{"text":"Der Strom fließt nur von der Batterie bis zum Schalter und bleibt dort stehen.","correct":false,"info":"Im offenen Kreis fließt der Strom nirgends im Kreis. Auch vor dem Schalter bewegt sich nichts."}]},"rendered":{}}},{"key":"a6","ref":"/stromkreis/schalter/#schalter-luft","page":"stromkreis/schalter/","exercise":"schalter-luft","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a6","text":"Stimmt die Aussage? Bei einem offenen Schalter ist zwischen den Kontakten Luft, die den Strom nicht leitet.","explanation":"Richtig. Trockene Luft ist ein Nichtleiter, deshalb ist der Kreis unterbrochen.","links":[{"title":"Elektrischer Schalter (Wikipedia)","url":"https://de.wikipedia.org/wiki/Elektrischer_Schalter"}],"type":"true-false","answer":true},"rendered":{}}},{"key":"a7","ref":"/stromkreis/schaltplan/#zeichen-zuordnen","page":"stromkreis/schaltplan/","exercise":"zeichen-zuordnen","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a7","text":"Ordne jedem Bauteil sein Schaltzeichen zu.","explanation":"Jedes Bauteil hat ein festes Schaltzeichen. So versteht jeder denselben Plan.","links":[{"title":"Schaltplan (Wikipedia)","url":"https://de.wikipedia.org/wiki/Schaltplan"}],"type":"matching","pairs":[{"left":"Lampe","right":"Kreis mit Kreuz"},{"left":"Amperemeter","right":"Kreis mit A"},{"left":"Voltmeter","right":"Kreis mit V"},{"left":"Batterie","right":"langer und kurzer Strich"}]},"rendered":{}}},{"key":"a8","ref":"/stromkreis/schaltplan/#plan-lesen","page":"stromkreis/schaltplan/","exercise":"plan-lesen","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a8","text":"Im Schaltplan ist ein Schalter als schräger Strich mit Lücke gezeichnet. Was bedeutet das?","explanation":"Ein schräger Strich ohne Verbindung steht für einen offenen Schalter.","links":[{"title":"Schaltplan (Wikipedia)","url":"https://de.wikipedia.org/wiki/Schaltplan"}],"type":"single-choice","options":[{"text":"Der Schalter ist offen, der Stromkreis ist unterbrochen.","correct":true,"info":"Der schräge Strich berührt den zweiten Kontakt nicht. Es gibt eine Lücke."},{"text":"Der Schalter ist geschlossen, die Lampe leuchtet.","correct":false,"info":"Ein geschlossener Schalter wird als gerader Strich gezeichnet, der beide Kontakte verbindet."},{"text":"Der Schalter ist defekt.","correct":false,"info":"Das Zeichen sagt nur, ob der Schalter offen oder zu ist, nicht, ob er funktioniert."}]},"rendered":{}}},{"key":"a9","ref":"/stromkreis/spannungsquellen/#quelle-einsatz","page":"stromkreis/spannungsquellen/","exercise":"quelle-einsatz","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a9","text":"Ordne jede Spannungsquelle ihrem Einsatz zu.","explanation":"Batterien sind mobil und ungefährlich. Netzgeräte lassen sich einstellen. Die Steckdose versorgt Haushaltsgeräte.","links":[{"title":"Spannungsquelle (Wikipedia)","url":"https://de.wikipedia.org/wiki/Spannungsquelle"}],"type":"matching","pairs":[{"left":"Batterie","right":"Taschenlampe"},{"left":"Netzgerät","right":"Versuche im Unterricht mit einstellbarer Spannung"},{"left":"Steckdose","right":"Staubsauger und Fernseher"}]},"rendered":{}}},{"key":"a10","ref":"/stromkreis/spannungsquellen/#quelle-experiment","page":"stromkreis/spannungsquellen/","exercise":"quelle-experiment","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a10","text":"Welche Spannungsquelle verwendest du für eigene Versuche mit einer kleinen Lampe?","explanation":"Für eigene Versuche benutzt du nur Batterien oder Netzgeräte mit kleiner Spannung.","links":[{"title":"Spannungsquelle (Wikipedia)","url":"https://de.wikipedia.org/wiki/Spannungsquelle"}],"type":"single-choice","options":[{"text":"Eine Batterie.","correct":true,"info":"Eine Batterie liefert nur wenige Volt und ist ungefährlich."},{"text":"Die Steckdose.","correct":false,"info":"Die Steckdose liefert 230 V. Damit sind Versuche lebensgefährlich."},{"text":"Eine Steckdose mit einem Verlängerungskabel.","correct":false,"info":"Auch das ändert nichts an den 230 V. Die Gefahr bleibt dieselbe."}]},"rendered":{}}}],"pages":[{"page":"stromkreis/einfacher-stromkreis/","title":"Der einfache Stromkreis","href":"../../stromkreis/einfacher-stromkreis/"},{"page":"stromkreis/leiter-nichtleiter/","title":"Leiter und Nichtleiter","href":"../../stromkreis/leiter-nichtleiter/"},{"page":"stromkreis/schalter/","title":"Der Schalter","href":"../../stromkreis/schalter/"},{"page":"stromkreis/schaltplan/","title":"Der Schaltplan","href":"../../stromkreis/schaltplan/"},{"page":"stromkreis/spannungsquellen/","title":"Spannungsquellen","href":"../../stromkreis/spannungsquellen/"}],"chapters":[{"title":"Der Stromkreis","assessment":"stromkreis/einschaetzung/","pages":[{"title":"Der einfache Stromkreis","local":"stromkreis/einfacher-stromkreis/"},{"title":"Leiter und Nichtleiter","local":"stromkreis/leiter-nichtleiter/"},{"title":"Der Schalter","local":"stromkreis/schalter/"},{"title":"Der Schaltplan","local":"stromkreis/schaltplan/"},{"title":"Spannungsquellen","local":"stromkreis/spannungsquellen/"}]},{"title":"Stromstärke","assessment":"stromstaerke/einschaetzung/","pages":[{"title":"Die Stromstärke","local":"stromstaerke/stromstaerke/"},{"title":"Stromstärke messen","local":"stromstaerke/messen/"}]},{"title":"Spannung","assessment":"spannung/einschaetzung/","pages":[{"title":"Die Spannung","local":"spannung/spannung/"},{"title":"Spannung messen","loca
