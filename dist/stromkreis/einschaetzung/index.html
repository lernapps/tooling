<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ist der Stromkreis an einer Stelle unterbrochen, kann die Lampe trotzdem leuchten.</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="true"> <span>Stimmt</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="false"> <span>Stimmt nicht</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Aussage stimmt nicht.</p>
<p class="question-explanation">Bei einem offenen Stromkreis fließt kein Strom, also leuchtet die Lampe nicht. Der Strom braucht einen Weg ohne Lücke, der zur Batterie zurückführt.</p>

<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Stromkreis" rel="noopener">Stromkreis (Wikipedia)</a></li>

</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>

<div class="question-material"><figure class="block-figure"><img src="../../images/stromkreis-2a.svg" alt="Schaltung A, Batterie links und Lampe rechts. Das obere Kabel ist durchgehend, das untere Kabel besteht aus zwei getrennten Stücken." loading="lazy" decoding="async"><figcaption><p>Schaltung A</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure><figure class="block-figure"><img src="../../images/stromkreis-2b.svg" alt="Schaltung B, Batterie links und Lampe rechts. Das obere und das untere Kabel sind durchgehend." loading="lazy" decoding="async"><figcaption><p>Schaltung B</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure><figure class="block-figure"><img src="../../images/stromkreis-2c.svg" alt="Schaltung C, Batterie links und Lampe rechts. Das untere Kabel ist durchgehend, das obere Kabel besteht aus zwei getrennten Stücken." loading="lazy" decoding="async"><figcaption><p>Schaltung C</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Schaltung A</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Schaltung B</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Schaltung C</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Schaltung A</strong></p><p>In Schaltung A fehlt ein Stück im unteren Kabel. Der Weg ist unterbrochen, also fließt kein Strom.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Schaltung B</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>In Schaltung B führt der Weg ohne Lücke von der Batterie durch die Lampe und zurück. Der Kreis ist geschlossen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Schaltung C</strong></p><p>In Schaltung C fehlt ein Stück im oberen Kabel. Der Weg ist unterbrochen, also fließt kein Strom.</p></li>
</ul>
<p class="question-explanation">Eine Lampe leuchtet nur, wenn der Weg des Stroms von der Batterie durch die Lampe und zurück geschlossen ist.</p>

</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Gegenstände leiten den elektrischen Strom?</legend>
<label class="question-option"><input type="checkbox" name="frage-a3" value="0"> <span>ein Kupferdraht</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="1"> <span>ein Radiergummi</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="2"> <span>eine Bleistiftmine</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="3"> <span>ein Glasstab</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>ein Kupferdraht</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Kupfer ist ein Leiter. Darum sind die Drähte in Kabeln aus Kupfer.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>ein Radiergummi</strong></p><p>Gummi ist ein Nichtleiter. Die Lampe würde dunkel bleiben.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>eine Bleistiftmine</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Mine besteht aus Graphit. Graphit ist kein Metall, leitet aber den Strom.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>ein Glasstab</strong></p><p>Glas ist ein Nichtleiter. Es lässt den Strom nicht durch.</p></li>
</ul>
<p class="question-explanation">Kupferdraht und Bleistiftmine leiten, Radiergummi und Glasstab nicht.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrischer_Leiter" rel="noopener">Elektrischer Leiter (Wikipedia)</a></li>
</ul>
</div>

</div></li>

<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">

<fieldset>

<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Kunststoff ist ein Leiter und hilft dem Draht beim Leiten.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Kunststoff macht das Kabel nur bunter.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Kunststoff ist ein Nichtleiter und hält den Strom im Draht.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Hülle lässt den Strom nicht durch. Er bleibt im Draht und nimmt keinen ungewollten Weg.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Kunststoff ist ein Leiter und hilft dem Draht beim Leiten.</strong></p><p>Kunststoff leitet den Strom nicht. Das zeigt die Tabelle mit dem Lineal.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Kunststoff macht das Kabel nur bunter.</strong></p><p>Die Farbe hilft beim Unterscheiden der Kabel, aber der Kunststoff hat eine wichtigere Aufgabe: Er isoliert.</p></li>
</ul>
<p class="question-explanation">Der Draht im Kabel leitet, die Hülle isoliert. So bleibt der Strom auf seinem Weg.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrischer_Leiter" rel="noopener">Elektrischer Leiter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>

<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Schaltplan B</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Schaltplan C</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Schaltplan A</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Schalter ist geschlossen, die Klinge verbindet beide Kontakte. Der Weg ist ohne Lücke.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Schaltplan B</strong></p><p>Hier ist der Schalter offen. Zwischen Klinge und Kontakt ist eine Lücke, also fließt kein Strom.</p></li>

<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Stromkreis" rel="noopener">Stromkreis (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="true-false">

<script type="application/json" class="explainer-assessment-data">{"key":"self-assessment:stromkreis","storage":"stromkreis","steps":3,"items":[{"key":"a1","ref":"/stromkreis/einfacher-stromkreis/#stromkreis-2","page":"stromkreis/einfacher-stromkreis/","exercise":"stromkreis-2","step":0,"data":{"kind":"question","lang":"de","question":{"id":"a1","text":"Ist der Stromkreis an einer Stelle unterbrochen, kann die Lampe trotzdem leuchten.","explanation":"Bei einem offenen Stromkreis fließt kein Strom, also leuchtet die Lampe nicht. Der Strom braucht einen Weg ohne Lücke, der zur Batterie zurückführt.","links":[{"title":"Stromkreis (Wikipedia)","url":"https://de.wikipedia.org/wiki/Stromkreis"}],"type":"true-false","answer":false},"rendered":{}}},{"key":"a2","ref":"/stromkreis/einfacher-stromkreis/#stromkreis-3","page":"stromkreis/einfacher-stromkreis/","exercise":"stromkreis-3","step":0,"data":{"kind":"question","lang":"de","question":{"id":"a2","text":"In welcher Schaltung leuchtet die Lampe? Folge in jeder Zeichnung dem Weg von der Batterie durch die Lampe und zurück und suche eine Lücke.","explanation":"Eine Lampe leuchtet nur, wenn der Weg des Stroms von der Batterie durch die Lampe und zurück geschlossen ist.","links":[{"title":"Stromkreis (Wikipedia)","url":"https://de.wikipedia.org/wiki/Stromkreis"}],"material":[{"type":"figure","image":"images/stromkreis-2a.svg","alt":"Schaltung A, Batterie links und Lampe rechts. Das obere Kabel ist durchgehend, das untere Kabel besteht aus zwei getrennten Stücken.","caption":"Schaltung A","source":"eigene Zeichnung","licence":"CC-BY-4.0"},{"type":"figure","image":"images/stromkreis-2b.svg","alt":"Schaltung B, Batterie links und Lampe rechts. Das obere und das untere Kabel sind durchgehend.","caption":"Schaltung B","source":"eigene Zeichnung","licence":"CC-BY-4.0"},{"type":"figure","image":"images/stromkreis-2c.svg","alt":"Schaltung C, Batterie links und Lampe rechts. Das untere Kabel ist durchgehend, das obere Kabel besteht aus zwei getrennten Stücken.","caption":"Schaltung C","source":"eigene Zeichnung","licence":"CC-BY-4.0"}],"type":"single-choice","options":[{"text":"Schaltung A","correct":false,"info":"In Schaltung A fehlt ein Stück im unteren Kabel. Der Weg ist unterbrochen, also fließt kein Strom."},{"text":"Schaltung B","correct":true,"info":"In Schaltung B führt der Weg ohne Lücke von der Batterie durch die Lampe und zurück. Der Kreis ist geschlossen."},{"text":"Schaltung C","correct":false,"info":"In Schaltung C fehlt ein Stück im oberen Kabel. Der Weg ist unterbrochen, also fließt kein Strom."}]},"rendered":{}}},{"key":"a3","ref":"/stromkreis/leiter-nichtleiter/#leiter-1","page":"stromkreis/leiter-nichtleiter/","exercise":"leiter-1","step":0,"data":{"kind":"question","lang":"de","question":{"id":"a3","text":"Welche Gegenstände leiten den elektrischen Strom?","explanation":"Kupferdraht und Bleistiftmine leiten, Radiergummi und Glasstab nicht.","links":[{"title":"Elektrischer Leiter (Wikipedia)","url":"https://de.wikipedia.org/wiki/Elektrischer_Leiter"}],"type":"multiple-choice","options":[{"text":"ein Kupferdraht","correct":true,"info":"Kupfer ist ein Leiter. Darum sind die Drähte in Kabeln aus Kupfer."},{"text":"ein Radiergummi","correct":false,"info":"Gummi ist ein Nichtleiter. Die Lampe würde dunkel bleiben."},{"text":"eine Bleistiftmine","correct":true,"info":"Die Mine besteht aus Graphit. Graphit ist kein Metall, leitet aber den Strom."},{"text":"ein Glasstab","correct":false,"info":"Glas ist ein Nichtleiter. Es lässt den Strom nicht durch."}]},"rendered":{}}},{"key":"a4","ref":"/stromkreis/leiter-nichtleiter/#leiter-4","page":"stromkreis/leiter-nichtleiter/","exercise":"leiter-4","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a4","text":"Warum sind Stromkabel außen mit Kunststoff umhüllt?","explanation":"Der Draht im Kabel leitet, die Hülle isoliert. So bleibt der Strom auf seinem Weg.","links":[{"title":"Elektrischer Leiter (Wikipedia)","url":"https://de.wikipedia.org/wiki/Elektrischer_Leiter"}],"type":"single-choice","options":[{"text":"Kunststoff ist ein Nichtleiter und hält den Strom im Draht.","correct":true,"info":"Die Hülle lässt den Strom nicht durch. Er bleibt im Draht und nimmt keinen ungewollten Weg."},{"text":"Kunststoff ist ein Leiter und hilft dem Draht beim Leiten.","correct":false,"info":"Kunststoff leitet den Strom nicht. Das zeigt die Tabelle mit dem Lineal."},{"text":"Kunststoff macht das Kabel nur bunter.","correct":false,"info":"Die Farbe hilft beim Unterscheiden der Kabel, aber der Kunststoff hat eine wichtigere Aufgabe: Er isoliert."}]},"rendered":{}}},{"key":"a5","ref":"/stromkreis/schalter/#schalter-1","page":"stromkreis/schalter/","exercise":"schalter-1","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a5","text":"In welchem Schaltplan leuchtet die Lampe?","explanation":"Die Lampe leuchtet nur, wenn jeder Schalter im Kreis geschlossen ist.","links":[{"title":"Stromkreis (Wikipedia)","url":"https://de.wikipedia.org/wiki/Stromkreis"}],"material":[{"type":"figure","image":"images/schalter-3a.svg","alt":"Schaltplan A, ein Schalter im unteren Kabel, die Klinge liegt waagerecht und verbindet beide Kontakte.","caption":"Schaltplan A","source":"eigene Zeichnung","licence":"CC-BY-4.0"},{"type":"figure","image":"images/schalter-3b.svg","alt":"Schaltplan B, ein Schalter im unteren Kabel, die Klinge ist schräg nach oben geklappt.","caption":"Schaltplan B","source":"eigene Zeichnung","licence":"CC-BY-4.0"},{"type":"figure","image":"images/schalter-3c.svg","alt":"Schaltplan C, zwei Schalter, einer im oberen Kabel mit waagerechter Klinge und einer im unteren Kabel mit schräg geklappter Klinge.","caption":"Schaltplan C","source":"eigene Zeichnung","licence":"CC-BY-4.0"}],"type":"single-choice","options":[{"text":"Schaltplan A","correct":true,"info":"Der Schalter ist geschlossen, die Klinge verbindet beide Kontakte. Der Weg ist ohne Lücke."},{"text":"Schaltplan B","correct":false,"info":"Hier ist der Schalter offen. Zwischen Klinge und Kontakt ist eine Lücke, also fließt kein Strom."},{"text":"Schaltplan C","correct":false,"info":"Einer der beiden Schalter ist offen. Eine einzige Lücke genügt, damit im ganzen Kreis kein Strom fließt."}]},"rendered":{}}},{"key":"a6","ref":"/stromkreis/schalter/#schalter-4","page":"stromkreis/schalter/","exercise":"schalter-4","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a6","text":"Ein Schalter im unteren Kabel schaltet die Lampe genauso aus wie ein Schalter im oberen Kabel.","explanation":"Ob oben oder unten, der Schalter öffnet denselben Kreis. In beiden Fällen ist der Weg unterbrochen.","links":[{"title":"Stromkreis (Wikipedia)","url":"https://de.wikipedia.org/wiki/Stromkreis"}],"type":"true-false","answer":true},"rendered":{}}},{"key":"a7","ref":"/stromkreis/schaltzeichen/#schaltzeichen-1","page":"stromkreis/schaltzeichen/","exercise":"schaltzeichen-1","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a7","text":"Ordne jedem Schaltzeichen das richtige Bauteil zu.","explanation":"Die Batterie erkennst du an den zwei unterschiedlichen Strichen, die Lampe am Kreis mit Kreuz, den offenen Schalter an der geklappten Klinge und die Leitung an der einfachen Linie.","links":[{"title":"Stromkreis (Wikipedia)","url":"https://de.wikipedia.org/wiki/Stromkreis"}],"type":"matching","pairs":[{"left":"Kreis mit Kreuz","right":"Lampe"},{"left":"Ein langer dünner und ein kurzer dicker Strich","right":"Batterie"},{"left":"Zwei Punkte mit schräg geklappter Klinge","right":"Schalter"},{"left":"Eine einfache gerade Linie","right":"Leitung (Kabel)"}]},"rendered":{}}},{"key":"a8","ref":"/stromkreis/schaltzeichen/#schaltzeichen-3","page":"stromkreis/schaltzeichen/","exercise":"schaltzeichen-3","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a8","text":"Lies den Schaltplan. Leuchtet die Lampe?","explanation":"Die Lampe leuchtet nur, wenn jeder Schalter im Kreis geschlossen ist.","links":[{"ti
