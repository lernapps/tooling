<main class="explainer" id="inhalt-der-seite">
<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../spannung/">Spannung</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 5 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was gibt die Spannung einer Batterie an?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Wie stark die Batterie den Strom antreibt.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Wie viel Strom in der Batterie gespeichert ist.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Wie viel Strom durch die Lampe fließt.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Wie stark die Batterie den Strom antreibt.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Spannung ist der Antrieb des Stroms, vergleichbar mit der Stärke einer Pumpe.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Wie viel Strom in der Batterie gespeichert ist.</strong></p><p>Die Spannung sagt nichts darüber, wie lange die Batterie hält. Das hängt von ihrer Ladung ab.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Wie viel Strom durch die Lampe fließt.</strong></p><p>Das ist die Stromstärke. Sie hängt auch von der Lampe ab, nicht nur von der Spannung.</p></li>
</ul>
<p class="question-explanation">Die Spannung gibt an, wie stark die Spannungsquelle den Strom antreibt.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Spannung" rel="noopener">Elektrische Spannung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-assessment-live"></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie schließt du ein Voltmeter an, um die Spannung an der Lampe zu messen?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/stromkreis.svg" alt="Ein einfacher Stromkreis aus Batterie, Schalter und Lampe, ohne Messgerät." loading="lazy" decoding="async"><figcaption><p>Dieser Stromkreis hat noch kein Messgerät.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Parallel zur Lampe, an ihre beiden Anschlüsse.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>In Reihe, mitten in der Leitung.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Nur an den Pluspol der Batterie.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Parallel zur Lampe, an ihre beiden Anschlüsse.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Spannung besteht zwischen den beiden Anschlüssen. Dort hält man das Voltmeter an.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>In Reihe, mitten in der Leitung.</strong></p><p>So baut man ein Amperemeter ein. Ein Voltmeter in Reihe würde den Strom fast ganz sperren.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Nur an den Pluspol der Batterie.</strong></p><p>Eine Spannung gibt es nur zwischen zwei Punkten. Mit einem Anschluss kann das Gerät nichts messen.</p></li>
</ul>
<p class="question-explanation">Das Voltmeter gehört parallel zum Bauteil.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Voltmeter" rel="noopener">Voltmeter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedem Messgerät zu, was es misst und wie es angeschlossen wird.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Amperemeter</span> <select name="frage-a5-0" data-left="0"><option value="">bitte wählen</option><option value="1">Spannung, parallel</option><option value="0">Stromstärke, in Reihe</option></select></label></li>
<li><label><span>Voltmeter</span> <select name="frage-a5-1" data-left="1"><option value="">bitte wählen</option><option value="1">Spannung, parallel</option><option value="0">Stromstärke, in Reihe</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Amperemeter – Stromstärke, in Reihe; Voltmeter – Spannung, parallel</p>
<p class="question-explanation">Das Amperemeter misst die Stromstärke und sitzt in Reihe. Das Voltmeter misst die Spannung und sitzt parallel.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Voltmeter" rel="noopener">Voltmeter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
