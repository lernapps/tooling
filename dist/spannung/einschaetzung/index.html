<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jeder Spannungsquelle ihre typische Spannung zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Rundzelle (AA)</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">9 V</option><option value="2">12 V</option><option value="0">1,5 V</option><option value="3">230 V</option></select></label></li>
<li><label><span>Blockbatterie</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">9 V</option><option value="2">12 V</option><option value="0">1,5 V</option><option value="3">230 V</option></select></label></li>
<li><label><span>Autobatterie</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">9 V</option><option value="2">12 V</option><option value="0">1,5 V</option><option value="3">230 V</option></select></label></li>
<li><label><span>Steckdose</span> <select name="frage-a1-3" data-left="3"><option value="">bitte wählen</option><option value="1">9 V</option><option value="2">12 V</option><option value="0">1,5 V</option><option value="3">230 V</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Rundzelle (AA) – 1,5 V; Blockbatterie – 9 V; Autobatterie – 12 V; Steckdose – 230 V</p>
<p class="question-explanation">Die Rundzelle hat 1,5 V, die Blockbatterie 9 V, die Autobatterie 12 V und die Steckdose 230 V.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Spannung" rel="noopener">Elektrische Spannung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Eine Mitschülerin sagt, eine Batterie liefert immer gleich viel Strom. Was stimmt?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Die Spannung der Batterie ist fest, die Stromstärke hängt vom Verbraucher ab.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Ja, eine Batterie liefert immer die gleiche Stromstärke.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Die Stromstärke hängt nur von der Größe der Batterie ab.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Die Spannung der Batterie ist fest, die Stromstärke hängt vom Verbraucher ab.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Eine große Lampe zieht an derselben Batterie mehr Strom als eine kleine.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Ja, eine Batterie liefert immer die gleiche Stromstärke.</strong></p><p>Die Stromstärke ändert sich, wenn du einen anderen Verbraucher anschließt.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Die Stromstärke hängt nur von der Größe der Batterie ab.</strong></p><p>Eine größere Batterie hält länger, aber die Stromstärke bestimmt der Verbraucher.</p></li>
</ul>
<p class="question-explanation">Die Batterie liefert eine feste Spannung. Welche Stromstärke fließt, entscheidet der Verbraucher.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Spannung" rel="noopener">Elektrische Spannung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-assessment-live"></div></li>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Du willst die Spannung an der Lampe L1 messen. Wo schließt du das Voltmeter an?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/voltmeter-2.svg" alt="Zeichnung mit Batterie und zwei Lampen L1 und L2 hintereinander. Messstelle A liegt als Lücke in der Leitung zwischen den Lampen, Messstelle B als Kasten unter L1, Messstelle C als Kasten unter beiden Lampen." loading="lazy" decoding="async"><figcaption><p>Drei mögliche Messstellen A, B und C.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>B, parallel zu L1, an beide Enden der Lampe.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>A, in der Leitung zwischen den Lampen.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>C, parallel zu beiden Lampen.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>B, parallel zu L1, an beide Enden der Lampe.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Voltmeter liegt zwischen den beiden Enden von L1 und misst deren Spannung.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>A, in der Leitung zwischen den Lampen.</strong></p><p>Dort würdest du das Voltmeter in Reihe setzen. Dann fließt fast kein Strom mehr.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>C, parallel zu beiden Lampen.</strong></p><p>Dort misst du die Spannung beider Lampen zusammen, nicht die von L1 allein.</p></li>
</ul>
<p class="question-explanation">Die Spannung an L1 misst du, indem du das Voltmeter parallel zu L1 anschließt.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Spannung" rel="noopener">Elektrische Spannung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="number">
<form class="question-form" novalidate>
<fieldset>

<div class="question-material"><figure class="block-figure"><img src="../../images/voltmeter-3.svg" alt="Zeigermessgerät mit der Skala 0 bis 10 V. Der Zeiger steht zwischen 6 und 8 auf dem kleinen Strich bei 7 V." loading="lazy" decoding="async"><figcaption><p>Skala von 0 bis 10 V, ein großer Strich alle 2 V, dazwischen ein kleiner.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a6" aria-describedby="frage-a6-unit"> <span id="frage-a6-unit">V</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 7 V (erlaubte Abweichung: 0,2 V)</p>
<p class="question-explanation">Der Zeiger steht auf dem kleinen Strich zwischen 6 und 8, also bei 7 V.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Spannung" rel="noopener">Elektrische Spannung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
