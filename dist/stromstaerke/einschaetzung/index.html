<main class="explainer" id="inhalt-der-seite">
<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../stromstaerke/">Stromstärke</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 5 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ein Amperemeter misst vor der Lampe 0,3 A. Was zeigt ein gleiches Gerät hinter der Lampe im selben Kreis?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Ebenfalls 0,3 A.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Weniger als 0,3 A, weil die Lampe Strom verbraucht.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Mehr als 0,3 A, weil sich der Strom dort staut.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Ebenfalls 0,3 A.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Im einfachen Stromkreis ist die Stromstärke überall gleich. Der Strom fließt im Kreis.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Weniger als 0,3 A, weil die Lampe Strom verbraucht.</strong></p><p>Die Lampe verbraucht keinen Strom. Sie wandelt elektrische Energie in Licht und Wärme um.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Mehr als 0,3 A, weil sich der Strom dort staut.</strong></p><p>Strom staut sich im geschlossenen Kreis nicht. Überall fließt gleich viel.</p></li>
</ul>
<p class="question-explanation">Die Stromstärke ist an jeder Stelle des einfachen Stromkreises gleich groß.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Stromstärke" rel="noopener">Elektrische Stromstärke (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-assessment-live"></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie schließt du ein Amperemeter an, um die Stromstärke durch die Lampe zu messen?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/stromkreis.svg" alt="Ein einfacher Stromkreis aus Batterie, Schalter und Lampe, ohne Messgerät." loading="lazy" decoding="async"><figcaption><p>Dieser Stromkreis hat noch kein Messgerät.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>In Reihe, an einer Stelle in der Leitung.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Parallel zur Lampe.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Neben dem Stromkreis, ohne Verbindung.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>In Reihe, an einer Stelle in der Leitung.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der ganze Strom muss durch das Amperemeter fließen, darum baut man es in die Leitung ein.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Parallel zur Lampe.</strong></p><p>Parallel zur Lampe misst man die Spannung mit dem Voltmeter. Ein Amperemeter dort würde den Kreis fast kurzschließen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Neben dem Stromkreis, ohne Verbindung.</strong></p><p>Ohne Verbindung fließt kein Strom durch das Gerät, und es zeigt nichts an.</p></li>
</ul>
<p class="question-explanation">Das Amperemeter gehört in Reihe in den Stromkreis.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Amperemeter" rel="noopener">Amperemeter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Stimmt die Aussage? Ein Amperemeter wird parallel zum Bauteil angeschlossen, dessen Stromstärke man messen will.</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="true"> <span>Stimmt</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="false"> <span>Stimmt nicht</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Aussage stimmt nicht.</p>
<p class="question-explanation">Falsch. Ein Amperemeter wird in Reihe eingebaut, damit der Strom hindurchfließt. Parallel schließt man ein Voltmeter an.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Amperemeter" rel="noopener">Amperemeter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
