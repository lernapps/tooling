<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie vergleichst du die Stromstärke an Stelle 1 und an Stelle 2?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/stromstaerke-1.svg" alt="Zeichnung eines Stromkreises mit Batterie und Lampe. Stelle 1 liegt in der oberen Leitung vor der Lampe, Stelle 2 in der unteren Leitung nach der Lampe." loading="lazy" decoding="async"><figcaption><p>Stelle 1 liegt vor, Stelle 2 hinter der Lampe.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>Sie ist an beiden Stellen gleich groß.</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>An Stelle 2 ist sie kleiner, weil die Lampe Strom verbraucht.</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>An Stelle 2 ist sie größer, weil die Lampe Strom abgibt.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sie ist an beiden Stellen gleich groß.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>In einem unverzweigten Stromkreis fließt überall gleich viel Strom.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>An Stelle 2 ist sie kleiner, weil die Lampe Strom verbraucht.</strong></p><p>Die Lampe wandelt Energie um, aber der Strom wird nicht weniger. Er muss ja zur Batterie zurück.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>An Stelle 2 ist sie größer, weil die Lampe Strom abgibt.</strong></p><p>Die Lampe erzeugt keinen Strom. Die Stromstärke bleibt gleich.</p></li>
</ul>
<p class="question-explanation">Die Stromstärke ist in einem einfachen Stromkreis an jeder Stelle gleich.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Stromst%C3%A4rke" rel="noopener">Elektrische Stromstärke (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Du willst die Stromstärke in der Lampe messen. An welcher Stelle schließt du das Amperemeter an?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/amperemeter-1.svg" alt="Zeichnung eines Stromkreises mit Batterie und Lampe. Die Messstelle A liegt als Lücke in der oberen Leitung. Die Messstelle B liegt als Kasten rechts um die Lampe, die Messstelle C links um die Batterie." loading="lazy" decoding="async"><figcaption><p>Drei mögliche Messstellen A, B und C.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>A, in der Leitung, sodass der Strom durch das Gerät fließt.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>B, parallel zur Lampe.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>C, parallel zur Batterie.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>A, in der Leitung, sodass der Strom durch das Gerät fließt.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Dort liegt das Amperemeter in Reihe mit der Lampe. Es zeigt die Stromstärke der Lampe.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>B, parallel zur Lampe.</strong></p><p>Dann fließt der Strom um die Lampe herum durch das Gerät. Es misst falsch und kann kaputtgehen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>C, parallel zur Batterie.</strong></p><p>Dann verbindest du die beiden Pole der Batterie fast ohne Hindernis. Das ist gefährlich für das Gerät.</p></li>
</ul>
<p class="question-explanation">Ein Amperemeter gehört in den Stromweg, in Reihe zu dem, was du messen willst.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Stromst%C3%A4rke" rel="noopener">Elektrische Stromstärke (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lies die Stromstärke ab.</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/amperemeter-2.svg" alt="Zeigermessgerät mit der Skala 0 bis 1 A. Der Zeiger steht auf dem großen Strich bei 0,6 A." loading="lazy" decoding="async"><figcaption><p>Skala von 0 bis 1 A, ein großer Strich alle 0,2 A.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a5" aria-describedby="frage-a5-unit"> <span id="frage-a5-unit">A</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 0,6 A (erlaubte Abweichung: 0,02 A)</p>
<p class="question-explanation">Der Zeiger steht auf dem großen Strich bei 0,6 A.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Stromst%C3%A4rke" rel="noopener">Elektrische Stromstärke (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lies die Stromstärke ab. Achte auf die Einheit.</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/amperemeter-3.svg" alt="Zeigermessgerät mit der Skala 0 bis 500 mA. Beschriftet sind 0, 100, 200, 300, 400 und 500. Der Zeiger steht auf dem kleinen Strich zwischen 300 und 400." loading="lazy" decoding="async"><figcaption><p>Skala von 0 bis 500 mA, ein großer Strich alle 100 mA, dazwischen ein kleiner.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a6" aria-describedby="frage-a6-unit"> <span id="frage-a6-unit">mA</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 350 mA (erlaubte Abweichung: 10 mA)</p>
<p class="question-explanation">Der Zeiger steht auf dem kleinen Strich zwischen 300 und 400, also bei 350 mA. Auf dem Gerät steht mA, nicht A.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Stromst%C3%A4rke" rel="noopener">Elektrische Stromstärke (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
