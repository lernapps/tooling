<main class="explainer" id="inhalt-der-seite">
<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../sicherheit/">Sicher mit Strom</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Warum ist Strom aus der Steckdose gefährlich, Strom aus einer Batterie dagegen nicht?</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Die Spannung der Steckdose ist mit 230 V viel größer als die der Batterie.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Aus der Steckdose kommt eine andere Sorte Strom, die man nicht mit der Batterie vergleichen kann.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Eine Batterie ist aus Kunststoff, und Kunststoff leitet nicht.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Die Spannung der Steckdose ist mit 230 V viel größer als die der Batterie.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Eine große Spannung treibt einen großen Strom durch den Körper. Bei wenigen Volt ist er zu klein, um zu schaden.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Aus der Steckdose kommt eine andere Sorte Strom, die man nicht mit der Batterie vergleichen kann.</strong></p><p>In beiden Fällen fließen Ladungen im Kreis. Der Unterschied liegt in der Spannung.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Eine Batterie ist aus Kunststoff, und Kunststoff leitet nicht.</strong></p><p>Eine Batterie hat Metallkontakte. Sie ist nur wegen ihrer kleinen Spannung ungefährlich.</p></li>
</ul>
<p class="question-explanation">Die Spannung der Steckdose ist so groß, dass ein gefährlicher Strom durch den Körper fließen kann.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Stromunfall" rel="noopener">Stromunfall (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Stimmt die Aussage? Mit nasser Haut ist Strom gefährlicher als mit trockener Haut.</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="true"> <span>Stimmt</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="false"> <span>Stimmt nicht</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Aussage stimmt.</p>
<p class="question-explanation">Richtig. Feuchte Haut leitet den Strom besser. Dann fließt bei derselben Spannung ein größerer Strom durch den Körper.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Stromunfall" rel="noopener">Stromunfall (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Verhaltensweisen sind sicher? Wähle alle richtigen aus.</legend>
<label class="question-option"><input type="checkbox" name="frage-a3" value="0"> <span>Zum Ausstecken am Stecker ziehen.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="1"> <span>Ein Gerät mit sichtbar beschädigtem Kabel nicht benutzen.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="2"> <span>Mit nassen Händen einen Stecker anfassen.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="3"> <span>Ein Experiment mit der Steckdose statt der Batterie aufbauen.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Zum Ausstecken am Stecker ziehen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>So bleibt das Kabel unbeschädigt, und die Isolierung hält.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Ein Gerät mit sichtbar beschädigtem Kabel nicht benutzen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ein freigelegter Draht ist gefährlich. Das Gerät muss repariert oder ersetzt werden.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Mit nassen Händen einen Stecker anfassen.</strong></p><p>Nasse Haut leitet den Strom besser. Das erhöht die Gefahr.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Ein Experiment mit der Steckdose statt der Batterie aufbauen.</strong></p><p>Die Steckdose liefert 230 V. Das ist lebensgefährlich, auch bei einem einfachen Versuch.</p></li>
</ul>
<p class="question-explanation">Sicher ist, wer am Stecker zieht und beschädigte Geräte nicht benutzt. Nasse Hände und die Steckdose für Versuche sind gefährlich.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Stromunfall" rel="noopener">Stromunfall (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Eine Person hat einen Stromschlag erhalten und hängt noch am Gerät. Was tust du zuerst?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Sie nicht berühren und sofort Erwachsene und den Notruf 112 holen.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Die Person sofort an der Hand wegziehen.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Abwarten, ob es von allein besser wird.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sie nicht berühren und sofort Erwachsene und den Notruf 112 holen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Berührst du die Person, kann der Strom auch durch dich fließen. Hilfe zu holen ist der sichere Weg.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Die Person sofort an der Hand wegziehen.</strong></p><p>Dabei wirst du selbst Teil des Stromkreises und kannst verletzt werden.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Abwarten, ob es von allein besser wird.</strong></p><p>Ein Stromschlag kann das Herz stören. Die Person braucht sofort Hilfe.</p></li>
</ul>
<p class="question-explanation">Zuerst die eigene Sicherheit, dann Hilfe holen. Eine Person unter Strom berührst du nicht.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Stromunfall" rel="noopener">Stromunfall (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
