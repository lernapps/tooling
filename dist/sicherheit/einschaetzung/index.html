<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../sicherheit/">Sicherheit</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Warum ist die Steckdose gefährlich, eine Taschenlampenbatterie aber nicht?</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Die Spannung der Steckdose (230 V) treibt viel mehr Strom durch den Körper als 1,5 V.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>In der Steckdose steckt mehr Strom, der sich ansammelt.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Batterien sind immer ungefährlich, egal wie groß.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Die Spannung der Steckdose (230 V) treibt viel mehr Strom durch den Körper als 1,5 V.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Gefahr hängt von der Stromstärke im Körper ab, und die bestimmt die Spannung.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>In der Steckdose steckt mehr Strom, der sich ansammelt.</strong></p><p>Strom sammelt sich nirgends an. Die Spannung bestimmt, wie stark er durch dich fließt.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Batterien sind immer ungefährlich, egal wie groß.</strong></p><p>Kleine Batterien sind ungefährlich, aber mit großen Spannungen oder anderen Quellen sieht es anders aus.</p></li>
</ul>
<p class="question-explanation">Bei 230 V kann ein gefährlich starker Strom durch den Körper fließen, bei 1,5 V nicht.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Stromunfall" rel="noopener">Stromunfall (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne die Wirkungen nach der Stromstärke durch den Körper, die kleinste zuerst.</legend>
<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>Lebensgefahr.</span> <select name="frage-a2-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>Man spürt den Strom.</span> <select name="frage-a2-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>Die Muskeln verkrampfen, man kann nicht loslassen.</span> <select name="frage-a2-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>Herzrhythmusstörungen sind möglich.</span> <select name="frage-a2-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. Man spürt den Strom., 2. Die Muskeln verkrampfen, man kann nicht loslassen., 3. Herzrhythmusstörungen sind möglich., 4. Lebensgefahr.</p>
<p class="question-explanation">Mit größerer Stromstärke werden die Folgen schlimmer. Schon etwa 10 mA können das Loslassen unmöglich machen.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Stromunfall" rel="noopener">Stromunfall (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche dieser Regeln sind richtig?</legend>
<label class="question-option"><input type="checkbox" name="frage-a3" value="0"> <span>Nie andere Gegenstände als Stecker in Steckdosen stecken.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="1"> <span>Elektrische Geräte von Wasser fernhalten und nur mit trockenen Händen anfassen.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="2"> <span>Ein Gerät mit gerissenem Kabel erst benutzen und dann reparieren.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="3"> <span>Geräte selbst reparieren, solange sie ausgeschaltet sind.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Nie andere Gegenstände als Stecker in Steckdosen stecken.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Sie leiten den Strom zu dir.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Elektrische Geräte von Wasser fernhalten und nur mit trockenen Händen anfassen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Wasser leitet den Strom, besonders an nasser Haut.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Ein Gerät mit gerissenem Kabel erst benutzen und dann reparieren.</strong></p><p>Beschädigte Kabel benutzt man nicht. Ein Erwachsener muss Bescheid wissen.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Geräte selbst reparieren, solange sie ausgeschaltet sind.</strong></p><p>Selbst reparieren ist eine häufige Unfallursache. Reparaturen gehören in Fachhände.</p></li>
</ul>
<p class="question-explanation">Steckdosen frei lassen und Wasser fernhalten sind richtig. Beschädigte Geräte nicht benutzen, nicht selbst reparieren.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Stromunfall" rel="noopener">Stromunfall (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Das Kabel deines Handyladegeräts ist an einer Stelle aufgerissen, der Draht schaut heraus. Was machst du?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Ich benutze es nicht mehr und sage einem Erwachsenen Bescheid.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Ich klebe schnell Tesafilm darum und benutze es weiter.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Ich fasse es an, um zu sehen, ob es noch funktioniert.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Ich benutze es nicht mehr und sage einem Erwachsenen Bescheid.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der freie Draht kann dich unter Strom setzen. Ein neues Kabel ist die sichere Lösung.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Ich klebe schnell Tesafilm darum und benutze es weiter.</strong></p><p>Tesafilm ersetzt keine Isolation und hält nicht sicher.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Ich fasse es an, um zu sehen, ob es noch funktioniert.</strong></p><p>Beschädigte Kabel dürfen nie berührt werden, während sie an der Steckdose hängen.</p></li>
</ul>
<p class="question-explanation">Beschädigte Kabel werden nicht benutzt. Man sagt einem Erwachsenen Bescheid.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Stromunfall" rel="noopener">Stromunfall (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
