<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Die Steckdose hat eine viel größere Spannung und kann daher einen gefährlich starken Strom durch den Körper treiben.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>230 V treiben den Strom viel stärker an als 1,5 V. Schon ab etwa 50 V kann ein lebensgefährlicher Strom fließen.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>In der Steckdose fließt Strom, in der Batterie nicht.</strong></p><p>Auch in einer Batterie fließt Strom, wenn sie in einem geschlossenen Kreis liegt. Der Unterschied liegt in der Spannung.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Strom aus der Steckdose ist eine andere Sorte Strom als Strom aus einer Batterie, die Spannung ist egal.</strong></p><p>Die Spannung ist entscheidend. Sie bestimmt, wie stark der Strom durch den Körper wird.</p></li>
</ul>
<p class="question-explanation">Bei 230 V kann ein gefährlich starker Strom durch den Körper fließen, bei 1,5 V nicht.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrischer_Schlag" rel="noopener">Elektrischer Schlag (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a22"><p class="explainer-assessment-label">Aufgabe 22</p><div class="question" id="frage-a22" data-id="a22" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Situationen können zu einem Stromunfall führen?</legend>
<label class="question-option"><input type="checkbox" name="frage-a22" value="0"> <span>Ein Kabel ohne Isolierung berühren</span></label>
<label class="question-option"><input type="checkbox" name="frage-a22" value="1"> <span>Einen beschädigten Stecker benutzen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a22" value="2"> <span>Mit Mignon-Batterien eine Taschenlampe benutzen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a22" value="3"> <span>Ein elektrisches Gerät mit Wasser in Berührung bringen</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Ein Kabel ohne Isolierung berühren</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ohne die Hülle aus Nichtleiter liegt der Draht frei. Wer ihn berührt, kann Teil des Stromkreises werden.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Einen beschädigten Stecker benutzen</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ein beschädigter Stecker kann stromführende Teile freilegen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Mit Mignon-Batterien eine Taschenlampe benutzen</strong></p><p>Die Spannung von 1,5 V ist so klein, dass dabei kein gefährlicher Strom durch den Körper fließt.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Ein elektrisches Gerät mit Wasser in Berührung bringen</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Wasser leitet den Strom. Es kann einen Weg zum Körper schaffen.</p></li>
</ul>
<p class="question-explanation">Häufige Ursachen für Stromunfälle sind der Kontakt von stromführenden Teilen mit Wasser, beschädigte Stecker und Kabel ohne Isolierung.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrischer_Schlag" rel="noopener">Elektrischer Schlag (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

<h2 id="teil-10" tabindex="-1">Seite 10 von 10</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a23"><p class="explainer-assessment-label">Aufgabe 23</p><div class="question" id="frage-a23" data-id="a23" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Situationen sind gefährlich?</legend>
<label class="question-option"><input type="checkbox" name="frage-a23" value="0"> <span>Ein Föhn liegt neben einer gefüllten Badewanne und ist an der Steckdose angeschlossen.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a23" value="1"> <span>Das Ladekabel eines Handys hat eine aufgeriebene Stelle, an der der blanke Draht zu sehen ist.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a23" value="2"> <span>Du wechselst die Mignon-Batterien in einer Taschenlampe.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a23" value="3"> <span>Du hältst einen Stecker am Gehäuse fest, wenn du ihn aus der Steckdose ziehst.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Ein Föhn liegt neben einer gefüllten Badewanne und ist an der Steckdose angeschlossen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Fällt er ins Wasser, kann das Wasser den Strom zum Körper leiten.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Das Ladekabel eines Handys hat eine aufgeriebene Stelle, an der der blanke Draht zu sehen ist.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der blanke Draht ist nicht mehr isoliert und kann unter Spannung stehen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Du wechselst die Mignon-Batterien in einer Taschenlampe.</strong></p><p>Mit 1,5 V ist das ungefährlich.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Du hältst einen Stecker am Gehäuse fest, wenn du ihn aus der Steckdose ziehst.</strong></p><p>Das Gehäuse des Steckers ist ein Nichtleiter und das richtige Anfassen. Am Kabel zu ziehen, würde das Kabel beschädigen.</p></li>
</ul>
<p class="question-explanation">Wasser an Geräten unter Netzspannung und freiliegende Drähte sind gefährlich. Batterien und das richtige Anfassen des Steckers sind es nicht.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrischer_Schlag" rel="noopener">Elektrischer Schlag (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a24"><p class="explainer-assessment-label">Aufgabe 24</p><div class="question" id="frage-a24" data-id="a24" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>

<label class="question-option"><input type="radio" name="frage-a24" value="0"> <span>Ich benutze die Lampe nicht mehr und sage einer erwachsenen Person Bescheid.</span></label>
<label class="question-option"><input type="radio" name="frage-a24" value="1"> <span>Ich wickele Papier um die Stelle und benutze die Lampe weiter.</span></label>
<label class="question-option"><input type="radio" name="frage-a24" value="2"> <span>Ich fasse die Stelle an, um zu prüfen, ob dort Strom fließt.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Ich benutze die Lampe nicht mehr und sage einer erwachsenen Person Bescheid.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Wo die Isolierung fehlt, liegt der Draht frei. Das Gerät darf nicht weiter benutzt werden.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Ich wickele Papier um die Stelle und benutze die Lampe weiter.</strong></p><p>Papier ist kein sicherer Ersatz für die Isolierung, besonders nicht bei Feuchtigkeit.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Ich fasse die Stelle an, um zu prüfen, ob dort Strom fließt.</strong></p><p>Das ist gerade die gefährliche Berührung. Prüfe nie mit der Hand, ob Strom fließt.</p></li>
</ul>
<p class="question-explanation">Beschädigte Kabel werden nicht benutzt. Erwachsene sorgen dafür, dass sie repariert oder ersetzt werden.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrischer_Schlag" rel="noopener">Elektrischer Schlag (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
