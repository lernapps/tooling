<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="number">

<fieldset>
<legend class="question-text"><math><mfrac><mn>3</mn><mn>5</mn></mfrac></math> wurde zu <math><mfrac><mn>12</mn><mn>20</mn></mfrac></math> erweitert. Mit welcher Zahl wurde erweitert?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a5">  </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 4</p>
<p class="question-explanation">Der Nenner ist von 5 auf 20 gewachsen, und 5 · 4 = 20. Probe mit dem Zähler 3 · 4 = 12.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="question" id="frage-a7" data-id="a7" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Durch welche größte Zahl kannst du <math><mfrac><mn>18</mn><mn>24</mn></mfrac></math> kürzen, sodass der Bruch danach vollständig gekürzt ist?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a7">  </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 6</p>
<p class="question-explanation">18 und 24 sind beide durch 6 teilbar, und 18 : 6 = 3, 24 : 6 = 4. Bei 3 und 4 ist nichts mehr zu kürzen.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>

<li class="explainer-assessment-item" data-key="a10"><p class="explainer-assessment-label">Aufgabe 10</p><div class="question" id="frage-a10" data-id="a10" data-type="single-choice">

<label class="question-option"><input type="radio" name="frage-a10" value="1"> <span>3/10</span></label>

<li class="question-info" data-option="1"><p class="question-info-head"><strong>3/10</strong></p><p>Der Nenner 10 ist größer, aber das heißt nur, dass die Stücke kleiner sind. Mit dem Nenner 10 sind es 3 Stücke gegen 4.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Beide sind gleich groß.</strong></p><p>Bei gleichem Nenner 10 sind es 4 Stücke gegen 3 Stücke. Das ist nicht gleich viel.</p></li>
