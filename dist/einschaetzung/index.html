<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Es steht still.</span></label>

<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Es bremst ab.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Tempo wird kleiner, von 5 auf 3 und dann auf 1 m/s. Das Fahrrad wird langsamer.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Es beschleunigt.</strong></p><p>Beim Beschleunigen würde das Tempo größer. Hier sinkt es aber.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Es steht still.</strong></p><p>Stillstand wäre die Geschwindigkeit 0 m/s. Das Fahrrad fährt noch mit 3 und mit 1 m/s.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Es fährt mit gleichbleibender Geschwindigkeit.</strong></p><p>Gleichbleibend wäre es, wenn die Zahl sich nicht ändert, wie in den ersten drei Sekunden mit 5 m/s.</p></li>
</ul>
<p class="question-explanation">Die Geschwindigkeit sinkt von 5 auf 3 und dann auf 1 m/s, das Fahrrad bremst ab, ohne stehen zu bleiben.</p>

<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Es beschleunigt die ganze Zeit in dieselbe Richtung.</span></label>

<ul class="question-infos">

<li class="question-info" data-option="1"><p class="question-info-head"><strong>Es bremst ab und bleibt dann stehen.</strong></p><p>Dann müsste am Ende 0 m/s stehen. Das Auto fährt aber am Ende mit −3 m/s, also mit Tempo 3 in die andere Richtung.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Es beschleunigt die ganze Zeit in dieselbe Richtung.</strong></p><p>Das Vorzeichen wechselt von + zu −, das Auto ändert also die Richtung.</p></li>

</ul>
<p class="question-explanation">Der Wechsel von + zu − zeigt die Richtungsänderung. Davor wird das Tempo kleiner und danach in der anderen Richtung größer.</p>

<li><label><span>Das Auto fährt los und bleibt dann stehen.</span> <select name="frage-a4-1" data-left="1"><option value="">bitte wählen</option><option value="1">Diagramm B</option><option value="0">Diagramm A</option><option value="2">Diagramm C</option></select></label></li>

<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">

<div class="question-material"><figure class="block-figure"><img src="../images/wz-knick.svg" alt="Ein Weg-Zeit-Diagramm. Die Linie steigt bis 4 Sekunden steil, knickt dort ab und steigt danach flacher weiter." loading="lazy" decoding="async"><figcaption><p>Die Linie knickt bei 4 s ab.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Das Auto ist ab 4 s langsamer.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Die Straße macht bei 4 s eine Kurve.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Das Auto steht ab 4 s.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="3"> <span>Das Auto fährt ab 4 s schneller.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Das Auto ist ab 4 s langsamer.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Nach dem Knick kommen pro Sekunde weniger Meter dazu, die Linie ist flacher. Das heißt, das Auto fährt langsamer.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Die Straße macht bei 4 s eine Kurve.</strong></p><p>Das Diagramm zeigt Weg über Zeit, nicht die Form der Straße. Die Straße ist hier gerade.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Das Auto steht ab 4 s.</strong></p><p>Beim Stehen wäre die Linie waagerecht, denn der Weg würde nicht mehr größer. Hier steigt sie weiter.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Das Auto fährt ab 4 s schneller.</strong></p><p>Schneller würde bedeuten, dass die Linie nach dem Knick steiler ist. Sie ist aber flacher.</p></li>
</ul>
<p class="question-explanation">Ein Knick zeigt eine Änderung der Geschwindigkeit. Flacher heißt langsamer, steiler heißt schneller.</p>
<p class="question-more">Mehr dazu:</p>

<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie viele Meter ist das Auto nach 6 Sekunden gefahren? Eine Abweichung von bis zu 2 m ist in Ordnung.</legend>
<div class="question-material"><figure class="block-figure"><img src="../images/wz-ablesen.svg" alt="Ein Weg-Zeit-Diagramm mit Gitter. Die Linie steigt bis 4 Sekunden flach, dann steiler, ab 8 Sekunden ist sie waagerecht." loading="lazy" decoding="async"><figcaption><p>Lies den Weg bei 6 s an der senkrechten Achse ab.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a6" aria-describedby="frage-a6-unit"> <span id="frage-a6-unit">m</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 40 m (erlaubte Abweichung: 2 m)</p>
<p class="question-explanation">Bei 6 s liegt die Linie bei 40 m. Das Auto ist nach 6 Sekunden 40 m gefahren.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Zeit-Weg-Diagramm" rel="noopener">Weg-Zeit-Diagramm (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>

<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="question" id="frage-a7" data-id="a7" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jeder Fahrt das passende Geschwindigkeit-Zeit-Diagramm zu.</legend>
<div class="question-material"><figure class="block-figure"><img src="../images/vt-drei-diagramme.svg" alt="Drei Geschwindigkeit-Zeit-Diagramme mit je fünf Säulen. A: alle Säulen gleich hoch. B: jede Säule höher als die davor. C: jede Säule niedriger als die davor, die letzte ist null." loading="lazy" decoding="async"><figcaption><p>Die Diagramme A, B und C zeigen jeweils die Geschwindigkeit von 0 bis 10 Sekunden.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Das Auto fährt die ganze Zeit gleich schnell.</span> <select name="frage-a7-0" data-left="0"><option value="">bitte wählen</option><option value="2">Diagramm C</option><option value="1">Diagramm B</option><option value="0">Diagramm A</option></select></label></li>
<li><label><span>Das Auto wird immer schneller.</span> <select name="frage-a7-1" data-left="1"><option value="">bitte wählen</option><option value="2">Diagramm C</option><option value="1">Diagramm B</option><option value="0">Diagramm A</option></select></label></li>
<li><label><span>Das Auto bremst ab, bis es steht.</span> <select name="frage-a7-2" data-left="2"><option value="">bitte wählen</option><option value="2">Diagramm C</option><option value="1">Diagramm B</option><option value="0">Diagramm A</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Das Auto fährt die ganze Zeit gleich schnell. – Diagramm A; Das Auto wird immer schneller. – Diagramm B; Das Auto bremst ab, bis es steht. – Diagramm C</p>
<p class="question-explanation">Gleich hohe Säulen heißen: Die Geschwindigkeit bleibt gleich. Immer höhere Säulen heißen: Das Auto wird schneller. Immer niedrigere Säulen heißen: Es wird langsamer, bis die Höhe 0 erreicht ist und es steht.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Geschwindigkeit" rel="noopener">Geschwindigkeit (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie schnell fährt das Fahrrad zwischen 4 s und 6 s?</legend>
<div class="question-material"><figure class="block-figure"><img src="../images/vt-ablesen.svg" alt="Ein Geschwindigkeit-Zeit-Diagramm mit Gitter und fünf Säulen. Die Säulen werden erst höher, sind in der Mitte gleich hoch und die letzte ist niedriger." loading="lazy" decoding="async"><figcaption><p>Such die Säule über der Zeit von 4 s bis 6 s und lies ihre Höhe an der senkrechten Achse ab.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a8" aria-describedby="frage-a8-unit"> <span id="frage-a8-unit">m/s</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 6 m/s</p>
<p class="question-explanation">Die Säule über 4 s bis 6 s ist 6 m/s hoch. Das Fahrrad fährt in dieser Zeit mit 6 m/s.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Geschwindigkeit" rel="noopener">Geschwindigkeit (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>

:"Weg-Zeit-Diagramm (Wikipedia)","url":"https://de.wikipedia.org/wiki/Zeit-Weg-Diagramm"}],"material":[{"type":"figure","image":"images/wz-drei-diagramme.svg","alt":"Drei Weg-Zeit-Diagramme. A: eine gerade, ansteigende Linie. B: eine steile Linie, die nach etwa 4 Sekunden waagerecht wird. C: eine Linie, die immer steiler wird.","caption":"Die Diagramme A, B und C zeigen jeweils Weg über Zeit von 0 bis 10 Sekunden.","source":"eigene Zeichnung","licence":"CC-BY-4.0"}],"type":"matching","pairs":[{"left":"Das Auto fährt die ganze Zeit mit gleichbleibender Geschwindigkeit.","right":"Diagramm A"},{"left":"Das Auto fährt los und bleibt dann stehen.","right":"Diagramm B"},{"left":"Das Auto wird immer schneller.","right":"Diagramm C"}]},"rendered":{}}},{"key":"a5","ref":"/beschleunigte-bewegung/weg-zeit-diagramm/#knick-bedeutung","page":"beschleunigte-bewegung/weg-zeit-diagramm/","exercise":"knick-bedeutung","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a5","text":"Ein Auto fährt auf einer geraden Straße. Im Diagramm knickt die Linie bei 4 s ab und steigt danach flacher. Was bedeutet das?","explanation":"Ein Knick zeigt eine Änderung der Geschwindigkeit. Flacher heißt langsamer, steiler heißt schneller.","links":[{"title":"Weg-Zeit-Diagramm (Wikipedia)","url":"https://de.wikipedia.org/wiki/Zeit-Weg-Diagramm"}],"material":[{"type":"figure","image":"images/wz-knick.svg","alt":"Ein Weg-Zeit-Diagramm. Die Linie steigt bis 4 Sekunden steil, knickt dort ab und steigt danach flacher weiter.","caption":"Die Linie knickt bei 4 s ab.","source":"eigene Zeichnung","licence":"CC-BY-4.0"}],"type":"single-choice","options":[{"text":"Das Auto ist ab 4 s langsamer.","correct":true,"info":"Nach dem Knick kommen pro Sekunde weniger Meter dazu, die Linie ist flacher. Das heißt, das Auto fährt langsamer."},{"text":"Die Straße macht bei 4 s eine Kurve.","correct":false,"info":"Das Diagramm zeigt Weg über Zeit, nicht die Form der Straße. Die Straße ist hier gerade."},{"text":"Da
