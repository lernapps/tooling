<div class="question-material"><figure class="block-figure"><img src="../images/vz-fahrrad.svg" alt="Ein Geschwindigkeit-Zeit-Diagramm mit drei Abschnitten. Abschnitt 1 (0 bis 10 s) liegt bei 2 m/s, Abschnitt 2 (10 bis 20 s) bei 6 m/s, Abschnitt 3 (20 bis 30 s) bei 4 m/s." loading="lazy" decoding="async"><figcaption><p>Dasselbe Diagramm mit drei Abschnitten zu je 10 s.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>Abschnitt 2 (10 bis 20 s)</span> <select name="frage-a10-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option></select></label></li>
<li><label><span>Abschnitt 3 (20 bis 30 s)</span> <select name="frage-a10-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option></select></label></li>
<li><label><span>Abschnitt 1 (0 bis 10 s)</span> <select name="frage-a10-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. Abschnitt 1 (0 bis 10 s), 2. Abschnitt 3 (20 bis 30 s), 3. Abschnitt 2 (10 bis 20 s)</p>
<p class="question-explanation">Je höher die Linie liegt, desto schneller fährt das Fahrrad. Abschnitt 1 liegt bei 2 m/s, Abschnitt 3 bei 4 m/s und Abschnitt 2 bei 6 m/s.</p>
<p class="question-more">Mehr dazu:</p>

<li class="explainer-assessment-item" data-key="a11"><p class="explainer-assessment-label">Aufgabe 11</p><div class="question" id="frage-a11" data-id="a11" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Geschwindigkeiten gehören zu dieser Fahrt in den drei Abschnitten?</legend>
<div class="question-material"><figure class="block-figure"><img src="../images/wz-fahrrad.svg" alt="Ein Weg-Zeit-Diagramm. Die Linie steigt bis 30 m bei 10 s, verläuft dann waagerecht bis 20 s und steigt danach bis 90 m bei 30 s." loading="lazy" decoding="async"><figcaption><p>Das Weg-Zeit-Diagramm einer Fahrt mit drei Abschnitten zu je 10 s.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a11" value="0"> <span>3 m/s, 0 m/s und 6 m/s</span></label>
<label class="question-option"><input type="radio" name="frage-a11" value="1"> <span>3 m/s, 3 m/s und 6 m/s</span></label>
<label class="question-option"><input type="radio" name="frage-a11" value="2"> <span>30 m/s, 0 m/s und 90 m/s</span></label>
<label class="question-option"><input type="radio" name="frage-a11" value="3"> <span>3 m/s, 0 m/s und 9 m/s</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>3 m/s, 0 m/s und 6 m/s</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Im ersten Abschnitt sind es 30 m in 10 s, also 3 m/s. Dann steht das Fahrrad (0 m/s). Im letzten Abschnitt sind es 60 m in 10 s, also 6 m/s.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>3 m/s, 3 m/s und 6 m/s</strong></p><p>Im zweiten Abschnitt verläuft die Linie waagerecht. Das Fahrrad kommt nicht weiter, es fährt also nicht mit 3 m/s.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>30 m/s, 0 m/s und 90 m/s</strong></p><p>Das sind die Wege bei 10 s und 30 s, nicht die Geschwindigkeiten. Die Geschwindigkeit ist Weg durch Zeit.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>3 m/s, 0 m/s und 9 m/s</strong></p><p>Im letzten Abschnitt kommt das Fahrrad von 30 m auf 90 m, also 60 m weit in 10 s. Das sind 6 m/s, nicht 9 m/s.</p></li>
</ul>
<p class="question-explanation">Aus dem Weg in jedem Abschnitt und der Zeit von 10 s folgt die Geschwindigkeit. Eine waagerechte Linie im Weg-Zeit-Diagramm ist eine Stufe bei 0.</p>
<p class="question-more">Mehr dazu:</p>

<li><a href="https://lernapps.net/apps/map/physik/c/bewegungsdiagramme/" rel="noopener">Bewegungsdiagramme (Lernlandkarte Physik)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a12"><p class="explainer-assessment-label">Aufgabe 12</p><div class="explainer-component" id="aufgabe-a12" data-component="GeschichteEinstellen" data-exercise data-assessment data-seeds="[1,2,3,4]" data-checked>
