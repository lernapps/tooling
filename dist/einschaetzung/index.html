<li><label><span>Ein Zug fährt aus dem Bahnhof und wird schneller.</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">Er wird langsamer.</option><option value="0">Er wird schneller.</option><option value="2">Die Richtung ändert sich.</option></select></label></li>

</ul>

<p class="question-explanation">Wird das Tempo größer, beschleunigt der Körper. Wird es kleiner, bremst er ab. In einer Kurve ändert sich die Richtung, auch wenn das Tempo gleich bleibt.</p>

<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Ja, denn die Richtung ändert sich.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Geschwindigkeit hat einen Betrag, das Tempo, und eine Richtung. In der Kurve ändert sich die Richtung.</p></li>

</ul>
<p class="question-explanation">Die Geschwindigkeit ändert sich, sobald sich das Tempo oder die Richtung ändert. In der Kurve ändert sich die Richtung.</p>

<div class="question-material"><figure class="block-figure"><img src="../images/geschw-zeit-rueckwaerts.svg" alt="Ein Geschwindigkeit-Zeit-Diagramm mit einer orangen Linie und einem Punkt bei jeder Sekunde. Die Zeit läuft von 0 bis 6 Sekunden, das Tempo von minus 2 bis 4 Metern pro Sekunde. Eine dicke schwarze Linie liegt bei 0." loading="lazy" decoding="async"><figcaption><p>Die dicke schwarze Linie ist die Null-Linie. Das Gitter ist 1 s breit und 1 m/s hoch.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>

<li class="explainer-assessment-item" data-key="a13"><p class="explainer-assessment-label">Aufgabe 13</p><div class="question" id="frage-a13" data-id="a13" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Linie im Weg-Zeit-Diagramm gehört zu welcher Fahrt?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Der Bus steht an der Haltestelle.</span> <select name="frage-a13-0" data-left="0"><option value="">bitte wählen</option><option value="2">Eine Linie, die immer steiler wird</option><option value="1">Eine gerade Linie, die ansteigt</option><option value="3">Eine Linie, die immer flacher wird</option><option value="0">Eine waagerechte Linie</option></select></label></li>
<li><label><span>Der Bus fährt gleichmäßig.</span> <select name="frage-a13-1" data-left="1"><option value="">bitte wählen</option><option value="2">Eine Linie, die immer steiler wird</option><option value="1">Eine gerade Linie, die ansteigt</option><option value="3">Eine Linie, die immer flacher wird</option><option value="0">Eine waagerechte Linie</option></select></label></li>
<li><label><span>Der Bus fährt an und wird schneller.</span> <select name="frage-a13-2" data-left="2"><option value="">bitte wählen</option><option value="2">Eine Linie, die immer steiler wird</option><option value="1">Eine gerade Linie, die ansteigt</option><option value="3">Eine Linie, die immer flacher wird</option><option value="0">Eine waagerechte Linie</option></select></label></li>
<li><label><span>Der Bus bremst ab.</span> <select name="frage-a13-3" data-left="3"><option value="">bitte wählen</option><option value="2">Eine Linie, die immer steiler wird</option><option value="1">Eine gerade Linie, die ansteigt</option><option value="3">Eine Linie, die immer flacher wird</option><option value="0">Eine waagerechte Linie</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Der Bus steht an der Haltestelle. – Eine waagerechte Linie; Der Bus fährt gleichmäßig. – Eine gerade Linie, die ansteigt; Der Bus fährt an und wird schneller. – Eine Linie, die immer steiler wird; Der Bus bremst ab. – Eine Linie, die immer flacher wird</p>
<p class="question-explanation">Steht der Bus, wächst der Weg nicht. Bei gleichem Tempo kommt in jeder Sekunde gleich viel Weg dazu. Wird der Bus schneller, kommt immer mehr Weg dazu, die Linie wird steiler. Beim Bremsen kommt immer weniger Weg dazu.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://lernapps.net/apps/map/physik/c/bewegungsdiagramme/" rel="noopener">Bewegungsdiagramme auf der Lernlandkarte</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a14"><p class="explainer-assessment-label">Aufgabe 14</p><div class="question" id="frage-a14" data-id="a14" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Das Geschwindigkeit-Zeit-Diagramm eines Wagens ist eine waagerechte Linie bei 2 m/s. Wie sieht sein Weg-Zeit-Diagramm aus?</legend>
<label class="question-option"><input type="radio" name="frage-a14" value="0"> <span>Eine waagerechte Linie</span></label>
<label class="question-option"><input type="radio" name="frage-a14" value="1"> <span>Eine gerade Linie, die ansteigt</span></label>
<label class="question-option"><input type="radio" name="frage-a14" value="2"> <span>Eine Linie, die immer steiler wird</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Eine waagerechte Linie</strong></p><p>Eine waagerechte Linie im Weg-Zeit-Diagramm heißt, dass der Wagen steht. Er fährt aber mit 2 m/s.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Eine gerade Linie, die ansteigt</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>In jeder Sekunde kommen 2 m dazu. Der Weg wächst gleichmäßig, die Linie ist gerade und steigt an.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Eine Linie, die immer steiler wird</strong></p><p>Das wäre der Fall, wenn der Wagen schneller würde. Sein Tempo bleibt aber bei 2 m/s.</p></li>
</ul>
<p class="question-explanation">Bei gleichem Tempo ist der Weg-Zeit-Verlauf eine gerade, ansteigende Linie.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://lernapps.net/apps/map/physik/c/bewegungsdiagramme/" rel="noopener">Bewegungsdiagramme auf der Lernlandkarte</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>

 bis 6 Sekunden, das Tempo von minus 2 bis 4 Metern pro Sekunde. Eine dicke schwarze Linie liegt bei 0.","caption":"Die dicke schwarze Linie ist die Null-Linie. Das Gitter ist 1 s breit und 1 m/s hoch.","source":"eigene Zeichnung","licence":"CC-BY-4.0"}],"type":"single-choice","options":[{"text":"Von 0 s bis 2 s","correct":false,"info":"In dieser Zeit liegt die Linie über der Null-Linie. Der Wagen fährt vorwärts und wird schneller."},{"text":"Von 2 s bis 4 s","correct":false,"info":"Die Linie liegt noch über der Null-Linie. Der Wagen fährt vorwärts, wird aber langsamer."},{"text":"Von 4 s bis 6 s","correct":true,"info":"Hier liegt die Linie unter der Null-Linie. Das Tempo hat ein Minus, der Wagen fährt rückwärts."}]},"rendered":{}}},{"key":"a11","ref":"/bewegung/richtung/#minus-langsamer","page":"bewegung/richtung/","exercise":"minus-langsamer","step":3,"data":{"kind":"question","lang":"de","question":{"id":"a11","text":"Ein Wagen mit −2 m/s ist langsamer als ein Wagen mit 1 m/s.","explanation":"Das Minus sagt nur die Richtung. Der Wagen mit −2 m/s fährt rückwärts, aber mit einem Tempo von 2 m/s. Das ist mehr als 1 m/s.","links":[{"title":"Bewegungsdiagramme auf der Lernlandkarte","url":"https://lernapps.net/apps/map/physik/c/bewegungsdiagramme/"}],"type":"true-false","answer":false},"rendered":{}}},{"key":"a12","ref":"/bewegung/richtung/#richtung-einstellen","page":"bewegung/richtung/","exercise":"richtung-einstellen","step":3,"data":{"kind":"component","seeds":[1]}},{"key":"a13","ref":"/bewegung/zusammen/#fahrt-linie-zuordnen","page":"bewegung/zusammen/","exercise":"fahrt-linie-zuordnen","step":4,"data":{"kind":"question","lang":"de","question":{"id":"a13","text":"Welche Linie im Weg-Zeit-Diagramm gehört zu welcher Fahrt?","explanation":"Steht der Bus, wächst der Weg nicht. Bei gleichem Tempo kommt in jeder Sekunde gleich viel Weg dazu. Wird der Bus schneller, kommt immer mehr Weg dazu, die Linie wird steiler. Beim Bremsen kommt immer weniger Weg dazu.","links":[{
