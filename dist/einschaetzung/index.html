<label class="question-option"><input type="radio" name="frage-a9" value="0"> <span>Der Wagen wird schneller.</span></label>
<label class="question-option"><input type="radio" name="frage-a9" value="1"> <span>Der Wagen wird langsamer und steht am Ende fast.</span></label>

<li class="explainer-assessment-item" data-key="a16"><p class="explainer-assessment-label">Aufgabe 16</p><div class="question" id="frage-a16" data-id="a16" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ein Scooter bremst bis zum Stillstand ab. Welches Geschwindigkeit-Zeit-Diagramm passt?</legend>
<div class="question-material"><figure class="block-figure"><img src="../images/vt-auswahl.svg" alt="Drei kleine Geschwindigkeit-Zeit-Diagramme. In A steigt die Linie, in B fällt sie bis auf null, in C ist sie waagerecht." loading="lazy" decoding="async"><figcaption><p>Drei Diagramme mit Zeit waagerecht und Geschwindigkeit senkrecht.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a16" value="0"> <span>A</span></label>
<label class="question-option"><input type="radio" name="frage-a16" value="1"> <span>B</span></label>
<label class="question-option"><input type="radio" name="frage-a16" value="2"> <span>C</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>A</strong></p><p>In A steigt die Linie. Der Scooter würde schneller, nicht langsamer.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>B</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>In B fällt die Linie bis auf null. Der Scooter wird immer langsamer und steht am Ende.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>C</strong></p><p>In C ist die Linie waagerecht. Der Scooter bliebe gleich schnell.</p></li>
</ul>
<p class="question-explanation">Abbremsen bis zum Stillstand heißt, dass die Geschwindigkeit bis auf null sinkt. Im Geschwindigkeit-Zeit-Diagramm fällt die Linie.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Beschleunigung" rel="noopener">Beschleunigung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
