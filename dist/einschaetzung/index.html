<h2 id="teil-1" tabindex="-1">Seite 1 von 5</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Bruch gehört zu den blauen Teilen des Streifens?</legend>
<div class="question-material"><figure class="block-figure"><img src="../images/streifen-3-von-5.svg" alt="Ein Streifen aus fünf gleich breiten Teilen. Die drei linken Teile sind blau mit Streifenmuster, die zwei rechten sind weiß." loading="lazy" decoding="async"><figcaption><p>Das Ganze ist der ganze Streifen.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>3/5</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>5/3</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>2/5</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="3"> <span>3/8</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>3/5</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Streifen hat 5 gleich große Teile, das ist der Nenner. Drei davon sind blau, das ist der Zähler.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>5/3</strong></p><p>Hier stehen Zähler und Nenner vertauscht. Der Nenner steht unten und zählt alle gleich großen Teile des Ganzen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>2/5</strong></p><p>Die Zahl im Zähler gehört zu den blauen Teilen. Die weißen Teile sind nicht gemeint.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>3/8</strong></p><p>Der Nenner zählt alle Teile des Streifens. Zähle sie noch einmal, blaue und weiße zusammen.</p></li>
</ul>
<p class="question-explanation">Der Nenner sagt, in wie viele gleich große Teile das Ganze geteilt ist. Der Zähler sagt, wie viele davon blau sind.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-assessment-live"></div></li>
</ol>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 5</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Bruch gehört zum blauen Punkt auf dem Zahlenstrahl?</legend>
<div class="question-material"><figure class="block-figure"><img src="../images/zahlenstrahl-3-von-5.svg" alt="Ein Zahlenstrahl von 0 bis 1 mit sechs Strichen. Ein blauer Punkt liegt auf dem vierten Strich von links." loading="lazy" decoding="async"><figcaption><p>Das Ganze ist die Strecke von 0 bis 1.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>3/5</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>4/6</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>4/5</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="3"> <span>3/6</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>3/5</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Zwischen 0 und 1 liegen 5 gleich lange Abschnitte, das ist der Nenner. Der Punkt liegt nach 3 Abschnitten, das ist der Zähler.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>4/6</strong></p><p>Hier wurden die Striche gezählt. Der Nenner zählt aber die Abschnitte zwischen den Strichen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>4/5</strong></p><p>Der Strich bei 0 wurde mitgezählt. Von der 0 aus gehst du Abschnitt für Abschnitt, die 0 selbst ist noch kein Abschnitt.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>3/6</strong></p><p>Der Zähler passt, aber der Nenner zählt Striche statt Abschnitte.</p></li>
</ul>
<p class="question-explanation">Am Zahlenstrahl zählst du Abschnitte, nicht Striche. Der Nenner ist die Zahl aller Abschnitte zwischen 0 und 1, der Zähler die Zahl der Abschnitte bis zum Punkt.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="explainer-assessment-live"></div></li>
</ol>

<h2 id="teil-3" tabindex="-1">Seite 3 von 5</h2>
<ol class="explainer-assessment-items">

<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Bruch ist gleichwertig zu 2/3?</legend>
<label class="question-option"><input type="radio" name="frage-a8" value="0"> <span>4/6</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="1"> <span>4/5</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="2"> <span>2/6</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="3"> <span>3/4</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>4/6</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Hier sind Zähler und Nenner mit 2 multipliziert worden, 2 · 2 = 4 und 3 · 2 = 6. Das ist Erweitern.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>4/5</strong></p><p>Hier wurde bei beiden Zahlen 2 addiert. Beim Erweitern wird aber multipliziert, sonst ändert sich der Anteil.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>2/6</strong></p><p>Nur der Nenner wurde verändert. Dann gibt es mehr Teile im Ganzen, aber gleich viele blaue Teile, und der Anteil wird kleiner.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>3/4</strong></p><p>Hier wurde bei beiden Zahlen 1 addiert. Das sind andere Teile und ein anderer Anteil, kein erweiterter Bruch.</p></li>
</ul>
<p class="question-explanation">Gleichwertige Brüche entstehen, wenn du Zähler und Nenner mit derselben Zahl multiplizierst.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

<li class="explainer-assessment-item" data-key="a11"><p class="explainer-assessment-label">Aufgabe 11</p><div class="question" id="frage-a11" data-id="a11" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Bruch ist vollständig gekürzt?</legend>
<label class="question-option"><input type="radio" name="frage-a11" value="0"> <span>3/4</span></label>
<label class="question-option"><input type="radio" name="frage-a11" value="1"> <span>4/6</span></label>
<label class="question-option"><input type="radio" name="frage-a11" value="2"> <span>6/9</span></label>
<label class="question-option"><input type="radio" name="frage-a11" value="3"> <span>5/10</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>3/4</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>3 und 4 haben keinen gemeinsamen Teiler außer 1. Der Bruch lässt sich nicht weiter kürzen.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>4/6</strong></p><p>Beide Zahlen sind gerade, also durch 2 teilbar. Der Bruch lässt sich noch zu 2/3 kürzen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>6/9</strong></p><p>6 und 9 sind beide durch 3 teilbar. Der Bruch lässt sich noch zu 2/3 kürzen.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>5/10</strong></p><p>5 und 10 sind beide durch 5 teilbar. Der Bruch lässt sich noch zu 1/2 kürzen.</p></li>
</ul>
<p class="question-explanation">Vollständig gekürzt ist ein Bruch, wenn Zähler und Nenner keinen gemeinsamen Teiler mehr haben, der größer als 1 ist.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Bruchrechnung" rel="noopener">Bruchrechnung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-back">Zurück</button> <button type="button" class="explainer-assessment-next">Weiter</button></p>

<li class="explainer-assessment-item" data-key="a14"><p class="explainer-assessment-label">Aufgabe 14</p><div class="question" id="frage-a14" data-id="a14" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>

<ul class="question-pairs">
<li><label><span>1/2</span> <select name="frage-a14-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>1/3</span> <select name="frage-a14-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>1/4</span> <select name="frage-a14-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>1/8</span> <select name="frage-a14-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>

</fieldset>
