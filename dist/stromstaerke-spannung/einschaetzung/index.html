<h2 id="teil-1" tabindex="-1">Seite 1 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Bei welchem Anschluss misst das Amperemeter die Stromstärke durch die Lampe richtig?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/strom-2a.svg" alt="Anschluss A, Batterie, Lampe und ein Amperemeter im unteren Kabel. Das Amperemeter ersetzt ein Stück des Kabels." loading="lazy" decoding="async"><figcaption><p>Anschluss A</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure><figure class="block-figure"><img src="../../images/strom-2b.svg" alt="Anschluss B, Batterie und Lampe. Das Amperemeter liegt in einem eigenen Zweig neben der Lampe, mit beiden Anschlüssen an den beiden Kabeln." loading="lazy" decoding="async"><figcaption><p>Anschluss B</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>Anschluss A</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>Anschluss B</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Anschluss A</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Amperemeter sitzt im Weg des Stroms. Der ganze Strom fließt durch das Gerät und durch die Lampe.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Anschluss B</strong></p><p>Das Amperemeter liegt neben der Lampe. Der Strom nimmt fast ganz den Weg durch das Gerät, die Lampe bleibt dunkel, und das Gerät kann Schaden nehmen.</p></li>
</ul>
<p class="question-explanation">Ein Amperemeter muss im Weg des Stroms liegen, damit der Strom durch das Gerät fließt.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Amperemeter" rel="noopener">Amperemeter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lies die Stromstärke von der Skala ab.</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/strom-3.svg" alt="Eine Bogenskala von 0 bis 1 A mit langen Strichen bei 0, 0,2, 0,4, 0,6, 0,8 und 1 und je einem kurzen Strich dazwischen. Ein Zeiger zeigt auf einen Strich." loading="lazy" decoding="async"><figcaption><p>Ein Amperemeter mit Messbereich bis 1 A</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a4" aria-describedby="frage-a4-unit"> <span id="frage-a4-unit">A</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 0,3 A (erlaubte Abweichung: 0,02 A)</p>
<p class="question-explanation">Der Zeiger steht auf dem kurzen Strich zwischen 0,2 und 0,4. Der kurze Strich steht für 0,1 A mehr als 0,2 A, also 0,3 A.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Amperemeter" rel="noopener">Amperemeter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Eine Batterie, die im Regal liegt und an nichts angeschlossen ist, hat keine Spannung, weil kein Strom fließt.</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="true"> <span>Stimmt</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="false"> <span>Stimmt nicht</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Aussage stimmt nicht.</p>
<p class="question-explanation">Die Batterie hat auch im Regal Spannung. Die Spannung ist der Antrieb, der Strom fließt erst im geschlossenen Kreis.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Spannung" rel="noopener">Elektrische Spannung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche dieser Spannungsquellen treibt den Strom am stärksten an?</legend>
<label class="question-option"><input type="radio" name="frage-a6" value="0"> <span>Die Mignon-Batterie mit 1,5 V</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="1"> <span>Der 9-Volt-Block</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="2"> <span>Die Steckdose mit 230 V</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Die Mignon-Batterie mit 1,5 V</strong></p><p>Die Mignon-Batterie hat von diesen Quellen die kleinste Spannung.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Der 9-Volt-Block</strong></p><p>9 V sind mehr als 1,5 V, aber weniger als 230 V.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Die Steckdose mit 230 V</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>230 V ist die größte Spannung der drei und treibt den Strom am stärksten an. Darum ist die Steckdose gefährlich.</p></li>
</ul>
<p class="question-explanation">Je größer die Spannung, desto stärker der Antrieb. Die Steckdose hat mit 230 V die größte.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Elektrische_Spannung" rel="noopener">Elektrische Spannung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-back">Zurück</button> <button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="2" aria-labelledby="teil-3" hidden>
<h2 id="teil-3" tabindex="-1">Seite 3 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="question" id="frage-a7" data-id="a7" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Bei welchem Anschluss misst das Voltmeter die Spannung an der Lampe richtig?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/spannung-2a.svg" alt="Anschluss A, Batterie und Lampe. Das Voltmeter sitzt im unteren Kabel und ersetzt ein Stück davon." loading="lazy" decoding="async"><figcaption><p>Anschluss A</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure><figure class="block-figure"><img src="../../images/spannung-2b.svg" alt="Anschluss B, Batterie und Lampe. Das Voltmeter liegt in einem eigenen Zweig neben der Lampe, an denselben zwei Punkten wie die Lampe." loading="lazy" decoding="async"><figcaption><p>Anschluss B</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a7" value="0"> <span>Anschluss A</span></label>
<label class="question-option"><input type="radio" name="frage-a7" value="1"> <span>Anschluss B</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Anschluss A</strong></p><p>Hier liegt das Voltmeter im Weg des Stroms. Es misst dort nicht die Spannung an der Lampe, und die Lampe bleibt dunkel.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Anschluss B</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Voltmeter liegt parallel zur Lampe, an denselben zwei Punkten. So misst es die Spannung an der Lampe.</p></li>
</ul>
<p class="question-explanation">Ein Voltmeter wird parallel zu dem Bauteil geschaltet, dessen Spannung man messen will.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Voltmeter" rel="noopener">Voltmeter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lies die Spannung von der Skala ab.</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/spannung-3.svg" alt="Eine Bogenskala von 0 bis 10 V mit langen Strichen bei 0, 2, 4, 6, 8 und 10 und je einem kurzen Strich dazwischen. Ein Zeiger zeigt auf einen Strich." loading="lazy" decoding="async"><figcaption><p>Ein Voltmeter mit Messbereich bis 10 V</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a8" aria-describedby="frage-a8-unit"> <span id="frage-a8-unit">V</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 7 V (erlaubte Abweichung: 0,3 V)</p>
<p class="question-explanation">Der Zeiger steht auf dem kurzen Strich zwischen 6 und 8. Der kurze Strich steht für 1 V mehr als 6 V, also 7 V.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Voltmeter" rel="noopener">Voltmeter (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
