<main class="explainer" id="inhalt-der-seite">
<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../schaltungen/">Reihen- und Parallelschaltung</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Die Lampe L2 brennt durch. Was geschieht mit L1 und L3?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/reihe-2.svg" alt="Schaltplan mit einer Batterie und drei Lampen L1, L2 und L3, die hintereinander im oberen Kabel liegen." loading="lazy" decoding="async"><figcaption><p>Drei Lampen in Reihe</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Beide gehen aus.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Beide leuchten weiter.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Nur L1 leuchtet weiter, weil sie vor L2 liegt.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Beide gehen aus.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der einzige Weg des Stroms ist an L2 unterbrochen. Damit fließt in der ganzen Schaltung kein Strom.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Beide leuchten weiter.</strong></p><p>Ohne Strom leuchtet keine Lampe. Der Strom hat nur den einen Weg, und der ist unterbrochen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Nur L1 leuchtet weiter, weil sie vor L2 liegt.</strong></p><p>Die Lage vor der defekten Lampe hilft nicht. Der Weg ist ein Kreis, an einer Stelle unterbrochen, und dann fließt nirgends Strom.</p></li>
</ul>
<p class="question-explanation">In der Reihenschaltung gibt es nur einen Weg. Fällt ein Bauteil aus, fließt in der ganzen Schaltung kein Strom.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reihenschaltung" rel="noopener">Reihenschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Zwei gleiche Lampen liegen in Reihe an einer Batterie. Wie ist die Spannung der Batterie verteilt?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Sie teilt sich auf beide Lampen auf.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Jede Lampe bekommt die volle Spannung der Batterie.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Nur die erste Lampe bekommt Spannung.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sie teilt sich auf beide Lampen auf.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Spannungen an den Lampen ergeben zusammen die Spannung der Batterie, wie 3 V und 3 V die 6 V.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Jede Lampe bekommt die volle Spannung der Batterie.</strong></p><p>Dann wären die Spannungen zusammen größer als die der Batterie. In der Reihenschaltung verteilt sich die Spannung.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Nur die erste Lampe bekommt Spannung.</strong></p><p>Beide Lampen leuchten, also liegt an beiden eine Spannung.</p></li>
</ul>
<p class="question-explanation">In der Reihenschaltung teilt sich die Spannung der Batterie auf die Bauteile auf.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reihenschaltung" rel="noopener">Reihenschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Die Lampe L2 brennt durch. Was geschieht mit L1 und L3?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/parallel-2.svg" alt="Schaltplan mit einer Batterie und drei Lampen L1, L2 und L3, die in drei senkrechten Zweigen nebeneinander liegen." loading="lazy" decoding="async"><figcaption><p>Drei Lampen parallel</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>Beide leuchten weiter.</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>Beide gehen aus.</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>Nur L1 leuchtet weiter, weil sie vor L2 liegt.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Beide leuchten weiter.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Zweig von L2 ist unterbrochen, die Zweige von L1 und L3 sind es nicht. Dort fließt weiter Strom.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Beide gehen aus.</strong></p><p>So wäre es bei einer Reihenschaltung. Hier hat jede Lampe einen eigenen Zweig.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Nur L1 leuchtet weiter, weil sie vor L2 liegt.</strong></p><p>Die Lage spielt keine Rolle. Jeder Zweig ist ein eigener Weg und unabhängig von den anderen.</p></li>
</ul>
<p class="question-explanation">In der Parallelschaltung ist jeder Zweig ein eigener Weg. Fällt einer aus, arbeiten die anderen weiter.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Parallelschaltung" rel="noopener">Parallelschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie hängt die Stromstärke der Batterie mit den Stromstärken in den Zweigen zusammen?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Sie ist so groß wie alle Zweigströme zusammen.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Sie ist so groß wie der Strom in einem einzigen Zweig.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Sie ist kleiner als der Strom in jedem Zweig.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sie ist so groß wie alle Zweigströme zusammen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Strom der Batterie teilt sich auf die Zweige auf, wie 0,2 A und 0,2 A zusammen die 0,4 A ergeben.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Sie ist so groß wie der Strom in einem einzigen Zweig.</strong></p><p>Die Batterie versorgt alle Zweige, darum ist ihr Strom größer als der in einem Zweig.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Sie ist kleiner als der Strom in jedem Zweig.</strong></p><p>Dann würde Strom aus dem Nichts entstehen. Der Strom der Batterie teilt sich nur auf.</p></li>
</ul>
<p class="question-explanation">In der Parallelschaltung teilt sich die Stromstärke der Batterie auf die Zweige auf.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Parallelschaltung" rel="noopener">Parallelschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
