<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../schaltungen/">Reihen- und Parallelschaltung</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 8 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In diesem Stromkreis fehlt bei L1 die Lampe. Leuchtet L2?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/reihenschaltung-2.svg" alt="Zeichnung eines Stromkreises mit Batterie und zwei Lampen hintereinander. Bei L1 fehlt die Lampe, die Leitung ist unterbrochen." loading="lazy" decoding="async"><figcaption><p>Bei L1 fehlt die Lampe.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Nein, der Weg ist unterbrochen, also fließt nirgends Strom.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Ja, denn L2 ist ja heil.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Ja, aber nur schwach.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Nein, der Weg ist unterbrochen, also fließt nirgends Strom.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>In einer Reihenschaltung gibt es nur diesen einen Weg. Ohne L1 ist der Kreis offen.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Ja, denn L2 ist ja heil.</strong></p><p>Dass L2 heil ist, reicht nicht. Sie braucht einen geschlossenen Stromweg.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Ja, aber nur schwach.</strong></p><p>Ohne geschlossenen Kreis fließt auch kein schwacher Strom.</p></li>
</ul>
<p class="question-explanation">Die Lücke bei L1 öffnet den ganzen Kreis. Deshalb bleibt auch L2 dunkel.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reihenschaltung" rel="noopener">Reihenschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In einer Reihenschaltung aus zwei Lampen sitzt ein Schalter. Wann leuchten beide Lampen?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Wenn der Schalter geschlossen ist.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Wenn der Schalter offen ist.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Immer, der Schalter betrifft nur eine Lampe.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Wenn der Schalter geschlossen ist.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Dann ist der einzige Weg geschlossen, und der Strom fließt durch beide Lampen.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Wenn der Schalter offen ist.</strong></p><p>Ein offener Schalter unterbricht den einzigen Weg.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Immer, der Schalter betrifft nur eine Lampe.</strong></p><p>In einer Reihenschaltung betrifft jede Unterbrechung alle Bauteile.</p></li>
</ul>
<p class="question-explanation">In einer Reihenschaltung schaltet der Schalter alle Bauteile zugleich ein oder aus.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reihenschaltung" rel="noopener">Reihenschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">An Stelle 1 misst du 0,30 A. Was zeigt das Amperemeter an Stelle 3?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/reihenschaltung-3.svg" alt="Zeichnung eines Stromkreises mit Batterie und zwei Lampen hintereinander mit den Stellen 1, 2 und 3." loading="lazy" decoding="async"><figcaption><p>Stelle 1 liegt vor L1, Stelle 3 nach L2.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>Ebenfalls 0,30 A.</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>Weniger als 0,30 A, weil die Lampen Strom verbrauchen.</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>Mehr als 0,30 A.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Ebenfalls 0,30 A.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>In der Reihenschaltung ist die Stromstärke überall gleich.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Weniger als 0,30 A, weil die Lampen Strom verbrauchen.</strong></p><p>Lampen wandeln Energie um. Der Strom wird nicht weniger.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Mehr als 0,30 A.</strong></p><p>Es kommt nichts dazu, die Stromstärke bleibt gleich.</p></li>
</ul>
<p class="question-explanation">Die Stromstärke ist an jeder Stelle der Reihenschaltung gleich.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reihenschaltung" rel="noopener">Reihenschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="explainer-assessment-live"></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Im Zweig von L1 fehlt die Lampe. Leuchtet L2?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/parallelschaltung-2.svg" alt="Zeichnung eines Stromkreises mit Batterie und zwei Lampen nebeneinander. Im Zweig von L1 ist die Leitung unterbrochen." loading="lazy" decoding="async"><figcaption><p>Der Zweig von L1 ist offen.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Ja, L2 hat einen eigenen geschlossenen Stromweg zur Batterie.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Nein, wenn eine Lampe fehlt, geht auch die andere aus.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Nein, weil die Batterie dann keinen Strom mehr liefert.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Ja, L2 hat einen eigenen geschlossenen Stromweg zur Batterie.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Jeder Zweig ist ein eigener Stromkreis. Der offene Zweig von L1 stört ihn nicht.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Nein, wenn eine Lampe fehlt, geht auch die andere aus.</strong></p><p>Das gilt für die Reihenschaltung. In der Parallelschaltung hat jede Lampe ihren eigenen Weg.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Nein, weil die Batterie dann keinen Strom mehr liefert.</strong></p><p>Die Batterie liefert weiter Strom, nur durch den anderen Zweig.</p></li>
</ul>
<p class="question-explanation">In der Parallelschaltung hat jede Lampe ihren eigenen Stromweg. Fällt eine aus, leuchten die anderen weiter.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Parallelschaltung" rel="noopener">Parallelschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was gilt in einer Parallelschaltung?</legend>
<label class="question-option"><input type="checkbox" name="frage-a6" value="0"> <span>Der Strom hat mehrere Wege.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="1"> <span>Jeder Zweig bildet mit der Batterie einen eigenen Stromkreis.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="2"> <span>Die Bauteile liegen hintereinander.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Der Strom hat mehrere Wege.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Auf jedem Zweig liegt ein Bauteil.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Jeder Zweig bildet mit der Batterie einen eigenen Stromkreis.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Deshalb stört ein offener Zweig die anderen nicht.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Die Bauteile liegen hintereinander.</strong></p><p>Das beschreibt die Reihenschaltung.</p></li>
</ul>
<p class="question-explanation">In der Parallelschaltung sind die Bauteile nebeneinander geschaltet, jedes auf einem eigenen Zweig.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Parallelschaltung" rel="noopener">Parallelschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="question" id="frage-a7" data-id="a7" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Die Batterie hat 4,5 V. Welche Spannung misst du an L2, der rechten Lampe?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/parallelschaltung-3.svg" alt="Zeichnung eines Stromkreises mit Batterie und zwei Lampen nebeneinander mit den Stellen 1 bis 4. Links L1, rechts L2." loading="lazy" decoding="async"><figcaption><p>L1 und L2 liegen in eigenen Zweigen an der Batterie.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a7" value="0"> <span>4,5 V, so viel wie die Batterie.</span></label>
<label class="question-option"><input type="radio" name="frage-a7" value="1"> <span>2,25 V, weil sich die Spannung auf die Lampen aufteilt.</span></label>
<label class="question-option"><input type="radio" name="frage-a7" value="2"> <span>0 V, weil L1 den Strom schon aufbraucht.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>4,5 V, so viel wie die Batterie.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Jeder Zweig hängt direkt an den beiden Polen der Batterie.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>2,25 V, weil sich die Spannung auf die Lampen aufteilt.</strong></p><p>Das gilt für die Reihenschaltung. In der Parallelschaltung bekommt jede Lampe die volle Spannung.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>0 V, weil L1 den Strom schon aufbraucht.</strong></p><p>Strom wird in einer Lampe nicht aufgebraucht, und die Spannung liegt an beiden Zweigen an.</p></li>
</ul>
<p class="question-explanation">In der Parallelschaltung liegt an jedem Zweig die volle Spannung der Batterie.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Parallelschaltung" rel="noopener">Parallelschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="explainer-assessment-live"></div></li>
</ol>
