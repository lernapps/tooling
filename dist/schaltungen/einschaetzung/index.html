<main class="explainer" id="inhalt-der-seite">
<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../schaltungen/">Reihen- und Parallelschaltung</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Zwei Lampen sind in Reihe geschaltet, Lampe 1 fällt aus. Was passiert mit Lampe 2?</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Sie geht ebenfalls aus.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Sie leuchtet weiter.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Sie leuchtet heller, weil der Strom nur noch zu ihr fließt.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sie geht ebenfalls aus.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Strom hat nur einen Weg. Ist er an Lampe 1 unterbrochen, fließt nirgends Strom.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Sie leuchtet weiter.</strong></p><p>Das gilt für die Parallelschaltung, in der jede Lampe einen eigenen Zweig hat.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Sie leuchtet heller, weil der Strom nur noch zu ihr fließt.</strong></p><p>Es fließt gar kein Strom mehr. Der einzige Weg ist unterbrochen.</p></li>
</ul>
<p class="question-explanation">In einer Reihenschaltung unterbricht der Ausfall eines Bauteils den ganzen Stromkreis.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reihenschaltung" rel="noopener">Reihenschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie fließt der Strom durch die Lampen einer Reihenschaltung?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>In einem Umlauf in eine Richtung durch alle Lampen nacheinander.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Von beiden Seiten in jede Lampe hinein.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Er wird in der ersten Lampe aufgebraucht, die zweite bekommt den Rest.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>In einem Umlauf in eine Richtung durch alle Lampen nacheinander.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Strom fließt vom einen Pol der Quelle durch die Bauteile zum anderen Pol.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Von beiden Seiten in jede Lampe hinein.</strong></p><p>Das wäre kein Umlauf. Im Kreis fließt der Strom in eine Richtung, nichts stößt in der Lampe zusammen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Er wird in der ersten Lampe aufgebraucht, die zweite bekommt den Rest.</strong></p><p>Strom wird nicht aufgebraucht. In allen Lampen der Reihe fließt derselbe Strom.</p></li>
</ul>
<p class="question-explanation">In der Reihenschaltung fließt der Strom in einer Richtung durch alle Bauteile nacheinander.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reihenschaltung" rel="noopener">Reihenschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Zwei Lampen sind parallel geschaltet, Lampe 1 fällt aus. Was passiert mit Lampe 2?</legend>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>Sie leuchtet weiter.</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>Sie geht ebenfalls aus.</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>Sie flackert, bis Lampe 1 ersetzt ist.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sie leuchtet weiter.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Lampe 2 hat einen eigenen Zweig und bleibt mit der Batterie verbunden.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Sie geht ebenfalls aus.</strong></p><p>Das gilt für die Reihenschaltung. In der Parallelschaltung bleibt der andere Zweig geschlossen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Sie flackert, bis Lampe 1 ersetzt ist.</strong></p><p>Es gibt keinen Grund zu flackern. Der Zweig ist unabhängig vom ausgefallenen.</p></li>
</ul>
<p class="question-explanation">In einer Parallelschaltung leuchten die anderen Zweige weiter, wenn ein Zweig ausfällt.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Parallelschaltung" rel="noopener">Parallelschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jede Eigenschaft der passenden Schaltung zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Der Strom hat nur einen Weg</span> <select name="frage-a4-0" data-left="0"><option value="">bitte wählen</option><option value="1">Parallelschaltung</option><option value="0">Reihenschaltung</option></select></label></li>
<li><label><span>Jedes Bauteil hat einen eigenen Zweig</span> <select name="frage-a4-1" data-left="1"><option value="">bitte wählen</option><option value="1">Parallelschaltung</option><option value="0">Reihenschaltung</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Der Strom hat nur einen Weg – Reihenschaltung; Jedes Bauteil hat einen eigenen Zweig – Parallelschaltung</p>
<p class="question-explanation">In der Reihenschaltung gibt es einen einzigen Weg. In der Parallelschaltung gibt es mehrere Zweige.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Parallelschaltung" rel="noopener">Parallelschaltung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-back">Zurück</button> <button type="button" class="explainer-assessment-finish">Auswerten</button></p>
