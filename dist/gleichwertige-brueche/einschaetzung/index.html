<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 9 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<label class="question-option"><input type="radio" name="frage-a3" value="3" aria-label="sieben zehntel"> <span><math><mfrac><mn>7</mn><mn>10</mn></mfrac></math></span></label>

<li class="question-info" data-option="2"><p class="question-info-head"><strong><math><mfrac><mn>2</mn><mn>10</mn></mfrac></math></strong></p><p>Falsch: Hier ist nur der Nenner mit 2 malgenommen. Dann sind die Felder kleiner, aber es sind noch immer 2 gefärbt.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong><math><mfrac><mn>7</mn><mn>10</mn></mfrac></math></strong></p><p>Falsch: Hier wurde zu beiden Zahlen 5 addiert. Addieren ändert den Bruch.</p></li>

<label class="question-option"><input type="radio" name="frage-a6" value="3" aria-label="sechs achtel ist gleich 12 geteilt durch 16"> <span><math><mrow><mfrac><mn>6</mn><mn>8</mn></mfrac><mo>=</mo><mfrac><mn>12</mn><mn>16</mn></mfrac></mrow></math></span></label>

<div class="question-feedback" role="status"></div>

<li class="question-info" data-option="2"><p class="question-info-head"><strong><math><mrow><mfrac><mn>6</mn><mn>8</mn></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>8</mn></mfrac></mrow></math></strong></p><p>Falsch: Hier ist nur der Zähler durch 2 geteilt. Der Nenner muss auch durch 2 geteilt werden.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong><math><mrow><mfrac><mn>6</mn><mn>8</mn></mfrac><mo>=</mo><mfrac><mn>12</mn><mn>16</mn></mfrac></mrow></math></strong></p><p>Falsch: Das ist erweitert, mit 2 malgenommen, nicht gekürzt.</p></li>

<label class="question-option"><input type="radio" name="frage-a8" value="0"> <span><math><mfrac><mn>5</mn><mn>6</mn></mfrac></math> ist größer.</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="1"> <span><math><mfrac><mn>3</mn><mn>4</mn></mfrac></math> ist größer.</span></label>

</ul>
<p class="question-explanation">Du machst die Nenner gleich und vergleichst dann die Zähler.</p>

<fieldset>
<legend class="question-text">Welcher Bruch ist größer, <math><mfrac><mn>2</mn><mn>3</mn></mfrac></math> oder <math><mfrac><mn>2</mn><mn>5</mn></mfrac></math>?</legend>
<label class="question-option"><input type="radio" name="frage-a9" value="0"> <span><math><mfrac><mn>2</mn><mn>3</mn></mfrac></math> ist größer.</span></label>
<label class="question-option"><input type="radio" name="frage-a9" value="1"> <span><math><mfrac><mn>2</mn><mn>5</mn></mfrac></math> ist größer.</span></label>
<label class="question-option"><input type="radio" name="frage-a9" value="2"> <span>Beide sind gleich groß.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>

<li class="question-info" data-option="1"><p class="question-info-head"><strong><math><mfrac><mn>2</mn><mn>5</mn></mfrac></math> ist größer.</strong></p><p>Falsch: Die 5 im Nenner heißt, dass das Ganze in kleinere Felder geteilt ist. Zwei kleine Felder sind weniger als zwei große.</p></li>
