<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../geschwindigkeit-aendert-sich/">Wenn sich die Geschwindigkeit ändert</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 5 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was zeigt dieses Blitzbild?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/spur-schneller.svg" alt="Ein Blitzbild mit sechs Punkten für 0 bis 5 Sekunden. Die Punkte liegen bei 0, 2, 6, 12, 20 und 30 Metern." loading="lazy" decoding="async"><figcaption><p>Ein Punkt je Sekunde auf der Bahn.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Der Wagen wird schneller.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Der Wagen fährt gleich schnell.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Der Wagen wird langsamer.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="3"> <span>Der Wagen steht.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Der Wagen wird schneller.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Abstände zwischen den Punkten wachsen. In jeder Sekunde schafft der Wagen mehr Weg als in der Sekunde davor.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Der Wagen fährt gleich schnell.</strong></p><p>Bei gleich schneller Fahrt wären alle Abstände gleich groß. Hier wachsen sie.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Der Wagen wird langsamer.</strong></p><p>Beim Langsamerwerden werden die Abstände kleiner. Hier werden sie größer.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Der Wagen steht.</strong></p><p>Ein stehender Wagen hätte an jeder Sekunde denselben Punkt. Die Punkte hier liegen auseinander.</p></li>
</ul>
<p class="question-explanation">Wachsende Abstände bei gleichen Zeitabständen bedeuten, dass der Wagen schneller wird.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Beschleunigung" rel="noopener">Beschleunigung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Dieses Blitzbild zeigt einen Wagen beim Abbremsen. Welche Aussage stimmt?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/spur-langsamer.svg" alt="Ein Blitzbild mit sechs Punkten für 0 bis 5 Sekunden. Die Punkte liegen bei 0, 10, 18, 24, 28 und 30 Metern." loading="lazy" decoding="async"><figcaption><p>Ein Punkt je Sekunde auf der Bahn.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Der Wagen steht schon bei 1 s.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Der Wagen fährt noch, schafft aber in jeder Sekunde weniger Weg.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Der Wagen fährt gleich schnell weiter.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="3"> <span>Der Wagen fährt zurück.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Der Wagen steht schon bei 1 s.</strong></p><p>Die Punkte bei 0 s und 1 s liegen 10 m auseinander. Der Wagen bewegt sich dort noch.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Der Wagen fährt noch, schafft aber in jeder Sekunde weniger Weg.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Abstände werden kleiner, sie sind aber nicht null. Der Wagen ist also langsamer, bewegt sich aber noch.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Der Wagen fährt gleich schnell weiter.</strong></p><p>Bei gleicher Geschwindigkeit wären alle Abstände gleich. Hier werden sie kleiner.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Der Wagen fährt zurück.</strong></p><p>Alle Punkte liegen weiter rechts als der davor. Der Wagen fährt immer in dieselbe Richtung.</p></li>
</ul>
<p class="question-explanation">Abbremsen heißt langsamer werden, nicht stehen. Der Wagen kommt in jeder Sekunde weniger weit.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Beschleunigung" rel="noopener">Beschleunigung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was ändert sich in der Situation? Ordne zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Ein Zug fährt aus dem Bahnhof und fährt immer schneller.</span> <select name="frage-a3-0" data-left="0"><option value="">bitte wählen</option><option value="3">Nichts ändert sich.</option><option value="0">Die Bewegung wird schneller.</option><option value="2">Die Richtung ändert sich.</option><option value="1">Die Bewegung wird langsamer.</option></select></label></li>
<li><label><span>Ein Auto bremst vor der roten Ampel bis zum Stillstand ab.</span> <select name="frage-a3-1" data-left="1"><option value="">bitte wählen</option><option value="3">Nichts ändert sich.</option><option value="0">Die Bewegung wird schneller.</option><option value="2">Die Richtung ändert sich.</option><option value="1">Die Bewegung wird langsamer.</option></select></label></li>
<li><label><span>Ein Bus fährt mit gleichem Tempo durch eine Kurve.</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="3">Nichts ändert sich.</option><option value="0">Die Bewegung wird schneller.</option><option value="2">Die Richtung ändert sich.</option><option value="1">Die Bewegung wird langsamer.</option></select></label></li>
<li><label><span>Ein Rad fährt auf gerader Straße gleich schnell.</span> <select name="frage-a3-3" data-left="3"><option value="">bitte wählen</option><option value="3">Nichts ändert sich.</option><option value="0">Die Bewegung wird schneller.</option><option value="2">Die Richtung ändert sich.</option><option value="1">Die Bewegung wird langsamer.</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Ein Zug fährt aus dem Bahnhof und fährt immer schneller. – Die Bewegung wird schneller.; Ein Auto bremst vor der roten Ampel bis zum Stillstand ab. – Die Bewegung wird langsamer.; Ein Bus fährt mit gleichem Tempo durch eine Kurve. – Die Richtung ändert sich.; Ein Rad fährt auf gerader Straße gleich schnell. – Nichts ändert sich.</p>
<p class="question-explanation">Schneller und langsamer erkennst du an der Geschwindigkeit, die Kurve an der Richtung. Fährt etwas gerade und gleich schnell, ändert sich nichts.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Beschleunigung" rel="noopener">Beschleunigung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Bei welchen Vorgängen ändert sich die Bewegung? Wähle alle aus.</legend>
<label class="question-option"><input type="checkbox" name="frage-a4" value="0"> <span>Ein Rad rollt an der Ampel an.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a4" value="1"> <span>Ein Auto fährt mit gleichem Tempo durch eine Kurve.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a4" value="2"> <span>Ein Zug fährt mit gleichem Tempo geradeaus.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a4" value="3"> <span>Ein Aufzug bremst kurz vor dem Stockwerk ab.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Ein Rad rollt an der Ampel an.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Rad wird schneller, die Bewegung ändert sich.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Ein Auto fährt mit gleichem Tempo durch eine Kurve.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Tempo bleibt gleich, aber die Richtung ändert sich. Auch das ist eine Änderung der Bewegung.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Ein Zug fährt mit gleichem Tempo geradeaus.</strong></p><p>Weder die Geschwindigkeit noch die Richtung ändern sich, die Bewegung bleibt gleich.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Ein Aufzug bremst kurz vor dem Stockwerk ab.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Aufzug wird langsamer, die Geschwindigkeit ändert sich.</p></li>
</ul>
<p class="question-explanation">Die Bewegung ändert sich, sobald der Körper schneller oder langsamer wird oder die Richtung wechselt.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Beschleunigung" rel="noopener">Beschleunigung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was passiert in diesem Blitzbild bei 4 s?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/spur-umkehr.svg" alt="Ein Blitzbild mit sieben Punkten für 0 bis 6 Sekunden. Die Punkte für 0 bis 4 Sekunden liegen in der oberen Reihe bei 0, 8, 14, 18 und 20 Metern, die für 5 und 6 Sekunden in der unteren Reihe bei 16 und 10 Metern." loading="lazy" decoding="async"><figcaption><p>Ein Punkt je Sekunde auf der Bahn.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Der Wagen kehrt um und fährt zurück.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Der Wagen bleibt dauerhaft stehen.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Der Wagen beschleunigt weiter in dieselbe Richtung.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="3"> <span>Der Wagen fährt mit gleichem Tempo geradeaus weiter.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Der Wagen kehrt um und fährt zurück.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Punkte nach 4 s liegen in der zweiten Reihe und weiter links. Der Wagen fährt wieder in Richtung Start.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Der Wagen bleibt dauerhaft stehen.</strong></p><p>Bei 5 s und 6 s sind es neue Punkte an anderen Stellen. Der Wagen steht nicht, er fährt zurück.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Der Wagen beschleunigt weiter in dieselbe Richtung.</strong></p><p>Vor 4 s werden die Abstände kleiner, nicht größer. Danach fährt der Wagen in die andere Richtung.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Der Wagen fährt mit gleichem Tempo geradeaus weiter.</strong></p><p>Die Punkte nach 4 s liegen links vom Punkt bei 4 s. Der Wagen fährt nicht mehr geradeaus weiter.</p></li>
</ul>
<p class="question-explanation">Die zweite Reihe zeigt, dass sich die Richtung geändert hat. Davor wurde der Wagen langsamer, am Umkehrpunkt stand er kurz.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Beschleunigung" rel="noopener">Beschleunigung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

ichem Tempo durch eine Kurve.","right":"Die Richtung ändert sich."},{"left":"Ein Rad fährt auf gerader Straße gleich schnell.","right":"Nichts ändert sich."}]},"rendered":{}}},{"key":"a4","ref":"/geschwindigkeit-aendert-sich/richtung-aendert-sich/#richtung-wahl","page":"geschwindigkeit-aendert-sich/richtung-aendert-sich/","exercise":"richtung-wahl","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a4","text":"Bei welchen Vorgängen ändert sich die Bewegung? Wähle alle aus.","explanation":"Die Bewegung ändert sich, sobald der Körper schneller oder langsamer wird oder die Richtung wechselt.","links":[{"title":"Beschleunigung (Wikipedia)","url":"https://de.wikipedia.org/wiki/Beschleunigung"}],"type":"multiple-choice","options":[{"text":"Ein Rad rollt an der Ampel an.","correct":true,"info":"Das Rad wird schneller, die Bewegung ändert sich."},{"text":"Ein Auto fährt mit gleichem Tempo durch eine Kurve.","correct":true,"info":"Das Tempo bleibt gleich, aber die Richtung ändert sich. Auch das ist eine Änderung der Bewegung."},{"text":"Ein Zug fährt mit gleichem Tempo geradeaus.","correct":false,"info":"Weder die Geschwindigkeit noch die Richtung ändern sich, die Bewegung bleibt gleich."},{"text":"Ein Aufzug bremst kurz vor dem Stockwerk ab.","correct":true,"info":"Der Aufzug wird langsamer, die Geschwindigkeit ändert sich."}]},"rendered":{}}},{"key":"a5","ref":"/geschwindigkeit-aendert-sich/richtung-aendert-sich/#umkehr-erkennen","page":"geschwindigkeit-aendert-sich/richtung-aendert-sich/","exercise":"umkehr-erkennen","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a5","text":"Was passiert in diesem Blitzbild bei 4 s?","explanation":"Die zweite Reihe zeigt, dass sich die Richtung geändert hat. Davor wurde der Wagen langsamer, am Umkehrpunkt stand er kurz.","links":[{"title":"Beschleunigung (Wikipedia)","url":"https://de.wikipedia.org/wiki/Beschleunigung"}],"material":[{"type":"figure","image":"images/spur-umkehr.svg","alt":"Ein Blitzbild mit
