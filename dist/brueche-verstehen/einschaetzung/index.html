<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Bruch gehört zum Kreis? Er ist in 8 gleich große Stücke geteilt, 5 sind gefärbt.</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/kreis-5-von-8.svg" alt="Ein Kreis, in acht gleich große Stücke geteilt. Fünf Stücke sind blau mit Streifen gefärbt, drei sind weiß." loading="lazy" decoding="async"><figcaption><p>Der ganze Kreis ist das Ganze.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>

<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>3/8</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>5/3</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="3"> <span>8/5</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>5/8</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die 8 Stücke sind alle gleich groß, also ist der Nenner 8. Gefärbt sind 5 davon: Zähler 5.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>3/8</strong></p><p>Das wären die 3 weißen Stücke. Der Bruch gehört zu den gefärbten Stücken.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>5/3</strong></p><p>Der Nenner zählt alle gleich großen Teile des Ganzen, nicht nur die weißen. Hier sind es 8.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>8/5</strong></p><p>Zähler und Nenner sind vertauscht: Der Nenner steht für die Teile des Ganzen, der Zähler für die genommenen.</p></li>
</ul>
<p class="question-explanation">Der Nenner ist die Zahl aller gleich großen Teile, der Zähler die Zahl der gefärbten.</p>

<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>4/3</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>1/4</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="3"> <span>3/5</span></label>
</fieldset>

<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>3/4</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Von der 0 bis zum Dreieck sind es 3 Abschnitte, und 4 Abschnitte machen das Ganze.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>4/3</strong></p><p>Zähler und Nenner sind vertauscht. Ein Ganzes besteht hier aus 4 Abschnitten.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>1/4</strong></p><p>Das wäre ein Abschnitt von der 0 aus. Das Dreieck steht weiter rechts.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>3/5</strong></p><p>Du hast die Striche gezählt, nicht die Abschnitte. Zwischen 0 und 1 sind 4 Abschnitte, nicht 5.</p></li>
