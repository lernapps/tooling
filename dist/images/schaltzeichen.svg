<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" font-family="sans-serif" font-size="13">
  <title>Schaltzeichen: Batterie, Lampe, Schalter offen, Schalter geschlossen, Amperemeter, Voltmeter</title>
  <g fill="none" stroke="#222" stroke-width="2">
    <!-- Batterie -->
    <path d="M10 30 H40 M50 30 H80"/><path d="M40 16 V44" stroke-width="2"/><path d="M50 22 V38" stroke-width="5"/>
    <!-- Lampe -->
    <path d="M190 30 H210 M250 30 H270"/><circle cx="230" cy="30" r="20" fill="#fff"/><path d="M216 16 L244 44 M244 16 L216 44"/>
    <!-- Schalter offen -->
    <path d="M10 100 H30 M80 100 H100"/><path d="M30 100 L74 82"/>
    <!-- Schalter geschlossen -->
    <path d="M190 100 H210 M270 100 H290"/><path d="M210 100 H270"/>
    <!-- Amperemeter -->
    <path d="M10 170 H30 M70 170 H90"/><circle cx="50" cy="170" r="20" fill="#fff"/>
    <!-- Voltmeter -->
    <path d="M190 170 H210 M250 170 H270" stroke="#06c"/><circle cx="230" cy="170" r="20" fill="#fff" stroke="#06c"/>
  </g>
  <circle cx="30" cy="100" r="3" fill="#222"/><circle cx="74" cy="100" r="3" fill="#222"/>
  <circle cx="210" cy="100" r="3" fill="#222"/><circle cx="270" cy="100" r="3" fill="#222"/>
  <text x="44" y="176" font-weight="bold">A</text>
  <text x="224" y="176" font-weight="bold" fill="#06c">V</text>
  <g fill="#444" font-size="12">
    <text x="10" y="68">Batterie</text><text x="190" y="68">Lampe</text>
    <text x="10" y="130">Schalter offen</text><text x="190" y="130">Schalter geschlossen</text>
    <text x="10" y="210">Amperemeter</text><text x="190" y="210">Voltmeter</text>
  </g>
</svg>
