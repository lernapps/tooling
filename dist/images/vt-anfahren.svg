<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" font-family="sans-serif" font-size="17" role="img">
  <title>Geschwindigkeit-Zeit-Diagramm: die Linie steigt und wird dann waagerecht</title>
  <rect width="400" height="280" fill="#ffffff"/>
  <g stroke="#cfd4da" stroke-width="1">
    <line x1="50" y1="196.7" x2="370" y2="196.7"/>
    <line x1="50" y1="163.3" x2="370" y2="163.3"/>
    <line x1="50" y1="130.0" x2="370" y2="130.0"/>
    <line x1="50" y1="96.7" x2="370" y2="96.7"/>
    <line x1="50" y1="63.3" x2="370" y2="63.3"/>
    <line x1="50" y1="30.0" x2="370" y2="30.0"/>
    <line x1="130" y1="30" x2="130" y2="230"/>
    <line x1="210" y1="30" x2="210" y2="230"/>
    <line x1="290" y1="30" x2="290" y2="230"/>
    <line x1="370" y1="30" x2="370" y2="230"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="1.5"><line x1="50" y1="20" x2="50" y2="230"/><line x1="50" y1="230" x2="372" y2="230"/></g>
  <g fill="#1a1a1a" text-anchor="end"><text x="44" y="234.0">0</text><text x="44" y="200.7">2</text><text x="44" y="167.3">4</text><text x="44" y="134.0">6</text><text x="44" y="100.7">8</text><text x="44" y="67.3">10</text><text x="44" y="34.0">12</text></g>
  <g fill="#1a1a1a" text-anchor="middle"><text x="50" y="248">0</text><text x="130" y="248">2</text><text x="210" y="248">4</text><text x="290" y="248">6</text><text x="370" y="248">8</text></g>
  <text x="56" y="16" fill="#1a1a1a">v in m/s</text>
  <text x="370" y="270" fill="#1a1a1a" text-anchor="end">t in s</text>
  <polyline points="50,230.0 210,96.7 370,96.7" fill="none" stroke="#1d5fc4" stroke-width="3" stroke-linejoin="round"/>
</svg>
