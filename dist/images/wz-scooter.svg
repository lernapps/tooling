<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" font-family="sans-serif" font-size="17" role="img">
  <title>Weg-Zeit-Diagramm eines Scooters: Gerade durch den Punkt 6 s und 18 m</title>
  <rect width="400" height="280" fill="#ffffff"/>
  <g stroke="#cfd4da" stroke-width="1">
    <line x1="50" y1="30" x2="370" y2="30"/><line x1="50" y1="80" x2="370" y2="80"/><line x1="50" y1="130" x2="370" y2="130"/><line x1="50" y1="180" x2="370" y2="180"/><line x1="50" y1="230" x2="370" y2="230"/>
    <line x1="130" y1="30" x2="130" y2="230"/><line x1="210" y1="30" x2="210" y2="230"/><line x1="290" y1="30" x2="290" y2="230"/><line x1="370" y1="30" x2="370" y2="230"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="1.5"><line x1="50" y1="20" x2="50" y2="230"/><line x1="50" y1="230" x2="372" y2="230"/></g>
  <g fill="#1a1a1a" text-anchor="end"><text x="44" y="234">0</text><text x="44" y="184">5</text><text x="44" y="134">10</text><text x="44" y="84">15</text><text x="44" y="34">20</text></g>
  <g fill="#1a1a1a" text-anchor="middle"><text x="50" y="248">0</text><text x="130" y="248">2</text><text x="210" y="248">4</text><text x="290" y="248">6</text><text x="370" y="248">8</text></g>
  <text x="56" y="16" fill="#1a1a1a">s in m</text>
  <text x="370" y="270" fill="#1a1a1a" text-anchor="end">t in s</text>
  <line x1="50" y1="230" x2="330" y2="20" stroke="#1d5fc4" stroke-width="3"/>
  <line x1="290" y1="230" x2="290" y2="50" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="50" y1="50" x2="290" y2="50" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="290" cy="50" r="5" fill="#1d5fc4"/>
  <text x="296" y="44" fill="#1a1a1a">(6 s | 18 m)</text>
</svg>
