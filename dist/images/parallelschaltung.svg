<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-labelledby="t d">
  <title id="t">Parallelschaltung</title>
  <desc id="d">Eine Batterie und zwei Lampen. Die Leitung teilt sich in zwei Zweige, in jedem Zweig liegt eine Lampe, danach laufen die Zweige wieder zusammen. Der Strom hat zwei Wege.</desc>
