<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" font-family="sans-serif" font-size="13">
  <title>Einfacher Stromkreis aus Batterie, Schalter und Lampe</title>
  <g fill="none" stroke="#222" stroke-width="2">
    <path d="M60 40 H150 M210 40 H300 V200 H210 M150 200 H60 V140 M60 100 V40"/>
    <!-- Batterie links: langer Strich = Pluspol oben -->
    <path d="M42 100 H78" stroke-width="3"/>
    <path d="M52 112 H68" stroke-width="5"/>
    <path d="M60 112 V140"/>
    <!-- Lampe oben -->
    <circle cx="180" cy="40" r="22" fill="#fff"/>
    <path d="M164 24 L196 56 M196 24 L164 56"/>
    <!-- Schalter unten, geschlossen -->
    <path d="M150 200 L208 200"/>
  </g>
  <circle cx="150" cy="200" r="4" fill="#222"/>
  <circle cx="210" cy="200" r="4" fill="#222"/>
  <text x="84" y="112">Batterie</text>
  <text x="156" y="94">Lampe</text>
  <text x="152" y="226">Schalter (zu)</text>
  <path d="M300 110 V130 M294 122 L300 132 L306 122" fill="none" stroke="#06c" stroke-width="2"/>
  <text x="308" y="124" fill="#06c" font-size="11">Strom</text>
</svg>
