name: Pages

# Builds the tooling's documentation into _site/ (start page and architecture, scripts/build.sh), checks the
# built site (npm run check:site: site-check of the site frame), and on main publishes it to the gh-pages branch, which GitHub
# Pages serves at https://lernapps.net/tooling/. The steps are the shared site actions of this repo, used from the
# checkout here, so a change to an action is exercised by its own pull request. The change scope (changes.yml) gates
# the jobs: they run for docs and for any change but one of only the plan (.vibe/**). The job `site` always runs and
# reports the result, the required check that never stays "Pending"; it is named `site`, not `check`: `check` is the
# check of the tooling's code (check.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  build:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/site-check
        with:
          check-script: check:site

  deploy:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.site == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/site-deploy

  site: # required status check: always runs, fails when a job above failed or was cancelled
    needs: [changes, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "the jobs ended: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
