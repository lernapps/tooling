name: Pages

# Builds the tooling's documentation into _site/ (start page and architecture, scripts/build.sh), checks the
# built site (npm run check:site: lernapps-check), and on main publishes it to the gh-pages branch, which GitHub
# Pages serves at https://lernapps.net/tooling/. The steps are the shared site actions of this repo, used from the
# checkout here, so a change to an action is exercised by its own pull request. The job is named `site`, not
# `check`: `check` is the check of the tooling's code (check.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/site-check
        with:
          check-script: check:site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/site-deploy
