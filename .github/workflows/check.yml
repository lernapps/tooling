name: Check

# The checks of the tooling's own code: `lernapps check` without a flag, with every test. The pre-push hook runs the
# same command, with the heavy end-to-end tests only when a push changes a path they exercise (scripts/pre-push.ts);
# CI runs everything, always, and so catches what the hook's positive list misses. The docs site is built and checked
# by pages.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check: # required status check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The command of the hooks, with every test (no LERNAPPS_TESTS). The generator's tests fetch lernapps/app-templates at the commit
      # pinned in package.json (appTemplates) themselves, as they do in the hooks (test/support.ts, appTemplates).
      - run: npm run lernapps -- check
