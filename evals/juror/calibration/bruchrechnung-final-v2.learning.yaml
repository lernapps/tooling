notes:
  Keine competencies in juror-input.yaml; Karte mathematik.json nur angeschaut, daher gilt das übliche Vorwissen Klasse
  6 (natürliche Zahlen, Grundrechenarten, Alltag). Glossar, Tutor- und Selbsttest-Seiten ausgelassen. Alle 21 Inhaltsseiten
  bei 1280x800 und 360x740 geöffnet (kein horizontales Scrollen). Eingabefelder/Regler bedient; falsche Eingaben in „Prüfen“
  geprüft, Rückmeldungen nicht bewertet. Die Meldung „Vergleiche die Zahl der ausgewählten Teile mit dem Zähler“ erscheint
  auch auf der Zahlenstrahl-Übung, wo nichts ausgewählt wird.
