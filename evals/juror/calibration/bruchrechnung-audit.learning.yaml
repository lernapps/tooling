    page: /anteile/zahlenstrahl/
    unit: Seite
    level: 1
    evidence:
      „Eine Zahl kann auch einen Platz auf einer Strecke haben.“ Die Seite knüpft nicht an den Zahlenstrahl der natürlichen
      Zahlen an, den man aus Klasse 5 kennt. „Einheit“ („Zwischen 0 und 1 liegt eine ganze Einheit“) kommt ohne Erklärung.
  - item: explainer-one-step
    page: /anteile/zahlenstrahl/
    unit: Seite
    level: 2
    evidence: "Ein Schritt: Brüche bis 1 auf dem Zahlenstrahl; das Beispiel zeigt nur 3/4."
