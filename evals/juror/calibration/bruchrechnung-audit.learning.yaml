units:
  - item: explainer-learner-start
    page: /anteile/darstellen/
    unit: Seite
    level: 2
    evidence:
      "Beginnt mit Pizza: „Stell dir vor, ihr teilt eine Pizza in vier gleich große Stücke. Du nimmst eines: Das ist
      ein Viertel der Pizza.“ Danach erklärt die Definition Nenner und Zähler, bevor sie gebraucht werden."
  - item: explainer-one-step
    page: /anteile/darstellen/
    unit: Seite
    level: 1
    evidence:
      "Neben Zähler/Nenner bringt die Beobachtung eine zweite Deutung: „Der Bruchstrich bedeutet auch geteilt durch.“
      Sie wird nirgends gezeigt oder geübt."
  - item: explainer-honest-headings
    page: /anteile/darstellen/
    unit: Seite
    level: 2
    evidence: „Begriffe klären“, „Ausprobieren“ (Regler), „Am Beispiel nachvollziehen“, „Üben“ passen zu ihren Abschnitten.
  - item: explainer-age-appropriate
    page: /anteile/darstellen/
    unit: Seite
    level: 2
    evidence: Kurze Sätze und Alltagsbezug („Mit einem Beinbruch hat er hier nichts zu tun“), passend für Klasse 6.
  - item: explainer-representation-explained
    page: /anteile/darstellen/
    unit: Komponente im Abschnitt „Ausprobieren“ (Zähler-/Nenner-Regler mit Kreis, Bruchstreifen, Menge)
    level: 0
    evidence:
      "Im Bruchstreifen stehen Häkchen in den Feldern (✓ ✓ ✓ ·), die wie „richtig“ wirken. Das Ganze ist widersprüchlich:
      Kreis „Ganzes: 1“, Menge „Ganzes: 8“ (bei Nenner 12 „Ganzes: 24“); dass 6 von 8 Punkten 3/4 sind, sagt der Text nicht."
    did: Zähler auf 0 und 4, Nenner auf 1 und 12 gestellt; 1/12, 12/12 angesehen.
  - item: explainer-control-purpose
    page: /anteile/darstellen/
    unit: Komponente im Abschnitt „Ausprobieren“ (Zähler-/Nenner-Regler mit Kreis, Bruchstreifen, Menge)
    level: 1
    evidence:
      Beide Regler ändern Kreis, Streifen und Menge sichtbar, und der Text fragt „Was verändert sich…“. Mit dem Nenner
      ändert sich aber auch die Größe der Menge (8 → 24 Gegenstände). Was dabei gleich bleibt, muss man erraten.
    did: Nenner 4 → 12 → 1, Zähler 0 → max.
  - item: explainer-text-figure-agree
    page: /anteile/darstellen/
    unit: Komponente im Abschnitt „Ausprobieren“ (Zähler-/Nenner-Regler mit Kreis, Bruchstreifen, Menge)
    level: 1
    evidence:
      Text und Notiz sprechen von einem Ganzen („Ein Ganzes muss feststehen“), die Menge zeigt aber ein Ganzes aus 8
      (24) Gegenständen. Das nojs nennt einen Zahlenstrahl, den die Komponente nicht zeigt.
    did: Ansichten bei 3/4 und 1/12 verglichen.
  - item: explainer-representation-explained
    page: /anteile/darstellen/
    unit: Übung „Markiere {z}/{n}“ (BruchModelle)
    level: 0
    evidence:
      Ausgewählte Felder bekommen ein Häkchen (✓). Das Ganze ist nicht beschriftet (nur „Bruchstreifen“ oder „Menge“
      mit Kreisen), und dass gefüllt „ausgewählt“ heißt, steht nicht da.
    did: Bei „Markiere 2/6“ 3 Felder markiert und geprüft, dann 2 Felder.
  - item: explainer-control-purpose
    page: /anteile/darstellen/
    unit: Übung „Markiere {z}/{n}“ (BruchModelle)
    level: 2
    evidence:
      Jedes Feld schaltet beim Antippen sichtbar um. Die Aufgabe sagt „Markiere 2/6 … ihre Anordnung darfst du frei
      wählen“. „Prüfen“ ist ohne Auswahl gesperrt.
    did: 3 Felder → „Leider nicht richtig. Vergleiche die Zahl der ausgewählten Teile mit dem Zähler“; 2 Felder → richtig.
  - item: explainer-text-figure-agree
    page: /anteile/darstellen/
