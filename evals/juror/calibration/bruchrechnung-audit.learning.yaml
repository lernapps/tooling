    page: /anteile/zahlenstrahl/
    unit: Komponente im Abschnitt „Ausprobieren“ (Zahlenstrahl mit Reglern)
    level: 1
    evidence:
      "0 und 1 sind beschriftet, die Teilstriche zeigen den Nenner. Der Punkt heißt aber „Ausgewählt: 5/12“, und was
      er bedeutet, steht nicht da. Das nojs beschreibt Kreis, Streifen und Menge, die diese Seite nicht zeigt."
    did: Nenner 1, 4, 12; Zähler 0 bis Nenner.
  - item: explainer-control-purpose
    page: /anteile/zahlenstrahl/
    unit: Komponente im Abschnitt „Ausprobieren“ (Zahlenstrahl mit Reglern)
    level: 2
    evidence:
      Der Zähler schiebt den Punkt, der Nenner ändert die Teilstriche. Der Zähler ist auf den Nenner begrenzt, Beschriftung
      und Lage passen nach jeder Änderung (5/12 auf dem 5. Strich).
    did: Zähler 0 → 4 bei Nenner 4; Nenner 12, Zähler 5.
  - item: explainer-text-figure-agree
