notes:
  "Map read (mathematik.json); no competencies given, so the learner role used the 5-6 band: brueche-begriff (requires
  natuerliche-zahlen), teilbarkeit, primfaktoren-ggt-kgv, brueche-kuerzen-erweitern, bruchrechnung-grundaufgaben, brueche-*
  , dezimalbrueche*, runden, einfache-gleichungen. Start page and the six chapter pages were opened (1280 and 360 wide, no
  horizontal scroll) but carry only summaries and links, so they have no units. Exercise seeds are random per load; steps
  of generated exercises read for three values of n from the sources and seen once each in the browser. Tables in sections
  titled „Ausprobieren“ are judged only for text-figure agreement. Not judged here: single-choice „Welche Zahl ist eine Primzahl?“
  explains 13 with a text about 132."
