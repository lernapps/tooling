units:
  - item: explainer-learner-start
    page: /anteile/darstellen/
    unit: Seite
    level: 1
    evidence:
      "Start: „Stell dir vor, ihr teilt eine Pizza in vier gleich große Stücke. Du nimmst eines: Das ist ein Viertel
      der Pizza.“ Gute Alltagssituation. Die Definition nutzt aber sofort „Nenner“ und „Zähler“, ohne zu sagen, welche Zahl
      oben und welche unten steht; das klärt erst das Beispiel weiter unten („Die 4 unter dem Bruchstrich …“)."
  - item: explainer-representation-explained
    page: /anteile/darstellen/
    unit: Komponente im Abschnitt „Ausprobieren“ (Kreis, Bruchstreifen, Menge)
    level: 0
    evidence:
      "Das Ganze heißt beim Kreis „Ganzes: 1“, bei der Menge „Ganzes: 8“, beim Streifen steht stattdessen „Ausgewählt:
      3/4“. Ausgewählte Felder im Streifen tragen ein Häkchen „✓“, das wie „richtig“ aussieht; die gefüllten Punkte der Menge
      werden nicht erklärt. Dass das Mengen-Ganze mit dem Nenner wächst (8 → 24), sagt kein Text."
    did: Zähler auf 0 und 4, Nenner auf 1 und 12 gestellt; dazu 2/3, 4/5, 3/6.
  - item: explainer-representation-explained
    page: /anteile/darstellen/
    unit: Übung „Markiere {z}/{n}“ (BruchModelle)
    level: 1
    evidence:
      Aufgabe „Markiere 4/12. Alle Teile sind gleich groß; ihre Anordnung darfst du frei wählen.“ sagt, was zu tun ist.
      Wie viele Felder ein Ganzes bilden, steht nicht da (alle Felder = ein Ganzes muss man erraten); markierte Felder zeigen
      „✓“ wie ein Häkchen für richtig.
    did: Zwei, dann drei Felder angeklickt, Prüfen gedrückt.
  - item: explainer-control-purpose
    page: /anteile/darstellen/
    unit: Komponente im Abschnitt „Ausprobieren“
    level: 1
    evidence:
      "Beide Regler ändern Kreis, Streifen und Menge sichtbar; der Text sagt, wozu („In wie viele gleich große Stücke
      teilst du das Ganze?“). Aber beim Nenner ändert sich auch das Ganze der Menge („Ganzes: 8“ → „Ganzes: 24“ bei Nenner 12),
      obwohl der Hinweis sagt „Ein Ganzes muss feststehen“. Der Start zeigt nicht zuerst, was gleich bleibt."
    did: "Nenner von 4 auf 12 und auf 1 („1/1“, Menge „Ganzes: 2“)."
  - item: explainer-control-purpose
    page: /anteile/darstellen/
    unit: Übung „Markiere {z}/{n}“
    level: 2
    evidence:
      "Jedes Feld schaltet sichtbar um (○ → ✓); der Zähler „Deine Darstellung: 3/10“ erscheint erst nach Prüfen und
      passt zur Zahl der Markierungen."
    did: Drei Felder markiert, Prüfen.
  - item: explainer-text-figure-agree
    page: /anteile/darstellen/
    unit: Komponente im Abschnitt „Ausprobieren“ mit Text und Hinweis
    level: 1
    evidence:
      "Start 3/4 passt zu Pizza-Text und Beispiel („Drei sind markiert: 3/4“). Der Hinweis „Ein Ganzes muss feststehen“
      widerspricht der Menge, deren Ganzes sich mit dem Nenner ändert."
    did: Nenner verändert.
