units:
  - item: explainer-learner-start
    page: /anteile/darstellen/
    unit: Die Seite (Einstieg)
    level: 2
    evidence:
      "Beginnt mit der Pizza: „ihr teilt eine Pizza in vier gleich große Stücke. Du nimmst eines: Das ist ein Viertel der Pizza.“ Nenner/Zähler werden in der
      Definition direkt danach erklärt."
  - item: explainer-learner-start
    page: /anteile/zahlenstrahl/
    unit: Die Seite (Einstieg)
    level: 1
    evidence: Beginnt mit „Eine Zahl kann auch einen Platz auf einer Strecke haben.“ Keine Alltagssituation; „Zahlenstrahl“ wird erst danach definiert.
  - item: explainer-learner-start
    page: /anteile/gemischte-zahlen/
    unit: Die Seite (Einstieg)
    level: 1
    evidence:
      "Pizza-Einstieg („Eine Pizza reicht nicht immer“), aber die Definition nutzt „echten Bruch“ ohne Erklärung: „Eine gemischte Zahl besteht aus einer ganzen
      Zahl und einem echten Bruch.“"
  - item: explainer-learner-start
    page: /teilbarkeit/regeln/
    unit: Die Seite (Einstieg)
    level: 1
    evidence:
      Bauklötze-Einstieg ist gut („zwölf Bauklötze … drei Reihen mit je vier“). Die Komponente nennt aber „Primzahlen“ und zeigt ★, bevor „Primzahl“ erklärt
      wird (erst im Abschnitt danach).
  - item: explainer-learner-start
    page: /teilbarkeit/teiler-vielfache/
    unit: Die Seite (Einstieg)
    level: 1
    evidence:
      Plättchen-Frage am Anfang („Zwölf und achtzehn Plättchen sollen in gleich große Päckchen“). Im Ausprobieren-Text kommen „Unterteilung … zu zwei Brüchen“
      sowie ggT/kgV, die erst in der Notiz erklärt werden.
  - item: explainer-learner-start
    page: /umformen/erweitern/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: "Kuchen in drei Stücke, zwei davon für dich: „Wie beschreibst du deinen Anteil jetzt?“ Anknüpfung an Bruchbegriff, „Erweitern“ wird danach erklärt."
  - item: explainer-learner-start
    page: /umformen/kuerzen/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: „Mehrere kleine Stücke können zusammen ein größeres Stück bilden.“ Knüpft an erweitern an, „Kürzen“ wird danach definiert.
  - item: explainer-learner-start
    page: /umformen/vergleichen/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: „Zwei Kinder bekommen unterschiedlich große Bruchteile einer gleich großen Tafel. Wie kannst du herausfinden, wer mehr bekommt?“
  - item: explainer-learner-start
    page: /grundaufgaben/bruchteil/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: „Du hast 12 Plättchen vor dir und möchtest drei Viertel davon nehmen.“ Konkret, danach Bruchteil definiert.
  - item: explainer-learner-start
    page: /grundaufgaben/ganzes/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: „Du siehst nur einen Teil einer Menge und weißt, welcher Anteil das ist.“ Konkrete Umkehrsituation, „Ganzes“ wird danach definiert.
  - item: explainer-learner-start
    page: /grundaufgaben/anteil/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: „Sechs von acht Plättchen sind markiert. Die Frage ist nun, welcher Bruch diese Auswahl beschreibt.“
  - item: explainer-learner-start
    page: /rechnen/plus-minus/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: „Du legst Bruchstücke zusammen oder nimmst welche weg. Damit du sie zählen kannst, müssen sie gleich groß sein.“
  - item: explainer-learner-start
    page: /rechnen/multiplizieren/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: "„Von einem Teil wird noch einmal ein Teil ausgewählt: etwa die Hälfte eines Viertels.“"
  - item: explainer-learner-start
    page: /rechnen/dividieren/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: „Du füllst Saft aus einem Gefäß in kleinere gleich große Gläser. Wie oft passt der Inhalt eines kleinen Glases in die vorhandene Menge?“
  - item: explainer-learner-start
    page: /rechnen/terme/
    unit: Die Seite (Einstieg)
    level: 1
    evidence:
      "Beginnt abstrakt: „In einer längeren Rechnung stehen mehrere Rechenschritte. Klammern und Rechenzeichen legen fest, welcher Schritt zuerst kommt.“ Keine
      Situation, die Regel steht sofort."
  - item: explainer-learner-start
    page: /rechnen/gleichungen/
    unit: Die Seite (Einstieg)
    level: 1
    evidence: Analogie „Eine Rechenwaage soll auf beiden Seiten denselben Wert zeigen“, aber auf der Seite gibt es keine Waage; die Analogie wird nicht weiterverwendet.
  - item: explainer-learner-start
    page: /anwendungen/dezimaldarstellung/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: „Auf einem Messbecher steht vielleicht 0,5 Liter statt ein halber Liter.“
  - item: explainer-learner-start
    page: /anwendungen/dezimalrechnen/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: „Beim Rechnen mit Geld legst du Euro zu Euro und Cent zu Cent.“
  - item: explainer-learner-start
    page: /anwendungen/runden/
    unit: Die Seite (Einstieg)
    level: 2
    evidence: „Eine Messung ist oft genauer angegeben, als du sie brauchst.“
  - item: explainer-learner-start
    page: /anwendungen/sachaufgaben/
    unit: Die Seite (Einstieg)
    level: 1
    evidence: „Eine Geschichte beschreibt Mengen und Anteile. Bevor du rechnest, klärst du, was du schon weißt“ – keine konkrete Situation, nur Verfahren.
  - item: explainer-one-step
    page: /anteile/darstellen/
    unit: Die Seite
    level: 2
    evidence: Nur Bruchbegriff (Zähler/Nenner, Ganzes). Nichts von späteren Seiten (Zahlenstrahl nur als Label in nojs).
  - item: explainer-one-step
    page: /anteile/zahlenstrahl/
    unit: Die Seite
    level: 2
    evidence: Nur Lage von Brüchen zwischen 0 und 1; ein Beispiel pro Kasten.
  - item: explainer-one-step
    page: /anteile/gemischte-zahlen/
    unit: Die Seite
    level: 1
    evidence:
      "Zwei Richtungen in einem Beispielkasten: „7/3 sind zwei Ganze und ein Drittel: 2 + 1/3. Umgekehrt ergeben 2 · 3 + 1 insgesamt sieben Drittel.“ plus unechter
      Bruch."
  - item: explainer-one-step
    page: /teilbarkeit/regeln/
    unit: Die Seite
    level: 1
    evidence: Faktoren, Primzahl, Primfaktorzerlegung und Teilbarkeitsregeln (Tabelle 2,5,10,4,25,100,3,9) auf einer Seite.
  - item: explainer-one-step
    page: /teilbarkeit/teiler-vielfache/
    unit: Die Seite
    level: 0
    evidence:
      Teiler, Vielfache, ggT und kgV (zwei eigene Kompetenzen) plus Anwendung auf Brüche („ggT beim Kürzen, kgV beim Hauptnenner“) – Kürzen und Hauptnenner
      sind Inhalte späterer Seiten.
  - item: explainer-one-step
    page: /umformen/erweitern/
    unit: Die Seite
    level: 2
    evidence: Nur Erweitern, ein Beispiel (2/3 = 4/6).
  - item: explainer-one-step
    page: /umformen/kuerzen/
    unit: Die Seite
    level: 2
    evidence: Nur Kürzen; ein Beispiel (6/8 = 3/4).
  - item: explainer-one-step
    page: /umformen/vergleichen/
    unit: Die Seite
    level: 1
    evidence: "Mehrere Methoden in einer Notiz: gleicher Nenner, gleicher Zähler, gemeinsamer Nenner, Zahlenstrahl."
  - item: explainer-one-step
    page: /grundaufgaben/bruchteil/
    unit: Die Seite
    level: 2
    evidence: Nur „Bruchteil von einer Menge“ in zwei Schritten.
  - item: explainer-one-step
    page: /grundaufgaben/ganzes/
    unit: Die Seite
    level: 1
    evidence: "Zwei Wege im Kasten: „Ganzes = Bruchteil : Anteil“ und „zuerst durch den Zähler teilen und dann mit dem Nenner multiplizieren“."
  - item: explainer-one-step
    page: /grundaufgaben/anteil/
    unit: Die Seite
    level: 1
    evidence: Anteil als Bruch, zusätzlich Einheiten umrechnen (50 cm von 2 m) und relative Häufigkeit; zwei Beispiele in einem Kasten.
  - item: explainer-one-step
    page: /rechnen/plus-minus/
    unit: Die Seite
    level: 1
    evidence: Addieren und Subtrahieren, Hauptnenner, Kürzen des Ergebnisses; zwei Beispiele im Kasten.
  - item: explainer-one-step
    page: /rechnen/multiplizieren/
    unit: Die Seite
    level: 1
    evidence: Multiplizieren plus „vorher kürzen“ und „Zahl wird kleiner“.
  - item: explainer-one-step
    page: /rechnen/dividieren/
    unit: Die Seite
    level: 1
    evidence: Wie-oft-passt-Idee und Kehrbruch-Regel mit „Nur der zweite Bruch wird umgekehrt“.
  - item: explainer-one-step
    page: /rechnen/terme/
    unit: Die Seite
    level: 0
    evidence: Vorrangregel, Kommutativ-/Assoziativgesetz und Distributivgesetz („a · (b + c) = a · b + a · c“) in einer Notiz; mehrere Kompetenzen.
  - item: explainer-one-step
    page: /rechnen/gleichungen/
    unit: Die Seite
    level: 1
    evidence: Gleichung lösen, Umkehroperation, Probe, fehlender Faktor.
  - item: explainer-one-step
    page: /anwendungen/dezimaldarstellung/
    unit: Die Seite
    level: 0
    evidence: Dezimalzahl, Stellenwerte, periodische Dezimalzahlen, „Nenner nur Primfaktoren 2 und 5“ und Prozent auf einer Seite.
  - item: explainer-one-step
    page: /anwendungen/dezimalrechnen/
    unit: Die Seite
    level: 0
    evidence: Addieren, Multiplizieren und Dividieren von Dezimalzahlen in einer Notiz und einem Beispielkasten (drei Rechnungen).
  - item: explainer-one-step
    page: /anwendungen/runden/
    unit: Die Seite
    level: 2
    evidence: Nur Runden auf Hundertstel; ein Beispiel mit Gegenbeispiel.
  - item: explainer-one-step
    page: /anwendungen/sachaufgaben/
    unit: Die Seite
    level: 1
    evidence: Sachaufgabenschema, Einheit, Schätzen, relative Häufigkeit; zwei Beispiele („3/4 Liter“, „20 Würfe“) in einem Kasten.
