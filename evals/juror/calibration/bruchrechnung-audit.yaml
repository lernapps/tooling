# Labels for the calibration of the juror (evals/juror/calibration.md): the simulated child audit of the app
# lernapps/bruchrechnung at its stand 791940f (the closest commit in PR #1 is 9cc93f6), quoted from issue
# lernapps/tooling#257, Anlage 2, table "Alle Lernseiten". Levels: klar = 2, teilweise = 1, unklar = 0.
# start: the column "Einstieg" (compares with explainer-learner-start); action: "Bedienung / Handlung" (compares
# with the mean of explainer-representation-explained, explainer-control-purpose and explainer-text-figure-agree).
# blockers: what the audit lists under "Zuerst verbessern" as text that names a tool or view the page lacks
# (compares with level 0 of explainer-text-figure-agree).
source: https://github.com/lernapps/tooling/issues/257
