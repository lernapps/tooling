    page: /anwendungen/
    unit: Kapitelseite
    level: 2
    evidence: Kurze Zusammenfassung in einfachen Sätzen; Beispiele aus dem Alltag der Klasse 6.
  - item: explainer-learner-start
    page: /anteile/darstellen/
    unit: Seite
    level: 2
    evidence:
      "„Stell dir vor, ihr teilt eine Pizza in vier gleich große Stücke. Du nimmst eines: Das ist ein Viertel der
      Pizza.“ Nenner und Zähler werden in der Definition erklärt, bevor der Regler sie nutzt."
  - item: explainer-representation-explained
    page: /anteile/darstellen/
    unit: Komponente „Ausprobieren“ (Kreis, Bruchstreifen, Menge)
    level: 1
    evidence:
      "Ganzes, Farbe und Regler werden erklärt („Die grünen Stücke sind ausgewählt“, „Mit „Nenner“ stellst du ein
      …“). Offen bleibt die Menge: bei 3/4 steht „Ganzes: 8“ und 6 von 8 Punkten sind gefüllt; warum zwei Punkte ein
      Teil sind, sagt weder Text noch nojs („Im Mengenbild sind sechs von acht Plättchen markiert“). Auch wie 6/8 zur
      Aussage „denselben Anteil“ führt, bleibt zu raten."
    did: Zähler 0 und 4, Nenner 1 und 12 gestellt.
  - item: explainer-control-purpose
    page: /anteile/darstellen/
    unit: Komponente „Ausprobieren“
    level: 1
    evidence:
      "Beide Regler ändern alle Bilder sichtbar, der Text sagt, wozu. Aber mit dem Nenner ändert sich in der Menge
      auch das Ganze: Nenner 1 → „Ganzes: 2“, Nenner 12 → „Ganzes: 24“, obwohl die Notiz sagt „Ein Ganzes muss
      feststehen“."
    did: Nenner auf 1 und 12, Zähler auf 0 und Maximum.
  - item: explainer-text-figure-agree
    page: /anteile/darstellen/
    unit: Komponente „Ausprobieren“
    level: 1
    evidence: Text und Kopfzeile nennen 3/4; die Menge zeigt ohne Hinweis 6 von 8 Punkten.
  - item: explainer-representation-explained
    page: /anteile/darstellen/
    unit: Übung „Markiere {z}/{n}“ (BruchModelle)
    level: 1
    evidence:
      "Kreis und Menge sind klar. In der Form Bruchstreifen (Aufgabe 2: „Markiere 3/4“) ist der Streifen nur 6 px
      hoch; die Teile sind kaum zu sehen und zu treffen."
    did: "Seeds 1–3: Kreis 2/3, Streifen 3/4, Menge 4/5; je richtig, eins zu wenig, nichts markiert."
  - item: explainer-control-purpose
    page: /anteile/darstellen/
    unit: Übung „Markiere {z}/{n}“
    level: 1
    evidence:
      Klicks markieren Teile, „Prüfen“ ist ohne Auswahl gesperrt. Im Bruchstreifen sind die Klickflächen 6 px hoch –
      ob man getroffen hat, muss man raten.
    did: Teile angeklickt und wieder abgewählt.
  - item: explainer-text-figure-agree
    page: /anteile/darstellen/
    unit: Übung „Markiere {z}/{n}“
    level: 2
    evidence: Der Text sagt „In der Übung klickst du die benötigten Teile an; ein weiterer Klick nimmt die Markierung
      zurück.“ – so verhält sich die Übung.
  - item: explainer-figure-hides-answer
    page: /anteile/darstellen/
    unit: Übung „Markiere {z}/{n}“
    level: 2
    evidence: "Vor „Prüfen“ zeigt die Übung nur die ungefärbten Teile; „Deine Darstellung: 2/3“ erscheint erst nach dem Prüfen."
    did: Teile markiert, vor Prüfen gelesen.
  - item: explainer-one-step
    page: /anteile/darstellen/
    unit: Seite
    level: 0
    evidence: Die Menge zeigt 3/4 als 6 von 8 Plättchen – gleichwertige Brüche gehören zu „Brüche erweitern“
      (brueche-kuerzen-erweitern). Dazu „Der Bruchstrich bedeutet auch geteilt durch“ ohne Erklärung.
  - item: explainer-steps-explain
    page: /anteile/darstellen/
    unit: Beispiel „Schritt für Schritt“
    level: 2
    evidence:
      "„Die 4 unter dem Bruchstrich sagt: Vier gleich große Teile bilden das Ganze. Die 3 darüber sagt: Drei davon
      sind ausgewählt.“"
  - item: explainer-steps-explain
    page: /anteile/darstellen/
    unit: Übung „aufgaben“ (Nenner zu 1/…)
    level: 2
    evidence:
      "Seed 1: „Hier besteht das Ganze aus 10 gleich großen Teilen. Ein ausgewählter Teil heißt deshalb ein 10-tel;
      unten steht 10.“ Seeds 2, 3 gleich gebaut."
    did: "Seeds 1–3: leer, 1, 5, 11 und die richtige Zahl."
  - item: explainer-honest-headings
    page: /anteile/darstellen/
    unit: Seite
    level: 2
    evidence: „Was ist ein Bruch?“, „Ausprobieren“ (mit Reglern), „Am Beispiel nachvollziehen“, „Üben“ passen.
  - item: explainer-age-appropriate
    page: /anteile/darstellen/
    unit: Seite
    level: 2
    evidence: Pizza, „Mit einem Beinbruch hat er hier nichts zu tun.“ – passend; der Ausprobieren-Absatz ist lang, aber
      verständlich.
  - item: explainer-learner-start
    page: /anteile/zahlenstrahl/
    unit: Seite
    level: 2
    evidence: „Eine Zahl kann auch einen Platz auf einer Strecke haben.“ und „Der Zahlenstrahl ist wie ein Lineal für
      Zahlen.“ – knüpft an den Zahlenstrahl der Klasse 5 an; Zahlenstrahl wird definiert.
  - item: explainer-representation-explained
    page: /anteile/zahlenstrahl/
    unit: Komponente „Ausprobieren“ (Zahlenstrahl)
    level: 2
    evidence:
      "Ganzes („Die Strecke von 0 bis 1 ist ein Ganzes“), Striche und Abstände („zähle also die Abstände, nicht die
      Striche“), grüner Punkt, Regler und Ergebnis („Ausgewählt: 3/4“) sind erklärt."
    did: Zähler 0/4, Nenner 1/12.
  - item: explainer-control-purpose
    page: /anteile/zahlenstrahl/
    unit: Komponente „Ausprobieren“
    level: 2
    evidence:
      "Beide Regler verschieben Punkt und Teilstriche sichtbar; Beschriftung „Ausgewählt: 1/12“ stimmt mit der Lage
      überein."
    did: Regler an beide Enden.
  - item: explainer-text-figure-agree
    page: /anteile/zahlenstrahl/
    unit: Komponente „Ausprobieren“
    level: 2
    evidence: Text, Startbild und Beispiel nutzen 3/4; das Beispiel teilt in vier Abstände wie das Bild.
  - item: explainer-representation-explained
    page: /anteile/zahlenstrahl/
    unit: Übung „Platziere {z}/{n}“
    level: 2
    evidence: Strecke 0–1 mit Teilstrichen des Nenners, Punkt, Regler „Wähle die Position“; Aufgabe sagt „Wähle den
      passenden Teilstrich“.
    did: "Seeds 1–3 (2/3, 3/4, 4/5): 0, richtig, eins zu wenig."
  - item: explainer-control-purpose
    page: /anteile/zahlenstrahl/
    unit: Übung „Platziere {z}/{n}“
    level: 1
    evidence:
      "Der Regler „Wähle die Position“ ist breiter als der Zahlenstrahl darüber; Reglerknopf und Punkt stehen nicht
      übereinander (3/4: Knopf bei ca. 500 px, Punkt bei ca. 350 px)."
    did: Regler auf 0, 10 und richtige Stelle.
  - item: explainer-text-figure-agree
    page: /anteile/zahlenstrahl/
    unit: Übung „Platziere {z}/{n}“
    level: 1
    evidence: Der Text sagt „In der Übung verschiebst du den Punkt“; tatsächlich bewegt man einen getrennten Regler darunter.
  - item: explainer-figure-hides-answer
    page: /anteile/zahlenstrahl/
    unit: Übung „Platziere {z}/{n}“
    level: 2
    evidence: Vor „Prüfen“ steht der Punkt bei 0; keine Anzeige des Bruchs, „Deine Darstellung“ erst nach Prüfen.
  - item: explainer-one-step
    page: /anteile/zahlenstrahl/
    unit: Seite
    level: 2
    evidence: Nur Brüche zwischen 0 und 1 (Zählerregler endet beim Nenner); ein Beispiel im Beispielkasten.
  - item: explainer-steps-explain
    page: /anteile/zahlenstrahl/
    unit: Beispiel „Schritt für Schritt“
    level: 2
    evidence: „Der erste Schritt führt zu 1/4, der zweite zu 2/4 und der dritte zu 3/4. Vier Schritte führen zu 4/4, also zur 1.“
  - item: explainer-steps-explain
    page: /anteile/zahlenstrahl/
    unit: Übung „aufgaben“ (Abstände für n/n)
    level: 2
    evidence:
      „Zwischen 0 und 1 liegen 10 gleich große Abstände. Ein Schritt ist also 1/10 lang. Für 10/10 gehst du alle 10
      Schritte … Der Startpunkt zählt nicht als Schritt.“
    did: Seeds 1–3 mit 4, 6, leer und richtig.
  - item: explainer-honest-headings
    page: /anteile/zahlenstrahl/
    unit: Seite
    level: 2
    evidence: Alle Titel passen; „Ausprobieren“ hat Regler.
  - item: explainer-age-appropriate
    page: /anteile/zahlenstrahl/
    unit: Seite
    level: 2
    evidence: Kurze Sätze, „wie ein Lineal für Zahlen“.
  - item: explainer-learner-start
    page: /anteile/gemischte-zahlen/
    unit: Seite
    level: 1
    evidence: Start mit Pizza („eine ganze Pizza und noch ein halbes Stück einer zweiten“). Die Definition nutzt „echten
      Bruch“, die Notiz „Ein unechter Bruch hat mindestens den Wert 1“ – beide Begriffe werden nirgends erklärt.
  - item: explainer-representation-explained
    page: /anteile/gemischte-zahlen/
    unit: Komponente „Ausprobieren“ (Bruchstreifen)
    level: 2
    evidence: „Ein Streifen steht für ein Ganzes … Wählst du mehr Teile aus, als in einen Streifen passen, geht es im
      nächsten weiter.“ Volle Streifen = Ganze, Rest = Restbruch.
    did: Zähler 0 und 12, Nenner 1 und 12.
  - item: explainer-control-purpose
    page: /anteile/gemischte-zahlen/
    unit: Komponente „Ausprobieren“
    level: 2
    evidence: "Zählerregler füllt Streifen für Streifen; Start 5/4 zeigt schon einen vollen Streifen, wie der Text es
      erklärt; Beschriftung „Ausgewählt: 12/4“ stimmt mit drei vollen Streifen."
    did: Regler an beide Enden.
  - item: explainer-text-figure-agree
    page: /anteile/gemischte-zahlen/
    unit: Komponente „Ausprobieren“
    level: 2
    evidence: Text, Startbild (5/4) und nojs („1 Ganzes und …“) stimmen überein.
  - item: explainer-representation-explained
    page: /anteile/gemischte-zahlen/
    unit: Übung „Markiere {z}/{n}“ (Bruchstreifen, gemischt)
    level: 0
    evidence:
      Die Streifen der Übung sind 6 px hohe Leisten, die beiden Ganzen liegen ohne Abstand übereinander (Teile 120×6
      px). Man sieht weder zwei getrennte Ganze noch einzelne Teile; der Text verspricht „Ein Streifen steht für ein
      Ganzes“.
    did: Seeds 1–3 (5/3, 7/4, 9/5) mit 0, richtig, eins zu wenig; Bild mit 3-facher Auflösung angesehen.
  - item: explainer-control-purpose
    page: /anteile/gemischte-zahlen/
    unit: Übung „Markiere {z}/{n}“
    level: 1
    evidence: Jeder Klick färbt ein Teil, aber auf 6 px hohen Flächen muss man raten, welches Teil man trifft und ob es
      markiert ist.
    did: Teile angeklickt.
  - item: explainer-text-figure-agree
    page: /anteile/gemischte-zahlen/
    unit: Übung „Markiere {z}/{n}“
    level: 1
    evidence: "Text: „Ein Streifen steht für ein Ganzes. Alle Streifen sind gleich groß“ – die Übung zeigt zwei
      aneinandergeklebte dünne Leisten, nicht die Streifen aus „Ausprobieren“."
  - item: explainer-figure-hides-answer
    page: /anteile/gemischte-zahlen/
    unit: Übung „Markiere {z}/{n}“
    level: 2
    evidence: Keine Anzeige vor „Prüfen“; der Zähler erscheint erst danach.
  - item: explainer-one-step
    page: /anteile/gemischte-zahlen/
    unit: Seite
    level: 1
    evidence:
      "Ein Schritt (mehr als ein Ganzes), aber der Beispielkasten hat zwei Richtungen: „7/3 sind zwei Ganze und ein
      Drittel … Umgekehrt ergeben 2 · 3 + 1 insgesamt sieben Drittel.“"
  - item: explainer-steps-explain
    page: /anteile/gemischte-zahlen/
    unit: Beispiel „Schritt für Schritt“
    level: 1
    evidence: „Umgekehrt ergeben 2 · 3 + 1 insgesamt sieben Drittel.“ – warum 2 · 3, steht nicht da.
  - item: explainer-steps-explain
    page: /anteile/gemischte-zahlen/
    unit: Übung „aufgaben“ (unechter Bruch)
    level: 2
    evidence: "„Ein Ganzes enthält 7 Teilstücke. Zwei Ganze enthalten zweimal 7 Teilstücke. Dazu kommt ein weiteres
      Teilstück: 2 ⋅ 7 + 1 = 15. Der Nenner bleibt 7.“"
    did: Seeds 1–3 mit 3, 8, leer und richtig.
  - item: explainer-honest-headings
    page: /anteile/gemischte-zahlen/
    unit: Seite
    level: 2
    evidence: Titel passen; „Ausprobieren“ hat Regler.
  - item: explainer-age-appropriate
    page: /anteile/gemischte-zahlen/
    unit: Seite
    level: 2
    evidence: Pizza, kurze Sätze.
  - item: explainer-learner-start
    page: /teilbarkeit/regeln/
    unit: Seite
    level: 1
    evidence:
      Start mit Bauklötzen („drei Reihen mit je vier Klötzen“), Faktor wird definiert. Die Komponente meldet aber
      „Alle sind Primzahlen“, bevor „Primzahl“ darunter definiert wird.
  - item: explainer-representation-explained
    page: /teilbarkeit/regeln/
    unit: Komponente „Ausprobieren“ (Zerlegungsbaum)
    level: 1
    evidence: "Zahl, Faktoren, Malaufgaben-Knöpfe und Stern („Ein Stern bedeutet: Diese Zahl lässt sich nicht weiter …
      zerlegen“) sind erklärt. Was der blau gefüllte Faktor bedeutet (gewählter Faktor), muss man raten."
    did: 12 → 3 · 4, 4 → 2 · 2; Zahl auf 2 und 48; „Noch einmal zerlegen“.
  - item: explainer-control-purpose
    page: /teilbarkeit/regeln/
    unit: Komponente „Ausprobieren“
    level: 2
    evidence:
      Regler ändert die Zahl, Faktor-Knöpfe zeigen passende Zerlegungen, „Noch einmal zerlegen“ setzt zurück; Ende
      mit Sternen und Satz „Jetzt lässt sich keiner der Faktoren weiter zerlegen.“
    did: Alle Knöpfe benutzt.
  - item: explainer-text-figure-agree
    page: /teilbarkeit/regeln/
    unit: Komponente „Ausprobieren“
    level: 2
    evidence: Text und Beispiel nennen 12 = 3 · 4 = 3 · 2 · 2; so verläuft die Komponente.
  - item: explainer-one-step
    page: /teilbarkeit/regeln/
    unit: Seite
    level: 0
    evidence:
      "Zwei Kompetenzen auf einer Seite: Teilbarkeitsregeln (Tabelle „Teilbar durch 2, 5, 10, 4, 25, 100, 3, 9“) und
      Primfaktorzerlegung mit eigener Übung."
  - item: explainer-steps-explain
    page: /teilbarkeit/regeln/
    unit: Beispiel „24 Schritt für Schritt zerlegen“
    level: 2
    evidence: „Die Faktoren 4 und 6 lassen sich beide weiter zerlegen. … Jetzt bleiben nur Primzahlen übrig“
  - item: explainer-steps-explain
    page: /teilbarkeit/regeln/
    unit: Übung „aufgaben“ (verteilen)
    level: 2
    evidence: "„Die 30 Gegenstände werden auf drei gleich große Gruppen verteilt. 30 : 3 = 10.“"
    did: Seeds 1–3 mit 1, 2, leer, richtig.
  - item: explainer-steps-explain
    page: /teilbarkeit/regeln/
    unit: Übung „primfaktoren“
    level: 2
    evidence: „Teile 14 durch den schon gefundenen Primfaktor 2. Das ergibt 7. 7 ist eine Primzahl.“
    did: Seeds 1–3.
  - item: explainer-honest-headings
    page: /teilbarkeit/regeln/
    unit: Seite
    level: 2
    evidence: „Ausprobieren“ hat Regler und Knöpfe; „Wo das Zerlegen endet“, „Abkürzungen beim Suchen“ passen.
  - item: explainer-age-appropriate
    page: /teilbarkeit/regeln/
    unit: Seite
    level: 2
    evidence: Bauklötze, klare Sätze.
  - item: explainer-learner-start
    page: /teilbarkeit/teiler-vielfache/
    unit: Seite
    level: 1
    evidence:
      Start „Zwölf und achtzehn Plättchen sollen in gleich große Päckchen.“ Dann „Die größte ist der ggT“ und „Die
      kleinste passende Zahl ist das kgV“ – die Abkürzungen werden nie ausgeschrieben.
  - item: explainer-representation-explained
    page: /teilbarkeit/teiler-vielfache/
    unit: Komponente Gruppen (12 und 18 Plättchen)
    level: 2
    evidence: "Ganzes (12/18 Plättchen), gestrichelte Umrandung = Gruppe, Rest außerhalb, Regler „Plättchen pro Gruppe“,
      Ziel „ohne Rest“; Satz unter jeder Reihe („Rest: 2“)."
    did: Gruppengröße 1, 5, 12.
  - item: explainer-control-purpose
    page: /teilbarkeit/teiler-vielfache/
    unit: Komponente Gruppen
    level: 2
    evidence:
      "Der Regler ändert die Gruppen sichtbar; Start 5 zeigt Rest. Texte stimmen („1 vollständige Gruppen mit je 12
      Plättchen; Rest: 6“)."
    did: Regler an beide Enden.
  - item: explainer-text-figure-agree
    page: /teilbarkeit/teiler-vielfache/
    unit: Komponente Gruppen
    level: 2
    evidence: Text 12 und 18, Bild 12 und 18; Beispiel ggT = 6.
  - item: explainer-representation-explained
    page: /teilbarkeit/teiler-vielfache/
    unit: Komponente Raster (4 und 6 Teile)
    level: 2
    evidence: „Jeder ist ein Ganzes … Durchgezogene Linien zeigen die alten Teilgrenzen, gestrichelte Linien die neue
      Unterteilung“; Satz zeigt, ob das Raster passt.
    did: Raster 1, 5, 24.
  - item: explainer-control-purpose
    page: /teilbarkeit/teiler-vielfache/
    unit: Komponente Raster
    level: 2
    evidence:
      Regler ändert das Raster sichtbar, Start 5 passt nicht; Sätze stimmen („Das Raster mit 24 Teilen trifft alle
      Grenzen“).
    did: Regler an beide Enden.
  - item: explainer-text-figure-agree
    page: /teilbarkeit/teiler-vielfache/
    unit: Komponente Raster
    level: 2
    evidence: Text 4 und 6, Bild 4 und 6, Beispiel kgV(4,6) = 12.
  - item: explainer-one-step
    page: /teilbarkeit/teiler-vielfache/
    unit: Seite
