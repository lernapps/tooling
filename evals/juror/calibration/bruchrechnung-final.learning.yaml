    page: /teilbarkeit/
    unit: Kapitelseite
    level: 2
    evidence:
      „Du legst Bauklötze in gleich große Reihen und beschreibst das als Malaufgabe.“ und „Das hilft dir später beim
      Umformen von Brüchen.“
  - item: explainer-age-appropriate
    page: /teilbarkeit/
    unit: Kapitelseite
    level: 2
    evidence: Kurze Zusammenfassung in einfachen Sätzen; Beispiele aus dem Alltag der Klasse 6.
