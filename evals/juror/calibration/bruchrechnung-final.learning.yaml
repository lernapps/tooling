    level: 1
    evidence:
      "„Du lernst vier Arten, mit Brüchen zu rechnen: Anteile zusammenlegen, etwas wegnehmen, einen Teil von einem
      Teil nehmen …“ – keine Situation, nur eine Aufzählung."
  - item: explainer-age-appropriate
    page: /rechnen/
    unit: Kapitelseite
    level: 2
    evidence: Kurze Zusammenfassung in einfachen Sätzen; Beispiele aus dem Alltag der Klasse 6.
