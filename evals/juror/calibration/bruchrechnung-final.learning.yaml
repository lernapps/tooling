units:
  - item: explainer-learner-start
    page: /
    unit: Startseite
    level: 1
    evidence:
      Startet mit „Entdecke Brüche mit Kreis, Streifen, Mengen und Zahlenstrahl.“ – keine Alltagssituation; der Satz
      „orientiert an den hessischen Gymnasialvorgaben“ richtet sich an Lehrkräfte. Die Kapitel-Zusammenfassungen
      darunter beginnen dann mit Pizza, Bauklötzen, Kuchen.
  - item: explainer-age-appropriate
    page: /
    unit: Startseite
    level: 2
    evidence: Kurze Sätze; die Kapiteltexte nennen Pizza, Bauklötze, Kuchen, Liter – passend für Klasse 6.
  - item: explainer-learner-start
    page: /anteile/
    unit: Kapitelseite
    level: 2
    evidence: „Eine Pizza wird in vier gleich große Stücke geteilt. Eines davon ist ein Viertel.“ – Alltag, dann die Seiten.
  - item: explainer-age-appropriate
    page: /anteile/
    unit: Kapitelseite
    level: 2
    evidence: Kurze Zusammenfassung in einfachen Sätzen; Beispiele aus dem Alltag der Klasse 6.
