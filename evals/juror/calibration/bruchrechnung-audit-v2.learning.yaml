notes: "No competencies were given in juror-input.yaml; I took what a grade-6 learner of a German Gymnasium usually
  knows (natural numbers, the four operations, Teiler, everyday life) and read the map only for the subject
  (mathematik). Chapter overview pages (/anteile/, /rechnen/ …) hold only summaries and links and were not given units;
  glossary, tutor and self-assessment pages left out. Page order read as in app.yaml (anteile, teilbarkeit, umformen,
  grundaufgaben, rechnen, anwendungen). The 360 px width was checked for every page: no horizontal scroll, components
  stay usable. Fixed pattern seen on all 20 single-choice questions: the correct option is always listed first (same
  order after reload); judged 2 for figure-hides-answer because no figure, caption or text names it, but it is a pattern
  a learner can pick up. The wrong-answer text for generic tasks (e.g. „Rechne den Schritt aus dem Beispiel mit deinen
  Zahlen nach“) was not judged here (other item). Strict reading for explainer-representation-explained level 2:
  requires that a common misreading is named; only the Kuchen figure and the Rechteck figure come near."
