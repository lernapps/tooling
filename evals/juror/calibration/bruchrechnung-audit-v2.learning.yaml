units:
  - item: explainer-page-goal
    page: /anteile/darstellen/
    unit: Seite
    level: 1
    evidence:
      "„Was ist überhaupt ein Bruch? … Stell dir vor, ihr teilt eine Pizza in vier gleich große Stücke.“ Links to
      everyday life; exercises (Nenner, Markieren) check that. Page never states the aim. Level 1: the opening situation
      links to something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /anteile/gemischte-zahlen/
    unit: Seite
    level: 1
    evidence: "„Eine Pizza reicht nicht immer. Was, wenn du eine ganze Pizza und noch ein halbes Stück einer zweiten
      meinst?“ Links to the pizza of the page before; no goal sentence; exercises (7/3, 2 + 1/6) check it. Level 1: the
      opening situation links to something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /anteile/zahlenstrahl/
    unit: Seite
    level: 1
    evidence:
      "„Eine Zahl kann auch einen Platz auf einer Strecke haben. Wir betrachten zunächst nur die Strecke von 0 bis
      1.“ Builds on the number line, says no goal; exercises (Platziere 7/10, 8/8) check it. Level 1: the opening
      situation links to something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /teilbarkeit/regeln/
    unit: Seite
    level: 1
    evidence:
      "„Stell dir zwölf Bauklötze vor. Du kannst daraus drei Reihen mit je vier Klötzen legen“. Everyday link, no
      goal sentence. Exercises check primes and prime factors, but the divisibility-rule table is never checked and the
      18 : 3 task checks division. Level 1: the opening situation links to something known and the exercises check the
      topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /teilbarkeit/teiler-vielfache/
    unit: Seite
    level: 1
    evidence:
      "„Zwölf und achtzehn Plättchen sollen in gleich große Päckchen. Welche Päckchengröße funktioniert für beide
      Mengen?“ A question, not a goal; exercises (kgV, ggT) check the content. Level 1: the opening situation links to
      something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /umformen/erweitern/
    unit: Seite
    level: 1
    evidence:
      "„Ein Kuchen ist in drei gleich große Stücke geteilt. Zwei davon sind für dich: zwei Drittel. Nun teilst du
      jedes … noch einmal“. Builds on the fraction picture; no goal sentence; exercises check Erweitern. Level 1: the
      opening situation links to something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /umformen/kuerzen/
    unit: Seite
    level: 1
    evidence:
      "„Mehrere kleine Stücke können zusammen ein größeres Stück bilden. So kannst du denselben Anteil mit weniger
      Teilen beschreiben.“ Links to the page before (Erweitern in reverse) only implicitly; no goal sentence; exercises
      check Kürzen. Level 1: the opening situation links to something known and the exercises check the topic, but the
      aim is not stated."
  - item: explainer-page-goal
    page: /umformen/vergleichen/
    unit: Seite
    level: 1
    evidence:
      "„Zwei Kinder bekommen unterschiedlich große Bruchteile einer gleich großen Tafel. Wie kannst du herausfinden,
      wer mehr bekommt?“ A situation and a question, no goal; exercises check comparing. Level 1: the opening situation
      links to something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /grundaufgaben/anteil/
    unit: Seite
    level: 1
    evidence: "„Sechs von acht Plättchen sind markiert. Die Frage ist nun, welcher Bruch diese Auswahl beschreibt.“ A
      situation, no sentence on what learners can do afterwards; exercises check it. Level 1: the opening situation
      links to something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /grundaufgaben/bruchteil/
    unit: Seite
    level: 1
    evidence:
      "„Du hast 12 Plättchen vor dir und möchtest drei Viertel davon nehmen … Gesucht ist, wie viele Plättchen du so
      erhältst.“ States the task of the page, not the learning aim; exercises check it. Level 1: the opening situation
      links to something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /grundaufgaben/ganzes/
    unit: Seite
    level: 1
    evidence: "„Du siehst nur einen Teil einer Menge und weißt, welcher Anteil das ist. Daraus kannst du die ganze Menge
      rekonstruieren.“ Closest to a goal sentence, but written as a situation; exercises check it. Level 1: the opening
      situation links to something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /rechnen/dividieren/
    unit: Seite
    level: 1
    evidence: "„Du füllst Saft aus einem Gefäß in kleinere gleich große Gläser. Wie oft passt der Inhalt eines kleinen
      Glases in die vorhandene Menge?“ Everyday question, no goal; exercises check it. Level 1: the opening situation
      links to something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /rechnen/gleichungen/
    unit: Seite
    level: 1
    evidence:
      "„Eine Rechenwaage soll auf beiden Seiten denselben Wert zeigen. Welche Zahl fehlt noch?“ Image and question,
      no goal; exercises check the missing number. Level 1: the opening situation links to something known and the
      exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /rechnen/multiplizieren/
    unit: Seite
    level: 1
    evidence: "„Von einem Teil wird noch einmal ein Teil ausgewählt: etwa die Hälfte eines Viertels.“ Builds on the
      Bruchteil pages; no goal sentence; exercises check it. Level 1: the opening situation links to something known and
      the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /rechnen/plus-minus/
    unit: Seite
    level: 1
    evidence: "„Du legst Bruchstücke zusammen oder nimmst welche weg. Damit du sie zählen kannst, müssen sie gleich groß
      sein.“ Builds on the pieces picture; no goal sentence; exercises check it. Level 1: the opening situation links to
      something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /rechnen/terme/
    unit: Seite
    level: 1
    evidence: "„In einer längeren Rechnung stehen mehrere Rechenschritte. Klammern und Rechenzeichen legen fest, welcher
      Schritt zuerst kommt.“ Names the topic, no goal and no link to the page before; exercises check the order of
      steps. Level 1: the opening situation links to something known and the exercises check the topic, but the aim is
      not stated."
  - item: explainer-page-goal
    page: /anwendungen/dezimaldarstellung/
    unit: Seite
    level: 1
    evidence:
      "„Auf einem Messbecher steht vielleicht 0,5 Liter statt ein halber Liter.“ Everyday link; no goal sentence;
      exercises check fraction to decimal. Level 1: the opening situation links to something known and the exercises
      check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /anwendungen/dezimalrechnen/
    unit: Seite
    level: 1
    evidence:
      "„Beim Rechnen mit Geld legst du Euro zu Euro und Cent zu Cent.“ Everyday link; no goal sentence; exercises
      check one decimal calculation. Level 1: the opening situation links to something known and the exercises check the
      topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /anwendungen/runden/
    unit: Seite
    level: 1
    evidence:
      "„Eine Messung ist oft genauer angegeben, als du sie brauchst. Beim Runden wählst du einen nahe gelegenen Wert
      mit weniger Stellen.“ Situation and topic, no goal; exercises check rounding. Level 1: the opening situation links
      to something known and the exercises check the topic, but the aim is not stated."
  - item: explainer-page-goal
    page: /anwendungen/sachaufgaben/
    unit: Seite
    level: 1
    evidence:
      "„Eine Geschichte beschreibt Mengen und Anteile. Bevor du rechnest, klärst du, was du schon weißt und was du
      herausfinden möchtest.“ Describes a method, not what learners can do afterwards; exercises check word problems.
      Level 1: the opening situation links to something known and the exercises check the topic, but the aim is not
      stated."
  - item: explainer-learner-start
    page: /anteile/darstellen/
    unit: Seite
    level: 1
    evidence: Pizza in vier Stücke is a good start, then „Bruch“ is defined. But „Mit einem Bruchteil schon eher!“ uses
      „Bruchteil“ before it is explained, and the note adds „Der Bruchstrich bedeutet auch geteilt durch“ without a
      link.
  - item: explainer-learner-start
    page: /anteile/gemischte-zahlen/
    unit: Seite
    level: 1
    evidence: "Pizza start is fine. „Eine gemischte Zahl besteht aus einer ganzen Zahl und einem echten Bruch“: „echter
      Bruch“ is never explained; „unechter Bruch“ is first used in the note after the figure."
  - item: explainer-learner-start
    page: /anteile/zahlenstrahl/
    unit: Seite
    level: 1
    evidence:
      Starts from „Platz auf einer Strecke“ but does not link fractions to the known number line (natural numbers);
      „Teilstrich“ is used in the task without being explained.
  - item: explainer-learner-start
    page: /teilbarkeit/regeln/
    unit: Seite
    level: 2
    evidence: "Bauklötze (3 Reihen à 4 or 2 à 6) link to Malaufgaben; Faktor, Produkt, Primzahl, Primfaktorzerlegung and
      Quersumme are each explained where first needed. Slight: „zusammengesetzte Faktoren“ comes without definition but
      is clear from the next clause."
  - item: explainer-learner-start
    page: /teilbarkeit/teiler-vielfache/
    unit: Seite
    level: 1
    evidence: Plättchen in Päckchen is a good start, Teiler/Vielfaches are defined. ggT and kgV appear only in the note
      after the table and „Hauptnenner“ comes unexplained in the same sentence.
  - item: explainer-learner-start
    page: /umformen/erweitern/
    unit: Seite
    level: 2
    evidence: Starts from 2/3 of a cake and halving each piece, then „Erweitern“ is defined right after with the same picture.
  - item: explainer-learner-start
    page: /umformen/kuerzen/
    unit: Seite
    level: 1
    evidence:
      First sentence „Mehrere kleine Stücke können zusammen ein größeres Stück bilden“ has no concrete situation;
      „gemeinsamen Teiler“ in the definition is not linked to the divisor pages.
  - item: explainer-learner-start
    page: /umformen/vergleichen/
    unit: Seite
    level: 1
    evidence: Two children and a bar of chocolate is a good situation; the definition then uses „Bezugs-Ganze“ without
      explanation.
  - item: explainer-learner-start
    page: /grundaufgaben/anteil/
    unit: Seite
    level: 1
    evidence:
      Concrete start (6 of 8 Plättchen), but the definition „Verhältnis von Bruchteil zu Ganzem“ uses two terms the
      learner has not seen and „Anteil“ vs. „Bruchteil“ is not distinguished by example.
  - item: explainer-learner-start
    page: /grundaufgaben/bruchteil/
    unit: Seite
    level: 2
    evidence:
      "12 Plättchen, drei Viertel: first „teile … in vier gleich große Gruppen und nimm dann drei“, then „Bruchteil“
      is defined with „neun von zwölf Plättchen“."
  - item: explainer-learner-start
    page: /grundaufgaben/ganzes/
    unit: Seite
    level: 1
    evidence:
      Start „Du siehst nur einen Teil einer Menge“ is concrete, but the definition „Das Ganze ist die Bezugsgröße“
      introduces „Bezugsgröße“ unexplained.
  - item: explainer-learner-start
    page: /rechnen/dividieren/
    unit: Seite
    level: 2
    evidence:
      "Saft in Gläser: „Wie oft passt der Inhalt eines kleinen Glases in die vorhandene Menge?“ then Kehrbruch is
      defined where first needed."
  - item: explainer-learner-start
    page: /rechnen/gleichungen/
    unit: Seite
    level: 1
    evidence: Rechenwaage is a good image; „Umkehroperation“ appears in the note without explanation.
  - item: explainer-learner-start
    page: /rechnen/multiplizieren/
    unit: Seite
    level: 2
    evidence: „die Hälfte eines Viertels“ builds on known fractions; „Anteil eines Anteils“ is defined right after.
  - item: explainer-learner-start
    page: /rechnen/plus-minus/
    unit: Seite
    level: 1
    evidence: Pieces start is fine; „Gleichnamige Brüche“ is defined, but the exploration needs „gemeinsamen Nenner“ /
      „Unterteilung“ for unlike denominators, which is first used in the note.
  - item: explainer-learner-start
    page: /rechnen/terme/
    unit: Seite
    level: 1
    evidence:
      Starts from the topic („Klammern und Rechenzeichen legen fest …“) without a situation; Vorrangregel is defined
      by listing the rule the learner already knows from grade 5, but no link is made to it.
  - item: explainer-learner-start
    page: /anwendungen/dezimaldarstellung/
    unit: Seite
    level: 1
    evidence: Messbecher 0,5 Liter is a good start; „periodisch“ and „Primfaktoren 2 und 5“ appear in the note without
      explanation.
  - item: explainer-learner-start
    page: /anwendungen/dezimalrechnen/
    unit: Seite
    level: 1
    evidence: Euro/Cent analogy for Stellenwert is good; the note uses „Divisor ganzzahlig“ and „Nachkommastellen“ unexplained.
  - item: explainer-learner-start
    page: /anwendungen/runden/
    unit: Seite
    level: 1
    evidence:
      Measurement start is good; „Rundungsstelle“ and „Näherungszeichen“ are used in the note without being shown
      (no ≈ appears).
  - item: explainer-learner-start
    page: /anwendungen/sachaufgaben/
    unit: Seite
    level: 1
    evidence:
      Generic start („Eine Geschichte beschreibt Mengen und Anteile“) without a concrete story; „Bezugsgröße“ and
      „Ganzes, Bruchteil oder Anteil“ are used as known.
  - item: explainer-one-step
    page: /anteile/darstellen/
    unit: Seite
    level: 1
    evidence:
      Main idea (Zähler/Nenner) is checked by all exercises. The note adds „Der Bruchstrich bedeutet auch geteilt
      durch“ (not checked, another idea) and the nojs text mentions the Zahlenstrahl of the next page.
  - item: explainer-one-step
    page: /anteile/gemischte-zahlen/
    unit: Seite
    level: 1
    evidence:
      "Two directions (7/3 → 2 + 1/3 and 2·3 + 1 → 7/3) in one example box: „7/3 sind zwei Ganze und ein Drittel: 2
      + 1/3. Umgekehrt ergeben 2 · 3 + 1 insgesamt sieben Drittel.“"
  - item: explainer-one-step
    page: /anteile/zahlenstrahl/
    unit: Seite
    level: 2
    evidence:
      One idea (position of a fraction between 0 and 1); „zunächst nur die Strecke von 0 bis 1“ keeps later content
      out; all exercises check it; one example.
  - item: explainer-one-step
    page: /teilbarkeit/regeln/
    unit: Seite
    level: 0
    evidence:
      "Two competencies on one page: Faktoren/Primfaktorzerlegung and the eight divisibility rules (2, 5, 10, 4, 25,
      100, 3, 9). The rules table is never checked by an exercise."
  - item: explainer-one-step
    page: /teilbarkeit/teiler-vielfache/
    unit: Seite
    level: 0
    evidence:
      "Teiler/ggT and Vielfache/kgV are two ideas in one example box; the note jumps to later pages: „Bei Brüchen
      hilft der ggT beim Kürzen und das kgV beim Hauptnenner.“"
  - item: explainer-one-step
    page: /umformen/erweitern/
    unit: Seite
    level: 2
    evidence: One idea (Erweitern, same value); one example; exercises (sc, Erweitere … mit …) check it.
  - item: explainer-one-step
    page: /umformen/kuerzen/
    unit: Seite
    level: 2
    evidence:
      One idea (Kürzen); one example. The warning „Aus Summen darfst du keine einzelnen Summanden kürzen“ is a side
      remark.
  - item: explainer-one-step
    page: /umformen/vergleichen/
    unit: Seite
    level: 1
    evidence: "Note gives three ways: „Bei gleichem Nenner entscheidet der Zähler. Bei gleichem positiven Zähler … Sonst
      kannst du auf einen gemeinsamen Nenner erweitern.“ Only the last is derived in the example."
  - item: explainer-one-step
    page: /grundaufgaben/anteil/
    unit: Seite
    level: 1
    evidence: Example box holds two examples (6 von 8 and „50 cm von 2 m“ with unit conversion); the note adds „relative
      Häufigkeit“.
  - item: explainer-one-step
    page: /grundaufgaben/bruchteil/
    unit: Seite
    level: 2
    evidence: One idea (teilen, dann malnehmen), one worked example, all exercises check it.
  - item: explainer-one-step
    page: /grundaufgaben/ganzes/
    unit: Seite
    level: 1
    evidence:
      "Note gives „Ganzes = Bruchteil : Anteil“ (a division by a fraction, which is the next chapter) and a second
      way „zuerst durch den Zähler teilen und dann mit dem Nenner multiplizieren“ without derivation."
  - item: explainer-one-step
    page: /rechnen/dividieren/
    unit: Seite
    level: 1
    evidence: "Two ways in one box: „Wie oft passt …“ (3/4 sind 6/8) and the Kehrbruch rule: „3/4 : 1/8 = 3/4 · 8/1 = 6“."
  - item: explainer-one-step
    page: /rechnen/gleichungen/
    unit: Seite
    level: 1
    evidence: "Note covers two kinds: „Ein fehlender Summand entsteht durch Subtraktion, ein fehlender Faktor durch
      Division.“ Exercises check only the missing summand."
  - item: explainer-one-step
    page: /rechnen/multiplizieren/
    unit: Seite
    level: 1
    evidence: Note adds „gemeinsame Faktoren … vorher kürzen“ and „wird eine positive Zahl kleiner“ without derivation;
      exercises check only Zähler·Zähler / Nenner·Nenner.
  - item: explainer-one-step
    page: /rechnen/plus-minus/
    unit: Seite
    level: 1
    evidence:
      "Same denominator (exercise) and unlike denominators (exploration, sc) plus subtraction: two ideas; example
      box has two examples (1/2 + 1/3 and 3/4 − 1/2)."
  - item: explainer-one-step
    page: /rechnen/terme/
    unit: Seite
    level: 1
    evidence:
      "Vorrang of operations (checked) plus „Distributivgesetz“ and Kommutativ-/Assoziativgesetz in the note, which
      no exercise checks. The sentence „Diese Regeln gelten nicht entsprechend für Subtraktion und Division“ is
      misleading: a · (b − c) = a·b − a·c does hold."
  - item: explainer-one-step
    page: /anwendungen/dezimaldarstellung/
    unit: Seite
    level: 0
    evidence:
      "Content of later pages/competencies: „25 % = 25/100 = 1/4“ (Prozent), periodic decimals „0,333…“, and „Bei
      vollständig gekürzten Brüchen endet sie genau dann, wenn der Nenner nur Primfaktoren 2 und 5 enthält.“"
  - item: explainer-one-step
    page: /anwendungen/dezimalrechnen/
    unit: Seite
    level: 0
    evidence:
      "Three operations of two competencies in one page: addition, multiplication and division of decimals („Beim
      Dividieren verschiebst du das Komma in beiden Zahlen …“); example box has three calculations; only one is
      practised."
  - item: explainer-one-step
    page: /anwendungen/runden/
    unit: Seite
    level: 1
    evidence: One idea, but the example box holds two examples (0,746 and 0,744) and the note adds „Näherungszeichen“.
  - item: explainer-one-step
    page: /anwendungen/sachaufgaben/
    unit: Seite
    level: 1
    evidence:
      "Example box has two unrelated examples (3/4 : 2 = 3/8 Liter and „5-mal eine Sechs … relative Häufigkeit … 25
      %“); the sc needs 3/4 : 2, the generated task 3/4 von 12 km."
  - item: explainer-exercise-progression
    page: /anteile/darstellen/
    unit: Übungen der Seite
    level: 1
    evidence: sc „Was beschreibt der Nenner bei 3/4?“ (recognise, same as the example), Markiere z/n and Nenner for 1/…
      (apply with new values). No new context or word problem.
  - item: explainer-exercise-progression
    page: /anteile/gemischte-zahlen/
    unit: Übungen der Seite
    level: 2
    evidence: sc „Wie viele Ganze stecken in 7/3?“ (recognise), Markiere 16/10 (apply), „Schreibe 2 + 1/6 als unechten
      Bruch“ (reverse question).
  - item: explainer-exercise-progression
    page: /anteile/zahlenstrahl/
    unit: Übungen der Seite
    level: 1
    evidence:
      sc „Wo liegt 3/4?“ (recognise), Platziere 7/10 (apply); „8 Abstände … für 8/8“ is the same step again. No new
      context.
  - item: explainer-exercise-progression
    page: /teilbarkeit/regeln/
    unit: Übungen der Seite
    level: 1
    evidence: "sc „Welche Zahl ist eine Primzahl?“ and „Welcher Primfaktor fehlt?“ (apply), but 18 : 3 and the
      divisibility-rule table are not part of the same ladder."
  - item: explainer-exercise-progression
    page: /teilbarkeit/teiler-vielfache/
    unit: Übungen der Seite
    level: 1
    evidence: sc kgV von 4 und 6 (same as the example), ggT von 4 und 8 (apply). No new context.
  - item: explainer-exercise-progression
    page: /umformen/erweitern/
    unit: Übungen der Seite
    level: 1
    evidence: sc „Was bleibt beim Erweitern gleich?“, Erweitere 3/5 mit 2 and „Erweitere 1/8 mit 3. Welcher Nenner
      entsteht?“ — recognise and apply, no new context.
  - item: explainer-exercise-progression
    page: /umformen/kuerzen/
    unit: Übungen der Seite
    level: 1
    evidence: "sc „Welcher Bruch ist vollständig gekürzt?“, Kürze 8/10, Kürze 6/30 mit 6: recognise and apply only."
  - item: explainer-exercise-progression
    page: /umformen/vergleichen/
    unit: Übungen der Seite
    level: 1
    evidence:
      "sc „Welcher Vergleich stimmt?“, Vergleiche 4/5 und 2/3, „Gib den Zähler des größeren Bruchs an“: recognise
      and apply only."
  - item: explainer-exercise-progression
    page: /grundaufgaben/anteil/
    unit: Übungen der Seite
    level: 1
    evidence: "sc „Welcher Anteil sind 6 von 8?“ (same as the example), „Welcher Anteil sind 4 von 16 Gegenständen?“ and
      „Von 40 Plättchen sind 30 markiert. Ergänze … 3/…“: apply with other values only."
  - item: explainer-exercise-progression
    page: /grundaufgaben/bruchteil/
    unit: Übungen der Seite
    level: 2
    evidence: sc „Welche Rechnung ergibt 3/4 von 12?“ (recognise), „Wie viele Gegenstände sind 1/4 von 12?“ (apply), „In
      einer Schachtel liegen 40 Plättchen. Du nimmst drei Viertel davon.“ (word problem).
  - item: explainer-exercise-progression
    page: /grundaufgaben/ganzes/
    unit: Übungen der Seite
    level: 1
    evidence:
