schema_version = "1.4"
# The workspace the agent leaves, without installed dependencies; the separate verifier scores it from this copy.
artifacts = [{ source = "/app", destination = "app", exclude = ["node_modules", ".cache"] }]

[task]
name = "lernapps/explainer-fresh"

[metadata]
archetype = "explainer"
start = "fresh"
entry_point = "E1"
# The dimensions of reward.json and transcript-score.json and their expectations: evals/expectations.json.
expectations = ["A1", "A2", "A3", "A4", "A6", "A7", "A9", "A11", "A12", "A13", "A19", "A21", "A22", "A23"]
# Skills the guidance loads only on a condition this task does not set (scored with A2: neither expected nor
# missing). Content growth is for an increment. The commit and listing skills come after the publish
# checkpoint, where the scenario ends.
# The question skill is for questions with options.
# The learner the juror plays (evals/harbor/judge.sh, evals/juror/prompt.md): grade, subject and the competencies of
# the learning map the persona asks for. The guidance was never tuned on this task: a control for the juror's tasks.
juror_grade = "8"
juror_subject = "physik"
juror_competencies = [
  "stromstaerke",
  "spannung",
  "stromstaerke-messen",
  "spannung-messen",
  "reihenschaltung-groessen",
  "parallelschaltung-groessen",
]
skills_conditional = ["lernapps-content-growth", "lernapps-content-questions", "lernapps-commit", "lernapps-listing"]

[agent]
timeout_sec = 7200

[verifier]
environment_mode = "separate"
timeout_sec = 2700

[verifier.env]
EXPECTED_ARCHETYPE = "explainer"

[environment]
workdir = "/app"
build_timeout_sec = 1800
