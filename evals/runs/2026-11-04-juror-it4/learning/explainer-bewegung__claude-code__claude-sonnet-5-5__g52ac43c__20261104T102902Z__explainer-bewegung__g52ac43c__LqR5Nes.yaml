  - item: explainer-steps-explain
    page: /bewegungen-im-diagramm/weg-zeit-diagramm/
    unit: Beispiel Scooter
    level: 2
    evidence:
      „Der Graph ist eine Gerade vom Start aus, der Scooter fährt also gleichmäßig. Dann … v = 18 m/6 s = 3 m/s. Das
      ist die Steigung.“
