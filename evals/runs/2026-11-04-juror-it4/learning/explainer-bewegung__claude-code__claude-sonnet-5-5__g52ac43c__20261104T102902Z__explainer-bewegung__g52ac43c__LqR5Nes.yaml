    page: /bewegungen-im-diagramm/geschwindigkeit-berechnen-wiederholt/
    unit: Seite
    level: 1
    evidence:
      "Drei Umstellungen, Einheiten-Umrechnung (3,6) und im selben Kasten Geschwindigkeit, km/h und Weg: „Zwei Beispiele“
      in einem Block."
  - item: explainer-one-step
    page: /bewegungen-im-diagramm/weg-zeit-diagramm/
    unit: Seite
    level: 1
    evidence:
      "Neben Lesen/Steigung führt die Seite im Regler negative Geschwindigkeit ein („Ein Regler unter 0 m/s heißt: Der
      Wagen fährt zum Start zurück“, Regler bis −12) und „Graph geht nach unten“. Das ist ein zweiter Schritt (Richtung/Vorzeichen)
      und kollidiert mit der v-t-Seite („zeigt nur, wie schnell … nicht die Richtung“)."
  - item: explainer-one-step
    page: /bewegungen-im-diagramm/weg-zeit-kurven/
    unit: Seite
    level: 2
    evidence: "Ein Schritt: gekrümmter Graph = Geschwindigkeit ändert sich; ein Beispiel."
