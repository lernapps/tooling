    page: /geschwindigkeit-aendert-sich/richtung-aendert-sich/
    unit: Seite
    level: 2
    evidence: "Ein Schritt: Richtung als dritte Änderung; ein Beispiel (Bus). Es wird nichts aus späteren Seiten vorweggenommen."
