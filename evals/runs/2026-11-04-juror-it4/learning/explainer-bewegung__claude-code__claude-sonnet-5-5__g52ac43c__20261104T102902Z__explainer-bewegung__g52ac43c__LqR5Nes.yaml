    page: /bewegungen-im-diagramm/weg-zeit-kurven/
    unit: Beispiel „Ein Wagen fährt an“
    level: 2
    evidence: „Von 0 bis 2 s kommen nur 2 m dazu, von 6 bis 8 s sind es 14 m … Er hat beschleunigt.“
  - item: explainer-steps-explain
    page: /bewegungen-im-diagramm/geschwindigkeit-zeit-diagramm/
    unit: Beispiel Fahrrad
    level: 2
    evidence:
      "„Von 0 bis 4 s steigt die Linie: … beschleunigt. … Bei 2 s liest du 4 m/s ab, denn die Linie liegt dort halb
