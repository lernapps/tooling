    page: /bewegungen-im-diagramm/geschwindigkeit-zeit-diagramm/
    unit: Seite
    level: 2
    evidence: "Ein Schritt: v-t-Diagramm lesen; ein Beispiel."
  - item: explainer-one-step
    page: /bewegungen-im-diagramm/bewegung-darstellen/
    unit: Seite
    level: 1
    evidence:
      Zeichnen/Zuordnen, dazu ein eigener Abschnitt „Die Durchschnittsgeschwindigkeit“ mit Definition, Rechnung und
      Aufgabe (32 m / 8 s) – ein zweites Thema, das nichts mit dem Darstellen zu tun hat.
  - item: explainer-steps-explain
    page: /bewegungen-im-diagramm/weg-zeit-diagramm/
    unit: Generierte Aufgabe „Steigung ablesen“
    level: 2
    evidence:
      "Schritt 1: „Die Geschwindigkeit ist der Weg durch die Zeit: v = s/t.“ Schritt 2: „Mit den Werten der Aufgabe:
      v = 50 m / 5 s = 10 m/s.“ Quellen für andere Seeds (6, 7, 8): gleiche Vorlage mit eigenen Zahlen (24 m/4 s, 66 m/6 s);
      gegebene Werte ausgerechnet."
    did: Falsche Antwort 20 und 100 und leere Antwort eingegeben, „Lösung“ gezeigt, dreimal neue Aufgabe.
  - item: explainer-steps-explain
    page: /geschwindigkeit-aendert-sich/geschwindigkeit-wiederholt/
    unit: Beispiel Fahrrad
    level: 2
    evidence:
      "„30 m / 6 s = 5 m/s. Das heißt: In jeder Sekunde kommt das Fahrrad 5 Meter weiter“ – Zahlen ausgerechnet, Bedeutung
      genannt."
  - item: explainer-steps-explain
    page: /geschwindigkeit-aendert-sich/beschleunigen-abbremsen/
    unit: Beispiel Radfahrerin
    level: 2
    evidence: „1 m, 2 m, 3 m und 4 m … Also wird sie schneller“ – Schluss aus wachsenden Abständen begründet.
  - item: explainer-steps-explain
    page: /geschwindigkeit-aendert-sich/richtung-aendert-sich/
    unit: Beispiel Bus
    level: 2
    evidence: Drei Situationen, jede mit dem Grund (schneller/langsamer/Richtung), abschließender Regel.
  - item: explainer-steps-explain
    page: /bewegungen-im-diagramm/geschwindigkeit-berechnen-wiederholt/
    unit: Beispiel Scooter
    level: 2
    evidence:
      24 m / 8 s = 3 m/s, 3·3,6 = 10,8 km/h, 3 m/s·5 s = 15 m – Zahlen ausgerechnet; der Grund für ·3,6 steht im Text
