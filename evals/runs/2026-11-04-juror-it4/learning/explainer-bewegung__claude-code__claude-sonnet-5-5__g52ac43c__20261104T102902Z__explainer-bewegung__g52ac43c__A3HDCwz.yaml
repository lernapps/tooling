      Text erklärt Stützpunkte 0, 4, 8, 12 s, Geraden dazwischen, Startzustand 6 m/s; Messmarke zeigt Weg und v; Fläche
      ist als Weg beschriftet.
    did: "Regler auf 0/12 gestellt, Messmarke 0/12 s: Weg 0 bzw. 144 m, v = 12 m/s; 360 px breit bedienbar."
