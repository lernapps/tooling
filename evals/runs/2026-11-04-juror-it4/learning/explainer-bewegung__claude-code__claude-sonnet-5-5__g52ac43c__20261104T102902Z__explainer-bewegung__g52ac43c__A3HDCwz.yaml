units:
  - item: explainer-learner-start
    page: /beschleunigte-bewegung/wiederholung-geschwindigkeit/
    unit: Seite
    level: 2
    evidence:
      Beginnt mit „Wenn ein Fahrrad schnell fährt, kommt es in kurzer Zeit weit.“ (Alltag), Tacho und Navi; v, s, t
      werden bei der Formel erklärt.
  - item: explainer-learner-start
    page: /beschleunigte-bewegung/beschleunigen-bremsen/
    unit: Seite
    level: 2
    evidence:
      "Beginnt mit dem Bus: „Ein Bus fährt an der Haltestelle ab, wird schneller…“, knüpft an den Tacho an; „Tempo“
      und „Richtung“ werden sofort erklärt. Kleiner Bruch: Geschwindigkeit war eben „wie schnell du bist“, dann gehört Richtung
      dazu."
  - item: explainer-learner-start
    page: /beschleunigte-bewegung/weg-zeit-diagramm/
    unit: Seite
    level: 2
    evidence:
      "Beginnt mit „Du kennst v = s/t aus Klasse 7: Wer in 4 s genau 20 m weit kommt, fährt mit 5 m/s.“ und der Frage
      nach der ganzen Fahrt; „Steigung“ wird im Beispiel erklärt, wo sie gebraucht wird."
  - item: explainer-learner-start
    page: /beschleunigte-bewegung/geschwindigkeit-zeit-diagramm/
    unit: Seite
    level: 2
    evidence:
      "Beginnt mit dem Tacho: „Schreibst du den Tachowert über die Zeit auf, bekommst du eine Linie.“ Knüpft an das
      Weg-Zeit-Diagramm an."
  - item: explainer-learner-start
    page: /beschleunigte-bewegung/diagramme-zeichnen/
    unit: Seite
    level: 2
    evidence: „Bisher hast du Diagramme gelesen. Jetzt drehst du es um“; verlangt nur, was die vorige Seite lehrte.
  - item: explainer-learner-start
    page: /beschleunigte-bewegung/diagramme-zusammen/
    unit: Seite
    level: 2
    evidence:
      „Du kannst beide Diagramme einzeln lesen… dieselbe Fahrt, nur aus zwei Blickwinkeln.“ „Negative Geschwindigkeit“
      wird im Text vor dem Einsatz erklärt.
  - item: explainer-representation-explained
    page: /beschleunigte-bewegung/weg-zeit-diagramm/
    unit: Statische Figur „Weg-Zeit-Diagramm“ (Linie, Abschnitte A B C)
    level: 1
    evidence:
      Das Ganze („die Fahrt von 12 s“), Achsen und Aussage stehen da („Steigt die Linie, wird der Weg größer… waagerecht…
      das Auto steht“). A, B, C sind im Text nirgends erklärt, erst die Übung sagt „drei Abschnitte A, B und C“.
  - item: explainer-representation-explained
    page: /beschleunigte-bewegung/weg-zeit-diagramm/
    unit: Bewegungslabor (Regler Abschnitt 1–3, Messmarke)
    level: 2
    evidence:
      "Text vor dem Labor: je 4 s pro Regler, Achsen bleiben, Messmarke liest den Weg ab; die Linie folgt den Reglern;
      Messmarke gibt „Bei t = 6 s ist der Weg s = 24 m.“"
    did: "Regler auf 0 und 12, Messmarke auf 0 und 12 s: s = 0 m bzw. 144 m; Linie folgt, Achse bleibt (bis 150)."
  - item: explainer-representation-explained
    page: /beschleunigte-bewegung/geschwindigkeit-zeit-diagramm/
    unit: Statische Figur „Geschwindigkeit-Zeit-Diagramm“ mit schraffierter Fläche
    level: 2
    evidence:
      "Caption: „Das Ganze ist die Fahrt von 12 s. Die Höhe der Linie ist die Geschwindigkeit… Die schraffierte Fläche
      liegt zwischen Linie und Zeitachse.“ Danach: „Sie ist der Weg.“ Ablesen und Bedeutung der Fläche stehen vor den Aufgaben."
  - item: explainer-representation-explained
    page: /beschleunigte-bewegung/geschwindigkeit-zeit-diagramm/
    unit: Bewegungslabor (4 Regler, Messmarke, Fläche)
    level: 2
