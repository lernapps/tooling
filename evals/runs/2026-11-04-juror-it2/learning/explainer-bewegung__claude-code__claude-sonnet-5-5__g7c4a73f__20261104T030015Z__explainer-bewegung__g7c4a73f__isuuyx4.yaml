units:
  - item: explainer-learner-start
    page: /bewegung-beschreiben/wiederholung/
    unit: Seite
    level: 2
    evidence:
      "Beginnt bei Bekanntem: „Aus Klasse 7 weißt du: Die Geschwindigkeit v sagt, wie weit etwas in einer Zeit kommt.
      Du teilst den Weg s durch die Zeit t.“ Formel als Block, Einheiten genannt."
    did: Seite von oben gelesen, 1280 und 360 px.
  - item: explainer-one-step
    page: /bewegung-beschreiben/wiederholung/
    unit: Seite
    level: 2
    evidence:
      Nur Wiederholung von v = s/t; die Notiz „Was auf den nächsten Seiten neu ist“ kündigt das Neue an, ohne es zu
      lehren.
  - item: explainer-steps-explain
    page: /bewegung-beschreiben/wiederholung/
    unit: Beispiel „Ein Rad fährt 60 Meter in 10 Sekunden“
    level: 2
    evidence:
      „v = 60 m / 10 s = 6 m/s. Das Rad kommt in jeder Sekunde 6 Meter weit. Das gilt, wenn das Tempo die ganze Zeit
      gleich bleibt.“ Zahlen der Aufgabe, Deutung dabei.
  - item: explainer-honest-headings
    page: /bewegung-beschreiben/wiederholung/
    unit: Seite
    level: 2
    evidence: „Das kennst du schon“ und „Ein Beispiel zum Erinnern“ passen; kein „Ausprobieren“.
  - item: explainer-age-appropriate
    page: /bewegung-beschreiben/wiederholung/
    unit: Seite
    level: 2
    evidence: Kurz, sachlich, Fahrrad-Beispiel; passend für Klasse 9–10, nicht kindisch.
  - item: explainer-learner-start
    page: /bewegung-beschreiben/aenderung/
    unit: Seite
    level: 2
    evidence:
      „Ein Rad steht an der roten Ampel. Es wird grün, und du trittst an. Dann rollst du aus und bremst …“ – Alltag,
      dann Anschluss an v = s/t aus Klasse 7. „beschleunigt“ und „bremst ab“ werden erst nach dem Bild eingeführt und definiert.
    did: Seite gelesen, Definitionen und Hinweiskasten angesehen.
  - item: explainer-one-step
    page: /bewegung-beschreiben/aenderung/
    unit: Seite
    level: 1
    evidence:
      "Drei Dinge auf einer Seite: Tempo steigt, Tempo sinkt, Richtungsänderung (Geschwindigkeit als Betrag und Richtung:
      „Deine Geschwindigkeit ändert sich also, auch wenn der Tacho immer dieselbe Zahl zeigt“). Das Beispiel sagt außerdem „zeigt,
      dass sein Tempo gleichmäßig steigt“ (gleichmäßige Beschleunigung, späteres Thema)."
  - item: explainer-honest-headings
    page: /bewegung-beschreiben/aenderung/
    unit: Seite
    level: 2
    evidence:
      „Einstieg – Rad an der Ampel“, „Anschaulich erklärt – der Bewegungsstreifen“, „Beispiel – Welche Änderung ist
      das?“, „Übung“ – kein „Ausprobieren“ ohne Bedienung.
  - item: explainer-age-appropriate
    page: /bewegung-beschreiben/aenderung/
    unit: Seite
    level: 2
    evidence: Alltagssituationen (Ampel, Kreisverkehr, Tacho), kurze Sätze, nicht kindisch; passt zu Klasse 9–10.
  - item: explainer-representation-explained
    page: /bewegung-beschreiben/aenderung/
    unit: Bewegungsstreifen (Bild mit Reihen A, B, C und Tabelle)
    level: 2
    evidence:
      "Text vor dem Bild: „Die Punkte sind die Orte, und die Zahl über dem Punkt ist die Zeit. Der Abstand zwischen
      zwei Punkten ist der Weg in einer Sekunde. Mit v = s/t und t = 1 s ist dieser Abstand zugleich das Tempo.“ Bild: „Weg
      in Fahrtrichtung, 0 bis 42 m“; Bildunterschrift „Vergleiche die Abstände in jeder Reihe“; die Tabelle gibt die Abstände.
      Alle fünf Fragen beantwortet (Bezug, Bedeutung der Punkte, Aussage, Aufgabe). Kleiner Mangel: bei A überdecken sich die
      Punkte 0 s und 1 s fast."
    did: "Bild und Tabelle verglichen: A 2…12 m, B 6 m, C 12…2 m – Summen 42/36/42 passen zur Skala."
  - item: explainer-text-figure-agree
    page: /bewegung-beschreiben/aenderung/
    unit: Bewegungsstreifen mit Text und Tabelle
    level: 2
    evidence:
      Text „Bei Rad A wachsen die Abstände … Rad C werden die Abstände kleiner“ passt zu Bild und Tabelle (Zahlen 2–12,
      6, 12–2). Keine Ansicht oder Werkzeug, das fehlt.
  - item: explainer-steps-explain
    page: /bewegung-beschreiben/aenderung/
    unit: Beispiel „Ein Roller fährt los“
    level: 2
    evidence:
      "„Orte: 1 m, 4 m, 9 m. Die Abstände sind 1 m, 3 m und 5 m. Sie werden größer, also wird der Roller schneller:
      Er beschleunigt.“ Zahlen und Begründung vorhanden."
  - item: explainer-figure-hides-answer
    page: /bewegung-beschreiben/aenderung/
    unit: Übung „roller-tabelle“ (Tabelle der Orte)
    level: 2
    evidence:
      Die Tabelle zeigt nur Orte 0, 8, 14, 18, 20 m; die Abstände (8, 6, 4, 2) muss man selbst bilden; vor „Prüfen“
      zeigt die Seite keine Lösung.
    did:
      "Falsche Option gewählt, geprüft: Rückmeldung nennt die Abstände; richtige Option: „Richtig!“. Leer geprüft: „Antworte
      zuerst“."
  - item: explainer-learner-start
    page: /bewegungsdiagramme/weg-zeit/
    unit: Seite
    level: 2
    evidence:
      „Lisa fährt mit dem Fahrrad von zu Hause los. Alle paar Sekunden messen wir, wie weit sie vom Startpunkt entfernt
      ist. Eine lange Liste von Zahlen ist unübersichtlich. Ein Weg-Zeit-Diagramm schreibt dieselben Messungen als eine Linie
      auf.“ Dazu v = s/t aus Klasse 7.
    did: Seite gelesen.
  - item: explainer-one-step
    page: /bewegungsdiagramme/weg-zeit/
    unit: Seite
    level: 1
    evidence:
      "Ein Diagramm, aber mehrere Lesearten auf einmal: gerade = gleiches Tempo, waagerecht = Stillstand, fallend =
      Rückweg, gekrümmt = schneller werden („Die Linie wird immer steiler: Lisa wird schneller“), dazu Tempo berechnen. Die
      Laboraufgabe 2 fragt nach der Krümmung („Abschnitt 1 ist gebogen, die anderen sind gerade. Warum?“), die der Text nicht
      erklärt. Beschleunigung im s-t-Diagramm gehört eher zur Folgeseite."
  - item: explainer-honest-headings
    page: /bewegungsdiagramme/weg-zeit/
    unit: Seite
    level: 2
    evidence: „Ausprobieren im Bewegungslabor“ steht über Reglern und Diagramm – dort bedient man etwas. Übrige Titel passen.
  - item: explainer-age-appropriate
    page: /bewegungsdiagramme/weg-zeit/
    unit: Seite
    level: 2
    evidence:
      Radfahrerin Lisa, Haltestelle; sachlich; passt für 9–10. Hinweiskasten „Das Diagramm ist kein Bild des Weges“
      trifft einen typischen Fehler.
  - item: explainer-representation-explained
    page: /bewegungsdiagramme/weg-zeit/
    unit: Lisas Weg-Zeit-Diagramm (labelled-figure)
    level: 2
    evidence:
      "Text: „Zeit t nach rechts, Entfernung vom Startpunkt s nach oben. Jeder Punkt der Linie sagt: Zu dieser Zeit
      ist Lisa so weit vom Start weg … vier Abschnitte von je 5 Sekunden. Die gestrichelten Linien trennen sie.“ Nummerierte
      Marken 1–4 mit Liste unter dem Bild („1. Die Linie steigt gerade nach oben: …“); Achsen mit Einheiten. Bezug, Marken,
      Aussage und Aufgabe („Achte auf die Neigung“) beantwortet."
    did: Bild und Liste gelesen (1280 px).
  - item: explainer-text-figure-agree
    page: /bewegungsdiagramme/weg-zeit/
    unit: Lisas Diagramm mit Text und Beispiel
    level: 2
    evidence:
      "Text und Beispiel: „bei t = 5 s liegt die Linie bei s = 20 m … 4 m/s“ – im Bild 20 m bei 5 s; zweiter Abschnitt
      bei 20 m; Abschnitt 3 fällt auf 5 m; Abschnitt 4 steigt auf etwa 18 m (passt zum Alt-Text). Beispiel kündigt „Lisas Diagramm
      weiter oben“ an."
  - item: explainer-representation-explained
    page: /bewegungsdiagramme/weg-zeit/
    unit: Bewegungslabor (Weg-Zeit)
    level: 1
    evidence:
      "Erklärt: 20 s, vier Abschnitte, Start bei 0 m mit 10 m/s, Regler = Tempo am Ende, „Die Quadrate auf der Linie
      sind die Enden der Abschnitte“, „Die Skalen bleiben immer gleich“. Offen: die Achse reicht von −400 bis 400 m und die
      gestrichelte Nulllinie wird nirgends gedeutet; was das Feld „rückwärts“ bedeutet, steht nur als Handlungsanweisung („Setze
      … den Haken ‚rückwärts‘“), nicht als Erklärung; im Beispiel der Seite ist Rückweg zwar gezeigt, aber ohne Bezug zum Feld.
      Die Linie liegt bei Standardwerten nur in der oberen Hälfte."
    did: Alle Regler auf 0 und auf 20, Abschnitt 2 auf 20, „rückwärts“ bei Abschnitt 4 gesetzt, Zurücksetzen gedrückt.
  - item: explainer-control-purpose
    page: /bewegungsdiagramme/weg-zeit/
    unit: "Bewegungslabor (Weg-Zeit): Regler, „rückwärts“, Zurücksetzen"
    level: 1
    evidence:
      "Regler und Zurücksetzen: sichtbare Wirkung (Linie, Satz „Du wirst schneller: von 10 auf 20 m/s.“), Startzustand
      zeigt konstantes Tempo. „rückwärts“ ändert die Linie (fällt ab Abschnitt 4 von 150 auf 100 m), sein Zweck wird nur in
      Aufgabe 3 gestellt; das Feld ist ausgegraut, wenn der Abschnitt kein Tempo hat, ohne Hinweis darum."
    did: Regler an beide Enden, Haken bei Abschnitt 4 gesetzt (Linie fällt), alle auf 0 (Haken gesperrt), Reset.
  - item: explainer-text-figure-agree
    page: /bewegungsdiagramme/weg-zeit/
    unit: Bewegungslabor (Weg-Zeit) mit Text
    level: 2
    evidence:
      „Du startest bei 0 Metern mit 10 m/s“ – Startzustand zeigt eine gerade Linie bis 200 m; Aufgabe 1 „In Abschnitt
      2 bremst du, die Linie wird dort flacher“ – im Labor so; Aufgabe 2 „Abschnitt 1 ist gebogen, die anderen sind gerade“
      – so zu sehen.
    did: Aufgaben 1–3 der Reihe nach nachgemacht.
  - item: explainer-steps-explain
    page: /bewegungsdiagramme/weg-zeit/
    unit: Beispiel „Wie schnell ist Lisa im ersten Abschnitt?“
    level: 2
    evidence:
      "„Bei t = 5 s liegt die Linie bei s = 20 m. Bei t = 0 s war sie bei 0 m … v = 20 m / 5 s = 4 m/s … Im zweiten
      Abschnitt bleibt die Linie bei 20 Metern: Dort ist s gleich geblieben, also ist v = 0 m/s.“"
  - item: explainer-figure-hides-answer
    page: /bewegungsdiagramme/weg-zeit/
    unit: Übung „stillstand-linie“ (drei Linien A, B, C)
    level: 2
    evidence:
      "Das Bild beschriftet nur A, B, C an den Linien; keine Markierung der richtigen Antwort. Bildunterschrift: „Vergleiche,
      ob und wie sich die Entfernung ändert.“"
    did: Alle drei Optionen einzeln geprüft; falsche geben eine Erklärung, B „Richtig!“.
  - item: explainer-figure-hides-answer
    page: /bewegungsdiagramme/weg-zeit/
    unit: Übung „anna-nach-12-s“ (Diagramm mit Gitter)
    level: 2
    evidence: Das Diagramm zeigt Gitter und Achsenzahlen, keine Marke bei 12 s oder 40 m.
    did: "Eingegeben: 12, 20, 30 (Rückmeldungen: „Das ist die Zeit, die du schon kennst …“ bzw. Hinweis), 40 richtig."
  - item: explainer-figure-hides-answer
    page: /bewegungsdiagramme/weg-zeit/
