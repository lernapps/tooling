  - item: explainer-control-purpose
    page: /bewegungsdiagramme/geschwindigkeit-zeit/
    unit: "Bewegungslabor (Geschwindigkeit-Zeit): Regler, „rückwärts“, Zurücksetzen"
    level: 0
    evidence:
      "Regler und Zurücksetzen wirken sichtbar. Das Feld „rückwärts“ hat auf dieser Seite keine sichtbare Wirkung: Haken
