units:
  - item: explainer-learner-start
    page: /brueche/was-ist-ein-bruch/
    unit: Seite
    level: 2
    evidence:
      Beginnt mit „Eine Pizza wird unter vier Kindern geteilt. Jedes Kind bekommt ein Stück.“ und der Frage „Aber wie
      sagst du, wie viel das ist?“; „Bruch“ wird danach definiert.
  - item: explainer-learner-start
    page: /brueche/zaehler-nenner/
    unit: Seite
    level: 1
    evidence:
      Beginnt mit „Ein Bruch besteht aus zwei natürlichen Zahlen, die untereinander stehen.“ – keine Alltagssituation;
      „Zähler“/„Nenner“ kommen erst im nächsten Abschnitt.
  - item: explainer-learner-start
    page: /brueche/brueche-darstellen/
    unit: Seite
    level: 1
    evidence:
      "Beginnt mit „Ein Bruch ist eine Zahl, und du kannst sie auf verschiedene Weise zeigen: … als Teil einer Menge
      von Dingen.“ – abstrakt, „Darstellung“ und „Menge“ unerklärt, kein Alltagsbezug."
  - item: explainer-learner-start
    page: /brueche/erweitern-kuerzen/
    unit: Seite
    level: 2
    evidence: „Eine halbe Pizza ist genauso viel wie 2 von 4 Stücken oder 4 von 8 Stücken.“ Danach wird „gleichwertig“ erklärt.
  - item: explainer-learner-start
    page: /brueche/brueche-vergleichen/
    unit: Seite
    level: 1
    evidence:
      Pizza-Frage „2/3 oder 3/4?“ ist gut, aber „Dafür brauchst du das Erweitern“ setzt den Begriff voraus, ohne ihn
      zu erklären; später kommt „Vielfaches beider Nenner“.
  - item: explainer-representation-explained
    page: /brueche/was-ist-ein-bruch/
    unit: Komponente „Teile insgesamt / Gefärbte Teile“ (Streifen, Bruch, Umschalter gleich/verschieden)
    level: 1
    evidence:
      "Das Ganze ist „ein Streifen“ (alt), Blau = gefärbt, Beschriftungen der Regler klar. Offen: Der Bruch 3/4 über
      dem Streifen wird nicht erklärt; im Modus „Verschieden große Teile“ bleibt „3/4“ stehen, obwohl der Text sagt „Das ist
      kein Bruch“; was man daraus ablesen soll, bleibt zu erraten."
    did: Nenner auf 12 und 2, Zähler bis zum Ende, auf „Verschieden große Teile“ umgeschaltet.
  - item: explainer-representation-explained
    page: /brueche/zaehler-nenner/
    unit: Komponente „Nenner / Zähler“ (Streifen mit Bruch)
    level: 1
    evidence:
      "Beschriftungen „Nenner (Teile insgesamt)“, „Zähler (gefärbte Teile)“ und Satz „Der Nenner 6 sagt: 6 gleich große
      Teile.“ erklären Teile und Farbe. Im Modus „Verschieden große Teile“ steht weiter der Bruch 5/6 neben „kein Bruch“ – widersprüchliches
      Zeichen."
    did: Regler auf Enden, Umschalter benutzt.
  - item: explainer-representation-explained
    page: /brueche/brueche-darstellen/
    unit: Komponente BruchFaerben (Streifen anklicken)
    level: 2
    evidence:
      "Aufgabe „Der Streifen ist in 6 gleich große Teile geteilt. Färbe 5/6 des Streifens.“ nennt das Ganze, Klick färbt
      blau, Zähler „Teil“ „1 von 6 Teilen gefärbt“; Regel davor: „färbst so viele Teile, wie der Zähler sagt“."
    did: Teile angeklickt, Zähler beobachtet; vor „Prüfen“ gibt nichts die Antwort preis.
  - item: explainer-representation-explained
    page: /brueche/brueche-darstellen/
    unit: Abbildung Zahlenstrahl in Viertel (Regel)
    level: 2
    evidence:
      "Caption „Die Strecke von 0 bis 1 ist in vier Abschnitte geteilt. Beachte, dass der Strich bei 3/4 nach drei Abschnitten
      kommt.“ Text davor: „Zähle die Abschnitte, nicht die Striche.“"
  - item: explainer-representation-explained
    page: /brueche/brueche-darstellen/
    unit: Abbildung Zahlenstrahl in Fünftel (Übung)
    level: 2
    evidence:
      Nur 0 und 1 beschriftet, Punkt markiert; Caption „Zähle die Abschnitte von 0 bis 1 und dann die Abschnitte bis
      zum Punkt.“ sagt, was zu tun ist.
  - item: explainer-representation-explained
    page: /brueche/brueche-darstellen/
    unit: Abbildung Zahlenstrahl in Achtel (Übung)
    level: 2
    evidence: Gleiche Gestaltung, Caption „Zähle die Abschnitte von 0 bis 1 …“; Punkt klar.
  - item: explainer-representation-explained
    page: /brueche/erweitern-kuerzen/
    unit: Komponente „Erweitern mit“ (zwei Streifen)
    level: 1
    evidence:
      Zwei Streifen untereinander ohne sichtbare Beschriftung; dass oben der Ausgangsbruch und unten der erweiterte
      steht, steht nur im alt-Text. Der Text darunter „1/2 = 9/18. … Der gefärbte Teil ist gleich lang.“ erklärt die Zahlen
      gut.
    did: Faktor von 1 bis 9 gestellt.
  - item: explainer-representation-explained
    page: /brueche/brueche-vergleichen/
    unit: Komponente „Gemeinsame Teilung zeigen“ (zwei Streifen, rote Linien)
    level: 1
    evidence:
      "Rote gestrichelte Linien werden sichtbar nicht erklärt (nur im alt-Text); der Satz „Auf den Nenner 12 erweitert:
      2/3 = 8/12 und 3/4 = 9/12“ steht schon vor dem Knopf; nicht klar, was Streifen oben/unten sind."
    did: Knopf gedrückt.
  - item: explainer-control-purpose
    page: /brueche/was-ist-ein-bruch/
    unit: Komponente „Teile insgesamt / Gefärbte Teile“
    level: 1
    evidence:
      "Alle Regler verändern Streifen und Zahl; Text sagt „Verändere, in wie viele Teile … Schalte dann auf Teile, die
      verschieden groß sind.“ Grenzen 2–12 und Zähler ≤ Nenner stimmen. Aber im Modus „Verschieden große Teile“ bleibt der Bruch
      3/4 stehen: Beschriftung und Anzeige stimmen nicht überein."
    did: Nenner 12 und 2, Zähler Grenzen, Modus gewechselt.
  - item: explainer-control-purpose
    page: /brueche/zaehler-nenner/
    unit: Komponente „Nenner / Zähler“
    level: 1
    evidence:
      Regler wirken sichtbar, Text „achte darauf, was sich im Streifen und im Bruch ändert“. Im ungleichen Modus bleibt
      der Bruch trotz „kein Bruch“ angezeigt.
    did: Nenner und Zähler bis zu den Grenzen, Modus umgeschaltet.
  - item: explainer-control-purpose
    page: /brueche/brueche-darstellen/
    unit: Komponente BruchFaerben (Teile anklicken)
    level: 2
    evidence:
      "Jeder Klick färbt/entfärbt und der Zähler „1 von 6 Teilen gefärbt“ passt; Text sagt, wozu: „Färbe in jeder Aufgabe
      so viele Teile, wie der Zähler sagt.“"
    did: Teile an- und abgewählt.
  - item: explainer-control-purpose
    page: /brueche/erweitern-kuerzen/
    unit: Regler „Erweitern mit“
    level: 2
    evidence:
      "Startzustand k=1: „1/2 = 1/2“, also zeigt zuerst, was gleich bleibt; Text „Erweitere den Bruch und schau, wie
      sich der gefärbte Teil verhält“; bei 9: „1/2 = 9/18“, Streifen stimmt; „+“ wird am Ende gesperrt."
    did: Faktor 1 bis 9.
  - item: explainer-control-purpose
    page: /brueche/brueche-vergleichen/
    unit: Knopf „Gemeinsame Teilung zeigen“
    level: 1
    evidence:
      Der Startzustand zeigt im Text schon das Ergebnis (8/12 und 9/12); der Knopf blendet nur rote Linien ein. Zweck
      („Zeige die gemeinsame Teilung“) ist genannt, die Wirkung ist klein.
    did: Knopf an und aus.
  - item: explainer-text-figure-agree
    page: /brueche/was-ist-ein-bruch/
    unit: Komponente mit Text darum
    level: 2
    evidence:
      Text kündigt „Schalte dann auf Teile, die verschieden groß sind“ an – Knopf „Verschieden große Teile“ gibt es;
      Streifen zeigt ungleiche Teile.
