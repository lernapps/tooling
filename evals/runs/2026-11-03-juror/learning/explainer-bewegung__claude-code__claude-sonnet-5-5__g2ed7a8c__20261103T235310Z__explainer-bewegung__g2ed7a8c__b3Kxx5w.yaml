units:
  - item: explainer-learner-start
    page: /geschwindigkeit-aendert-sich/geschwindigkeit-wiederholt/
    unit: Seite
    level: 2
    evidence:
      Beginnt mit „Das kennst du schon“ und „Das hast du in Klasse 7 gelernt“; v = s/t, m/s und km/h mit Fahrradbeispiel
      (60 m in 10 s = 6 m/s).
  - item: explainer-learner-start
    page: /geschwindigkeit-aendert-sich/schneller-langsamer/
    unit: Seite
    level: 2
    evidence:
      "Start: „Du trittst auf dem Fahrrad in die Pedale und wirst schneller … Vor der roten Ampel bremst du“, dann „Stell
      dir vor, eine Kamera fotografiert einen Wagen jede Sekunde“. Beschleunigen/Abbremsen werden in Definitionen erklärt."
  - item: explainer-learner-start
    page: /geschwindigkeit-aendert-sich/richtung-aendert-sich/
    unit: Seite
    level: 1
    evidence:
      "Start: Karussell, „Der Tacho würde dauernd dieselbe Zahl zeigen … Ändert sich bei dir die Geschwindigkeit, obwohl
      du nicht schneller oder langsamer wirst?“ – die Frage braucht schon die neue Idee (Geschwindigkeit hat Richtung); „Tempo“
      und „Geschwindigkeit“ als zwei Begriffe kommen erst danach, ohne Rückbezug auf die bisherige Gleichsetzung."
  - item: explainer-learner-start
    page: /bewegungsdiagramme/weg-zeit-diagramm/
    unit: Seite
    level: 2
    evidence:
      "Start: „Ein Wagen rollt über den Tisch. Alle zwei Sekunden misst du …“, Verweis auf Klasse 7 (v = s : t). Achsen
      und „Weg-Zeit-Diagramm“ werden direkt danach erklärt."
  - item: explainer-learner-start
    page: /bewegungsdiagramme/geschwindigkeit-zeit-diagramm/
    unit: Seite
    level: 2
    evidence:
      "Start: „Ein Fahrrad hat dafür einen Tacho … Wenn du den Tacho alle zwei Sekunden abliest …“ – knüpft an das vorige
      Diagramm und den Alltag an."
  - item: explainer-learner-start
    page: /bewegungsdiagramme/ein-wagen-zwei-diagramme/
    unit: Seite
    level: 2
    evidence: "Start: „so wie der Kilometerstand und der Tacho in einem Auto“; beide Diagramme sind von den Vorseiten bekannt."
  - item: explainer-learner-start
    page: /bewegungsdiagramme/diagramme-zeichnen/
    unit: Seite
    level: 2
    evidence:
      "Start: „Bisher hast du Diagramme gelesen … Jetzt gehst du den umgekehrten Weg … wie eine Wegbeschreibung, die
      du auf eine Karte überträgst“."
  - item: explainer-one-step
    page: /geschwindigkeit-aendert-sich/geschwindigkeit-wiederholt/
    unit: Seite
    level: 2
    evidence: Nur Wiederholung von v = s/t mit einem Beispiel; nichts Neues.
  - item: explainer-one-step
    page: /geschwindigkeit-aendert-sich/schneller-langsamer/
    unit: Seite
    level: 2
    evidence:
      "Ein Schritt: aus Abständen im Sekundentakt erkennen, ob gleich/schneller/langsamer. Rückwärtsfahren wird nur
      abgegrenzt („kommt auf der nächsten Seite“)."
  - item: explainer-one-step
    page: /geschwindigkeit-aendert-sich/richtung-aendert-sich/
    unit: Seite
    level: 2
    evidence:
      "Ein Schritt: Tempo und Richtung; Pfeil als Geschwindigkeit, Tabelle mit fünf Situationen als eine Übersicht.
      Keine Beschleunigungsformel."
  - item: explainer-one-step
    page: /bewegungsdiagramme/weg-zeit-diagramm/
    unit: Seite
    level: 1
    evidence:
      "Die Seite bringt Weg ablesen, Steilheit/Geschwindigkeit berechnen (Δs : Δt), Rückfahrt (Linie fällt), „gleichförmige
      Bewegung“ und Knick auf einmal; im Beispiel kommt die Rechnung dazu. Ein Lernender kommt durch, aber mit zwei Methoden
      (ablesen und rechnen) auf einer Seite."
  - item: explainer-one-step
    page: /bewegungsdiagramme/geschwindigkeit-zeit-diagramm/
    unit: Seite
    level: 2
    evidence:
      "Ein Schritt: Höhe der Linie = Geschwindigkeit, vier Regeln, eine Vergleichstabelle. Weg-Zeit-Diagramm erscheint
      nur als Anzeige im Ausprobieren."
  - item: explainer-one-step
    page: /bewegungsdiagramme/ein-wagen-zwei-diagramme/
    unit: Seite
    level: 2
    evidence: "Ein Schritt: von einem Diagramm auf das andere schließen, vier Zuordnungen."
  - item: explainer-one-step
    page: /bewegungsdiagramme/diagramme-zeichnen/
    unit: Seite
    level: 2
    evidence:
      "Ein Schritt: aus Beschreibung zeichnen (drei Schritte vorgehen, je ein Beispiel für s-t und v-t). Δs = v · Δt
      wird dort erklärt, wo es gebraucht wird."
  - item: explainer-honest-headings
    page: /geschwindigkeit-aendert-sich/geschwindigkeit-wiederholt/
    unit: Seite
    level: 2
    evidence: "Titel: Das kennst du schon / Weg, Zeit und Geschwindigkeit. Alle passen; kein „Ausprobieren“ ohne Bedienbares."
  - item: explainer-honest-headings
    page: /geschwindigkeit-aendert-sich/schneller-langsamer/
    unit: Seite
    level: 2
    evidence: "Titel: Einstieg / So erkennst du die Änderung / Übung. Alle passen; kein „Ausprobieren“ ohne Bedienbares."
  - item: explainer-honest-headings
    page: /geschwindigkeit-aendert-sich/richtung-aendert-sich/
