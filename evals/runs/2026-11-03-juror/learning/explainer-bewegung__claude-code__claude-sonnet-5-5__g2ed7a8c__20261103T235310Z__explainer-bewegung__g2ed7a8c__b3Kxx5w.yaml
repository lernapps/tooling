  - item: explainer-age-appropriate
    page: /geschwindigkeit-aendert-sich/geschwindigkeit-wiederholt/
    unit: Seite
    level: 2
    evidence:
      „Die Geschwindigkeit sagt, wie viel Weg ein Körper in einer bestimmten Zeit zurücklegt.“ Knapp, für Klasse 9–10
      passend.
  - item: explainer-age-appropriate
    page: /geschwindigkeit-aendert-sich/schneller-langsamer/
    unit: Seite
    level: 2
