  - item: explainer-honest-headings
    page: /bewegungsdiagramme/diagramme-zeichnen/
    unit: Seite
    level: 2
    evidence: "Titel: Einstieg / So gehst du vor / Übung. Alle passen; kein „Ausprobieren“ ohne Bedienbares."
