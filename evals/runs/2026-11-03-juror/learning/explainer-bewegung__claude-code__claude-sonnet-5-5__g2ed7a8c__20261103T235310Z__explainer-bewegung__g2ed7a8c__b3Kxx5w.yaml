  - item: explainer-representation-explained
    page: /geschwindigkeit-aendert-sich/schneller-langsamer/
    unit: Figur Streifenbilder (drei Fahrten)
    level: 2
    evidence:
      "Text erklärt: „Eine Kamera fotografiert einen Wagen jede Sekunde und legt alle Bilder übereinander. Der Abstand
      … ist der Weg … in dieser einen Sekunde.“ Bildunterschrift: „Gleich große Abstände, wachsende Abstände, schrumpfende Abstände:
      Jedes Bild zeigt einen der drei Fälle.“ Sekundenmarken 0 s–4 s unter den Wagen."
    did: Figur bei 1280 und 360 px angesehen.
  - item: explainer-text-figure-agree
    page: /geschwindigkeit-aendert-sich/schneller-langsamer/
    unit: Figur Streifenbilder mit Text
    level: 2
    evidence:
      Text „drei Fälle“ und Figur-Titel „Abstände gleich groß / werden größer / werden kleiner“ stimmen überein; Übung
      nutzt Bild A–C im gleichen Stil und kündigt sie an („Auf den Bildern fährt ein Wagen von links nach rechts“).
  - item: explainer-representation-explained
    page: /geschwindigkeit-aendert-sich/richtung-aendert-sich/
    unit: Figur Geschwindigkeitspfeile
    level: 2
    evidence:
      "Text: „Man zeichnet die Geschwindigkeit als Pfeil. Die Länge des Pfeils ist das Tempo, die Spitze zeigt die Richtung.“
      Bildunterschrift/Text: „Sie sind gleich lang, aber ihre Spitzen zeigen jedes Mal woandershin.“ Folgerung steht im Absatz
      danach."
  - item: explainer-text-figure-agree
    page: /geschwindigkeit-aendert-sich/richtung-aendert-sich/
    unit: Figur Pfeile mit Text und Tabelle
    level: 2
    evidence:
      Text nennt „vier Pfeile“, Figur zeigt vier gleich lange Pfeile in verschiedenen Richtungen; Karussell in Einstieg,
      Tabelle und Übung durchgehend.
  - item: explainer-representation-explained
    page: /bewegungsdiagramme/weg-zeit-diagramm/
    unit: Figur und Komponente Weg-Zeit-Diagramm (Ausprobieren)
    level: 2
    evidence:
      "Bezug: „Senkrecht steht der Weg s … die Entfernung des Wagens vom Start“; „Die Linie ist nicht die Strecke …
      kein Berg“; Bedeutung der Punkte, der feste Startpunkt, was man ändert („Du klickst einen der anderen Punkte an und ziehst
      ihn“), Tabelle „Weg dazu / Geschwindigkeit (negativ heißt zurück)“ und Aufgabe „Verschiebe den Punkt bei 4 s nach oben.
      Welche zwei Abschnitte ändern sich …“."
    did: "Punkt bei 4 s 12× mit Pfeiltaste hoch (stoppt bei 8 m, Tabelle: 4 m/s), Zeit-Schieber auf 8, Abspielen, Zurücksetzen."
  - item: explainer-control-purpose
    page: /bewegungsdiagramme/weg-zeit-diagramm/
    unit: "Komponente Weg-Zeit-Diagramm: Punkte, Zeit-Schieber, Abspielen, Zurücksetzen"
    level: 2
    evidence:
      "Jeder Punkt ändert Linie, Tabelle und Wagen auf der Bahn; Schieber „Zeit t“ → „Zeit 8 s: Der Wagen ist 2 m vom
      Start entfernt.“; Text sagt, wozu („fährt der Wagen unter dem Diagramm genau das, was die Linie sagt“). Grenzen 0–8 m
      stimmen mit Bahn überein."
    did: Alle Bedienelemente benutzt, auch bei 360 px.
  - item: explainer-text-figure-agree
    page: /bewegungsdiagramme/weg-zeit-diagramm/
    unit: Figuren und Komponente mit Text
    level: 2
    evidence:
      „Von 2 s bis 6 s steht der Wagen“ passt zur Figur (4 m, waagerecht); Beispiel „von 0 m bei 0 s auf 4 m bei 2 s
      … 2 m/s“ passt; Komponente nennt dieselbe Bahn 0–8 m wie im Text.
  - item: explainer-representation-explained
    page: /bewegungsdiagramme/geschwindigkeit-zeit-diagramm/
    unit: Figur und Komponente Geschwindigkeit-Zeit-Diagramm (Ausprobieren)
    level: 2
    evidence:
      "„Senkrecht steht die Geschwindigkeit v … so, wie sie der Tacho gerade zeigt“; „Wie weit er vom Start entfernt
      ist, steht hier nicht“; Komponente: „Du veränderst: die Geschwindigkeit (orange, gestrichelt)“, „Du siehst: den Weg …
      (blau, durchgezogen)“, Tabelle „Der Wagen: wird schneller …“."
    did: Punkte per Pfeiltasten verändert; Schieber/Abspielen/Zurücksetzen benutzt.
  - item: explainer-control-purpose
    page: /bewegungsdiagramme/geschwindigkeit-zeit-diagramm/
    unit: "Komponente v-t-Diagramm: Punkte, Zeit-Schieber, Abspielen, Zurücksetzen"
    level: 2
    evidence:
      "Punkte ändern oberes Diagramm, Weg-Diagramm, Tabelle und Wagen gleichzeitig; Beschriftungen („Zeit 8 s: Der Wagen
      fährt mit 2 m/s und ist 10 m vom Start entfernt“) stimmen mit Positionen überein; Aufgabentext sagt, was auszuprobieren
      ist."
    did: Wie vor; Bahn 0–32 m passt zur Achse.
  - item: explainer-text-figure-agree
    page: /bewegungsdiagramme/geschwindigkeit-zeit-diagramm/
    unit: Figuren und Komponente mit Text
    level: 2
    evidence:
      Text „Geschwindigkeit von 0 bis 4 m/s in ganzen Zahlen“ und „Bahn von 0 bis 32 Metern“ entsprechen den Achsen;
      Aufgabenfiguren sind als solche angekündigt.
  - item: explainer-representation-explained
    page: /bewegungsdiagramme/ein-wagen-zwei-diagramme/
    unit: Figur zwei Diagramme übereinander und Komponente (Ausprobieren)
    level: 2
    evidence:
      "„Oben steht die Geschwindigkeit, unten der Weg, beide mit derselben Zeitachse. Die grauen gestrichelten Linien
      markieren dieselben Zeiten“; Bildunterschrift „Lies von oben nach unten“; Regeln als Liste; Komponente: Start „fährt der
      Wagen die ganze Zeit mit 2 m/s“. Kleiner Makel: in der Figur überdeckt der Achsentitel „t in s“ die Zahl 8."
    did: Punkte 0 und 2 s auf 0 gezogen, Zeit 8 s, Abspielen, Zurücksetzen.
  - item: explainer-control-purpose
    page: /bewegungsdiagramme/ein-wagen-zwei-diagramme/
    unit: Komponente Ein Wagen, zwei Diagramme
    level: 2
    evidence:
      Start zeigt ausdrücklich die gleichbleibende Fahrt (2 m/s); jeder Punkt ändert beide Diagramme, Tabelle (z. B.
      „von 0 auf 2 m/s – wird schneller“) und Wagen; nach der Änderung 10 m bei 8 s passt zur Rechnung (0+2+4+4).
    did: Punkte gezogen, Zeit, Abspielen, Zurücksetzen (zurück auf 2 m/s, 0 m).
  - item: explainer-text-figure-agree
    page: /bewegungsdiagramme/ein-wagen-zwei-diagramme/
    unit: Figur und Komponente mit Text
    level: 2
    evidence:
      Text „Der Wagen fährt an, fährt dann gleichmäßig, bremst ab und steht zuletzt“ entspricht der Figur (0→2→2→0→0
      m/s, 8 m); Aufgaben des Ausprobierens passen zu den Achsen (bis 32 m).
  - item: explainer-representation-explained
    page: /bewegungsdiagramme/diagramme-zeichnen/
    unit: Komponente Diagramme zeichnen
    level: 2
    evidence:
      "Aufgabe nennt das Diagramm („Setze die Punkte im Weg-Zeit-Diagramm. Der Start bei 0 s und 0 m steht fest.“);
      Seite erklärt: „Ein Punkt im Weg-Zeit-Diagramm sagt, wie weit der Wagen vom Start entfernt ist, nicht, wie viel Weg im
      letzten Abschnitt dazukam“, mit zwei Beispielen. Die Rückmeldung „Abschnitt 1 (0 s bis 2 s) ist zu flach“ benennt, was
      falsch ist."
    did:
      "Mit einem Pfeiltasten-Schritt einen Punkt gesetzt und geprüft: „Leider nicht richtig. Abschnitt 1 … ist zu flach.“
      Prüfen ist zuerst deaktiviert, bis ein Punkt bewegt wird."
  - item: explainer-control-purpose
    page: /bewegungsdiagramme/diagramme-zeichnen/
    unit: "Komponente Diagramme zeichnen: Punkte, Alle Punkte zurücksetzen, Neue Aufgabe"
    level: 2
    evidence:
      Punkte starten alle auf 0 („Wert 0“, zeigen keine Lösung), „Neue Aufgabe“ wechselt Text und Diagrammart, „Alle
      Punkte zurücksetzen“ leert. Prüfen ist ohne Bewegung deaktiviert, was nicht erklärt wird (kleiner Makel).
  - item: explainer-text-figure-agree
    page: /bewegungsdiagramme/diagramme-zeichnen/
    unit: Komponente und Text
    level: 2
    evidence:
      Beispiele „steht 2 s … 3 m/s“ nutzen dieselben 2-s-Abschnitte und Achsen wie die Übung; Aufgabe nennt jeweils,
      welches Diagramm gezeichnet wird.
  - item: explainer-representation-explained
    page: /bewegungsdiagramme/diagramme-zeichnen/
    unit: Figur „Falsch gezeichnet“ (Übung fehler-finden)
    level: 2
    evidence:
      Aufgabe nennt die Fahrt in Worten, Figur zeigt die gezeichnete Linie; Antwortoptionen erklären jeweils per Rückmeldung
      („Im Weg-Zeit-Diagramm steht jeder Punkt für die Entfernung vom Start“).
  - item: explainer-steps-explain
    page: /geschwindigkeit-aendert-sich/geschwindigkeit-wiederholt/
    unit: Beispiel Fahrrad (60 m in 10 s)
    level: 2
    evidence: "„v = 60 m : 10 s = 6 m/s. Das sind 6 · 3,6 km/h = 21,6 km/h.“ Zahlen der Aufgabe, jeder Schritt benannt."
  - item: explainer-steps-explain
    page: /bewegungsdiagramme/weg-zeit-diagramm/
    unit: Beispiel „Geschwindigkeit eines Abschnitts“
    level: 2
    evidence:
      "„Es kommen Δs = 4 m − 0 m = 4 m dazu, und es vergehen Δt = 2 s − 0 s = 2 s. … v = 4 m : 2 s = 2 m/s.“ Mit den
      Zahlen der Figur, Werte ausgerechnet."
  - item: explainer-steps-explain
    page: /bewegungsdiagramme/weg-zeit-diagramm/
    unit: "Generierte Übung „Geschwindigkeit ablesen“ (Aufgabe Nr. 6: 5 s/10 m, 8 s/19 m)"
    level: 1
    evidence:
      "Schritt 1: „Δs = 19 m − 10 m und Δt = 8 s − 5 s.“ – die Differenzen bleiben als Term stehen; Schritt 2: „v =
      Δs : Δt = 3 m/s“ ohne Begründung. Daten aus ablesungen.yaml haben das gleiche Muster in allen Seeds. Gut: Fehlerrückmeldungen
      („Du hast Endweg durch Endzeit gerechnet …“)."
    did: Aufgabe mit „Neue Aufgabe“ gewechselt; Schritte aus der Quelle gelesen (drei Seeds gleiche Form).
  - item: explainer-steps-explain
    page: /bewegungsdiagramme/diagramme-zeichnen/
    unit: Beispiele Weg-Zeit und Geschwindigkeit-Zeit zeichnen
    level: 2
    evidence:
      "„Im zweiten Abschnitt kommen Δs = 3 m/s · 2 s = 6 m dazu: Der Punkt bei 4 s liegt bei 0 m + 6 m = 6 m.“ und „Der
      Punkt bei 2 s bei 2 m/s, denn der Wagen wird schneller.“"
  - item: explainer-steps-explain
    page: /bewegungsdiagramme/diagramme-zeichnen/
    unit: Übung Diagramm zeichnen (Aufgaben Nr. 6 und 9)
    level: 1
    evidence:
      "Es gibt keine Lösung mit Schritten, nur Hinweise wie „Abschnitt 1 (0 s bis 2 s) ist zu flach. Rechne noch einmal:
      Weg = Geschwindigkeit · Zeit.“ – ohne die Zahlen der Aufgabe. Wer nicht weiterkommt, rät."
