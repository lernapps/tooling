  - item: explainer-honest-headings
    page: /erweitern-kuerzen/kuerzen/
    unit: Seite
    level: 2
    evidence: „Den Weg zurückgehen“, „Ausprobieren“ (bedienbar), „Kürzen heißt teilen“, „Beispiel“, „Übung“ passen.
