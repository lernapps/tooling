    page: /erweitern-kuerzen/kuerzen/
    unit: Seite
    level: 2
    evidence: "Ein Schritt: Kürzen mit gemeinsamem Teiler. Der Weg „so weit wie möglich“ im Beispiel bleibt dasselbe Verfahren."
  - item: explainer-steps-explain
    page: /erweitern-kuerzen/kuerzen/
    unit: Aufgabe kuerzen-zaehler (3 Seeds)
    level: 1
    evidence:
      "z. B. „30 und 50 sind beide durch 10 teilbar.“ „Der Zähler wird geteilt: 30 : 10 = 3. Der neue Zähler ist 3.“
      Seeds 12:6=2, 6:3=2 gleich. Die Zahlen sind eingesetzt, aber es steht nicht, warum geteilt wird (Teile zusammenfassen),
      anders als bei erweitern."
    did: Falsche Eingabe 1, „Lösung“, 3 Seeds.
  - item: explainer-steps-explain
    page: /erweitern-kuerzen/kuerzen/
    unit: Aufgabe kuerzen-nenner (3 Seeds)
    level: 1
    evidence:
      "z. B. „9 und 12 sind beide durch 3 teilbar.“ „Der Nenner wird geteilt: 12 : 3 = 4. Der neue Nenner ist 4.“ Gleiches
      Muster bei 10/15 und 3/6: Grund des Teilens fehlt."
    did: Falsche Eingabe, „Lösung“, 3 Seeds.
  - item: explainer-steps-explain
    page: /erweitern-kuerzen/kuerzen/
    unit: Beispiel „Kürze 12/18 so weit wie möglich“
    level: 2
    evidence:
      "„12 und 18 sind beide gerade, also durch 2 teilbar. 12 : 2 = 6 und 18 : 2 = 9.“ „… Von 2 und 3 teilt keine Zahl
