  - item: explainer-one-step
    page: /bewegung/richtungsaenderung/
    unit: Seite
    level: 2
    evidence: Nur Richtungsänderung mit negativer Geschwindigkeit; Kurve ausdrücklich ausgeklammert.
  - item: explainer-one-step
    page: /diagramme/lesen/
    unit: Seite
    level: 1
    evidence:
      "Zwei Diagrammarten mit je eigener Leseregel in einer Seite: „Im v-t-Diagramm gilt…“, „Im s-t-Diagramm gilt…“,
      dazu zusammen als Paar."
  - item: explainer-one-step
    page: /diagramme/zeichnen/
    unit: Seite
    level: 2
    evidence: Zeichnen als eine Tätigkeit, Tabelle fasst Bekanntes.
