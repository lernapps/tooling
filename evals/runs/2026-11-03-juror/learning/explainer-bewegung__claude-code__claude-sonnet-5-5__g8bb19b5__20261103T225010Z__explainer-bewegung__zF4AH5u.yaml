notes:
  "Map gelesen: geschwindigkeitsaenderung requires geschwindigkeit; bewegungsdiagramme requires geschwindigkeit-berechnen.
  Kapitelseiten ohne Einheiten. Keine Übung mit Lösungsschritten (explainer-steps-explain entfällt). Mobil 360 px: kein horizontaler
  Überlauf. Statische Abbildung von Abbremsen nur über Beschriftung/alt gelesen."
