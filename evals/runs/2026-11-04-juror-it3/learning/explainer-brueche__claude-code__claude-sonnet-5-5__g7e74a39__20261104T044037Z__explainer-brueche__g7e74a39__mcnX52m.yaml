  - item: explainer-representation-explained
    page: /bruch/was-ist-ein-bruch/
    unit: "Komponente „Ausprobieren“ (Streifen mit 2–12 Teilen)"
    level: 1
    evidence: "Ganzes („Das Ganze ist der ganze Streifen“), Teilezahl-Knöpfe, Tippen/Zurücktippen, Zähler unter dem Streifen und „Was bleibt gleich“ sind erklärt. Die blaue Schraffur der gefärbten Teile wird nirgends benannt; im Streifen wirkt sie wie eine Strichmarkierung. Wie man vom Zähltext zum Bruch/Zähler-Nenner-Zuordnung kommt, steht erst im „Regel“-Abschnitt danach."
    did: "Teile 4→2 (Streifen), 2 Teile gefärbt: „2 von 4 Teilen gefärbt. 2/4“; 12 Teile: alles wieder weiß."
  - item: explainer-control-purpose
    page: /bruch/was-ist-ein-bruch/
    unit: "Komponente „Ausprobieren“"
    level: 2
    evidence: "Start „0 von 4 Teilen gefärbt“, nur Streifen gleich lang; Text sagt, dass beim Wechsel der Zahl alles weiß wird und warum man sie wählt. Zähltext und Bruch passen nach jeder Änderung (2 von 4 → 0 von 12 nach Wechsel)."
    did: "Alle Knöpfe 2–12 gedrückt, Teile getippt und wieder abgewählt."
