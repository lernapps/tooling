notes:
  'Karte nicht gelesen (kein Netz-Zugriff geprüft); nehme an, was Klasse 6 kennt: natürliche Zahlen, Teilbarkeit grob.
  Startseite, Glossar, Tutor, Selbsteinschätzung ausgelassen. 360px: keine horizontale Überlaufung gemessen. Auffällig: Tabellenüberschriften
  der Beispiele zeigen rohen LaTeX-Code („So findest du $\frac{3}{5}$“) auf Darstellen, Erweitern, Kürzen und Vergleichen.'
