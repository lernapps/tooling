    page: /brueche/anteile-erkennen/
    unit: Abbildung „Streifen 3 von 8“ mit Text
    level: 2
    evidence: Text „8 gleich große Teile … 3 Teile blau“ stimmt mit dem Bild und mit „3/8“ überein.
