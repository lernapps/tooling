units:
  - item: explainer-learner-start
    page: /brueche/anteile-erkennen/
    unit: Seite
    level: 1
    evidence:
      "Start gut: „Eine Pizza wird in 4 gleich große Stücke geschnitten, für 4 Kinder.“ Zähler/Nenner/Bruchstrich werden
      erklärt. Aber die Aufgabe „Ein Kuchen ist in 12 gleich große Stücke geschnitten … wenn du den Bruch nicht kürzt?“ nutzt
      „kürzt“, das die Seite nie erklärt (Kürzen kommt erst zwei Seiten später)."
  - item: explainer-representation-explained
    page: /brueche/anteile-erkennen/
    unit: Abbildung im Abschnitt „Anschaulich erklärt“ (Streifen 3 von 8)
    level: 2
    evidence:
      "Ganzes: „Das Ganze ist hier ein Streifen“, Bildunterschrift „Der ganze Streifen ist das Ganze. Zähle erst alle
      Teile, dann die blauen.“ Teile und blau erklärt („8 gleich große Teile … 3 Teile davon sind blau“), danach „Den blauen
      Anteil schreibst du als Bruch: 3/8“, Zähler/Nenner mit „hier 3“/„hier 8“. Figur zeigt 8 Teile, 3 blau."
  - item: explainer-representation-explained
    page: /brueche/anteile-erkennen/
    unit: Abbildungen der Übungen (Streifen 7/10, Pizza 5/6, Rechteck)
    level: 2
    evidence:
      "Jede Aufgabe nennt das Ganze in der Unterschrift („Der ganze Streifen/Die ganze runde Pizza/Das ganze Rechteck
      ist das Ganze“) und was blau bedeutet („Die blauen Stücke der Pizza sind schon gegessen“). Streifen: 10 Teile, 7 blau;
      Pizza: 6 Stücke, 5 blau; Rechteck: ungleiche Teile, durch Text „gleich große Teile“ vorbereitet."
