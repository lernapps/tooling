  - item: explainer-steps-explain
    page: /bewegung/wiederholung/
    unit: Beispiel „Ein Beispiel“ (12 m in 4 s)
    level: 2
    evidence: „Dann ist v = 12 m / 4 s = 3 m/s. Er legt in jeder Sekunde 3 m zurück.“ Zahlen eingesetzt, Bedeutung genannt.
  - item: explainer-steps-explain
    page: /bewegung/weg-zeit/
    unit: Beispiel Wagen X und Y
    level: 2
    evidence:
      „X kommt in 3 s genau 6 m weit, Y in 3 s genau 3 m … X fährt mit 2 m/s, Y mit 1 m/s.“ Begründung über die Steilheit,
      Werte ausgerechnet.
  - item: explainer-steps-explain
    page: /bewegung/weg-zeit/
    unit: Aufgabe „tempo-aus-diagramm“ (Erklärung)
    level: 2
    evidence:
      „Der Wagen kommt in 4 s genau 12 m weit. Mit v = s/t ergibt das 12 m / 4 s = 3 m/s.“ Falschantwort 2 wird begründet
      („Du hast durch 6 s geteilt“).
  - item: explainer-representation-explained
    page: /bewegung/weg-zeit/
    unit: Komponente „Tempo einstellen“ im Abschnitt „Ausprobieren“ (Bahn + Weg-Zeit-Diagramm)
    level: 2
    evidence:
      "Beantwortet: „Das Quadrat ist der Start“, „Die Punkte zeigen, wo er nach 0, 1, 2 bis 6 Sekunden ist“, Achsen
      bleiben fest, „Der Weg geht bis 24 m, so lang ist die Bahn“, Frage „Wie steil ist sie? Wo ist sie nach 6 s?“."
    did:
      Auf 0 gestellt (waagerechte Linie, Punkte übereinander), auf 4 gestellt (Linie bis 24 m), Zurücksetzen; 360 px ohne
      Überlauf.
  - item: explainer-control-purpose
    page: /bewegung/weg-zeit/
    unit: Komponente „Tempo einstellen“ im Abschnitt „Ausprobieren“ (Bahn + Weg-Zeit-Diagramm)
    level: 2
    evidence:
      "Mit − und + Tempo 0–4 m/s; Linie, Punkte auf der Bahn ändern sich sichtbar; Anzeige „Tempo: 0 m/s“ bis „4 m/s“;
      Startzustand 2 m/s als gerade Linie; Zurücksetzen."
    did:
      Auf 0 gestellt (waagerechte Linie, Punkte übereinander), auf 4 gestellt (Linie bis 24 m), Zurücksetzen; 360 px ohne
      Überlauf.
