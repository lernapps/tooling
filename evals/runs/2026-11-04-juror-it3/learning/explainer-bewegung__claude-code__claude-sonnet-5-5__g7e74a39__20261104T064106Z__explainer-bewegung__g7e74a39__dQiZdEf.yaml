    level: 2
    evidence: „Ausprobieren“ mit Schaltern; passt.
  - item: explainer-age-appropriate
    page: /bewegung/wiederholung/
    unit: Seite
    level: 2
    evidence: Kurz, „Du“-Ansprache, nüchtern; passt für Klasse 9/10 (etwas knapp).
  - item: explainer-age-appropriate
    page: /bewegung/aenderung/
    unit: Seite
    level: 2
    evidence: Beispiele Bus, Zug, Kreisverkehr; Sätze kurz, für Klasse 9–10 leicht, aber nicht kindisch.
  - item: explainer-age-appropriate
    page: /bewegung/weg-zeit/
    unit: Seite
    level: 2
    evidence: „Du siehst auf einen Blick…“; Wagen auf der Bahn; sachlich, leicht einfach, noch im Rahmen.
  - item: explainer-age-appropriate
    page: /bewegung/geschwindigkeit-zeit/
    unit: Seite
    level: 2
    evidence: Bus und Fahrrad; Tabelle, Notiz „Vorsicht“; passend.
  - item: explainer-age-appropriate
    page: /bewegung/richtung/
    unit: Seite
    level: 2
    evidence: Sachlich; „Hin und zurück“; passend.
  - item: explainer-age-appropriate
