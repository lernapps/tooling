units:
  - item: explainer-learner-start
    page: /bewegung/wiederholung/
    unit: Seite
    level: 2
    evidence:
      Beginnt mit „In Klasse 7 hast du die Geschwindigkeit kennengelernt“, nennt v, s, t und Einheiten, Beispiel 12
      m in 4 s.
  - item: explainer-learner-start
    page: /bewegung/aenderung/
    unit: Seite
    level: 2
    evidence:
      Beginnt mit „Du kennst die Geschwindigkeit als Weg pro Zeit“ und dem Alltag („Ein Bus fährt an, wird schneller,
      bremst … und biegt um die Ecke“); „Beschleunigen“ und „Abbremsen“ werden sofort definiert.
  - item: explainer-learner-start
    page: /bewegung/weg-zeit/
    unit: Seite
    level: 2
    evidence:
      "„Du kennst die Geschwindigkeit als Weg pro Zeit: v = s/t. Ein Wagen, der in 1 s genau 2 m weit kommt, fährt mit
      2 m/s.“ Achsen, Punkt und „Tempo“ werden erklärt, bevor sie gebraucht werden."
  - item: explainer-learner-start
    page: /bewegung/geschwindigkeit-zeit/
    unit: Seite
    level: 2
    evidence:
      "„Im Weg-Zeit-Diagramm hast du gesehen, wie weit ein Wagen vom Start entfernt ist. Jetzt zeichnen wir etwas anderes
      auf: wie schnell er zu jedem Zeitpunkt ist.“ Dann Definition, Tabelle des Busses, Figur."
  - item: explainer-learner-start
    page: /bewegung/richtung/
    unit: Seite
    level: 1
    evidence:
      „Ein Wagen kann vorwärts fahren und dann rückwärts … Wie zeigt das Diagramm den Wechsel?“ Der Einstieg ist kurz,
      aber „Weg“ negativ (Achse −12 bis 24 m im Weg-Zeit-Diagramm) kommt später ohne Erklärung, was ein negativer Weg heißt.
  - item: explainer-learner-start
    page: /bewegung/zusammen/
    unit: Seite
    level: 2
    evidence:
      „Zu jeder Fahrt gehören zwei Diagramme … Hier bringst du beide zusammen.“ Knüpft an die beiden Vorgängerseiten
      an; Tabelle fasst zusammen.
  - item: explainer-one-step
    page: /bewegung/wiederholung/
    unit: Seite
    level: 2
    evidence: Nur die Wiederholung von v = s/t, ein Beispiel.
  - item: explainer-one-step
    page: /bewegung/aenderung/
    unit: Seite
    level: 2
    evidence:
      "Ein Schritt: Tempo oder Richtung ändern sich. Ein Beispiel (Kreisverkehr). Allerdings widerspricht die Notiz
      „Die Bewegung ist beschleunigt“ auch bei Abbremsen und Kurve etwas der Definition „Beschleunigen heißt schneller werden“;
      ein Detail."
  - item: explainer-one-step
    page: /bewegung/weg-zeit/
    unit: Seite
    level: 2
    evidence: "Ein Schritt: Weg-Zeit-Diagramm lesen (Punkt, Steilheit). Nur gerade Linien. Ein Beispiel pro Kasten."
  - item: explainer-one-step
    page: /bewegung/geschwindigkeit-zeit/
    unit: Seite
    level: 2
    evidence: "Ein Schritt: v-t-Diagramm lesen und einstellen. Die Notiz grenzt es vom Weg-Zeit-Diagramm ab."
  - item: explainer-one-step
    page: /bewegung/richtung/
    unit: Seite
    level: 1
    evidence:
      Neben dem Minus-Tempo erscheint im Ausprobieren ein Weg-Zeit-Diagramm mit krummer Linie und Weg-Achse bis −12
      m. Die Seite erklärt nur gerade Linien bei gleichem Tempo; krumme Linien und negativen Weg erklärt erst die nächste Seite
      bzw. nie.
  - item: explainer-one-step
    page: /bewegung/zusammen/
    unit: Seite
    level: 2
    evidence: "Ein Schritt: beide Diagramme verbinden; krumme Weg-Zeit-Linien werden hier erstmals benannt („immer steiler“)."
  - item: explainer-honest-headings
    page: /bewegung/wiederholung/
    unit: Seite
    level: 2
    evidence: „Das weißt du schon“ passt.
  - item: explainer-honest-headings
    page: /bewegung/aenderung/
    unit: Seite
    level: 2
    evidence: "„Wenn das Tempo nicht gleich bleibt“, „Drei Fälle“, „Übung“: alle passend; kein „Ausprobieren“ ohne Bedienung."
  - item: explainer-honest-headings
    page: /bewegung/weg-zeit/
    unit: Seite
    level: 2
    evidence: „Ausprobieren“ enthält Tempo-Schalter +/−; alle Titel passend.
  - item: explainer-honest-headings
    page: /bewegung/geschwindigkeit-zeit/
    unit: Seite
    level: 2
    evidence: „Ausprobieren“ mit Schaltern pro Sekunde; passt.
  - item: explainer-honest-headings
    page: /bewegung/richtung/
    unit: Seite
    level: 2
    evidence: „Ausprobieren“ mit Schaltern; passt.
  - item: explainer-honest-headings
    page: /bewegung/zusammen/
