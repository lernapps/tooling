grade: 9-10
subject: physik
competencies:
  - geschwindigkeitsaenderung
  - bewegungsdiagramme
pages:
  - /bewegung/wiederholung/
  - /bewegung/aenderung/
  - /bewegung/weg-zeit/
  - /bewegung/geschwindigkeit-zeit/
