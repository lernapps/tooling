units:
  - item: explainer-page-goal
    page: /stromkreis/einfacher-stromkreis/
    unit: Seite
    level: 2
    evidence:
      „Danach kannst du einen einfachen Stromkreis aufbauen und erklären, warum er geschlossen sein muss“; knüpft an
      „Du hast schon einmal eine Lampe mit einer Batterie zum Leuchten gebracht“ an; Übungen prüfen genau das (offen/geschlossen).
  - item: explainer-learner-start
    page: /stromkreis/einfacher-stromkreis/
    unit: Seite
    level: 2
    evidence:
      Beginnt mit „Vielleicht hat eine Taschenlampe einmal nicht geleuchtet, obwohl die Batterie neu war“; „Pole“ wird
      beim ersten Gebrauch erklärt, „Stromkreis“ nach der Zeichnung definiert.
  - item: explainer-one-step
    page: /stromkreis/einfacher-stromkreis/
    unit: Seite
    level: 2
    evidence: "Eine neue Idee: geschlossener Kreis. Ein Beispiel pro Kasten."
  - item: explainer-exercise-progression
    page: /stromkreis/einfacher-stromkreis/
    unit: Übungen der Seite
    level: 2
    evidence:
      stromkreis-1 Zuordnen (Erkennen) → stromkreis-2 Aussage → stromkreis-3 Schaltungen vergleichen (Anwenden auf neue
      Zeichnungen) → stromkreis-4 Taschenlampe (neue Situation).
  - item: explainer-honest-headings
    page: /stromkreis/einfacher-stromkreis/
    unit: Seite
    level: 2
    evidence: "Alle Überschriften passen („Was du schon kennst“, „Beispiel: …“, „Übung“); „Ausprobieren“ kommt nicht vor."
  - item: explainer-age-appropriate
