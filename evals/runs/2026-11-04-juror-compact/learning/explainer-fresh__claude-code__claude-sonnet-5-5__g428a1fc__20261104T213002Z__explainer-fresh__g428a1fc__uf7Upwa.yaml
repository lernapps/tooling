  - item: explainer-page-goal
    page: /stromstaerke-spannung/stromstaerke/
    unit: Seite
    level: 1
    evidence:
      „Danach kannst du die Stromstärke … erklären, und sie in Ampere angeben“; Anknüpfung „Du kennst den Stromkreis“.
      Zwei der vier Übungen verlangen Umrechnen mA↔A und Vergleichen, das im Ziel nicht steht.
  - item: explainer-learner-start
    page: /stromstaerke-spannung/stromstaerke/
    unit: Seite
    level: 1
    evidence:
      Start mit Handy-Ladegerät und Wasserleitung ist da. Aber die Analogie „In der Leitung ist Wasser, das sich verbrauchen
      lässt“ ist irreführend (Wasser in einer geschlossenen Leitung verbraucht sich auch nicht) und verknüpft sich nicht sauber
      mit der Idee.
  - item: explainer-one-step
    page: /stromstaerke-spannung/stromstaerke/
    unit: Seite
    level: 1
    evidence:
      "Zwei Ideen: Stromstärke als Größe und Umrechnen mA↔A / Vergleichen verschiedener Einheiten („Wenn du von Milliampere
      in Ampere umrechnest, teilst du durch 1000“). Der Umrechnungsweg hat einen eigenen Abschnitt (Tabelle, Formel)."
  - item: explainer-exercise-progression
    page: /stromstaerke-spannung/stromstaerke/
    unit: Übungen der Seite
    level: 2
    evidence:
      staerke-1 Einheit (Erkennen) → staerke-2/-3 generierte Umrechnungen in beide Richtungen mit wechselnden Werten
      → staerke-4 Vergleich in Sachsituation.
