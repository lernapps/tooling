  - item: explainer-exercise-progression
    page: /stromkreis/schaltzeichen/
    unit: Übungen der Seite
    level: 1
    evidence: recognising/reading (matching A–D, gap); schaltplan-kreis asks to apply the criterion; no new plan.
  - item: explainer-exercise-progression
    page: /leiter/leiter-nichtleiter/
    unit: Übungen der Seite
    level: 1
    evidence: recognising (welche-leiten, gap) and application (kabel-huelle, wasser-leitet) – no other situation.
  - item: explainer-exercise-progression
    page: /strom-spannung/stromstaerke/
    unit: Übungen der Seite
    level: 2
    evidence: "recognising (matching, gap, true-false) and applying with a new value (ma-in-a: 0,25 A in mA)."
  - item: explainer-exercise-progression
    page: /strom-spannung/spannung/
    unit: Übungen der Seite
    level: 1
    evidence: recognising (matching, true-false) and ordering numbers (spannungen-ordnen); no new situation.
  - item: explainer-exercise-progression
    page: /strom-spannung/stromstaerke-messen/
    unit: Übungen der Seite
    level: 0
    evidence: all four exercises ask for repeated facts (how to connect, range, sign A).
  - item: explainer-exercise-progression
    page: /strom-spannung/spannung-messen/
    unit: Übungen der Seite
    level: 1
