b-process-guidance\n    bb-archetypes -->|\"if-lint-plugin\"| bb-lint-rules","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":52}},{"kind":"diagram","diagramType":"sequence","id":"rs-new-app-sequence","scenario":"rs-new-app","notation":"mermaid-sequence","aliases":"creator=actor-creator, assistant=actor-assistant, guidance=bb-process-guidance, generator=bb-generator, templates=bb-app-templates, skills=bb-skills, hooks=bb-git-hooks, check=bb-check-cli, ci=bb-app-check-action, listing=bb-listing-validation","source":"sequenceDiagram\n    participant creator as Creator\n    participant assistant as Assistant\n    participant guidance as AGENTS.md and plan\n    participant generator as Generator\n    participant templates as Templates\n    participant skills as Skills\n    participant hooks as Git hooks\n    participant check as Check CLI\n    participant ci as App check action\n    participant listing as Listing validation\n    assistant->>guidance: read AGENTS.md, start the plan file\n    assistant->>creator: Explore: purpose, learners, what the entry needs\n    creator->>assistant: answers, confirms the plan\n    assistant->>generator: lernapps create --archetype \u003cname>\n    generator->>templates: copy the archetype folder\n    assistant->>skills: load the skills of the archetype and topic\n    assistant->>hooks: commit\n    hooks->>check: lernapps check --pre-commit\n    assistant->>hooks: push\n    hooks->>check: lernapps check --pre-push (incl. end-to-end tests)\n    check-->>assistant: messages, or ok\n    assistant->>ci: pull request in the app repo\n    ci->>check: lernapps check (the same checks)\n    assistant->>creator: checkpoint: publish\n    assistant->>listing: entry from plan and report, pull request to lernapps/apps","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/06-runtime-view.arc42.md","line":23}},{"kind":"diagram","diagramType":"sequence","id":"rs-push-fails-sequence","scenario":"rs-push-fails","notation":"mermaid-sequence","aliases":"assistant=actor-assistant, hooks=bb-git-hooks, check=bb-check-cli, plan=bb-process-guidance","source":"sequenceDiagram\n    participant assistant as Assistant\n    participant hooks as Pre-push hook\n    participant check as Check CLI\n    participant plan as Plan file\n    assistant->>hooks: git push\n    hooks->>check: lernapps check --pre-push\n    check-->>hooks: error no-request-before-click, page, element, fix\n    hooks->>plan: prePushFailures + 1\n    hooks-->>assistant: push refused, message\n    assistant->>assistant: fix, commit (with the counter)\n    assistant->>hooks: git push\n    hooks->>check: lernapps check --pre-push\n    check-->>hooks: ok","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/06-runtime-view.arc42.md","line":75}},{"kind":"diagram","diagramType":"sequence","id":"rs-listing-validated-sequence","scenario":"rs-listing-validated","notation":"mermaid-sequence","aliases":"assistant=actor-assistant, listing=bb-listing-validation, check=bb-check-cli, review=actor-review-agent, procedure=bb-review-procedure, owner=actor-owner","source":"sequenceDiagram\n    participant assistant as Creator's assistant\n    participant listing as Listing validation\n    participant check as Check CLI\n    participant review as Review agent\n    participant procedure as Review procedure\n    participant owner as Owner\n    assistant->>listing: pull request with the entry\n    listing->>check: lernapps check \u003curl> --entry \u003cfile>\n    check-->>listing: validation report\n    listing-->>assistant: comment with the report (on failure)\n    assistant->>listing: fix, push again\n    listing->>check: second run\n    check-->>listing: report: rules kept, topic links resolve, fitness values match\n    owner->>review: start the review of the pull request\n    review->>procedure: prompt and rubric\n    review-->>owner: verdict for the reviewed commit\n    owner->>listing: merge or decline","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/06-runtime-view.arc42.md","line":116}},{"kind":"diagram","diagramType":"sequence","id":"rs-rule-changes-sequence","scenario":"rs-rule-changes","notation":"mermaid-sequence","aliases":"owner=actor-owner, package=bb-tooling-package, skills=bb-skills, lint=bb-lint-rules, check=bb-check-cli, procedure=bb-review-procedure, evals=bb-evals, github=actor-github","source":"sequenceDiagram\n    participant owner as Owner\n    participant skills as Skills\n    participant lint as Lint rules\n    participant check as Check CLI\n    participant procedure as Review rubric\n    participant package as Package build\n    participant evals as Evals\n    participant github as GitHub (Renovate)\n    owner->>check: pull request: new check for a recurring finding (same rule id)\n    owner->>procedure: remove the rubric item of that rule\n    package->>skills: read rule ids\n    package->>lint: read rule ids\n    package->>check: read rule ids\n    package->>procedure: read rule ids\n    package-->>owner: ids unique per artifact kind, every message linked\n    owner->>evals: run by hand with three assistants\n    evals-->>owner: scores per archetype\n    owner->>github: merge to main\n    github->>github: Renovate bumps the package in every app, merges when green","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/06-runtime-view.arc42.md","line":161}},{"kind":"diagram","diagramType":"deployment","view":"deployment","id":"deployment-overview","notation":"mermaid-architecture","roots":[],"aliases":"creator=dn-creator-machine, harness=dn-agent-harness, agents=dn-lernapps-agents, github=dn-github, toolingrepo=dn-tooling-repo, templaterepo=dn-templates-repo, appci=dn-app-ci, appsci=dn-apps-ci, generator=bb-generator, hooks=bb-git-hooks, checklocal=bb-check-cli, skills=bb-skills, guidance=bb-process-guidance, package=bb-tooling-package, templates=bb-app-templates, appcheck=bb-app-check-action, listing=bb-listing-validation, review=bb-review-procedure, evals=bb-evals","source":"architecture-beta\n    group creator(server)[Creator]\n    group harness(server)[Harness] in creator\n    group agents(server)[Agents]\n    group github(cloud)[GitHub]\n    group toolingrepo(disk)[tooling] in github\n    group templaterepo(disk)[templates] in github\n    group appci(server)[AppCI] in github\n    group appsci(server)[AppsCI] in github\n    service guidance(server)[Guidance] in harness\n    service skills(server)[Skills] in harness\n    service generator(server)[Generator] in creator\n    service hooks(server)[Hooks] in creator\n    service checklocal(server)[Check] in creator\n    service review(server)[Review] in agents\n    service evals(server)[Evals] in agents\n    service package(disk)[Package] in toolingrepo\n    service templates(disk)[Templates] in templaterepo\n    service appcheck(server)[AppCheck] in appci\n    service listing(server)[Listing] in appsci\n    generator:R --> L:package\n    generator:B --> T:templates\n    hooks:R --> L:checklocal\n    appcheck:L --> R:package\n    listing:T --> B:package\n    review:R --> L:listing","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/07-deployment-view.arc42.md","line":11}}],"documents":[{"filePath":"/home/runner/work/tooling/tooling/docs/arc42/01-introduction-and-goals.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Introduction and Goals","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>This architecture describes the tooling with which a creator builds a learning app together with their AI agent,\nso that it comes out static, frontend-only, collecting nothing, accessible and ready to list on lernapps.net. It\nrealises the platform&#39;s \u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-building-guidance\">guidance for building apps\u003c/a>, the &quot;agent guidance and starter templates&quot;\nof the \u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d1-ecosystem.pdt42.md:el-platform-lernapps\">platform\u003c/a>.\u003c/p>\n\u003cp>The tooling also holds what this repo already provides for every lernapps.net site (the site actions and the\nRenovate preset). This document covers the app-creation tooling; the site actions appear only where the apps use them.\u003c/p>\n"},{"kind":"prose","text":"This architecture describes the tooling with which a creator builds a learning app together with their AI agent,","line":3,"renderedHtml":""},{"kind":"prose","text":"so that it comes out static, frontend-only, collecting nothing, accessible and ready to list on lernapps.net. It","line":4,"renderedHtml":""},{"kind":"prose","text":"realises the platform's [guidance for building apps](https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-building-guidance), the \"agent guidance and starter templates\"","line":5,"renderedHtml":""},{"kind":"prose","text":"of the [platform](https://lernapps.net/docs/platform-design/#2-design/d1-ecosystem.pdt42.md:el-platform-lernapps).","line":6,"renderedHtml":""},{"kind":"prose","text":"","line":7,"renderedHtml":""},{"kind":"prose","text":"The tooling also holds what this repo already provides for every lernapps.net site (the site actions and the","line":8,"renderedHtml":""},{"kind":"prose","text":"Renovate preset). This document covers the app-creation tooling; the site actions appear only where the apps use them.","line":9,"renderedHtml":""},{"kind":"prose","text":"","line":10,"renderedHtml":""},{"kind":"heading","level":2,"text":"1.1 Requirements Overview","line":11},{"kind":"prose","text":"","line":12,"renderedHtml":"\u003cp>The platform&#39;s main job is that adults find the right app. A creator, typically a teacher or a parent, has an idea for a small learning app and an AI assistant that writes\nthe code. The creator is usually not a professional developer. The tooling carries the rules in scope for the app\n(chapter 8, rule catalog) into the assistant&#39;s work, so that the creator does not need to know them, and shows before\nlisting that the app keeps them.\u003c/p>\n\u003cp>The creator&#39;s journey has five steps. Process guidance runs through all of them: the assistant follows the phases of\na plan file (Explore, Plan, Code, Commit) that the creator can read, and stops at the creator&#39;s checkpoints.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Step\u003c/th>\n\u003cth>Phase\u003c/th>\n\u003cth>What the tooling does\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>UC-1\u003c/td>\n\u003ctd>Clarify the app\u003c/td>\n\u003ctd>Explore\u003c/td>\n\u003ctd>The assistant asks what the app is for, for whom and what the catalog needs to know to help adults find it, and chooses the archetype. No code yet\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UC-2\u003c/td>\n\u003ctd>Set up\u003c/td>\n\u003ctd>Plan → Code\u003c/td>\n\u003ctd>Once the creator confirms the plan, the assistant generates the scaffold of the archetype: toolchain, strict TypeScript, git hooks, end-to-end tests, i18n and a11y in place\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UC-3\u003c/td>\n\u003ctd>Build\u003c/td>\n\u003ctd>Code\u003c/td>\n\u003ctd>The assistant follows the skills (general, per archetype, per topic) and gets fast feedback from one check command, run by the git hooks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UC-4\u003c/td>\n\u003ctd>Validate\u003c/td>\n\u003ctd>Commit\u003c/td>\n\u003ctd>The same deterministic checks run on the built or deployed app; a review agent in a fresh context judges what they cannot decide; the report is bound to one commit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UC-5\u003c/td>\n\u003ctd>List\u003c/td>\n\u003ctd>Commit\u003c/td>\n\u003ctd>The assistant fetches the entry schema of the app overview, fills it from the plan and the validation report, so that the entry describes the app as adults search for it, and opens a pull request to lernapps/apps\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Apps come in a few kinds, called archetypes, named after their character (for example content-heavy pages, an\ninteractive single-page app, a quiz). The architecture treats the archetype as a variation point: a template, a\npreset, skills and rules per archetype. Which archetypes exist, and what each one contains, is decided outside this\ndocument. All apps are written in TypeScript, strictly enforced.\u003c/p>\n\u003cp>Not part of the tooling: showing a catalog entry as a fact sheet of an app deployed elsewhere, and re-validating\nlisted apps over time. Both belong to the app overview; the tooling makes them possible by binding every validation\nreport to a commit.\u003c/p>\n"},{"kind":"prose","text":"The platform's main job is that adults find the right app. A creator, typically a teacher or a parent, has an idea for a small learning app and an AI assistant that writes","line":13,"renderedHtml":""},{"kind":"prose","text":"the code. The creator is usually not a professional developer. The tooling carries the rules in scope for the app","line":14,"renderedHtml":""},{"kind":"prose","text":"(chapter 8, rule catalog) into the assistant's work, so that the creator does not need to know them, and shows before","line":15,"renderedHtml":""},{"kind":"prose","text":"listing that the app keeps them.","line":16,"renderedHtml":""},{"kind":"prose","text":"","line":17,"renderedHtml":""},{"kind":"prose","text":"The creator's journey has five steps. Process guidance runs through all of them: the assistant follows the phases of","line":18,"renderedHtml":""},{"kind":"prose","text":"a plan file (Explore, Plan, Code, Commit) that the creator can read, and stops at the creator's checkpoints.","line":19,"renderedHtml":""},{"kind":"prose","text":"","line":20,"renderedHtml":""},{"kind":"prose","text":"| # | Step | Phase | What the tooling does |","line":21,"renderedHtml":""},{"kind":"prose","text":"|---|---|---|---|","line":22,"renderedHtml":""},{"kind":"prose","text":"| UC-1 | Clarify the app | Explore | The assistant asks what the app is for, for whom and what the catalog needs to know to help adults find it, and chooses the archetype. No code yet |","line":23,"renderedHtml":""},{"kind":"prose","text":"| UC-2 | Set up | Plan → Code | Once the creator confirms the plan, the assistant generates the scaffold of the archetype: toolchain, strict TypeScript, git hooks, end-to-end tests, i18n and a11y in place |","line":24,"renderedHtml":""},{"kind":"prose","text":"| UC-3 | Build | Code | The assistant follows the skills (general, per archetype, per topic) and gets fast feedback from one check command, run by the git hooks |","line":25,"renderedHtml":""},{"kind":"prose","text":"| UC-4 | Validate | Commit | The same deterministic checks run on the built or deployed app; a review agent in a fresh context judges what they cannot decide; the report is bound to one commit |","line":26,"renderedHtml":""},{"kind":"prose","text":"| UC-5 | List | Commit | The assistant fetches the entry schema of the app overview, fills it from the plan and the validation report, so that the entry describes the app as adults search for it, and opens a pull request to lernapps/apps |","line":27,"renderedHtml":""},{"kind":"prose","text":"","line":28,"renderedHtml":""},{"kind":"prose","text":"Apps come in a few kinds, called archetypes, named after their character (for example content-heavy pages, an","line":29,"renderedHtml":""},{"kind":"prose","text":"interactive single-page app, a quiz). The architecture treats the archetype as a variation point: a template, a","line":30,"renderedHtml":""},{"kind":"prose","text":"preset, skills and rules per archetype. Which archetypes exist, and what each one contains, is decided outside this","line":31,"renderedHtml":""},{"kind":"prose","text":"document. All apps are written in TypeScript, strictly enforced.","line":32,"renderedHtml":""},{"kind":"prose","text":"","line":33,"renderedHtml":""},{"kind":"prose","text":"Not part of the tooling: showing a catalog entry as a fact sheet of an app deployed elsewhere, and re-validating","line":34,"renderedHtml":""},{"kind":"prose","text":"listed apps over time. Both belong to the app overview; the tooling makes them possible by binding every validation","line":35,"renderedHtml":""},{"kind":"prose","text":"report to a commit.","line":36,"renderedHtml":""},{"kind":"prose","text":"","line":37,"renderedHtml":""},{"kind":"heading","level":2,"text":"1.2 Quality Goals","line":38},{"kind":"prose","text":"","line":39,"renderedHtml":"\u003cp>Grounded in the platform design: building is simple with the guidance; listing takes minutes, and listings help\nadults find the right app; what an app sends is checked, not declared; nothing is collected in secret, neither by the apps nor by the tooling. Fewer\niterations for the assistant (cost), working through any assistant, and guidance that evolves with creators&#39;\npractices follow with medium priority.\u003c/p>\n\u003cp>See \u003ca href=\"10-quality-requirements.arc42.md\">10-quality-requirements.arc42.md\u003c/a> for the complete\nquality catalog with priorities and measurable scenarios.\u003c/p>\n"},{"kind":"prose","text":"Grounded in the platform design: building is simple with the guidance; listing takes minutes, and listings help","line":40,"renderedHtml":""},{"kind":"prose","text":"adults find the right app; what an app sends is checked, not declared; nothing is collected in secret, neither by the apps nor by the tooling. Fewer","line":41,"renderedHtml":""},{"kind":"prose","text":"iterations for the assistant (cost), working through any assistant, and guidance that evolves with creators'","line":42,"renderedHtml":""},{"kind":"prose","text":"practices follow with medium priority.","line":43,"renderedHtml":""},{"kind":"prose","text":"","line":44,"renderedHtml":""},{"kind":"prose","text":"See [10-quality-requirements.arc42.md](10-quality-requirements.arc42.md) for the complete","line":45,"renderedHtml":""},{"kind":"prose","text":"quality catalog with priorities and measurable scenarios.","line":46,"renderedHtml":""},{"kind":"prose","text":"","line":47,"renderedHtml":""},{"kind":"heading","level":2,"text":"1.3 Stakeholders","line":48},{"kind":"prose","text":"","line":49,"renderedHtml":"\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Role\u003c/th>\n\u003cth>Contact\u003c/th>\n\u003cth>Expectations\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Creator\u003c/td>\n\u003ctd>teachers, parents, students who build an app\u003c/td>\n\u003ctd>Gets from an idea to a listed app in little time, without knowing the platform&#39;s rules or the toolchain; stays in control at a few clear decisions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Creator&#39;s AI agent\u003c/td>\n\u003ctd>Claude Code, Codex, Gemini CLI and others; chat assistants without a shell\u003c/td>\n\u003ctd>Reaches a working, listable app in few iterations: clear next step, fast feedback, error messages that say how to fix a problem (\u003ca href=\"https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants\">AI assistants\u003c/a>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Platform owner\u003c/td>\n\u003ctd>Oliver Jägle (\u003ca href=\"https://github.com/mrsimpson\">@mrsimpson\u003c/a>)\u003c/td>\n\u003ctd>Decides whether an app is listed; needs a validation to trust without reading every app; guidance that improves from what the reviews find\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Review agent\u003c/td>\n\u003ctd>agent run by the platform in a fresh context\u003c/td>\n\u003ctd>A defined procedure, the deterministic checks as a starting point, a rubric per archetype\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Adopting adults\u003c/td>\n\u003ctd>teachers and parents who use the app overview\u003c/td>\n\u003ctd>Can trust the fitness signal of an entry: measured, not self-declared\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Learners\u003c/td>\n\u003ctd>students, indirectly\u003c/td>\n\u003ctd>Apps that run at once, collect nothing, and work with assistive technology and on a phone\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Maintainers of the shared repos\u003c/td>\n\u003ctd>\u003ccode>@lernapps/maintainers\u003c/code>\u003c/td>\n\u003ctd>Few moving parts; one place per rule; Renovate carries changes to every repo\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"kind":"prose","text":"| Role | Contact | Expectations |","line":50,"renderedHtml":""},{"kind":"prose","text":"|---|---|---|","line":51,"renderedHtml":""},{"kind":"prose","text":"| Creator | teachers, parents, students who build an app | Gets from an idea to a listed app in little time, without knowing the platform's rules or the toolchain; stays in control at a few clear decisions |","line":52,"renderedHtml":""},{"kind":"prose","text":"| Creator's AI agent | Claude Code, Codex, Gemini CLI and others; chat assistants without a shell | Reaches a working, listable app in few iterations: clear next step, fast feedback, error messages that say how to fix a problem ([AI assistants](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants)) |","line":53,"renderedHtml":""},{"kind":"prose","text":"| Platform owner | Oliver Jägle ([@mrsimpson](https://github.com/mrsimpson)) | Decides whether an app is listed; needs a validation to trust without reading every app; guidance that improves from what the reviews find |","line":54,"renderedHtml":""},{"kind":"prose","text":"| Review agent | agent run by the platform in a fresh context | A defined procedure, the deterministic checks as a starting point, a rubric per archetype |","line":55,"renderedHtml":""},{"kind":"prose","text":"| Adopting adults | teachers and parents who use the app overview | Can trust the fitness signal of an entry: measured, not self-declared |","line":56,"renderedHtml":""},{"kind":"prose","text":"| Learners | students, indirectly | Apps that run at once, collect nothing, and work with assistive technology and on a phone |","line":57,"renderedHtml":""},{"kind":"prose","text":"| Maintainers of the shared repos | `@lernapps/maintainers` | Few moving parts; one place per rule; Renovate carries changes to every repo |","line":58,"renderedHtml":""},{"kind":"prose","text":"","line":59,"renderedHtml":""}]},{"filePath":"/home/runner/work/tooling/tooling/docs/arc42/02-constraints.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Architecture Constraints","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>The constraints come from the platform design, the organisation&#39;s rules across repos\n(\u003ca href=\"https://github.com/lernapps/.github/blob/main/ORGANIZATION.md\">ORGANIZATION.md\u003c/a>) and the owner&#39;s decisions. They\napply to the tooling and, through it, to every app built with it.\u003c/p>\n"},{"kind":"prose","text":"The constraints come from the platform design, the organisation's rules across repos","line":3,"renderedHtml":""},{"kind":"prose","text":"([ORGANIZATION.md](https://github.com/lernapps/.github/blob/main/ORGANIZATION.md)) and the owner's decisions. They","line":4,"renderedHtml":""},{"kind":"prose","text":"apply to the tooling and, through it, to every app built with it.","line":5,"renderedHtml":""},{"kind":"prose","text":"","line":6,"renderedHtml":""},{"kind":"heading","level":2,"text":"Apps are static and frontend-only","line":7},{"kind":"prose","text":"","line":8,"renderedHtml":"\u003cp>The apps collect nothing and stay fully frontend-only: there is no hidden data collection on the platform\n(\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-feedback\">returning use and praise to creators\u003c/a>). They have no backend of their own and\nsend nothing to a server; storage is at most on the learner&#39;s device.\u003c/p>\n"},{"kind":"prose","text":"The apps collect nothing and stay fully frontend-only: there is no hidden data collection on the platform","line":9,"renderedHtml":""},{"kind":"prose","text":"([returning use and praise to creators](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-feedback)). They have no backend of their own and","line":10,"renderedHtml":""},{"kind":"prose","text":"send nothing to a server; storage is at most on the learner's device.","line":11,"renderedHtml":""},{"kind":"prose","text":"","line":12,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-frontend-only","title":"Apps are static and frontend-only","category":"technical","source":"Platform design; listing criteria of the app overview"},"startLine":14,"endLine":19,"inArc42Fence":true},{"kind":"prose","text":"","line":21,"renderedHtml":""},{"kind":"heading","level":2,"text":"Rules for every page","line":22},{"kind":"prose","text":"","line":23,"renderedHtml":"\u003cp>Every page in every repo of the organisation sets no cookies, does no tracking and sends no requests to other servers\nbefore a click; it is readable without JavaScript, meets WCAG 2.1 AA and is usable at 360 px. Pages on lernapps.net\nlink the imprint and the privacy notice. Archetypes that cannot be read without JavaScript as a whole keep a\nreadable start page.\u003c/p>\n"},{"kind":"prose","text":"Every page in every repo of the organisation sets no cookies, does no tracking and sends no requests to other servers","line":24,"renderedHtml":""},{"kind":"prose","text":"before a click; it is readable without JavaScript, meets WCAG 2.1 AA and is usable at 360 px. Pages on lernapps.net","line":25,"renderedHtml":""},{"kind":"prose","text":"link the imprint and the privacy notice. Archetypes that cannot be read without JavaScript as a whole keep a","line":26,"renderedHtml":""},{"kind":"prose","text":"readable start page.","line":27,"renderedHtml":""},{"kind":"prose","text":"","line":28,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-page-rules","title":"Rules for every page","category":"convention","source":"ORGANIZATION.md \"Every page, in every repo\""},"startLine":30,"endLine":35,"inArc42Fence":true},{"kind":"prose","text":"","line":37,"renderedHtml":""},{"kind":"heading","level":2,"text":"GitHub is the means of production","line":38},{"kind":"prose","text":"","line":39,"renderedHtml":"\u003cp>The platform runs on GitHub: repositories, pull requests, GitHub Actions, GitHub Pages and Renovate\n(\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d1-ecosystem.pdt42.md:el-platform-lernapps\">platform\u003c/a>). Only the owner creates repositories in the organisation; a repo named \u003ccode>x\u003c/code> with Pages is served\nat \u003ccode>lernapps.net/x/\u003c/code>. Actions are pinned to full commit SHAs and updated by Renovate.\u003c/p>\n"},{"kind":"prose","text":"The platform runs on GitHub: repositories, pull requests, GitHub Actions, GitHub Pages and Renovate","line":40,"renderedHtml":""},{"kind":"prose","text":"([platform](https://lernapps.net/docs/platform-design/#2-design/d1-ecosystem.pdt42.md:el-platform-lernapps)). Only the owner creates repositories in the organisation; a repo named `x` with Pages is served","line":41,"renderedHtml":""},{"kind":"prose","text":"at `lernapps.net/x/`. Actions are pinned to full commit SHAs and updated by Renovate.","line":42,"renderedHtml":""},{"kind":"prose","text":"","line":43,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-github","title":"GitHub is the means of production","category":"organizational","source":"Platform design; ORGANIZATION.md \"Rules across repos\""},"startLine":45,"endLine":50,"inArc42Fence":true},{"kind":"prose","text":"","line":52,"renderedHtml":""},{"kind":"heading","level":2,"text":"One owner, little time, no money","line":53},{"kind":"prose","text":"","line":54,"renderedHtml":"\u003cp>The platform is free, pays no one and has one owner whose time is the cost of maintaining the guidance\n(\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d7-experiences.pdt42.md:el-x-list-and-hear-back\">list an app and hear it is used\u003c/a>). There is no budget for paid services; the platform&#39;s only\nservice is a small one for anonymous thanks and feedback.\u003c/p>\n"},{"kind":"prose","text":"The platform is free, pays no one and has one owner whose time is the cost of maintaining the guidance","line":55,"renderedHtml":""},{"kind":"prose","text":"([list an app and hear it is used](https://lernapps.net/docs/platform-design/#2-design/d7-experiences.pdt42.md:el-x-list-and-hear-back)). There is no budget for paid services; the platform's only","line":56,"renderedHtml":""},{"kind":"prose","text":"service is a small one for anonymous thanks and feedback.","line":57,"renderedHtml":""},{"kind":"prose","text":"","line":58,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-one-owner","title":"One owner, little time, no money","category":"organizational","source":"Platform design; GOVERNANCE.md"},"startLine":60,"endLine":65,"inArc42Fence":true},{"kind":"prose","text":"","line":67,"renderedHtml":""},{"kind":"heading","level":2,"text":"The listing is one entry in lernapps/apps","line":68},{"kind":"prose","text":"","line":69,"renderedHtml":"\u003cp>An app connects to the platform in one way only: its entry in the app overview links to it. The entry schema is owned\nby lernapps/apps and published as JSON Schema; the owner decides whether an app is listed.\u003c/p>\n"},{"kind":"prose","text":"An app connects to the platform in one way only: its entry in the app overview links to it. The entry schema is owned","line":70,"renderedHtml":""},{"kind":"prose","text":"by lernapps/apps and published as JSON Schema; the owner decides whether an app is listed.","line":71,"renderedHtml":""},{"kind":"prose","text":"","line":72,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-entry-schema","title":"The listing is one entry in lernapps/apps","category":"organizational","source":"ORGANIZATION.md \"Apps and the app overview\""},"startLine":74,"endLine":79,"inArc42Fence":true},{"kind":"prose","text":"","line":81,"renderedHtml":""},{"kind":"heading","level":2,"text":"Languages and licence","line":82},{"kind":"prose","text":"","line":83,"renderedHtml":"\u003cp>Shared infrastructure is in English: names, identifiers, schemas, workflows, developer docs. Texts for learners,\nteachers and parents are German, in plain language (ISO 24495-1). The tooling and apps generated from it are MIT\nlicensed; third-party content keeps its own licence and is named next to it.\u003c/p>\n"},{"kind":"prose","text":"Shared infrastructure is in English: names, identifiers, schemas, workflows, developer docs. Texts for learners,","line":84,"renderedHtml":""},{"kind":"prose","text":"teachers and parents are German, in plain language (ISO 24495-1). The tooling and apps generated from it are MIT","line":85,"renderedHtml":""},{"kind":"prose","text":"licensed; third-party content keeps its own licence and is named next to it.","line":86,"renderedHtml":""},{"kind":"prose","text":"","line":87,"renderedHtml":""},{"kind":"block","blockType":"constraint","attributes":{"id":"con-language-licence","title":"Languages and licence","category":"convention","source":"ORGANIZATION.md \"Language\", \"License\""},"startLine":89,"endLine":94,"inArc42Fence":true},{"kind":"prose","text":"","line":96,"renderedHtml":""}]},{"filePath":"/home/runner/work/tooling/tooling/docs/arc42/03-system-context.arc42.md","nodes":[{"kind":"heading","level":1,"text":"System Scope and Context","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>The system is the tooling for building, validating and listing apps: process guidance, generator and archetype\npresets, skills, checks, the validation and its report. It lives mostly in lernapps/tooling, with the archetype templates in\nlernapps/app-templates and the listing validation in lernapps/apps (chapter 5).\u003c/p>\n\u003cp>Outside the system: the people and assistants who use it, GitHub where it runs, and the parts of lernapps.net it\ndepends on but does not own. The shared site frame (\u003ccode>@lernapps/site\u003c/code> in lernapps.github.io) gives apps on\nlernapps.net their header, footer and the site check; the entry schema belongs to lernapps/apps; apps are hosted on\nlernapps.net&#39;s GitHub Pages or anywhere else.\u003c/p>\n"},{"kind":"prose","text":"The system is the tooling for building, validating and listing apps: process guidance, generator and archetype","line":3,"renderedHtml":""},{"kind":"prose","text":"presets, skills, checks, the validation and its report. It lives mostly in lernapps/tooling, with the archetype templates in","line":4,"renderedHtml":""},{"kind":"prose","text":"lernapps/app-templates and the listing validation in lernapps/apps (chapter 5).","line":5,"renderedHtml":""},{"kind":"prose","text":"","line":6,"renderedHtml":""},{"kind":"prose","text":"Outside the system: the people and assistants who use it, GitHub where it runs, and the parts of lernapps.net it","line":7,"renderedHtml":""},{"kind":"prose","text":"depends on but does not own. The shared site frame (`@lernapps/site` in lernapps.github.io) gives apps on","line":8,"renderedHtml":""},{"kind":"prose","text":"lernapps.net their header, footer and the site check; the entry schema belongs to lernapps/apps; apps are hosted on","line":9,"renderedHtml":""},{"kind":"prose","text":"lernapps.net's GitHub Pages or anywhere else.","line":10,"renderedHtml":""},{"kind":"prose","text":"","line":11,"renderedHtml":""},{"kind":"heading","level":2,"text":"Context overview","line":12},{"kind":"prose","text":"","line":13,"renderedHtml":""},{"kind":"diagram","diagramType":"context","view":"context","id":"context-overview","notation":"mermaid","roots":[],"aliases":"","source":"flowchart LR\n    actor-creator[\"Creator\"]\n    actor-assistant[\"Creator's AI assistant\"]\n    actor-owner[\"Platform owner\"]\n    actor-review-agent[\"Review agent\"]\n    actor-github[\"GitHub (Actions, Renovate)\"]\n    subgraph tooling[\"Tooling for agentic app creation\"]\n        bb-process-guidance[\"Process guidance\"]\n        bb-generator[\"Generator\"]\n        bb-skills[\"Skills\"]\n        bb-check-cli[\"Check CLI\"]\n        bb-archetypes[\"Archetype presets\"]\n        bb-review-procedure[\"Review procedure\"]\n        bb-app-check-action[\"App check action\"]\n        bb-listing-validation[\"Listing validation\"]\n    end\n    actor-creator -->|\"plan file, checkpoints\"| tooling\n    actor-assistant -->|\"AGENTS.md, skills, generator, check CLI, listing comment\"| tooling\n    actor-review-agent -->|\"review procedure, check CLI\"| tooling\n    actor-owner -->|\"validation report, review procedure\"| tooling\n    actor-github -->|\"app check action, package updates\"| tooling","startLine":15,"endLine":44},{"kind":"prose","text":"","line":45,"renderedHtml":""},{"kind":"heading","level":2,"text":"Creator","line":46},{"kind":"prose","text":"","line":47,"renderedHtml":"\u003cp>A teacher, parent or student who builds an app for a gap they noticed (\u003ca href=\"https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-creators\">app creators\u003c/a>). They talk to their assistant,\nread the plan file and confirm it; after that, they are asked only at the checkpoints. They never need to know the\nrules or the toolchain.\u003c/p>\n"},{"kind":"prose","text":"A teacher, parent or student who builds an app for a gap they noticed ([app creators](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-creators)). They talk to their assistant,","line":48,"renderedHtml":""},{"kind":"prose","text":"read the plan file and confirm it; after that, they are asked only at the checkpoints. They never need to know the","line":49,"renderedHtml":""},{"kind":"prose","text":"rules or the toolchain.","line":50,"renderedHtml":""},{"kind":"prose","text":"","line":51,"renderedHtml":""},{"kind":"block","blockType":"actor","attributes":{"id":"actor-creator","title":"Creator","type":"person","description":"Builds an app with their AI assistant; reads and confirms the plan","requires":"if-plan-file"},"startLine":53,"endLine":59,"inArc42Fence":true},{"kind":"prose","text":"","line":61,"renderedHtml":""},{"kind":"heading","level":2,"text":"Creator's AI assistant","line":62},{"kind":"prose","text":"","line":63,"renderedHtml":"\u003cp>Claude Code, Codex, Gemini CLI or another agent, chosen by the creator (\u003ca href=\"https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants\">AI assistants\u003c/a>). It reads \u003ccode>AGENTS.md\u003c/code>,\nwrites the plan, runs the generator, follows the skills, reacts to the checks and fills the entry. It is a partner the\nplatform designs for, not part of the system.\u003c/p>\n"},{"kind":"prose","text":"Claude Code, Codex, Gemini CLI or another agent, chosen by the creator ([AI assistants](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants)). It reads `AGENTS.md`,","line":64,"renderedHtml":""},{"kind":"prose","text":"writes the plan, runs the generator, follows the skills, reacts to the checks and fills the entry. It is a partner the","line":65,"renderedHtml":""},{"kind":"prose","text":"platform designs for, not part of the system.","line":66,"renderedHtml":""},{"kind":"prose","text":"","line":67,"renderedHtml":""},{"kind":"block","blockType":"actor","attributes":{"id":"actor-assistant","title":"Creator's AI assistant","type":"system","description":"Any coding agent; works from plain files and CLIs, no MCP server required","requires":"if-agents-md, if-plan-file, if-generator-cli, if-skills, if-check-cli, if-listing-comment"},"startLine":69,"endLine":75,"inArc42Fence":true},{"kind":"prose","text":"","line":77,"renderedHtml":""},{"kind":"heading","level":2,"text":"Platform owner","line":78},{"kind":"prose","text":"","line":79,"renderedHtml":"\u003cp>Decides whether an app is listed, maintains the rules and runs the review and the evals (one owner,\n\u003ccode>con-one-owner\u003c/code>). Reads the validation report and the retrospective.\u003c/p>\n"},{"kind":"prose","text":"Decides whether an app is listed, maintains the rules and runs the review and the evals (one owner,","line":80,"renderedHtml":""},{"kind":"prose","text":"`con-one-owner`). Reads the validation report and the retrospective.","line":81,"renderedHtml":""},{"kind":"prose","text":"","line":82,"renderedHtml":""},{"kind":"block","blockType":"actor","attributes":{"id":"actor-owner","title":"Platform owner","type":"person","description":"Decides listing, maintains the rules, runs review and evals","requires":"if-validation-report, if-review-procedure"},"startLine":84,"endLine":90,"inArc42Fence":true},{"kind":"prose","text":"","line":92,"renderedHtml":""},{"kind":"heading","level":2,"text":"Review agent","line":93},{"kind":"prose","text":"","line":94,"renderedHtml":"\u003cp>An agent in a fresh context, run by the owner. It follows the review procedure,\nstarts from the check CLI&#39;s report and judges what the checks cannot decide.\u003c/p>\n"},{"kind":"prose","text":"An agent in a fresh context, run by the owner. It follows the review procedure,","line":95,"renderedHtml":""},{"kind":"prose","text":"starts from the check CLI's report and judges what the checks cannot decide.","line":96,"renderedHtml":""},{"kind":"prose","text":"","line":97,"renderedHtml":""},{"kind":"block","blockType":"actor","attributes":{"id":"actor-review-agent","title":"Review agent","type":"system","description":"Fresh-context agent that validates an app before listing","requires":"if-review-procedure, if-check-cli, if-validation-report"},"startLine":99,"endLine":105,"inArc42Fence":true},{"kind":"prose","text":"","line":107,"renderedHtml":""},{"kind":"heading","level":2,"text":"GitHub","line":108},{"kind":"prose","text":"","line":109,"renderedHtml":"\u003cp>Runs the app repo&#39;s workflows and the listing validation in lernapps/apps (GitHub Actions), serves Pages, and keeps\nevery app&#39;s tooling current (Renovate with the organisation&#39;s preset).\u003c/p>\n"},{"kind":"prose","text":"Runs the app repo's workflows and the listing validation in lernapps/apps (GitHub Actions), serves Pages, and keeps","line":110,"renderedHtml":""},{"kind":"prose","text":"every app's tooling current (Renovate with the organisation's preset).","line":111,"renderedHtml":""},{"kind":"prose","text":"","line":112,"renderedHtml":""},{"kind":"block","blockType":"actor","attributes":{"id":"actor-github","title":"GitHub (Actions, Pages, Renovate)","type":"system","description":"Runs CI and the listing validation; Renovate bumps the tooling package in every app","requires":"if-app-check-action, if-archetype-preset"},"startLine":114,"endLine":120,"inArc42Fence":true},{"kind":"prose","text":"","line":122,"renderedHtml":""}]},{"filePath":"/home/runner/work/tooling/tooling/docs/arc42/04-solution-strategy.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Solution Strategy","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>The tooling follows the creator&#39;s journey. Each step has its own approach; three principles hold across all of\nthem: everything the assistant needs is a plain file or a command, everything an app uses comes from one versioned\npackage, and nothing leaves the creator&#39;s side unless they submit a listing.\u003c/p>\n"},{"kind":"prose","text":"The tooling follows the creator's journey. Each step has its own approach; three principles hold across all of","line":3,"renderedHtml":""},{"kind":"prose","text":"them: everything the assistant needs is a plain file or a command, everything an app uses comes from one versioned","line":4,"renderedHtml":""},{"kind":"prose","text":"package, and nothing leaves the creator's side unless they submit a listing.","line":5,"renderedHtml":""},{"kind":"prose","text":"","line":6,"renderedHtml":""},{"kind":"block","blockType":"solution-strategy","attributes":{"id":"strategy-architecture","title":"Follow the creator's journey; plain files, one package, nothing leaves unasked","addresses":"qg-simple-to-build, qg-list-in-minutes, qg-findable, qg-checked-not-declared, qg-nothing-collected, qg-few-iterations, qg-any-assistant, qg-guidance-evolves"},"startLine":8,"endLine":12,"inArc42Fence":true},{"kind":"prose","text":"","line":14,"renderedHtml":""},{"kind":"heading","level":2,"text":"Clarify: the plan file asks first","line":15},{"kind":"prose","text":"","line":16,"renderedHtml":"\u003cp>The assistant starts a plan file before it writes code and works through its phases (Explore, Plan, Code, Commit).\nIn Explore it asks the creator what the app is for and for whom, fetches the entry schema of the app overview and\nasks what the schema needs to help adults find the app. From the answers it chooses the archetype. The creator\nconfirms the plan; from then on the assistant works on its own.\u003c/p>\n"},{"kind":"prose","text":"The assistant starts a plan file before it writes code and works through its phases (Explore, Plan, Code, Commit).","line":17,"renderedHtml":""},{"kind":"prose","text":"In Explore it asks the creator what the app is for and for whom, fetches the entry schema of the app overview and","line":18,"renderedHtml":""},{"kind":"prose","text":"asks what the schema needs to help adults find the app. From the answers it chooses the archetype. The creator","line":19,"renderedHtml":""},{"kind":"prose","text":"confirms the plan; from then on the assistant works on its own.","line":20,"renderedHtml":""},{"kind":"prose","text":"","line":21,"renderedHtml":""},{"kind":"heading","level":2,"text":"Set up: start from a working app","line":22},{"kind":"prose","text":"","line":23,"renderedHtml":"\u003cp>The generator writes an app from the archetype&#39;s template that already passes every check: strict TypeScript, the\ntoolchain, git hooks, end-to-end tests, i18n and a11y. The app holds only thin files that refer to the tooling\npackage, so it never has to be changed to receive a new rule. The assistant changes a working app instead of\nbuilding one from nothing.\u003c/p>\n"},{"kind":"prose","text":"The generator writes an app from the archetype's template that already passes every check: strict TypeScript, the","line":24,"renderedHtml":""},{"kind":"prose","text":"toolchain, git hooks, end-to-end tests, i18n and a11y. The app holds only thin files that refer to the tooling","line":25,"renderedHtml":""},{"kind":"prose","text":"package, so it never has to be changed to receive a new rule. The assistant changes a working app instead of","line":26,"renderedHtml":""},{"kind":"prose","text":"building one from nothing.","line":27,"renderedHtml":""},{"kind":"prose","text":"","line":28,"renderedHtml":""},{"kind":"heading","level":2,"text":"Build: one check command, run by the hooks","line":29},{"kind":"prose","text":"","line":30,"renderedHtml":"\u003cp>Rules reach the assistant in three forms: as skills it loads when a task needs them, as lint rules that mark the\ncode while it writes, and as checks of the built app. One command, \u003ccode>lernapps check\u003c/code>, runs every deterministic check:\nformat, lint, types, unit tests, build, the checks of the built app and the end-to-end tests in a browser. The\npre-commit hook runs the fast part, the pre-push hook the heavy part, CI runs both. Every message says what to fix,\nso the assistant fixes it without asking.\u003c/p>\n"},{"kind":"prose","text":"Rules reach the assistant in three forms: as skills it loads when a task needs them, as lint rules that mark the","line":31,"renderedHtml":""},{"kind":"prose","text":"code while it writes, and as checks of the built app. One command, `lernapps check`, runs every deterministic check:","line":32,"renderedHtml":""},{"kind":"prose","text":"format, lint, types, unit tests, build, the checks of the built app and the end-to-end tests in a browser. The","line":33,"renderedHtml":""},{"kind":"prose","text":"pre-commit hook runs the fast part, the pre-push hook the heavy part, CI runs both. Every message says what to fix,","line":34,"renderedHtml":""},{"kind":"prose","text":"so the assistant fixes it without asking.","line":35,"renderedHtml":""},{"kind":"prose","text":"","line":36,"renderedHtml":""},{"kind":"heading","level":2,"text":"Validate: deterministic first, judgment for the rest","line":37},{"kind":"prose","text":"","line":38,"renderedHtml":"\u003cp>The same check runs once more in the listing validation, against the deployed app, and writes a report bound to\nthe commit. When it fails, the report goes back to the creator&#39;s assistant as a comment on the listing pull\nrequest. A review agent in a fresh context starts from the report and judges only what no check can decide.\u003c/p>\n"},{"kind":"prose","text":"The same check runs once more in the listing validation, against the deployed app, and writes a report bound to","line":39,"renderedHtml":""},{"kind":"prose","text":"the commit. When it fails, the report goes back to the creator's assistant as a comment on the listing pull","line":40,"renderedHtml":""},{"kind":"prose","text":"request. A review agent in a fresh context starts from the report and judges only what no check can decide.","line":41,"renderedHtml":""},{"kind":"prose","text":"","line":42,"renderedHtml":""},{"kind":"heading","level":2,"text":"List: the entry comes from the plan and the report","line":43},{"kind":"prose","text":"","line":44,"renderedHtml":"\u003cp>The assistant fills the entry from the creator&#39;s answers in the plan and from the validation report; it never asks\nthe creator to type the entry. The fitness values come from the report. The topics of the entry are deep links into\nthe app, and the check confirms that they resolve, so adults land where the entry promises.\u003c/p>\n"},{"kind":"prose","text":"The assistant fills the entry from the creator's answers in the plan and from the validation report; it never asks","line":45,"renderedHtml":""},{"kind":"prose","text":"the creator to type the entry. The fitness values come from the report. The topics of the entry are deep links into","line":46,"renderedHtml":""},{"kind":"prose","text":"the app, and the check confirms that they resolve, so adults land where the entry promises.","line":47,"renderedHtml":""},{"kind":"prose","text":"","line":48,"renderedHtml":""},{"kind":"heading","level":2,"text":"Across the journey","line":49},{"kind":"prose","text":"","line":50,"renderedHtml":"\u003cul>\n\u003cli>\u003cstrong>Plain files and commands.\u003c/strong> Process guidance, plan and skills are Markdown; generator and check are commands;\nenforcement sits in git hooks, which every assistant triggers. Nothing depends on one vendor or an MCP server.\u003c/li>\n\u003cli>\u003cstrong>One versioned package.\u003c/strong> Templates aside, everything an app uses comes from one package, installed from git and\nkept current by Renovate, so a change reaches every app without editing it.\u003c/li>\n\u003cli>\u003cstrong>Nothing leaves unasked.\u003c/strong> The tooling fetches packages and schemas and sends nothing. What is measured stays in\nthe plan file until the creator submits a listing.\u003c/li>\n\u003c/ul>\n"},{"kind":"prose","text":"- **Plain files and commands.** Process guidance, plan and skills are Markdown; generator and check are commands;","line":51,"renderedHtml":""},{"kind":"prose","text":"  enforcement sits in git hooks, which every assistant triggers. Nothing depends on one vendor or an MCP server.","line":52,"renderedHtml":""},{"kind":"prose","text":"- **One versioned package.** Templates aside, everything an app uses comes from one package, installed from git and","line":53,"renderedHtml":""},{"kind":"prose","text":"  kept current by Renovate, so a change reaches every app without editing it.","line":54,"renderedHtml":""},{"kind":"prose","text":"- **Nothing leaves unasked.** The tooling fetches packages and schemas and sends nothing. What is measured stays in","line":55,"renderedHtml":""},{"kind":"prose","text":"  the plan file until the creator submits a listing.","line":56,"renderedHtml":""},{"kind":"prose","text":"","line":57,"renderedHtml":""}]},{"filePath":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Building Blocks","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>The tooling is one package, \u003ccode>@lernapps/tooling\u003c/code>, at the root of lernapps/tooling, installed by apps from git at a\ncommit of \u003ccode>main\u003c/code> and kept current by Renovate, like the site frame \u003ccode>@lernapps/site\u003c/code> (decision \u003ccode>dec-one-package\u003c/code>).\nIts parts are subpath exports and commands of one CLI, \u003ccode>lernapps\u003c/code>. Two blocks live in other repos: the archetype\ntemplates in lernapps/app-templates and the listing validation in lernapps/apps. Folders inside the package are\nnamed in the prose.\u003c/p>\n\u003cp>Rules have no block of their own: each rule lives in the block where it acts, as skill text, lint rule, check or\nrubric item (concept \u003ccode>concept-rule-catalog\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"The tooling is one package, `@lernapps/tooling`, at the root of lernapps/tooling, installed by apps from git at a","line":3,"renderedHtml":""},{"kind":"prose","text":"commit of `main` and kept current by Renovate, like the site frame `@lernapps/site` (decision `dec-one-package`).","line":4,"renderedHtml":""},{"kind":"prose","text":"Its parts are subpath exports and commands of one CLI, `lernapps`. Two blocks live in other repos: the archetype","line":5,"renderedHtml":""},{"kind":"prose","text":"templates in lernapps/app-templates and the listing validation in lernapps/apps. Folders inside the package are","line":6,"renderedHtml":""},{"kind":"prose","text":"named in the prose.","line":7,"renderedHtml":""},{"kind":"prose","text":"","line":8,"renderedHtml":""},{"kind":"prose","text":"Rules have no block of their own: each rule lives in the block where it acts, as skill text, lint rule, check or","line":9,"renderedHtml":""},{"kind":"prose","text":"rubric item (concept `concept-rule-catalog`).","line":10,"renderedHtml":""},{"kind":"prose","text":"","line":11,"renderedHtml":""},{"kind":"heading","level":2,"text":"Level 1","line":12},{"kind":"prose","text":"","line":13,"renderedHtml":""},{"kind":"diagram","diagramType":"building-block","view":"building-block","id":"building-blocks-level-1","notation":"mermaid","roots":[],"aliases":"","source":"flowchart TB\n    subgraph bb-tooling-package[\"@lernapps/tooling\"]\n        bb-process-guidance[\"Process guidance\"]\n        bb-skills[\"Skills\"]\n        bb-generator[\"Generator\"]\n        bb-archetypes[\"Archetype presets\"]\n        bb-lint-rules[\"Lint rules\"]\n        bb-check-cli[\"Check CLI\"]\n        bb-review-procedure[\"Review procedure\"]\n        bb-evals[\"Evals\"]\n    end\n    bb-app-templates[\"Archetype templates (lernapps/app-templates)\"]\n    bb-app-check-action[\"App check action\"]\n    bb-listing-validation[\"Listing validation (lernapps/apps)\"]\n    bb-generator -->|\"if-archetype-templates\"| bb-app-templates\n    bb-generator -->|\"if-plan-file\"| bb-process-guidance\n    bb-archetypes -->|\"if-lint-plugin\"| bb-lint-rules\n    bb-archetypes -->|\"if-check-cli\"| bb-check-cli\n    bb-app-check-action -->|\"if-check-cli\"| bb-check-cli\n    bb-listing-validation -->|\"if-check-cli\"| bb-check-cli\n    bb-listing-validation -->|\"if-review-procedure\"| bb-review-procedure\n    bb-review-procedure -->|\"if-validation-report\"| bb-check-cli\n    bb-evals -->|\"if-generator-cli\"| bb-generator\n    bb-evals -->|\"if-validation-report\"| bb-check-cli","startLine":15,"endLine":47},{"kind":"prose","text":"","line":48,"renderedHtml":""},{"kind":"heading","level":2,"text":"Level 2: archetype presets","line":49},{"kind":"prose","text":"","line":50,"renderedHtml":""},{"kind":"diagram","diagramType":"building-block","view":"building-block","id":"building-blocks-archetypes","notation":"mermaid","roots":["bb-archetypes"],"aliases":"","source":"flowchart TB\n    subgraph bb-tooling-package[\"@lernapps/tooling\"]\n        subgraph bb-archetypes[\"Archetype presets\"]\n            bb-git-hooks[\"Git hooks\"]\n        end\n        bb-check-cli[\"Check CLI\"]\n        bb-process-guidance[\"Process guidance\"]\n        bb-lint-rules[\"Lint rules\"]\n    end\n    bb-git-hooks -->|\"if-check-cli\"| bb-check-cli\n    bb-git-hooks -->|\"if-plan-file\"| bb-process-guidance\n    bb-archetypes -->|\"if-lint-plugin\"| bb-lint-rules","startLine":52,"endLine":73},{"kind":"prose","text":"","line":74,"renderedHtml":""},{"kind":"heading","level":2,"text":"@lernapps/tooling","line":75},{"kind":"prose","text":"","line":76,"renderedHtml":"\u003cp>The one package every app depends on. Its version is a commit of \u003ccode>main\u003c/code>; Renovate moves every app to the latest\ncommit and merges when the app&#39;s checks are green (preset \u003ccode>github&gt;lernapps/tooling\u003c/code>). An app holds only thin files\nthat refer to it: configuration that extends a preset, the hooks installed by it, skills synced from it. The\npackage&#39;s own build runs the same check command it gives apps, plus a test that the rule ids within skills, lint rules,\nchecks and rubric are unique and every message links to its rule.\u003c/p>\n"},{"kind":"prose","text":"The one package every app depends on. Its version is a commit of `main`; Renovate moves every app to the latest","line":77,"renderedHtml":""},{"kind":"prose","text":"commit and merges when the app's checks are green (preset `github>lernapps/tooling`). An app holds only thin files","line":78,"renderedHtml":""},{"kind":"prose","text":"that refer to it: configuration that extends a preset, the hooks installed by it, skills synced from it. The","line":79,"renderedHtml":""},{"kind":"prose","text":"package's own build runs the same check command it gives apps, plus a test that the rule ids within skills, lint rules,","line":80,"renderedHtml":""},{"kind":"prose","text":"checks and rubric are unique and every message links to its rule.","line":81,"renderedHtml":""},{"kind":"prose","text":"","line":82,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-tooling-package","title":"\"@lernapps/tooling\"","technology":"TypeScript, Node, npm package installed from git","implements":"concept-stable-contracts"},"startLine":84,"endLine":89,"inArc42Fence":true},{"kind":"prose","text":"","line":91,"renderedHtml":""},{"kind":"heading","level":3,"text":"Process guidance","line":92},{"kind":"prose","text":"","line":93,"renderedHtml":"\u003cp>The EPCC workflow for the creator&#39;s assistant (\u003ccode>guidance/\u003c/code>): the text of the app&#39;s \u003ccode>AGENTS.md\u003c/code> and the plan\ntemplate. \u003ccode>AGENTS.md\u003c/code> is short and always loaded; it tells the assistant to keep a plan and points to the skills.\u003c/p>\n\u003cp>The plan template has the phases Explore, Plan, Code and Commit, each with its tasks and the creator&#39;s checkpoints\n(confirm the plan, publish, list). Explore holds the questions for the creator, including what the entry schema of\nthe app overview needs to help adults find the app; the answers stay in the plan for listing. The front matter holds\nthe archetype, the current phase and counters the hooks write (\u003ccode>prePushFailures\u003c/code>). The plan ends with a\nretrospective: phases reached, checks that failed and how often, the creator&#39;s turns after the plan was confirmed,\nwhere the assistant had to guess. Comments in the template explain each part, so the template itself guides the\nassistant.\u003c/p>\n"},{"kind":"prose","text":"The EPCC workflow for the creator's assistant (`guidance/`): the text of the app's `AGENTS.md` and the plan","line":94,"renderedHtml":""},{"kind":"prose","text":"template. `AGENTS.md` is short and always loaded; it tells the assistant to keep a plan and points to the skills.","line":95,"renderedHtml":""},{"kind":"prose","text":"","line":96,"renderedHtml":""},{"kind":"prose","text":"The plan template has the phases Explore, Plan, Code and Commit, each with its tasks and the creator's checkpoints","line":97,"renderedHtml":""},{"kind":"prose","text":"(confirm the plan, publish, list). Explore holds the questions for the creator, including what the entry schema of","line":98,"renderedHtml":""},{"kind":"prose","text":"the app overview needs to help adults find the app; the answers stay in the plan for listing. The front matter holds","line":99,"renderedHtml":""},{"kind":"prose","text":"the archetype, the current phase and counters the hooks write (`prePushFailures`). The plan ends with a","line":100,"renderedHtml":""},{"kind":"prose","text":"retrospective: phases reached, checks that failed and how often, the creator's turns after the plan was confirmed,","line":101,"renderedHtml":""},{"kind":"prose","text":"where the assistant had to guess. Comments in the template explain each part, so the template itself guides the","line":102,"renderedHtml":""},{"kind":"prose","text":"assistant.","line":103,"renderedHtml":""},{"kind":"prose","text":"","line":104,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-process-guidance","title":"Process guidance","parent":"bb-tooling-package","technology":"Markdown","implements":"concept-plain-language, concept-terse-output, concept-traceability"},"startLine":106,"endLine":112,"inArc42Fence":true},{"kind":"prose","text":"","line":114,"renderedHtml":""},{"kind":"heading","level":4,"text":"AGENTS.md","line":115},{"kind":"prose","text":"","line":116,"renderedHtml":"\u003cp>The entry point every assistant reads, generated into the app. It stays short and refers to the plan and the\nskills.\u003c/p>\n"},{"kind":"prose","text":"The entry point every assistant reads, generated into the app. It stays short and refers to the plan and the","line":117,"renderedHtml":""},{"kind":"prose","text":"skills.","line":118,"renderedHtml":""},{"kind":"prose","text":"","line":119,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-agents-md","title":"AGENTS.md","provider":"bb-process-guidance","protocol":"Markdown file at the app's root"},"startLine":121,"endLine":126,"inArc42Fence":true},{"kind":"prose","text":"","line":128,"renderedHtml":""},{"kind":"heading","level":4,"text":"Plan file","line":129},{"kind":"prose","text":"","line":130,"renderedHtml":"\u003cp>The human-readable plan in the app repo (\u003ccode>.vibe/plan.md\u003c/code>). It stays in the creator&#39;s repo and reaches the platform\nonly with a listing. Its front matter has a versioned JSON Schema in the package; its headings (the four phases,\nthen the retrospective and its parts) are fixed, so hooks, review and evals can read it.\u003c/p>\n"},{"kind":"prose","text":"The human-readable plan in the app repo (`.vibe/plan.md`). It stays in the creator's repo and reaches the platform","line":131,"renderedHtml":""},{"kind":"prose","text":"only with a listing. Its front matter has a versioned JSON Schema in the package; its headings (the four phases,","line":132,"renderedHtml":""},{"kind":"prose","text":"then the retrospective and its parts) are fixed, so hooks, review and evals can read it.","line":133,"renderedHtml":""},{"kind":"prose","text":"","line":134,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-plan-file","title":"Plan file","provider":"bb-process-guidance","protocol":"Markdown with YAML front matter"},"startLine":136,"endLine":141,"inArc42Fence":true},{"kind":"prose","text":"","line":143,"renderedHtml":""},{"kind":"heading","level":3,"text":"Skills","line":144},{"kind":"prose","text":"","line":145,"renderedHtml":"\u003cp>The rules as the assistant reads them, and the know-how around them (\u003ccode>skills/\u003c/code>), in the agentskills.io format: \u003ccode>lernapps-app\u003c/code> (workflow\nand general rules), one per archetype, topic skills such as third-party content (bundle it at build time, name\nsource and licence next to it, embeds only after a click, links verified, never guessed), and \u003ccode>lernapps-listing\u003c/code>\n(fetch the entry schema, fill it from plan and report, open the pull request). Each skill names the rule ids it\ncarries. They are synced from the package into the creator&#39;s agent harness (chapter 7) and can be installed alone\nwith \u003ccode>npx skills add lernapps/tooling\u003c/code> for apps built otherwise.\u003c/p>\n"},{"kind":"prose","text":"The rules as the assistant reads them, and the know-how around them (`skills/`), in the agentskills.io format: `lernapps-app` (workflow","line":146,"renderedHtml":""},{"kind":"prose","text":"and general rules), one per archetype, topic skills such as third-party content (bundle it at build time, name","line":147,"renderedHtml":""},{"kind":"prose","text":"source and licence next to it, embeds only after a click, links verified, never guessed), and `lernapps-listing`","line":148,"renderedHtml":""},{"kind":"prose","text":"(fetch the entry schema, fill it from plan and report, open the pull request). Each skill names the rule ids it","line":149,"renderedHtml":""},{"kind":"prose","text":"carries. They are synced from the package into the creator's agent harness (chapter 7) and can be installed alone","line":150,"renderedHtml":""},{"kind":"prose","text":"with `npx skills add lernapps/tooling` for apps built otherwise.","line":151,"renderedHtml":""},{"kind":"prose","text":"","line":152,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-skills","title":"Skills","parent":"bb-tooling-package","technology":"Markdown (agentskills.io)","implements":"concept-rule-catalog, concept-plain-language, concept-terse-output"},"startLine":154,"endLine":160,"inArc42Fence":true},{"kind":"prose","text":"","line":162,"renderedHtml":""},{"kind":"heading","level":4,"text":"Skills interface","line":163},{"kind":"prose","text":"","line":164,"renderedHtml":"\u003cp>The skills the assistant loads when a task needs them; one per concern.\u003c/p>\n"},{"kind":"prose","text":"The skills the assistant loads when a task needs them; one per concern.","line":165,"renderedHtml":""},{"kind":"prose","text":"","line":166,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-skills","title":"Skills","provider":"bb-skills","protocol":"SKILL.md files in the harness's skill folder"},"startLine":168,"endLine":173,"inArc42Fence":true},{"kind":"prose","text":"","line":175,"renderedHtml":""},{"kind":"heading","level":3,"text":"Generator","line":176},{"kind":"prose","text":"","line":177,"renderedHtml":"\u003cp>\u003ccode>lernapps create --archetype &lt;name&gt;\u003c/code> writes a new app from the archetype&#39;s template at the commit pinned in the\npackage: the thin files that refer to the package, \u003ccode>AGENTS.md\u003c/code>, the plan file carried over from the conversation,\nthe app&#39;s workflows, LICENSE and an issue form for content errors. The assistant runs it after the creator has\nconfirmed the plan.\u003c/p>\n"},{"kind":"prose","text":"`lernapps create --archetype \u003cname>` writes a new app from the archetype's template at the commit pinned in the","line":178,"renderedHtml":""},{"kind":"prose","text":"package: the thin files that refer to the package, `AGENTS.md`, the plan file carried over from the conversation,","line":179,"renderedHtml":""},{"kind":"prose","text":"the app's workflows, LICENSE and an issue form for content errors. The assistant runs it after the creator has","line":180,"renderedHtml":""},{"kind":"prose","text":"confirmed the plan.","line":181,"renderedHtml":""},{"kind":"prose","text":"","line":182,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-generator","title":"Generator","parent":"bb-tooling-package","technology":"TypeScript CLI","requires":"if-archetype-templates, if-plan-file","implements":"concept-stable-contracts"},"startLine":184,"endLine":191,"inArc42Fence":true},{"kind":"prose","text":"","line":193,"renderedHtml":""},{"kind":"heading","level":4,"text":"Generator CLI","line":194},{"kind":"prose","text":"","line":195,"renderedHtml":"\u003cp>It fails if the archetype is unknown or the folder is not empty.\u003c/p>\n"},{"kind":"prose","text":"It fails if the archetype is unknown or the folder is not empty.","line":196,"renderedHtml":""},{"kind":"prose","text":"","line":197,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-generator-cli","title":"Generator CLI","provider":"bb-generator","protocol":"CLI `lernapps create`"},"startLine":199,"endLine":204,"inArc42Fence":true},{"kind":"prose","text":"","line":206,"renderedHtml":""},{"kind":"heading","level":3,"text":"Archetype presets","line":207},{"kind":"prose","text":"","line":208,"renderedHtml":"\u003cp>What an app imports and never edits (\u003ccode>archetypes/\u003c/code>), one preset per archetype on a shared base: the vite-plus\nconfiguration (lint with the severities of our lint rules, format, type check, unit tests, staged files), the strict\n\u003ccode>tsconfig\u003c/code> base, the Playwright configuration for end-to-end tests, i18n and a11y helpers, and the git hooks.\u003c/p>\n"},{"kind":"prose","text":"What an app imports and never edits (`archetypes/`), one preset per archetype on a shared base: the vite-plus","line":209,"renderedHtml":""},{"kind":"prose","text":"configuration (lint with the severities of our lint rules, format, type check, unit tests, staged files), the strict","line":210,"renderedHtml":""},{"kind":"prose","text":"`tsconfig` base, the Playwright configuration for end-to-end tests, i18n and a11y helpers, and the git hooks.","line":211,"renderedHtml":""},{"kind":"prose","text":"","line":212,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-archetypes","title":"Archetype presets","parent":"bb-tooling-package","technology":"TypeScript, vite-plus, Playwright","requires":"if-lint-plugin, if-check-cli","implements":"concept-rule-catalog, concept-stable-contracts"},"startLine":214,"endLine":221,"inArc42Fence":true},{"kind":"prose","text":"","line":223,"renderedHtml":""},{"kind":"heading","level":4,"text":"Archetype preset interface","line":224},{"kind":"prose","text":"","line":225,"renderedHtml":"\u003cp>What an app imports and extends: configuration, \u003ccode>tsconfig\u003c/code> base and hooks, by archetype.\u003c/p>\n"},{"kind":"prose","text":"What an app imports and extends: configuration, `tsconfig` base and hooks, by archetype.","line":226,"renderedHtml":""},{"kind":"prose","text":"","line":227,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-archetype-preset","title":"Archetype preset","provider":"bb-archetypes","protocol":"npm subpath exports (config, tsconfig, hooks)"},"startLine":229,"endLine":234,"inArc42Fence":true},{"kind":"prose","text":"","line":236,"renderedHtml":""},{"kind":"heading","level":4,"text":"Git hooks","line":237},{"kind":"prose","text":"","line":238,"renderedHtml":"\u003cp>Installed by the preset. Pre-commit runs \u003ccode>lernapps check --pre-commit\u003c/code>, pre-push runs \u003ccode>lernapps check --pre-push\u003c/code>;\ntogether they run exactly what CI runs. When the pre-push run fails, the hook increments \u003ccode>prePushFailures\u003c/code> in the\nplan file&#39;s front matter and prints the messages.\u003c/p>\n"},{"kind":"prose","text":"Installed by the preset. Pre-commit runs `lernapps check --pre-commit`, pre-push runs `lernapps check --pre-push`;","line":239,"renderedHtml":""},{"kind":"prose","text":"together they run exactly what CI runs. When the pre-push run fails, the hook increments `prePushFailures` in the","line":240,"renderedHtml":""},{"kind":"prose","text":"plan file's front matter and prints the messages.","line":241,"renderedHtml":""},{"kind":"prose","text":"","line":242,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-git-hooks","title":"Git hooks","parent":"bb-archetypes","technology":"vite-plus hooks, shell","requires":"if-check-cli, if-plan-file","implements":"concept-terse-output, concept-traceability"},"startLine":244,"endLine":251,"inArc42Fence":true},{"kind":"prose","text":"","line":253,"renderedHtml":""},{"kind":"heading","level":3,"text":"Lint rules","line":254},{"kind":"prose","text":"","line":255,"renderedHtml":"\u003cp>The rules that can be decided on source code (\u003ccode>lint/\u003c/code>), as an Oxlint JS plugin written against the\nESLint-compatible API: no URLs to other hosts in code, storage only through the preset&#39;s wrapper, learner texts only\nfrom the i18n files, no \u003ccode>any\u003c/code>. Each rule carries its rule id; its severity is set in the preset&#39;s configuration; a\nsuppression needs a reason.\u003c/p>\n"},{"kind":"prose","text":"The rules that can be decided on source code (`lint/`), as an Oxlint JS plugin written against the","line":256,"renderedHtml":""},{"kind":"prose","text":"ESLint-compatible API: no URLs to other hosts in code, storage only through the preset's wrapper, learner texts only","line":257,"renderedHtml":""},{"kind":"prose","text":"from the i18n files, no `any`. Each rule carries its rule id; its severity is set in the preset's configuration; a","line":258,"renderedHtml":""},{"kind":"prose","text":"suppression needs a reason.","line":259,"renderedHtml":""},{"kind":"prose","text":"","line":260,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-lint-rules","title":"Lint rules","parent":"bb-tooling-package","technology":"TypeScript, Oxlint JS plugin","implements":"concept-rule-catalog, concept-terse-output"},"startLine":262,"endLine":268,"inArc42Fence":true},{"kind":"prose","text":"","line":270,"renderedHtml":""},{"kind":"heading","level":4,"text":"Lint plugin","line":271},{"kind":"prose","text":"","line":272,"renderedHtml":"\u003cp>The preset loads the plugin; apps do not configure it themselves.\u003c/p>\n"},{"kind":"prose","text":"The preset loads the plugin; apps do not configure it themselves.","line":273,"renderedHtml":""},{"kind":"prose","text":"","line":274,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-lint-plugin","title":"Lint plugin","provider":"bb-lint-rules","protocol":"Oxlint / ESLint plugin API"},"startLine":276,"endLine":281,"inArc42Fence":true},{"kind":"prose","text":"","line":283,"renderedHtml":""},{"kind":"heading","level":3,"text":"Check CLI","line":284},{"kind":"prose","text":"","line":285,"renderedHtml":"\u003cp>\u003ccode>lernapps check\u003c/code> runs every deterministic check (\u003ccode>check/\u003c/code>) and is the same command in hooks, CI and listing\nvalidation:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Part\u003c/th>\n\u003cth>Runs with\u003c/th>\n\u003cth>Contents\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>fast\u003c/td>\n\u003ctd>\u003ccode>--pre-commit\u003c/code>\u003c/td>\n\u003ctd>format, lint, type check of staged files\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>heavy\u003c/td>\n\u003ctd>\u003ccode>--pre-push\u003c/code>\u003c/td>\n\u003ctd>unit tests, build, checks of the built app, end-to-end tests in a browser (Playwright)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>all\u003c/td>\n\u003ctd>no flag, or both flags\u003c/td>\n\u003ctd>both parts (CI)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The checks of the built app work on a bundle or a deployed URL, without the source repo: requests to other hosts\nbefore a click, storage, readable without JavaScript where the archetype requires it, 360 px without overflow, axe,\nlinks, dependency licences, and the site rules by calling \u003ccode>lernapps-check\u003c/code> of the site frame for apps on\nlernapps.net. With \u003ccode>--entry &lt;file&gt;\u003c/code> it also checks an entry against the app: the app&#39;s URL and every topic link\nresolve, and the fitness values match. Each check carries its rule id and severity. The output is the validation\nreport.\u003c/p>\n"},{"kind":"prose","text":"`lernapps check` runs every deterministic check (`check/`) and is the same command in hooks, CI and listing","line":286,"renderedHtml":""},{"kind":"prose","text":"validation:","line":287,"renderedHtml":""},{"kind":"prose","text":"","line":288,"renderedHtml":""},{"kind":"prose","text":"| Part | Runs with | Contents |","line":289,"renderedHtml":""},{"kind":"prose","text":"|---|---|---|","line":290,"renderedHtml":""},{"kind":"prose","text":"| fast | `--pre-commit` | format, lint, type check of staged files |","line":291,"renderedHtml":""},{"kind":"prose","text":"| heavy | `--pre-push` | unit tests, build, checks of the built app, end-to-end tests in a browser (Playwright) |","line":292,"renderedHtml":""},{"kind":"prose","text":"| all | no flag, or both flags | both parts (CI) |","line":293,"renderedHtml":""},{"kind":"prose","text":"","line":294,"renderedHtml":""},{"kind":"prose","text":"The checks of the built app work on a bundle or a deployed URL, without the source repo: requests to other hosts","line":295,"renderedHtml":""},{"kind":"prose","text":"before a click, storage, readable without JavaScript where the archetype requires it, 360 px without overflow, axe,","line":296,"renderedHtml":""},{"kind":"prose","text":"links, dependency licences, and the site rules by calling `lernapps-check` of the site frame for apps on","line":297,"renderedHtml":""},{"kind":"prose","text":"lernapps.net. With `--entry \u003cfile>` it also checks an entry against the app: the app's URL and every topic link","line":298,"renderedHtml":""},{"kind":"prose","text":"resolve, and the fitness values match. Each check carries its rule id and severity. The output is the validation","line":299,"renderedHtml":""},{"kind":"prose","text":"report.","line":300,"renderedHtml":""},{"kind":"prose","text":"","line":301,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-check-cli","title":"Check CLI","parent":"bb-tooling-package","technology":"TypeScript CLI, vite-plus, Playwright, axe-core","implements":"concept-rule-catalog, concept-terse-output, concept-traceability, concept-stable-contracts"},"startLine":303,"endLine":309,"inArc42Fence":true},{"kind":"prose","text":"","line":311,"renderedHtml":""},{"kind":"heading","level":4,"text":"Check CLI interface","line":312},{"kind":"prose","text":"","line":313,"renderedHtml":"\u003cp>Exit code 0 when no \u003ccode>error\u003c/code> rule fails; the report on standard output; \u003ccode>--report &lt;file&gt;\u003c/code> writes it to a file.\u003c/p>\n"},{"kind":"prose","text":"Exit code 0 when no `error` rule fails; the report on standard output; `--report \u003cfile>` writes it to a file.","line":314,"renderedHtml":""},{"kind":"prose","text":"","line":315,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-check-cli","title":"Check CLI","provider":"bb-check-cli","protocol":"CLI `lernapps check [--pre-commit] [--pre-push] [\u003cdir|url>] [--entry \u003cfile>]`"},"startLine":317,"endLine":322,"inArc42Fence":true},{"kind":"prose","text":"","line":324,"renderedHtml":""},{"kind":"heading","level":4,"text":"Validation report","line":325},{"kind":"prose","text":"","line":326,"renderedHtml":"\u003cp>The result of a check run as YAML: what was checked (commit, or URL and time), the rules in scope, findings per rule\nid with location and fix, suppressions with their reasons, and the fitness values for the entry. Deterministic: the\nsame input gives the same report. Its schema is published at lernapps.net as JSON Schema, which validates the YAML.\u003c/p>\n"},{"kind":"prose","text":"The result of a check run as YAML: what was checked (commit, or URL and time), the rules in scope, findings per rule","line":327,"renderedHtml":""},{"kind":"prose","text":"id with location and fix, suppressions with their reasons, and the fitness values for the entry. Deterministic: the","line":328,"renderedHtml":""},{"kind":"prose","text":"same input gives the same report. Its schema is published at lernapps.net as JSON Schema, which validates the YAML.","line":329,"renderedHtml":""},{"kind":"prose","text":"","line":330,"renderedHtml":""},{"kind":"block","blockType":"interface","attributes":{"id":"if-validation-report","title":"Validation report","provider":"bb-check-cli","protocol":"YAML with published JSON Schema"},"startLine":332,"endLine":337,"inArc42Fence":true},{"kind":"prose","text":"","line":339,"renderedHtml":""},{"kind":"heading","level":3,"text":"Review procedure","line":340},{"kind":"prose","text":"","line":341,"renderedHtml":"\u003cp>The formal validation&#39;s judgment (\u003ccode>review/\u003c/code>): a prompt for an agent in a fresh context, the rubric of the\nrules no program decides, per archetype, each item with its rule id, and the format of the verdict. The agent starts from the validation\nreport, reads the built bundle, the dependencies and the plan&#39;s retrospective, and judges what no check decides:\nwhether learners act themselves, ads, plain language, learner-specific data in public texts.\u003c/p>\n"},{"kind":"prose","text":"The formal validation's judgment (`review/`): a prompt for an agent in a fresh context, the rubric of the","line":342,"renderedHtml":""},{"kind":"prose","text":"rules no program decides, per archetype, each item with its rule id, and the format of the verdict. The agent starts from the validation","line":343,"renderedHtml":""},{"kind":"prose","text":"report, reads the
