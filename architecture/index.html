<script>window.__WORKSPACE__={"elements":[{"id":"con-entry-schema","title":"The listing is one entry in lernapps/apps","category":"organizational","source":"ORGANIZATION.md \"Apps and the app overview\"","kind":"constraint","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/02-constraints.arc42.md","line":74,"heading":"The listing is one entry in lernapps/apps","prose":"\nAn app connects to the platform in one way only: its entry in the app overview links to it. The entry schema is owned\nby lernapps/apps and published as JSON Schema; the owner decides whether an app is listed.\n"}},{"id":"con-frontend-only","title":"Apps are static and frontend-only","category":"technical","source":"Platform design; listing criteria of the app overview","kind":"constraint","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/02-constraints.arc42.md","line":14,"heading":"Apps are static and frontend-only","prose":"\nThe apps collect nothing and stay fully frontend-only: there is no hidden data collection on the platform\n([returning use and praise to creators](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-feedback)). They have no backend of their own and\nsend nothing to a server; storage is at most on the learner's device.\n"}},{"id":"con-github","title":"GitHub is the means of production","category":"organizational","source":"Platform design; ORGANIZATION.md \"Rules across repos\"","kind":"constraint","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/02-constraints.arc42.md","line":45,"heading":"GitHub is the means of production","prose":"\nThe platform runs on GitHub: repositories, pull requests, GitHub Actions, GitHub Pages and Renovate\n([platform](https://lernapps.net/docs/platform-design/#2-design/d1-ecosystem.pdt42.md:el-platform-lernapps)). Only the owner creates repositories in the organisation; a repo named `x` with Pages is served\nat `lernapps.net/x/`. Actions are pinned to full commit SHAs and updated by Renovate.\n"}},{"id":"con-language-licence","title":"Languages and licence","category":"convention","source":"ORGANIZATION.md \"Language\", \"License\"","kind":"constraint","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/02-constraints.arc42.md","line":89,"heading":"Languages and licence","prose":"\nShared infrastructure is in English: names, identifiers, schemas, workflows, developer docs. Texts for learners,\nteachers and parents are German, in plain language (ISO 24495-1). The tooling and apps generated from it are MIT\nlicensed; third-party content keeps its own licence and is named next to it.\n"}},{"id":"con-one-owner","title":"One owner, little time, no money","category":"organizational","source":"Platform design; GOVERNANCE.md","kind":"constraint","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/02-constraints.arc42.md","line":60,"heading":"One owner, little time, no money","prose":"\nThe platform is free, pays no one and has one owner whose time is the cost of maintaining the guidance\n([list an app and hear it is used](https://lernapps.net/docs/platform-design/#2-design/d7-experiences.pdt42.md:el-x-list-and-hear-back)). There is no budget for paid services; the platform's only\nservice is a small one for anonymous thanks and feedback.\n"}},{"id":"con-page-rules","title":"Rules for every page","category":"convention","source":"ORGANIZATION.md \"Every page, in every repo\"","kind":"constraint","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/02-constraints.arc42.md","line":30,"heading":"Rules for every page","prose":"\nEvery page in every repo of the organisation sets no cookies, does no tracking and sends no requests to other servers\nbefore a click; it is readable without JavaScript, meets WCAG 2.1 AA and is usable at 360 px. Pages on lernapps.net\nlink the imprint and the privacy notice. Archetypes that cannot be read without JavaScript as a whole keep a\nreadable start page.\n"}},{"id":"actor-assistant","title":"Creator's AI assistant","type":"system","requires":["if-agents-md","if-plan-file","if-generator-cli","if-skills","if-check-cli","if-listing-comment"],"description":"Any coding agent; works from plain files and CLIs, no MCP server required","kind":"actor","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/03-system-context.arc42.md","line":69,"heading":"Creator's AI assistant","prose":"\nClaude Code, Codex, Gemini CLI or another agent, chosen by the creator ([AI assistants](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants)). It reads `AGENTS.md`,\nwrites the plan, runs the generator, follows the skills, reacts to the checks and fills the entry. It is a partner the\nplatform designs for, not part of the system.\n"}},{"id":"actor-creator","title":"Creator","type":"person","requires":["if-plan-file"],"description":"Builds an app with their AI assistant; reads and confirms the plan","kind":"actor","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/03-system-context.arc42.md","line":53,"heading":"Creator","prose":"\nA teacher, parent or student who builds an app for a gap they noticed ([app creators](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-creators)). They talk to their assistant,\nread the plan file and confirm it; after that, they are asked only at the checkpoints. They never need to know the\nrules or the toolchain.\n"}},{"id":"actor-github","title":"GitHub (Actions, Pages, Renovate)","type":"system","requires":["if-app-check-action","if-archetype-preset"],"description":"Runs CI and the listing validation; Renovate bumps the tooling package in every app","kind":"actor","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/03-system-context.arc42.md","line":114,"heading":"GitHub","prose":"\nRuns the app repo's workflows and the listing validation in lernapps/apps (GitHub Actions), serves Pages, and keeps\nevery app's tooling current (Renovate with the organisation's preset).\n"}},{"id":"actor-owner","title":"Platform owner","type":"person","requires":["if-validation-report","if-review-procedure"],"description":"Decides listing, maintains the rules, runs review and evals","kind":"actor","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/03-system-context.arc42.md","line":84,"heading":"Platform owner","prose":"\nDecides whether an app is listed, maintains the rules and runs the review and the evals (one owner,\n`con-one-owner`). Reads the validation report and the retrospective.\n"}},{"id":"actor-review-agent","title":"Review agent","type":"system","requires":["if-review-procedure","if-check-cli","if-validation-report"],"description":"Fresh-context agent that validates an app before listing","kind":"actor","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/03-system-context.arc42.md","line":99,"heading":"Review agent","prose":"\nAn agent in a fresh context, run by the owner. It follows the review procedure,\nstarts from the check CLI's report and judges what the checks cannot decide.\n"}},{"id":"strategy-architecture","title":"Follow the creator's journey; plain files, one package, nothing leaves unasked","addresses":["qg-simple-to-build","qg-list-in-minutes","qg-findable","qg-checked-not-declared","qg-nothing-collected","qg-few-iterations","qg-any-assistant","qg-guidance-evolves"],"kind":"solution-strategy","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/04-solution-strategy.arc42.md","line":8,"heading":"Solution Strategy","prose":"\nThe tooling follows the creator's journey. Each step has its own approach; three principles hold across all of\nthem: everything the assistant needs is a plain file or a command, everything an app uses comes from one versioned\npackage, and nothing leaves the creator's side unless they submit a listing.\n"}},{"id":"bb-app-check-action","title":"App check action","technology":"GitHub composite action","implements":[],"requires":["if-check-cli"],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":421,"heading":"App check action","prose":"\nA composite action next to the site actions (`actions/app-check`): runs `lernapps check` without flags, exactly\nwhat the hooks ran, with the Playwright browser cached; uploads the report. Apps on lernapps.net deploy with the\nsite actions after it.\n"}},{"id":"bb-app-templates","title":"Archetype templates","technology":"lernapps/app-templates, one folder per archetype","implements":[],"requires":[],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":394,"heading":"Archetype templates","prose":"\nlernapps/app-templates, one folder per archetype: the files the generator copies, each a working app that passes\nevery check. Each folder can be tried on its own; the logic stays in the package.\n"}},{"id":"bb-archetypes","title":"Archetype presets","technology":"TypeScript, vite-plus, Playwright","parent":"bb-tooling-package","implements":["concept-rule-catalog","concept-stable-contracts"],"requires":["if-lint-plugin","if-check-cli"],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":214,"heading":"Archetype presets","prose":"\nWhat an app imports and never edits (`archetypes/`), one preset per archetype on a shared base: the vite-plus\nconfiguration (lint with the severities of our lint rules, format, type check, unit tests, staged files), the strict\n`tsconfig` base, the Playwright configuration for end-to-end tests, i18n and a11y helpers, and the git hooks.\n"}},{"id":"bb-check-cli","title":"Check CLI","technology":"TypeScript CLI, vite-plus, Playwright, axe-core","parent":"bb-tooling-package","implements":["concept-rule-catalog","concept-terse-output","concept-traceability","concept-stable-contracts"],"requires":[],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":303,"heading":"Check CLI","prose":"\n`lernapps check` runs every deterministic check (`check/`) and is the same command in hooks, CI and listing\nvalidation:\n\n| Part | Runs with | Contents |\n|---|---|---|\n| fast | `--pre-commit` | format, lint, type check of staged files |\n| heavy | `--pre-push` | unit tests, build, checks of the built app, end-to-end tests in a browser (Playwright) |\n| all | no flag, or both flags | both parts (CI) |\n\nThe checks of the built app work on a bundle or a deployed URL, without the source repo: requests to other hosts\nbefore a click, storage, readable without JavaScript where the archetype requires it, 360 px without overflow, axe,\nlinks, dependency licences, and the site rules by calling `lernapps-check` of the site frame for apps on\nlernapps.net. With `--entry \u003cfile>` it also checks an entry against the app: the app's URL and every topic link\nresolve, and the fitness values match. Each check carries its rule id and severity. The output is the validation\nreport.\n"}},{"id":"bb-evals","title":"Evals","technology":"Markdown prompts, scoring script","parent":"bb-tooling-package","implements":["concept-traceability"],"requires":["if-generator-cli","if-check-cli","if-validation-report","if-review-procedure"],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":378,"heading":"Evals","prose":"\nSample creator prompts, at least one per archetype, with the expected result (`evals/`). Run by hand with Claude\nCode, Codex and Gemini CLI on their latest models; scored with the check CLI, the review procedure and the plan's\ncounters. They run before a change to the guidance is merged.\n"}},{"id":"bb-generator","title":"Generator","technology":"TypeScript CLI","parent":"bb-tooling-package","implements":["concept-stable-contracts"],"requires":["if-archetype-templates","if-plan-file"],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":184,"heading":"Generator","prose":"\n`lernapps create --archetype \u003cname>` writes a new app from the archetype's template at the commit pinned in the\npackage: the thin files that refer to the package, `AGENTS.md`, the plan file carried over from the conversation,\nthe app's workflows, LICENSE and an issue form for content errors. The assistant runs it after the creator has\nconfirmed the plan.\n"}},{"id":"bb-git-hooks","title":"Git hooks","technology":"vite-plus hooks, shell","parent":"bb-archetypes","implements":["concept-terse-output","concept-traceability"],"requires":["if-check-cli","if-plan-file"],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":244,"heading":"Git hooks","prose":"\nInstalled by the preset. Pre-commit runs `lernapps check --pre-commit`, pre-push runs `lernapps check --pre-push`;\ntogether they run exactly what CI runs. When the pre-push run fails, the hook increments `prePushFailures` in the\nplan file's front matter and prints the messages.\n"}},{"id":"bb-lint-rules","title":"Lint rules","technology":"TypeScript, Oxlint JS plugin","parent":"bb-tooling-package","implements":["concept-rule-catalog","concept-terse-output"],"requires":[],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":262,"heading":"Lint rules","prose":"\nThe rules that can be decided on source code (`lint/`), as an Oxlint JS plugin written against the\nESLint-compatible API: no URLs to other hosts in code, storage only through the preset's wrapper, learner texts only\nfrom the i18n files, no `any`. Each rule carries its rule id; its severity is set in the preset's configuration; a\nsuppression needs a reason.\n"}},{"id":"bb-listing-validation","title":"Listing validation","technology":"GitHub Actions workflow in lernapps/apps","implements":["concept-terse-output","concept-traceability"],"requires":["if-check-cli","if-review-procedure","if-validation-report"],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":450,"heading":"Listing validation","prose":"\nA workflow in lernapps/apps on pull requests that add or change an entry. It runs the checks of the built app against\nthe entry's URL with `--entry`, so it also confirms that the topic links resolve and the fitness values match. If\nchecks fail, it posts the report as a comment for the creator's assistant. The review agent then judges the rest;\nthe owner decides.\n"}},{"id":"bb-process-guidance","title":"Process guidance","technology":"Markdown","parent":"bb-tooling-package","implements":["concept-plain-language","concept-terse-output","concept-traceability"],"requires":[],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":106,"heading":"Process guidance","prose":"\nThe EPCC workflow for the creator's assistant (`guidance/`): the text of the app's `AGENTS.md` and the plan\ntemplate. `AGENTS.md` is short and always loaded; it tells the assistant to keep a plan and points to the skills.\n\nThe plan template has the phases Explore, Plan, Code and Commit, each with its tasks and the creator's checkpoints\n(confirm the plan, publish, list). Explore holds the questions for the creator, including what the entry schema of\nthe app overview needs to help adults find the app; the answers stay in the plan for listing. The front matter holds\nthe archetype, the current phase and counters the hooks write (`prePushFailures`). The plan ends with a\nretrospective: phases reached, checks that failed and how often, the creator's turns after the plan was confirmed,\nwhere the assistant had to guess. Comments in the template explain each part, so the template itself guides the\nassistant.\n"}},{"id":"bb-review-procedure","title":"Review procedure","technology":"Markdown","parent":"bb-tooling-package","implements":["concept-rule-catalog","concept-plain-language"],"requires":["if-validation-report"],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":348,"heading":"Review procedure","prose":"\nThe formal validation's judgment (`review/`): a prompt for an agent in a fresh context, the rubric of the\nrules no program decides, per archetype, each item with its rule id, and the format of the verdict. The agent starts from the validation\nreport, reads the built bundle, the dependencies and the plan's retrospective, and judges what no check decides:\nwhether learners act themselves, ads, plain language, learner-specific data in public texts.\n"}},{"id":"bb-skills","title":"Skills","technology":"Markdown (agentskills.io)","parent":"bb-tooling-package","implements":["concept-rule-catalog","concept-plain-language","concept-terse-output"],"requires":[],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":154,"heading":"Skills","prose":"\nThe rules as the assistant reads them, and the know-how around them (`skills/`), in the agentskills.io format: `lernapps-app` (workflow\nand general rules), one per archetype, topic skills such as third-party content (bundle it at build time, name\nsource and licence next to it, embeds only after a click, links verified, never guessed), and `lernapps-listing`\n(fetch the entry schema, fill it from plan and report, open the pull request). Each skill names the rule ids it\ncarries. They are synced from the package into the creator's agent harness (chapter 7) and can be installed alone\nwith `npx skills add lernapps/tooling` for apps built otherwise.\n"}},{"id":"bb-tooling-package","title":"\"@lernapps/tooling\"","technology":"TypeScript, Node, npm package installed from git","implements":["concept-stable-contracts"],"requires":[],"kind":"building-block","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":84,"heading":"@lernapps/tooling","prose":"\nThe one package every app depends on. Its version is a commit of `main`; Renovate moves every app to the latest\ncommit and merges when the app's checks are green (preset `github>lernapps/tooling`). An app holds only thin files\nthat refer to it: configuration that extends a preset, the hooks installed by it, skills synced from it. The\npackage's own build runs the same check command it gives apps, plus a test that the rule ids within skills, lint rules,\nchecks and rubric are unique and every message links to its rule.\n"}},{"id":"if-agents-md","title":"AGENTS.md","provider":"bb-process-guidance","protocol":"Markdown file at the app's root","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":121,"heading":"AGENTS.md","prose":"\nThe entry point every assistant reads, generated into the app. It stays short and refers to the plan and the\nskills.\n"}},{"id":"if-app-check-action","title":"App check action","provider":"bb-app-check-action","protocol":"GitHub Actions `uses:` at a pinned commit","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":434,"heading":"App check action interface","prose":"\nUsed in the app's `pages.yml` next to the site actions, pinned to a commit and bumped by Renovate.\n"}},{"id":"if-archetype-preset","title":"Archetype preset","provider":"bb-archetypes","protocol":"npm subpath exports (config, tsconfig, hooks)","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":229,"heading":"Archetype preset interface","prose":"\nWhat an app imports and extends: configuration, `tsconfig` base and hooks, by archetype.\n"}},{"id":"if-archetype-templates","title":"Archetype templates","provider":"bb-app-templates","protocol":"Files at a pinned commit of lernapps/app-templates","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":406,"heading":"Archetype templates interface","prose":"\nThe generator copies one folder at the commit pinned in the package, so templates and presets change together.\n"}},{"id":"if-check-cli","title":"Check CLI","provider":"bb-check-cli","protocol":"CLI `lernapps check [--pre-commit] [--pre-push] [\u003cdir|url>] [--entry \u003cfile>]`","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":317,"heading":"Check CLI interface","prose":"\nExit code 0 when no `error` rule fails; the report on standard output; `--report \u003cfile>` writes it to a file.\n"}},{"id":"if-generator-cli","title":"Generator CLI","provider":"bb-generator","protocol":"CLI `lernapps create`","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":199,"heading":"Generator CLI","prose":"\nIt fails if the archetype is unknown or the folder is not empty.\n"}},{"id":"if-lint-plugin","title":"Lint plugin","provider":"bb-lint-rules","protocol":"Oxlint / ESLint plugin API","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":276,"heading":"Lint plugin","prose":"\nThe preset loads the plugin; apps do not configure it themselves.\n"}},{"id":"if-listing-comment","title":"Listing results comment","provider":"bb-listing-validation","protocol":"GitHub pull request comment","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":464,"heading":"Listing results comment","prose":"\nThe validation report as a comment on the pull request, so the creator's assistant can fix the app and push again.\n"}},{"id":"if-plan-file","title":"Plan file","provider":"bb-process-guidance","protocol":"Markdown with YAML front matter","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":136,"heading":"Plan file","prose":"\nThe human-readable plan in the app repo (`.vibe/plan.md`). It stays in the creator's repo and reaches the platform\nonly with a listing. Its front matter has a versioned JSON Schema in the package; its headings (the four phases,\nthen the retrospective and its parts) are fixed, so hooks, review and evals can read it.\n"}},{"id":"if-review-procedure","title":"Review procedure","provider":"bb-review-procedure","protocol":"Markdown prompt and rubric","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":363,"heading":"Review procedure interface","prose":"\nIts verdict names the reviewed commit and, per finding, the rule id, or proposes a new rule and where it would act.\n"}},{"id":"if-skills","title":"Skills","provider":"bb-skills","protocol":"SKILL.md files in the harness's skill folder","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":168,"heading":"Skills interface","prose":"\nThe skills the assistant loads when a task needs them; one per concern.\n"}},{"id":"if-validation-report","title":"Validation report","provider":"bb-check-cli","protocol":"YAML with published JSON Schema","kind":"interface","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/05-building-blocks.arc42.md","line":332,"heading":"Validation report","prose":"\nThe result of a check run as YAML: what was checked (commit, or URL and time), the rules in scope, findings per rule\nid with location and fix, suppressions with their reasons, and the fitness values for the entry. Deterministic: the\nsame input gives the same report. Its schema is published at lernapps.net as JSON Schema, which validates the YAML.\n"}},{"id":"rs-listing-validated","title":"A listing is validated","involves":["bb-listing-validation","bb-check-cli","bb-review-procedure"],"trigger":"A pull request to lernapps/apps adds or changes an entry","kind":"runtime-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/06-runtime-view.arc42.md","line":107,"heading":"A listing is validated","prose":"\nA pull request adds an entry to lernapps/apps. The listing validation checks the deployed app against the entry:\nthe rules, the topic links, the fitness values. On failure it comments the report; the creator's assistant fixes the\napp or the entry and pushes again. Then the review agent judges the rest and the owner decides.\n"}},{"id":"rs-new-app","title":"A new app, from first prompt to listing","involves":["bb-process-guidance","bb-generator","bb-app-templates","bb-skills","bb-archetypes","bb-lint-rules","bb-git-hooks","bb-check-cli","bb-app-check-action","bb-listing-validation"],"trigger":"A creator asks their AI assistant for a learning app","kind":"runtime-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/06-runtime-view.arc42.md","line":14,"heading":"A new app, from first prompt to listing","prose":"\nThe creator asks their assistant for an app. The assistant reads `AGENTS.md`, explores the idea with the creator in\nthe plan file, including what the entry needs to help adults find the app, and confirms the plan with them. Then it\nworks on its own: it generates the scaffold, builds with the skills and the hooks' feedback, publishes, and lists\nthe app from the plan and the validation report.\n"}},{"id":"rs-push-fails","title":"A push fails","involves":["bb-git-hooks","bb-check-cli","bb-process-guidance"],"trigger":"The assistant pushes a commit that breaks a checked rule","kind":"runtime-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/06-runtime-view.arc42.md","line":66,"heading":"A push fails","prose":"\nThe pre-push run finds a request to another server in a built page. The hook prints the message, counts the\nfailure in the plan's front matter, and the assistant fixes the app without asking the creator.\n"}},{"id":"rs-rule-changes","title":"A rule changes","involves":["bb-tooling-package","bb-skills","bb-lint-rules","bb-check-cli","bb-review-procedure","bb-evals"],"trigger":"A pull request to lernapps/tooling changes a rule in its artifact","kind":"runtime-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/06-runtime-view.arc42.md","line":152,"heading":"A rule changes","prose":"\nThe owner tightens a rule, or a creator contributes one. The pull request changes the artifact where the rule acts:\nthe skill text, the lint rule, the check or the rubric item, keeping or adding the rule id. The tooling's build\nchecks the ids; the evals run; after the merge, Renovate brings the new package commit to every app.\n"}},{"id":"dn-agent-harness","title":"Creator's agent harness","type":"environment","hosts":["bb-process-guidance","bb-skills"],"parent":"dn-creator-machine","kind":"deployment-node","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/07-deployment-view.arc42.md","line":72,"heading":"Creator's agent harness","prose":"\nThe runtime of the creator's assistant: Claude Code, Codex, Gemini CLI or another agent. Guidance reaches the\nassistant here: `AGENTS.md` at the app's root, which every harness reads, and the skills, synced from the package\ninto the harness's skill folder (e.g. `.agents/skills/`, `.claude/skills/`). The harness decides when to load a\nskill; agent-specific hooks of the harness may add convenience but carry no enforcement.\n"}},{"id":"dn-app-ci","title":"App repo CI (GitHub Actions)","type":"container","hosts":["bb-app-check-action","bb-check-cli"],"parent":"dn-github","kind":"deployment-node","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/07-deployment-view.arc42.md","line":144,"heading":"App repo CI","prose":"\nGitHub Actions of each app repo: the app check action runs the check command without flags, the same checks the\nhooks ran, on every pull request and push; apps on lernapps.net deploy with the site actions afterwards.\n"}},{"id":"dn-apps-ci","title":"lernapps/apps CI (GitHub Actions)","type":"container","hosts":["bb-listing-validation","bb-check-cli"],"parent":"dn-github","kind":"deployment-node","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/07-deployment-view.arc42.md","line":158,"heading":"lernapps/apps CI","prose":"\nGitHub Actions of the app overview: the listing validation on pull requests that add or change an entry.\n"}},{"id":"dn-creator-machine","title":"Creator's machine or assistant sandbox","type":"device","hosts":["bb-tooling-package","bb-generator","bb-archetypes","bb-git-hooks","bb-lint-rules","bb-check-cli"],"kind":"deployment-node","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/07-deployment-view.arc42.md","line":56,"heading":"Creator's machine","prose":"\nThe creator's computer or their assistant's sandbox, with the app repo. `npm ci` installs the tooling package into\nthe app; the generator runs once; the hooks run the check command on every commit and push. The pre-push part\nneeds a browser for the end-to-end tests; the preset installs Playwright's browser once and caches it, and the check\nsays clearly when a sandbox cannot run one.\n"}},{"id":"dn-github","title":"GitHub","type":"cloud-region","hosts":[],"kind":"deployment-node","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/07-deployment-view.arc42.md","line":101,"heading":"GitHub","prose":"\nThe means of production (`con-github`).\n"}},{"id":"dn-lernapps-agents","title":"Environment for lernapps agents","type":"environment","hosts":["bb-review-procedure","bb-evals","bb-check-cli"],"kind":"deployment-node","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/07-deployment-view.arc42.md","line":88,"heading":"Environment for lernapps agents","prose":"\nThe environment where agents defined by lernapps run: the review agent on a listing pull request, and the eval runs\nwith Claude Code, Codex and Gemini CLI. Today it is the owner's machine; it can move to a dedicated environment\nwithout changing the blocks.\n"}},{"id":"dn-templates-repo","title":"lernapps/app-templates repository","type":"environment","hosts":["bb-app-templates"],"parent":"dn-github","kind":"deployment-node","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/07-deployment-view.arc42.md","line":129,"heading":"lernapps/app-templates","prose":"\nThe archetype templates, one folder each, read by the generator at the commit pinned in the package.\n"}},{"id":"dn-tooling-repo","title":"lernapps/tooling repository","type":"environment","hosts":["bb-tooling-package","bb-app-check-action"],"parent":"dn-github","kind":"deployment-node","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/07-deployment-view.arc42.md","line":115,"heading":"lernapps/tooling","prose":"\nSource of the package and of the app check action; apps install the package from git at a commit of `main`, which\nRenovate keeps current. Its Pages at lernapps.net/tooling/ publish the documentation and the schema of the\nvalidation report.\n"}},{"id":"concept-plain-language","title":"Plain language","category":"language","kind":"concept","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/08-concepts.arc42.md","line":57,"heading":"Plain language","prose":"\nTexts for learners, teachers and parents are German in plain language (ISO 24495-1): short sentences, active voice,\nno jargon; they live in message files, not in code. Shared infrastructure is English. Guidance for assistants\n(`AGENTS.md`, plan template, skills, rubric) is direct and imperative: what to do, in which order, with one\nexample. The same applies to the messages of every check.\n"}},{"id":"concept-rule-catalog","title":"Rule catalog","category":"guidance","kind":"concept","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/08-concepts.arc42.md","line":42,"heading":"Rule catalog","prose":"\nA **rule** is one requirement on an app. The rule catalog is not a file or a block: it is the set of all rules,\neach living in the artifacts where it acts. What makes it one catalog is a shared vocabulary and stable ids.\n\nEvery rule has:\n\n| Attribute | Values | Meaning |\n|---|---|---|\n| id | stable name, e.g. `no-request-before-click` | the same id in every artifact, message and report; it never changes when the rule moves |\n| scope | one or more of `listing`, `site`, `archetype:\u003cname>` | which apps it applies to: every listed app wherever it is hosted; every page served on lernapps.net; apps of that archetype |\n| severity | `error`, `warning`, `hint` | error: must not be broken, the check or review fails. Warning: may be broken deliberately with a reason recorded in place; the review sees every suppression. Hint: a recommendation, never fails |\n\nA `listing` rule is never a `warning`: a creator cannot argue their way past the fitness signal. The rules in scope\nfor an app are those of scope `listing`, of its archetype and, when it is served on lernapps.net, of scope `site`.\n\nA rule can live in several artifacts at once, each a different deployment unit; the shared id makes them one rule.\nA skill tells it, so that the assistant prevents the problem; a lint rule or check reports it, so that a slip is\ncaught; the review judges what no program decides. No artifact refers to the others:\n\n| Artifact | Carries a rule as | Building block | Takes effect in |\n|---|---|---|---|\n| section of a skill (`skills/**/*.md`) | a `rule` block with id, scope and severity under the section's heading; \"must\" for errors, \"should\" or \"may\" for hints | `bb-skills` | the creator's agent harness |\n| lint rule (`lint/rules/\u003cid>.ts`) | its file name; `meta.docs.url` links the rule; severity in the preset's configuration | `bb-lint-rules`, `bb-archetypes` | the editor and the pre-commit hook; CI |\n| check of the check CLI (`check/rules/*.ts`) | `id` and `url` in its default export | `bb-check-cli` | the pre-push hook; CI; the listing validation |\n| item of the review rubric (`review/**/*.md`) | a `rubric` block with its id under the item's heading | `bb-review-procedure` | the environment where lernapps agents run |\n\nThe link of every message is the rule's entry on the rule page, `https://lernapps.net/tooling/rules/#\u003cid>`. The\ntooling's own build reads all artifacts and tests each kind on its own: ids are valid and unique within the kind,\nand every message links to its rule (`scripts/rules.ts`, run by the tests in `lernapps check`). The same reading\nlists every rule grouped by id, as YAML for agents and as the rule page of the docs site. Whether the artifacts of\none id still agree, which rules lack a skill or a check, and which could move, is judged by an agent that reads\nthat list; it reports and changes nothing. Nothing is generated from a central file.\n\nA rule moves when experience shows it can: a review finding that recurs becomes a lint rule or a check, a step that\nassistants keep forgetting becomes a question in the plan template. The move is a pull request that adds the new\nartifact and removes the old text; the id stays. Rules contributed by experienced creators enter the same way.\n"}},{"id":"concept-stable-contracts","title":"Stable contracts","category":"evolution","kind":"concept","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/08-concepts.arc42.md","line":106,"heading":"Stable contracts","prose":"\nWhat others build on does not change silently: rule ids, the commands and flags of the CLI, the subpath exports of\nthe package, the schema of the validation report and the front matter of the plan file. A breaking change gets a\nnew schema version or a new name, and Renovate brings it to every app with the evals run before. The entry schema\nbelongs to lernapps/apps; the tooling fetches it each time instead of copying it.\n"}},{"id":"concept-terse-output","title":"Terse output","category":"efficiency","kind":"concept","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/08-concepts.arc42.md","line":75,"heading":"Terse output","prose":"\nEvery token an assistant reads costs the creator time and money. Output is short and structured:\n\n- **Messages** have one shape in lint, hooks, check CLI and listing comment: rule id and severity, where (file and\n  line, or page and element), what was found, how to fix it, link to the rule. Nothing else; passing checks print\n  one line.\n- **Reports** are YAML, readable by people and agents without a viewer.\n- **Guidance** is loaded when needed: `AGENTS.md` stays short and points to skills; a skill covers one concern.\n"}},{"id":"concept-traceability","title":"Logging and traceability","category":"operations","kind":"concept","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/08-concepts.arc42.md","line":91,"heading":"Logging and traceability","prose":"\nWhat runs is traceable without collecting anything about people. Every validation report names the commit (or URL\nand time) it checked; the hooks keep their counters in the plan file's front matter, which is committed with the app;\nthe review verdict names the reviewed commit. Logs stay where the run happens: on the creator's machine, in the CI\nlog of the repo, in the environment where lernapps agents run. No log or report contains personal data, and the\ntooling sends no telemetry.\n"}},{"id":"dec-archetypes","title":"Archetypes as the variation point","status":"accepted","date":"2026-10-08","addresses":["qg-simple-to-build","qg-few-iterations"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":31,"heading":"Archetypes as the variation point","prose":"\n**Context:** a content-heavy app and a typing trainer differ in stack, rules and review. **Decision:** apps are\nbuilt from archetypes, named after their character; an archetype is a template, a preset, skills and the rules in\nscope. The architecture fixes the variation point, not the list of archetypes. **Consequences:** a new archetype\nneeds a template, a preset and skills, no new building block; it is justified only by a different set of rules,\nstack or review.\n"}},{"id":"dec-check-cli","title":"A standalone check CLI with YAML output","status":"accepted","date":"2026-10-09","addresses":["qg-checked-not-declared","qg-list-in-minutes","qg-findable","con-frontend-only","con-page-rules","risk-no-shell"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":207,"heading":"A standalone check CLI with YAML output","prose":"\n**Context:** the same rules must be checked on scaffolded apps and on apps built otherwise, and people and agents\nread the result. **Decision:** one CLI that works on a repo, a bundle or a URL, without needing the source repo for\nthe checks of the built app; it checks an entry against the app with `--entry`; it reports in YAML; for scope\n`site` it calls `lernapps-check` of the site frame, which stays there. **Consequences:** the same check in hook, CI\nand listing; the report is the fitness signal and is readable without a viewer.\n"}},{"id":"dec-correctness-suggested","title":"Content correctness is suggested","status":"accepted","date":"2026-10-08","addresses":["qg-simple-to-build"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":273,"heading":"Content correctness is suggested","prose":"\n**Context:** correctness is checkable only where answers are computable. **Decision:** generator and checker tests,\ncited sources and verified links are `hint` rules, never a listing condition. **Consequences:** the review notes, but\ndoes not block, missing correctness support.\n"}},{"id":"dec-epcc-plan-file","title":"EPCC in AGENTS.md with a plan file","status":"accepted","date":"2026-10-08","addresses":["qg-any-assistant","qg-simple-to-build","qg-findable","risk-assistants-skip-guidance"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":49,"heading":"EPCC in AGENTS.md with a plan file","prose":"\n**Context:** assistants run through all steps at once unless guided; the guidance must work with any assistant.\n**Decision:** the EPCC workflow as plain text in `AGENTS.md` and a plan file with phases, checkpoints, the creator's\nanswers for the entry, front matter counters and a retrospective; `@codemcp/workflows` stays optional.\n**Consequences:** no MCP server needed; the plan is readable by the creator, carries what the entry needs, and is the\nsource for measurement.\n"}},{"id":"dec-evals-by-hand","title":"Evals by hand with three assistants","status":"accepted","date":"2026-10-08","addresses":["qg-any-assistant","qg-few-iterations"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":257,"heading":"Evals by hand with three assistants","prose":"\n**Context:** other people's assistants cannot be observed. **Decision:** the evals run by hand with Claude Code,\nCodex and Gemini CLI on their latest models; there is no automated eval pipeline. **Consequences:** evals before\nmerging guidance changes; the p90 of failed pre-push runs is measured there.\n"}},{"id":"dec-five-layers","title":"Five layers around the assistant","status":"accepted","date":"2026-10-08","addresses":["qg-simple-to-build","qg-few-iterations","qg-checked-not-declared"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":13,"heading":"Five layers around the assistant","prose":"\n**Context:** a creator's assistant needs guidance before, during and after building, and the platform needs proof\nbefore listing. **Decision:** process guidance, scaffolding, conventions, deterministic verification and formal\nvalidation, each in its own building blocks. **Consequences:** every layer can improve on its own; a rule can move\nbetween layers (`concept-rule-catalog`).\n"}},{"id":"dec-one-check-command","title":"One check command; hooks and CI run the same","status":"accepted","date":"2026-10-09","addresses":["qg-few-iterations","qg-any-assistant","risk-owner-bottleneck","risk-assistants-skip-guidance","risk-counter-tampering","risk-browser-at-creator"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":151,"heading":"One check command; hooks and CI run the same","prose":"\n**Context:** checks that only CI runs reach the assistant late and cost the owner's attention; checks that differ\nbetween hook and CI surprise. **Decision:** `lernapps check` runs every deterministic check. `--pre-commit` selects\nthe fast part (format, lint, types), `--pre-push` the heavy part (unit tests, build, checks of the built app,\nend-to-end tests with Playwright); no flag or both flags run everything. The hooks run the two parts, CI runs\neverything. A failed pre-push increments `prePushFailures` in the plan's front matter. **Consequences:** failures\nreach the assistant on the creator's machine, before any CI run; CI is a safety net for skipped hooks and adds no\nchecks of its own; the creator's machine needs a browser for the end-to-end tests.\n"}},{"id":"dec-one-package","title":"One package from git","status":"accepted","date":"2026-10-08","addresses":["qg-guidance-evolves","risk-git-install","con-github"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":82,"heading":"One package from git","prose":"\n**Context:** a template copied once drifts; npm installs from git only a repo root. **Decision:** one package\n`@lernapps/tooling` at the root of lernapps/tooling with subpath exports and one CLI, installed from git at a commit\nof `main`, kept current by Renovate, as `@lernapps/site` is. **Consequences:** no publishing pipeline; every app gets\nchanges without edits; publishing to npm stays possible.\n"}},{"id":"dec-report-per-commit","title":"Every report is bound to a commit","status":"accepted","date":"2026-10-08","addresses":["qg-checked-not-declared"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":308,"heading":"Every report is bound to a commit","prose":"\n**Context:** apps may be deployed anywhere, and a validation does not stay true when the app changes.\n**Decision:** every validation report names the commit (or the URL and time) it checked. Showing an entry as a\nfact sheet of an app deployed elsewhere, and re-validating listed apps, belong to the app overview and build on\nthat. **Consequences:** the deployed app can be traced to the validated commit.\n"}},{"id":"dec-review-agent","title":"Review by an agent, results as a comment","status":"accepted","date":"2026-10-08","addresses":["qg-checked-not-declared","qg-list-in-minutes","risk-owner-bottleneck"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":224,"heading":"Review by an agent, results as a comment","prose":"\n**Context:** some rules need judgment; creators should be able to fix failures without the owner. **Decision:** the\nlisting validation comments the report on failure; a review agent in a fresh context, starting from the report,\njudges the rest; its verdict names the commit. Target: half pass on the first run, 7 of 8 on the second.\n**Consequences:** the owner sees only listings that passed the checks.\n"}},{"id":"dec-review-by-owner","title":"The owner runs the review","status":"accepted","date":"2026-10-08","addresses":["con-one-owner","risk-owner-bottleneck"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":241,"heading":"The owner runs the review","prose":"\n**Context:** a review agent in CI needs an API key and costs money per run. **Decision:** the listing workflow runs\nthe deterministic checks; the owner starts the review agent in the environment for lernapps agents on a pull request\nthat passed them. **Consequences:** no secret in lernapps/apps; the environment can change without changing the\nprocedure.\n"}},{"id":"dec-rules-in-artifacts","title":"Rules live in their artifacts","status":"accepted","date":"2026-10-09","addresses":["qg-guidance-evolves","qg-checked-not-declared","risk-oxlint-plugins","risk-rule-drift"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":189,"heading":"Rules live in their artifacts","prose":"\n**Context:** a central rule file compiled into skills, lint configuration, checks and rubric would duplicate what\nthe artifacts already say, and skill text cannot be generated well; rules move between layers rarely.\n**Decision:** each rule lives where it acts, as skill text, lint rule, check or rubric item, often in several of\nthem, with a stable id and the shared vocabulary of scope and severity (`concept-rule-catalog`). Each kind of\nartifact is tested on its own; the tooling's build only reads the artifacts, tests the ids per kind and lists the\nrules by id. **Rejected:** a central catalog with a compile step; cross-checks between the artifacts, which would\nneed each artifact to declare how the rule is enforced elsewhere. **Consequences:** moving a rule is a pull request\nthat writes the new artifact and removes the old text; a rule can be told preventively and checked at the same\ntime; the artifacts can drift in wording, which an agent reading the list by id and the evals catch.\n"}},{"id":"dec-schema-explains-itself","title":"The entry schema explains itself","status":"accepted","date":"2026-10-08","addresses":["qg-list-in-minutes","qg-findable","con-entry-schema","risk-entry-schema-changes"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":65,"heading":"The entry schema explains itself","prose":"\n**Context:** the entry model of the app overview is tuned for discovery over time. **Decision:** the guidance only\ntells the assistant to fetch the published schema and fill it; field descriptions live in the schema.\n**Consequences:** the schema must be self-explanatory; changing it needs no change to the tooling.\n"}},{"id":"dec-skills","title":"Conventions as skills","status":"accepted","date":"2026-10-08","addresses":["qg-any-assistant","qg-guidance-evolves"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":167,"heading":"Conventions as skills","prose":"\n**Context:** guidance must be loaded when needed, not all at once. **Decision:** skills in the agentskills.io\nformat, general, per archetype and per topic, synced from the package into the creator's agent harness.\n**Consequences:** skills reach every app through the package; apps built otherwise can install them alone.\n"}},{"id":"dec-strict-typescript","title":"Strict TypeScript everywhere","status":"accepted","date":"2026-10-08","addresses":["qg-few-iterations","con-language-licence"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":131,"heading":"Strict TypeScript everywhere","prose":"\n**Context:** types give assistants the fastest feedback. **Decision:** every app is TypeScript only: `strict` and the\nstricter compiler options, no `any`, no JavaScript sources; data the creator supplies is typed and validated at\nbuild time. **Consequences:** every archetype's toolchain must support TypeScript sources end to end.\n"}},{"id":"dec-templates-repo","title":"Templates in lernapps/app-templates, logic in the package","status":"accepted","date":"2026-10-08","addresses":["qg-simple-to-build","qg-guidance-evolves"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":99,"heading":"Templates in lernapps/app-templates, logic in the package","prose":"\n**Context:** each archetype needs a starting app that can be seen and tried. **Decision:** lernapps/app-templates\nholds one folder per archetype; the generator in the package copies a folder at a pinned commit.\n**Consequences:** templates and presets change together through the pinned commit; templates stay small because the\nlogic is in the package.\n"}},{"id":"dec-tooling-sends-nothing","title":"The tooling sends nothing","status":"accepted","date":"2026-10-08","addresses":["qg-nothing-collected","risk-invisible-failures"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":291,"heading":"The tooling sends nothing","prose":"\n**Context:** sessions that never reach a listing stay invisible, but the platform collects nothing in secret.\n**Decision:** the tooling sends nothing about a creator, an app or a session. Measurements stay in the creator's\nrepo (plan file) and reach the platform only with a listing. Feedback from an assistant to the platform needs the\ncreator's consent for each sending and carries structured totals only, through the platform's anonymous feedback\nchannel. **Consequences:** measurement relies on evals, listings and conversations with creators.\n"}},{"id":"dec-vite-plus","title":"vite-plus as the toolchain","status":"accepted","date":"2026-10-08","addresses":["qg-simple-to-build","qg-few-iterations","risk-vite-plus-young"],"kind":"decision","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","line":115,"heading":"vite-plus as the toolchain","prose":"\n**Context:** creators should get lint, format, type check, tests and hooks without choosing tools. **Decision:**\nvite-plus with its defaults, made stricter by the presets; the presets own the configuration. **Consequences:** one\ntoolchain and one config; the risk of a young tool is contained in the presets.\n"}},{"id":"qg-checked-not-declared","title":"Checked, not declared","priority":"high","kind":"quality-goal","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":78,"heading":"Checked, not declared","prose":"\nAdults decide whether to use an app from its listing; what an app sends to third parties is \"checked rather than\ndeclared\" ([visible fitness for use](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-fitness-signal)). Teachers use an app without checking it themselves\n([teachers use an app without checking it themselves](https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md:el-a-trust-built-in)), so the\nvalidation must be trustworthy: reproducible, bound to one commit, and the same for apps not built with the tooling.\n"}},{"id":"qg-findable","title":"Listings help find the right app","priority":"high","kind":"quality-goal","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":63,"heading":"Listings help find the right app","prose":"\nThe platform's main job is that adults [find an app for a topic and grade](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-t-find-app), through\n[finding apps by topic and grade](https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-finding). A listing helps only if it describes the app as adults search for it:\nsubject, grades, topics with deep links into the app, a summary of what learners do. The tooling asks for this while\nthe app is being shaped, not after it is built, and checks that what the entry promises exists in the app.\n"}},{"id":"qg-list-in-minutes","title":"List in minutes","priority":"high","kind":"quality-goal","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":48,"heading":"List in minutes","prose":"\nReach is no reason for creators to start ([relationships](https://lernapps.net/docs/platform-design/#2-design/d4-relationships.pdt42.md)), so the first listing has to cost almost nothing: \"Contributing an\napp takes minutes\" ([effortless listing](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-listing), [help to list an app](https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-listing-help)). It serves the riskiest\nassumption of the MVP, [creators list an app when it costs minutes](https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md:el-a-creators-list).\n"}},{"id":"qg-nothing-collected","title":"Nothing collected in secret","priority":"high","kind":"quality-goal","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":92,"heading":"Nothing collected in secret","prose":"\nThe apps collect nothing and stay frontend-only ([returning use and praise to creators](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-feedback)). The tooling follows the same rule towards creators:\nit sends nothing about a creator, an app or a session without the creator's explicit consent, and then only\nstructured totals. When this conflicts with features or convenience, it wins.\n"}},{"id":"qg-simple-to-build","title":"Simple to build with guidance","priority":"high","kind":"quality-goal","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":34,"heading":"Simple to build with guidance","prose":"\nCreators have little time and build alongside their actual job ([app creators](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-creators)); the\njourney promises to \"build your app faster with good guidance\" ([list an app and hear it is used](https://lernapps.net/docs/platform-design/#2-design/d7-experiences.pdt42.md:el-x-list-and-hear-back)). This goal is about\nsimplicity for the creator: few, clear decisions, the next step always known, no need to know the platform's rules\nor the toolchain. When it conflicts with flexibility, simplicity wins: fewer choices, stricter defaults.\n"}},{"id":"qg-any-assistant","title":"Works through any assistant","priority":"medium","kind":"quality-goal","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":119,"heading":"Works through any assistant","prose":"\n\"Whatever lernapps.net offers creators has to work through their AI assistants\" ([AI assistants](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants)), and the\nproviders compete. Guidance and enforcement must not depend on one vendor, an MCP server or agent-specific hooks.\n"}},{"id":"qg-few-iterations","title":"Fewer iterations for the assistant","priority":"medium","kind":"quality-goal","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":106,"heading":"Fewer iterations for the assistant","prose":"\nAI assistants want to \"reach a working app with fewer iterations and less guessing\" ([AI assistants](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants),\nconvenience gain). This goal is about cost: every iteration costs the creator time and money for their assistant.\nFast, precise feedback and a scaffold that already meets the rules keep iterations down.\n"}},{"id":"qg-guidance-evolves","title":"The guidance evolves","priority":"medium","kind":"quality-goal","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":135,"heading":"The guidance evolves","prose":"\nMaintaining the guidance is an activity of the creators' journey, paid with the owner's time\n([list an app and hear it is used](https://lernapps.net/docs/platform-design/#2-design/d7-experiences.pdt42.md:el-x-list-and-hear-back)), and experienced creators bring their own practices into it\n([contributing best practices](https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-contribute-practices)).\nA rule lives in one place; a change reaches every app through its dependency updates, and is tested before it\nreaches creators.\n"}},{"id":"qs-actionable-failure","title":"A check fails","quality":"qg-few-iterations","stimulus":"A deterministic check fails on a commit or push","response":"The message names the rule, the file or page, what was found, and how to fix it","metric":"The assistant fixes it without asking the creator in every eval run; no listing retrospective names a check message as unclear (source - evals, retrospective)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":197,"heading":"A check fails","prose":"\nAgents fix what they understand. An error message is their prompt.\n"}},{"id":"qs-entry-matches-app","title":"An entry promises what the app has","quality":"qg-findable","stimulus":"The assistant opens a listing pull request","response":"Subject, grades, topics and summary come from the plan's Explore answers; the check confirms that the app's URL and every topic link resolve","metric":"Every topic link of every listing built with the tooling resolves, and no listing needs a field corrected by the owner for discovery (source - listing reports)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":228,"heading":"An entry promises what the app has","prose":"\nThe entry is built from the creator's answers in Explore, and the listing validation compares it with the app.\n"}},{"id":"qs-eval-iterations","title":"An archetype in the evals","quality":"qg-few-iterations","stimulus":"The evals run a sample creator prompt for an archetype","response":"The assistant reaches an app that passes validation","metric":"p90 of failed pre-push runs per app below 5 (source - evals, counter in the plan's front matter)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":182,"heading":"An archetype in the evals","prose":"\nIterations are compared in the evals, where we run the assistants ourselves. The pre-push hook counts its failed\nruns in the front matter of the plan file, so the same number arrives with every listing, without the assistant\nreporting it.\n"}},{"id":"qs-external-request","title":"An external request slips in","quality":"qg-nothing-collected","stimulus":"An assistant adds a resource that loads from another server on page load","response":"The pre-push hook and the validation both fail and name the page, the host and the element","metric":"0 requests to other hosts before a click in any app that passes validation (source - listing reports)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":274,"heading":"An external request slips in","prose":"\nA web font, a CDN script or a video thumbnail sends the learner's IP address to another server before any click.\n"}},{"id":"qs-few-turns-after-plan","title":"Few turns after the plan","quality":"qg-simple-to-build","stimulus":"The creator confirms the plan at the end of the Plan phase","response":"The assistant builds, checks and prepares the listing on its own and comes back to the creator only for what it cannot decide","metric":"At most 3 creator turns from the confirmed plan to the listing pull request (source - retrospective)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":150,"heading":"Few turns after the plan","prose":"\nTurns before the plan is agreed are good assistance: the assistant explores the idea with the creator and asks what\nthe catalog needs. Once the creator has confirmed the plan, the assistant should work on its own.\n"}},{"id":"qs-first-listings","title":"The first listings","quality":"qg-list-in-minutes","stimulus":"A creator with a working app asks their assistant to list it","response":"The assistant fills the entry from the plan and the validation report and opens the pull request to lernapps/apps; if the validation fails, it posts the deterministic check results as a comment on the pull request, and the assistant fixes the app from that comment","metric":"Half of the listing pull requests pass validation on the first run, 7 of 8 on the second run after the comment; no creator types an entry field by hand (source - listing reports, retrospective)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":213,"heading":"The first listings","prose":"\nThe listing is generated from the plan and the validation report, not typed by the creator. A first run that\nfails is expected for many creators; the results comment has to be enough for their assistant to fix it.\n"}},{"id":"qs-foreign-app","title":"An app not built with the tooling","quality":"qg-checked-not-declared","stimulus":"A listing pull request names an app that was not generated from a scaffold","response":"The validation runs on the deployed URL or the built bundle alone and produces the same report as for a scaffolded app","metric":"Every deterministic check runs without access to the app's source repository (source - listing reports)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":244,"heading":"An app not built with the tooling","prose":"\nSome creators already have an app, e.g. a chat assistant's artifact, a site of their own or an app built with\nanother toolchain.\n"}},{"id":"qs-guidance-named","title":"Creators name the guidance","quality":"qg-simple-to-build","stimulus":"The owner talks to a creator after their first listing","response":"The creator describes building as simpler than without the guidance","metric":"Most of the first 5 to 10 creators name the guidance as a reason it went fast (source - conversations)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":165,"heading":"Creators name the guidance","prose":"\nThe creators' own view is the main source in the [MVP](https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md).\n"}},{"id":"qs-other-assistant","title":"A creator uses another assistant","quality":"qg-any-assistant","stimulus":"A creator builds an app with an assistant other than Claude Code, without an MCP server","response":"The assistant reads the workflow from AGENTS.md, writes the plan file, loads the skills, and the git hooks run the same checks","metric":"The evals pass with Claude Code, Codex and Gemini CLI, each with its provider's latest model at the time of the run (source - evals)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":304,"heading":"A creator uses another assistant","prose":"\nThe guidance is written for any assistant; Claude Code is only the one the owner uses.\n"}},{"id":"qs-practice-contributed","title":"A creator contributes a practice","quality":"qg-guidance-evolves","stimulus":"An experienced creator proposes a practice from their own app","response":"It is added where it acts - a skill section, a lint rule, a check or a rubric item - with a new rule id, scope and severity","metric":"One pull request to lernapps/tooling, touching no other repo (source - repos)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":334,"heading":"A creator contributes a practice","prose":"\nWhoever shapes the guidance shapes the platform ([contributing best practices](https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-contribute-practices)).\n"}},{"id":"qs-repeatable-validation","title":"Validation is repeated","quality":"qg-checked-not-declared","stimulus":"The deterministic part of the validation runs twice on the same commit","response":"Both runs give the same findings and the same fitness values; the report names the commit","metric":"Identical deterministic results for the same commit; every entry's fitness values come from a report (source - listing reports)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":259,"heading":"Validation is repeated","prose":"\nThe owner and adopting adults rely on the result; a check that passes once and fails the next time is no signal.\n"}},{"id":"qs-rule-change","title":"A rule changes","quality":"qg-guidance-evolves","stimulus":"The owner tightens a rule in the tooling","response":"The change is released once; every app built from a scaffold gets it with its next dependency update pull request, and the evals run before release","metric":"No file in an app repo has to be edited by hand to receive the change (source - repos)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":319,"heading":"A rule changes","prose":"\nA template copied once drifts; the scaffold therefore refers to the versioned package (`dec-one-package`).\n"}},{"id":"qs-tooling-silent","title":"A session with the tooling","quality":"qg-nothing-collected","stimulus":"A creator builds and checks an app with the tooling","response":"The tooling fetches what it needs (packages, schemas) and sends nothing about the creator, the app or the session","metric":"No request from the tooling carries data about the creator, the app or the session without the creator's consent (source - evals with recorded network)","kind":"quality-scenario","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","line":289,"heading":"A session with the tooling","prose":"\nThe tooling itself must not become a hidden channel about creators.\n"}},{"id":"risk-assistants-skip-guidance","title":"Assistants skip the guidance","severity":"high","mitigation":"Enforcement in git hooks and CI, not in text; the scaffold already keeps the rules; the plan template guides through comments; the evals with three assistants show where guidance is ignored","kind":"risk","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","line":11,"heading":"Assistants skip the guidance","prose":"\nAn assistant may ignore `AGENTS.md`, run through all phases at once or skip the checkpoints. The process guidance\nis text; nothing forces an assistant to read it.\n"}},{"id":"risk-browser-at-creator","title":"A browser at the creator","severity":"medium","mitigation":"The preset installs Playwright's browser once and caches it; the check says clearly when no browser can run and which part was skipped; CI runs the same checks, and the listing validation runs them against the deployed app","kind":"risk","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","line":64,"heading":"A browser at the creator","prose":"\nThe end-to-end tests and the checks of the built app run pre-push and need a browser. Downloading it costs time once,\nand some assistant sandboxes cannot run one.\n"}},{"id":"risk-counter-tampering","title":"Counters can be changed by hand","severity":"low","mitigation":"The counter is committed with every change; the review reads its history in git; it is a learning signal, not a listing criterion","kind":"risk","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","line":131,"heading":"Counters can be changed by hand","prose":"\nAn assistant could reset `prePushFailures` in the plan's front matter.\n"}},{"id":"risk-entry-schema-changes","title":"The entry model changes","severity":"medium","mitigation":"The guidance never repeats the schema's fields; the listing skill fetches the published schema each time (`dec-schema-explains-itself`)","kind":"risk","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","line":118,"heading":"The entry model changes","prose":"\nThe entry schema is tuned for discovery over time.\n"}},{"id":"risk-git-install","title":"Installing from git","severity":"low","mitigation":"One package at the root of lernapps/tooling (`dec-one-package`); publish to npm under the reserved scope @lernapps when install time or size starts to hurt","kind":"risk","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","line":144,"heading":"Installing from git","prose":"\nnpm installs a package from git only as a whole repo root, and more slowly than from a registry.\n"}},{"id":"risk-invisible-failures","title":"Sessions without a listing stay invisible","severity":"medium","mitigation":"Evals cover the archetypes; conversations with creators; agent feedback sent with the creator's consent through the platform's anonymous feedback channel","kind":"risk","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","line":105,"heading":"Sessions without a listing stay invisible","prose":"\nWe learn from listings only; sessions that fail before a listing leave no trace.\n"}},{"id":"risk-no-shell","title":"Creators without a shell","severity":"medium","mitigation":"The listing validation works on a URL alone; the comment with the deterministic results is readable for a chat assistant too; lernapps.net/apps/llms.txt guides listing","kind":"risk","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","line":92,"heading":"Creators without a shell","prose":"\nCreators who build in claude.ai or another chat assistant cannot run the generator, hooks or check CLI.\n"}},{"id":"risk-owner-bottleneck","title":"The owner is the bottleneck","severity":"high","mitigation":"Deterministic checks decide everything they can and comment failures without the owner; a deep scaffold leaves little to review; the review can move into the listing workflow when listings justify its cost","kind":"risk","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","line":24,"heading":"The owner is the bottleneck","prose":"\nReview, evals and listing decisions run by hand, on one person's time (`con-one-owner`).\n"}},{"id":"risk-oxlint-plugins","title":"Oxlint JS plugins are young","severity":"medium","mitigation":"Write the rules against the ESLint-compatible API, so they can run as an ESLint plugin; keep rules that need deep analysis in the check CLI","kind":"risk","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","line":50,"heading":"Oxlint JS plugins are young","prose":"\nOur lint rules depend on Oxlint's JavaScript plugin support.\n"}},{"id":"risk-rule-drift","title":"Rule artifacts drift apart","severity":"low","mitigation":"Stable rule ids and the tooling's id test (unique per artifact kind, every message linked); an agent reviews the rules grouped by id; the evals show contradicting guidance","kind":"risk","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","line":79,"heading":"Rule artifacts drift apart","prose":"\nWithout a central rule file, the same rule can be worded differently in a skill and a check, or a moved rule can\nstay in its old place. No program compares the artifacts of one id; the rule list grouped by id makes the\ndifferences visible to the agent that reviews it.\n"}},{"id":"risk-vite-plus-young","title":"vite-plus is before 1.0","severity":"medium","mitigation":"The configuration is owned by the archetype presets, so a change is made once; Renovate updates go through the evals before they reach apps","kind":"risk","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","line":37,"heading":"vite-plus is before 1.0","prose":"\nIts configuration format and commands may still change.\n"}},{"id":"term-archetype","title":"Archetype","definition":"A kind of app the tooling supports, named after its character; a template, a preset, skills and the rules in scope.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":8,"heading":"Archetype","prose":"\nNot \"template\": the template is only one part of an archetype. Names describe what the app is like, not what it is used for.\n"}},{"id":"term-assistant","title":"Assistant","definition":"The creator's AI coding agent (e.g. Claude Code, Codex, Gemini CLI); called \"agent\" in the plan and the skills.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":20,"heading":"Assistant","prose":"\nThe platform design calls them [AI assistants](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants); in the files the assistant reads, we say agent. Not part of the system.\n"}},{"id":"term-checkpoint","title":"Checkpoint","definition":"A point in the plan where the assistant stops for the creator's decision - confirming the plan, publishing, listing.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":32,"heading":"Checkpoint","prose":"\nAfter the creator confirms the plan, the assistant comes back at most three times (`qs-few-turns-after-plan`).\n"}},{"id":"term-creator","title":"Creator","definition":"The person who builds an app with their assistant, typically a teacher or parent.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":44,"heading":"Creator","prose":"\nNot \"developer\": most creators are not professional developers.\n"}},{"id":"term-epcc","title":"EPCC","definition":"Explore, Plan, Code, Commit - the phases of the plan file, after the workflow of the same name in codemcp/workflows.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":56,"heading":"EPCC","prose":"\nWritten out in `AGENTS.md` as plain instructions; the MCP server of codemcp/workflows is optional.\n"}},{"id":"term-evals","title":"Evals","definition":"Sample creator prompts run by the owner with several assistants to test the guidance itself before a change is merged.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":68,"heading":"Evals","prose":"\nRun by hand with Claude Code, Codex and Gemini CLI on their latest models (`dec-evals-by-hand`).\n"}},{"id":"term-fitness-values","title":"Fitness values","definition":"The fitness block of an entry (what an app stores, whether it contacts third parties); taken from a validation report, not declared by the creator.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":80,"heading":"Fitness values","prose":"\nThey feed the platform's [fitness signal](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-fitness-signal): checked, not declared.\n"}},{"id":"term-listing","title":"Listing","definition":"An app's entry in lernapps/apps, added by a pull request, validated, and accepted by the owner.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":92,"heading":"Listing","prose":"\nNot \"registration\" or \"submission\". The listing is the only way an app connects to the platform.\n"}},{"id":"term-plan-file","title":"Plan file","definition":"The assistant's Markdown plan in the app repo with phases, checkpoints, front matter counters and a closing retrospective.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":104,"heading":"Plan file","prose":"\nLives in the app repo and is readable by the creator; it reaches the platform only with a listing.\n"}},{"id":"term-promotion-path","title":"Promotion path","definition":"How a rule moves to the layer where it works best - a recurring review finding becomes a lint rule or check, a forgotten step a question in the plan template.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":116,"heading":"Promotion path","prose":"\nA move is a pull request that adds the new artifact and removes the old text; the id stays.\n"}},{"id":"term-retrospective","title":"Retrospective","definition":"The last section of the plan file, filled by the assistant at the end - phases reached, failed checks, the creator's turns after the plan, where it had to guess.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":128,"heading":"Retrospective","prose":"\nExplained in comments of the plan template; the counters in the front matter are written by the hooks, not by the assistant.\n"}},{"id":"term-rule","title":"Rule","definition":"One requirement on an app, with a stable id, scope (listing, site, archetype), and severity (error, warning, hint); it lives as skill text, lint rule, check or rubric item, often in several of them under the same id.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":140,"heading":"Rule","prose":"\nReplaces the loose terms criterion, convention and guideline: their difference is expressed by scope and severity. One rule can be told in a skill and checked by a program at the same time, under one id. All rules together are the rule catalog (chapter 8).\n"}},{"id":"term-rules-in-scope","title":"Rules in scope","definition":"The rules that apply to one app - scope listing, its archetype, and scope site when it is served on lernapps.net.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":152,"heading":"Rules in scope","prose":"\nSkills, checks and rubric work on the rules in scope of the app at hand.\n"}},{"id":"term-validation-report","title":"Validation report","definition":"The YAML result of the check CLI for one commit or
