 URL - findings per rule id and the fitness values; its schema is published.","kind":"glossary-term","loc":{"file":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","line":164,"heading":"Validation report","prose":"\nBound to the commit it checked, so a fact sheet can trace the deployed app to it.\n"}}],"edges":[{"from":"actor-creator","to":"if-plan-file","relation":"requires"},{"from":"actor-assistant","to":"if-agents-md","relation":"requires"},{"from":"actor-assistant","to":"if-plan-file","relation":"requires"},{"from":"actor-assistant","to":"if-generator-cli","relation":"requires"},{"from":"actor-assistant","to":"if-skills","relation":"requires"},{"from":"actor-assistant","to":"if-check-cli","relation":"requires"},{"from":"actor-assistant","to":"if-listing-comment","relation":"requires"},{"from":"actor-owner","to":"if-validation-report","relation":"requires"},{"from":"actor-owner","to":"if-review-procedure","relation":"requires"},{"from":"actor-review-agent","to":"if-review-procedure","relation":"requires"},{"from":"actor-review-agent","to":"if-check-cli","relation":"requires"},{"from":"actor-review-agent","to":"if-validation-report","relation":"requires"},{"from":"actor-github","to":"if-app-check-action","relation":"requires"},{"from":"actor-github","to":"if-archetype-preset","relation":"requires"},{"from":"strategy-architecture","to":"qg-simple-to-build","relation":"addresses"},{"from":"strategy-architecture","to":"qg-list-in-minutes","relation":"addresses"},{"from":"strategy-architecture","to":"qg-findable","relation":"addresses"},{"from":"strategy-architecture","to":"qg-checked-not-declared","relation":"addresses"},{"from":"strategy-architecture","to":"qg-nothing-collected","relation":"addresses"},{"from":"strategy-architecture","to":"qg-few-iterations","relation":"addresses"},{"from":"strategy-architecture","to":"qg-any-assistant","relation":"addresses"},{"from":"strategy-architecture","to":"qg-guidance-evolves","relation":"addresses"},{"fr
