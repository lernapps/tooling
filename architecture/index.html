, with the expected result (`evals/`). Run by hand with Claude","line":373,"renderedHtml":""},{"kind":"prose","text":"Code, Codex and Gemini CLI on their latest models; scored with the check CLI, the review procedure and the plan's","line":374,"renderedHtml":""},{"kind":"prose","text":"counters. They run before a change to the guidance is merged.","line":375,"renderedHtml":""},{"kind":"prose","text":"","line":376,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-evals","title":"Evals","parent":"bb-tooling-package","technology":"Markdown prompts, scoring script","requires":"if-generator-cli, if-check-cli, if-validation-report, if-review-procedure","implements":"concept-traceability"},"startLine":378,"endLine":385,"inArc42Fence":true},{"kind":"prose","text":"","line":387,"renderedHtml":""},{"kind":"heading","level":2,"text":"Archetype templates","line":388},{"kind":"prose","text":"","line":389,"renderedHtml":"\u003cp>lernapps/app-templates, one folder per archetype: the files the generator copies, each a working app that passes\nevery check. Each folder can be tried on its own; the logic stays in the package.\u003c/p>\n"},{"kind":"prose","text":"lernapps/app-templates, one folder per archetype: the files the generator copies, each a working app that passes","line":390,"renderedHtml":""},{"kind":"prose","text":"every check. Each folder can be tried on its own; the logic stays in the package.","line":391,"renderedHtml":""},{"kind":"prose","text":"","line":392,"renderedHtml":""},{"kind":"block","blockType":"building-block","attributes":{"id":"bb-app-templates","title":"Archetype templates","technology":"lernapps/app-templates, one folder per archetype"},"startLine":394,"endLine":398,"inArc42Fence":true},{"kind":"prose","text":"","line":400,"renderedHtml":""},{"kind":"heading","level":3,"text":"Archetype templates interface","line":401},{"kind":"prose","text":"","line":402,"renderedHtml":"\u003cp>The generator copies one folder at the nerator as Generator\n    participant templates as Templates\n    participant skills as Skills\n    participant hooks as Git hooks\n    participant check as Check CLI\n    participant ci as App check action\n    participant listing as Listing validation\n    assistant->>guidance: read AGENTS.md, start the plan file\n    assistant->>creator: Explore: purpose, learners, what the entry needs\n    creator->>assistant: answers, confirms the plan\n    assistant->>generator: lernapps create --archetype \u003cname>\n    generator->>templates: copy the archetype folder\n    assistant->>skills: load the skills of the archetype and topic\n    assistant->>hooks: commit\n    hooks->>check: lernapps check --pre-commit\n    assistant->>hooks: push\n    hooks->>check: lernapps check --pre-push (incl. end-to-end tests)\n    check-->>assistant: messages, or ok\n    assistant->>ci: pull request in the app repo\n    ci->>check: lernapps check (the same checks)\n    assistant->>creator: checkpoint: publish\n    assistant->>listing: entry from plan and report, pull request to lernapps/apps","startLine":23,"endLine":58},{"kind":"prose","text":"","line":59,"renderedHtml":""},{"kind":"heading","level":2,"text":"A push fails","line":60},{"kind":"prose","text":"","line":61,"renderedHtml":"\u003cp>The pre-push run finds a request to another server in a built page. The hook prints the message, counts the\nfailure in the plan&#39;s front matter, and the assistant fixes the app without asking the creator.\u003c/p>\n"},{"kind":"prose","text":"The pre-push run finds a request to another server in a built page. The hook prints the message, counts the","line":62,"renderedHtml":""},{"kind":"prose","text":"failure in the plan's front matter, and the assistant fixes the app without asking the creator.","line":63,"renderedHtml":""},{"kind":"prose","text":"","line":64,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-push-fails","title":"A push fails","trigger":"The acts:\nthe skill text, the lint rule, the check or the rubric item, keeping or adding the rule id. The tooling&#39;s build\nchecks the ids; the evals run; after the merge, Renovate brings the new package commit to every app.\u003c/p>\n"},{"kind":"prose","text":"The owner tightens a rule, or a creator contributes one. The pull request changes the artifact where the rule acts:","line":147,"renderedHtml":""},{"kind":"prose","text":"the skill text, the lint rule, the check or the rubric item, keeping or adding the rule id. The tooling's build","line":148,"renderedHtml":""},{"kind":"prose","text":"checks the ids; the evals run; after the merge, Renovate brings the new package commit to every app.","line":149,"renderedHtml":""},{"kind":"prose","text":"","line":150,"renderedHtml":""},{"kind":"block","blockType":"runtime-scenario","attributes":{"id":"rs-rule-changes","title":"A rule changes","trigger":"A pull request to lernapps/tooling changes a rule in its artifact","involves":"bb-tooling-package, bb-skills, bb-lint-rules, bb-check-cli, bb-review-procedure, bb-evals"},"startLine":152,"endLine":157,"inArc42Fence":true},{"kind":"prose","text":"","line":159,"renderedHtml":""},{"kind":"diagram","diagramType":"sequence","id":"rs-rule-changes-sequence","scenario":"rs-rule-changes","notation":"mermaid-sequence","aliases":"owner=actor-owner, package=bb-tooling-package, skills=bb-skills, lint=bb-lint-rules, check=bb-check-cli, procedure=bb-review-procedure, evals=bb-evals, github=actor-github","source":"sequenceDiagram\n    participant owner as Owner\n    participant skills as Skills\n    participant lint as Lint rules\n    participant check as Check CLI\n    participant procedure as Review rubric\n    participant package as Package build\n    participant evals as Evals\n    participant github as GitHub (Renovate)\n    owner->>check: pull request: new check for a recurring finding (same rule id)\n    owner->>procedure: remove the rubric item of that rule\n    package->>skills: read rule ids\n    package->>lint: read rule ids\n    package->>check: read rule ids\n    package->>procedure: read rule ids\n    package-->>owner: ids unique per artifact kind, every message linked\n    owner->>evals: run by hand with three assistants\n    evals-->>owner: scores per archetype\n    owner->>github: merge to main\n    github->>github: Renovate bumps the package in every app, merges when green","startLine":161,"endLine":190},{"kind":"prose","text":"","line":191,"renderedHtml":""}]},{"filePath":"/home/runner/work/tooling/tooling/docs/arc42/07-deployment-view.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Deployment View","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>The tooling has no server of its own. It runs where the creator works, in the creator&#39;s agent harness, in an\nenvironment for the agents lernapps defines, and in GitHub Actions; its sources and published pages live on GitHub.\nApps themselves are hosted on lernapps.net&#39;s GitHub Pages or anywhere else; they are not building blocks of the\ntooling.\u003c/p>\n"},{"kind":"prose","text":"The tooling has no server of its own. It runs where the creator works, in the creator's agent harness, in an","line":3,"renderedHtml":""},{"kind":"prose","text":"environment for the agents lernapps defines, and in GitHub Actions; its sources and published pages live on GitHub.","line":4,"renderedHtml":""},{"kind":"prose","text":"Apps themselves are hosted on lernapps.net's GitHub Pages or anywhere else; they are not building blocks of the","line":5,"renderedHtml":""},{"kind":"prose","text":"tooling.","line":6,"renderedHtml":""},{"kind":"prose","text":"","line":7,"renderedHtml":""},{"kind":"heading","level":2,"text":"Deployment overview","line":8},{"kind":"prose","text":"","line":9,"renderedHtml":""},{"kind":"diagram","diagramType":"deployment","view":"deployment","id":"deployment-overview","notation":"mermaid-architecture","roots":[],"aliases":"creator=dn-creator-machine, harne pinned in the package.\u003c/p>\n"},{"kind":"prose","text":"The archetype templates, one folder each, read by the generator at the commit pinned in the package.","line":126,"renderedHtml":""},{"kind":"prose","text":"","line":127,"renderedHtml":""},{"kind":"block","blockType":"deployment-node","attributes":{"id":"dn-templates-repo","title":"lernapps/app-templates repository","type":"environment","parent":"dn-github","hosts":"bb-app-templates"},"startLine":129,"endLine":135,"inArc42Fence":true},{"kind":"prose","text":"","line":137,"renderedHtml":""},{"kind":"heading","level":3,"text":"App repo CI","line":138},{"kind":"prose","text":"","line":139,"renderedHtml":"\u003cp>GitHub Actions of each app repo: the app check action runs the check command without flags, the same checks the\nhooks ran, on every pull request and push; apps on lernapps.net deploy with the site actions afterwards.\u003c/p>\n"},{"kind":"prose","text":"GitHub Actions of each app repo: the app check action runs the check command without flags, the same checks the","line":140,"renderedHtml":""},{"kind":"prose","text":"hooks ran, on every pull request and push; apps on lernapps.net deploy with the site actions afterwards.","line":141,"renderedHtml":""},{"kind":"prose","text":"","line":142,"renderedHtml":""},{"kind":"block","blockType":"deployment-node","attributes":{"id":"dn-app-ci","title":"App repo CI (GitHub Actions)","type":"container","parent":"dn-github","hosts":"bb-app-check-action, bb-check-cli"},"startLine":144,"endLine":150,"inArc42Fence":true},{"kind":"prose","text":"","line":152,"renderedHtml":""},{"kind":"heading","level":3,"text":"lernapps/apps CI","line":153},{"kind":"prose","text":"","line":154,"renderedHtml":"\u003cp>GitHub Actions of the app overview: the listing validation on pull requests that add or change an entry.\u003c/p>\n"},{"kind":"prose","text":"GitHub Actions of the app overview: the listing validation on pull requests that add or change an entry.","line":155,"renderedHtml":""},{"kind":"prose","text":"","line":156,"renderedHtml":""},{"kind":"block","blockType":"deployment-node","attributes":{"id":"dn-apps-ci","title":"lernapps/apps CI (GitHub Actions)","type":"container","parent":"dn-github","hosts":"bb-listing-validation, bb-check-cli"},"startLine":158,"endLine":164,"inArc42Fence":true},{"kind":"prose","text":"","line":166,"renderedHtml":""}]},{"filePath":"/home/runner/work/tooling/tooling/docs/arc42/08-concepts.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Cross-cutting Concepts","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"heading","level":2,"text":"Rule catalog","line":3},{"kind":"prose","text":"","line":4,"renderedHtml":"\u003cp>A \u003cstrong>rule\u003c/strong> is one requirement on an app. The rule catalog is not a file or a block: it is the set of all rules,\neach living in the artifacts where it acts. What makes it one catalog is a shared vocabulary and stable ids.\u003c/p>\n\u003cp>Every rule has:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Attribute\u003c/th>\n\u003cth>Values\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>id\u003c/td>\n\u003ctd>stable name, e.g. \u003ccode>no-request-before-click\u003c/code>\u003c/td>\n\u003ctd>the same id in every artifact, message and report; it never changes when the rule moves\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>scope\u003c/td>\n\u003ctd>one or more of \u003ccode>listing\u003c/code>, \u003ccode>site\u003c/code>, \u003ccode>archetype:&lt;name&gt;\u003c/code>\u003c/td>\n\u003ctd>which apps it applies to: every listed app wherever it is hosted; every page served on lernapps.net; apps of that archetype\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>severity\u003c/td>\n\u003ctd>\u003ccode>error\u003c/code>, \u003ccode>warning\u003c/code>, \u003ccode>hint\u003c/code>\u003c/td>\n\u003ctd>error: must not be broken, the check or review fails. Warning: may be broken deliberately with a reason recorded in place; the review sees every suppression. Hint: a recommendation, never fails\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>A \u003ccode>listing\u003c/code> rule is never a \u003ccode>warning\u003c/code>: a creator cannot argue their way past the fitness signal. The rules in scope\nfor an app are those of scope \u003ccode>listing\u003c/code>, of its archetype and, when it is served on lernapps.net, of scope \u003ccode>site\u003c/code>.\u003c/p>\n\u003cp>A rule can live in several artifacts at once, each a different deployment unit; the shared id makes them one rule.\nA skill tells it, so that the assistant prevents the problem; a lint rule or check reports it, so that a slip is\ncaught; the review judges what no program decides. No artifact refers to the others:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Artifact\u003c/th>\n\u003cth>Carries a rule as\u003c/th>\n\u003cth>Building block\u003c/th>\n\u003cth>Takes effect in\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>section of a skill (\u003ccode>skills/**/*.md\u003c/code>)\u003c/td>\n\u003ctd>a \u003ccode>rule\u003c/code> block with id, scope and severity under the section&#39;s heading; &quot;must&quot; for errors, &quot;should&quot; or &quot;may&quot; for hints\u003c/td>\n\u003ctd>\u003ccode>bb-skills\u003c/code>\u003c/td>\n\u003ctd>the creator&#39;s agent harness\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lint rule (\u003ccode>lint/rules/&lt;id&gt;.ts\u003c/code>)\u003c/td>\n\u003ctd>its file name; \u003ccode>meta.docs.url\u003c/code> links the rule; severity in the preset&#39;s configuration\u003c/td>\n\u003ctd>\u003ccode>bb-lint-rules\u003c/code>, \u003ccode>bb-archetypes\u003c/code>\u003c/td>\n\u003ctd>the editor and the pre-commit hook; CI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>check of the check CLI (\u003ccode>check/rules/*.ts\u003c/code>)\u003c/td>\n\u003ctd>\u003ccode>id\u003c/code> and \u003ccode>url\u003c/code> in its default export\u003c/td>\n\u003ctd>\u003ccode>bb-check-cli\u003c/code>\u003c/td>\n\u003ctd>the pre-push hook; CI; the listing validation\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>item of the review rubric (\u003ccode>review/**/*.md\u003c/code>)\u003c/td>\n\u003ctd>a \u003ccode>rubric\u003c/code> block with its id under the item&#39;s heading\u003c/td>\n\u003ctd>\u003ccode>bb-review-procedure\u003c/code>\u003c/td>\n\u003ctd>the environment where lernapps agents run\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The link of every message is the rule&#39;s entry on the rule page, \u003ccode>https://lernapps.net/tooling/rules/#&lt;id&gt;\u003c/code>. The\ntooling&#39;s own build reads all artifacts and tests each kind on its own: ids are valid and unique within the kind,\nand every message links to its rule (\u003ccode>scripts/rules.ts\u003c/code>, run by the tests in \u003ccode>lernapps check\u003c/code>). The same reading\nlists every rule grouped by id, as YAML for agents and as the rule page of the docs site. Whether the artifacts of\none id still agree, which rules lack a skill or a check, and which could move, is judged by an agent that reads\nthat list; it reports and changes nothing. Nothing is generated from a central file.\u003c/p>\n\u003cp>A rule moves when experience shows it can: a review finding that recurs becomes a lint rule or a check, a step that\nassistants keep forgetting becomes a question in the plan template. The move is a pull request that adds the new\nartifact and removes the old text; the id stays. Rules contributed by experienced creators enter the same way.\u003c/p>\n"},{"kind":"prose","text":"A **rule** is one requirement on an app. The rule catalog is not a file or a block: it is the set of all rules,","line":5,"renderedHtml":""},{"kind":"prose","text":"each living in the artifacts where it acts. What makes it one catalog is a shared vocabulary and stable ids.","line":6,"renderedHtml":""},{"kind":"prose","text":"","line":7,"renderedHtml":""},{"kind":"prose","text":"Every rule has:","line":8,"renderedHtml":""},{"kind":"prose","text":"","line":9,"renderedHtml":""},{"kind":"prose","text":"| Attribute | Values | Meaning |","line":10,"renderedHtml":""},{"kind":"prose","text":"|---|---|---|","line":11,"renderedHtml":""},{"kind":"prose","text":"| id | stable name, e.g. `no-request-before-click` | the same id in every artifact, message and report; it never changes when the rule moves |","line":12,"renderedHtml":""},{"kind":"prose","text":"| scope | one or more of `listing`, `site`, `archetype:\u003cname>` | which apps it applies to: every listed app wherever it is hosted; every page served on lernapps.net; apps of that archetype |","line":13,"renderedHtml":""},{"kind":"prose","text":"| severity | `error`, `warning`, `hint` | error: must not be broken, the check or review fails. Warning: may be broken deliberately with a reason recorded in place; the review sees every suppression. Hint: a recommendation, never fails |","line":14,"renderedHtml":""},{"kind":"prose","text":"","line":15,"renderedHtml":""},{"kind":"prose","text":"A `listing` rule is never a `warning`: a creator cannot argue their way past the fitness signal. The rules in scope","line":16,"renderedHtml":""},{"kind":"prose","text":"for an app are those of scope `listing`, of its archetype and, when it is served on lernapps.net, of scope `site`.","line":17,"renderedHtml":""},{"kind":"prose","text":"","line":18,"renderedHtml":""},{"kind":"prose","text":"A rule can live in several artifacts at once, each a different deployment unit; the shared id makes them one rule.","line":19,"renderedHtml":""},{"kind":"prose","text":"A skill tells it, so that the assistant prevents the problem; a lint rule or check reports it, so that a slip is","line":20,"renderedHtml":""},{"kind":"prose","text":"caught; the review judges what no program decides. No artifact refers to the others:","line":21,"renderedHtml":""},{"kind":"prose","text":"","line":22,"renderedHtml":""},{"kind":"prose","text":"| Artifact | Carries a rule as | Building block | Takes effect in |","line":23,"renderedHtml":""},{"kind":"prose","text":"|---|---|---|---|","line":24,"renderedHtml":""},{"kind":"prose","text":"| section of a skill (`skills/**/*.md`) | a `rule` block with id, scope and severity under the section's heading; \"must\" for errors, \"should\" or \"may\" for hints | `bb-skills` | the creator's agent harness |","line":25,"renderedHtml":""},{"kind":"prose","text":"| lint rule (`lint/rules/\u003cid>.ts`) | its file name; `meta.docs.url` links the rule; severity in the preset's configuration | `bb-lint-rules`, `bb-archetypes` | the editor and the pre-commit hook; CI |","line":26,"renderedHtml":""},{"kind":"prose","text":"| check of the check CLI (`check/rules/*.ts`) | `id` and `url` in its default export | `bb-check-cli` | the pre-push hook; CI; the listing validation |","line":27,"renderedHtml":""},{"kind":"prose","text":"| item of the review rubric (`review/**/*.md`) | a `rubric` block with its id under the item's heading | `bb-review-procedure` | the environment where lernapps agents run |","line":28,"renderedHtml":""},{"kind":"prose","text":"","line":29,"renderedHtml":""},{"kind":"prose","text":"The link of every message is the rule's entry on the rule page, `https://lernapps.net/tooling/rules/#\u003cid>`. The","line":30,"renderedHtml":""},{"kind":"prose","text":"tooling's own build reads all artifacts and tests each kind on its own: ids are valid and unique within the kind,","line":31,"renderedHtml":""},{"kind":"prose","text":"and every message links to its rule (`scripts/rules.ts`, run by the tests in `lernapps check`). The same reading","line":32,"renderedHtml":""},{"kind":"prose","text":"lists every rule grouped by id, as YAML for agents and as the rule page of the docs site. Whether the artifacts of","line":33,"renderedHtml":""},{"kind":"prose","text":"one id still agree, which rules lack a skill or a check, and which could move, is judged by an agent that reads","line":34,"renderedHtml":""},{"kind":"prose","text":"that list; it reports and changes nothing. Nothing is generated from a central file.","line":35,"renderedHtml":""},{"kind":"prose","text":"","line":36,"renderedHtml":""},{"kind":"prose","text":"A rule moves when experience shows it can: a review finding that recurs becomes a lint rule or a check, a step that","line":37,"renderedHtml":""},{"kind":"prose","text":"assistants keep forgetting becomes a question in the plan template. The move is a pull request that adds the new","line":38,"renderedHtml":""},{"kind":"prose","text":"artifact and removes the old text; the id stays. Rules contributed by experienced creators enter the same way.","line":39,"renderedHtml":""},{"kind":"prose","text":"","line":40,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-rule-catalog","title":"Rule catalog","category":"guidance"},"startLine":42,"endLine":46,"inArc42Fence":true},{"kind":"prose","text":"","line":48,"renderedHtml":""},{"kind":"heading","level":2,"text":"Plain language","line":49},{"kind":"prose","text":"","line":50,"renderedHtml":"\u003cp>Texts for learners, teachers and parents are German in plain language (ISO 24495-1): short sentences, active voice,\nno jargon; they live in message files, not in code. Shared infrastructure is English. Guidance for assistants\n(\u003ccode>AGENTS.md\u003c/code>, plan template, skills, rubric) is direct and imperative: what to do, in which order, with one\nexample. The same applies to the messages of every check.\u003c/p>\n"},{"kind":"prose","text":"Texts for learners, teachers and parents are German in plain language (ISO 24495-1): short sentences, active voice,","line":51,"renderedHtml":""},{"kind":"prose","text":"no jargon; they live in message files, not in code. Shared infrastructure is English. Guidance for assistants","line":52,"renderedHtml":""},{"kind":"prose","text":"(`AGENTS.md`, plan template, skills, rubric) is direct and imperative: what to do, in which order, with one","line":53,"renderedHtml":""},{"kind":"prose","text":"example. The same applies to the messages of every check.","line":54,"renderedHtml":""},{"kind":"prose","text":"","line":55,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-plain-language","title":"Plain language","category":"language"},"startLine":57,"endLine":61,"inArc42Fence":true},{"kind":"prose","text":"","line":63,"renderedHtml":""},{"kind":"heading","level":2,"text":"Terse output","line":64},{"kind":"prose","text":"","line":65,"renderedHtml":"\u003cp>Every token an assistant reads costs the creator time and money. Output is short and structured:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Messages\u003c/strong> have one shape in lint, hooks, check CLI and listing comment: rule id and severity, where (file and\nline, or page and element), what was found, how to fix it, link to the rule. Nothing else; passing checks print\none line.\u003c/li>\n\u003cli>\u003cstrong>Reports\u003c/strong> are YAML, readable by people and agents without a viewer.\u003c/li>\n\u003cli>\u003cstrong>Guidance\u003c/strong> is loaded when needed: \u003ccode>AGENTS.md\u003c/code> stays short and points to skills; a skill covers one concern.\u003c/li>\n\u003c/ul>\n"},{"kind":"prose","text":"Every token an assistant reads costs the creator time and money. Output is short and structured:","line":66,"renderedHtml":""},{"kind":"prose","text":"","line":67,"renderedHtml":""},{"kind":"prose","text":"- **Messages** have one shape in lint, hooks, check CLI and listing comment: rule id and severity, where (file and","line":68,"renderedHtml":""},{"kind":"prose","text":"  line, or page and element), what was found, how to fix it, link to the rule. Nothing else; passing checks print","line":69,"renderedHtml":""},{"kind":"prose","text":"  one line.","line":70,"renderedHtml":""},{"kind":"prose","text":"- **Reports** are YAML, readable by people and agents without a viewer.","line":71,"renderedHtml":""},{"kind":"prose","text":"- **Guidance** is loaded when needed: `AGENTS.md` stays short and points to skills; a skill covers one concern.","line":72,"renderedHtml":""},{"kind":"prose","text":"","line":73,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-terse-output","title":"Terse output","category":"efficiency"},"startLine":75,"endLine":79,"inArc42Fence":true},{"kind":"prose","text":"","line":81,"renderedHtml":""},{"kind":"heading","level":2,"text":"Logging and traceability","line":82},{"kind":"prose","text":"","line":83,"renderedHtml":"\u003cp>What runs is traceable without collecting anything about people. Every validation report names the commit (or URL\nand time) it checked; the hooks keep their counters in the plan file&#39;s front matter, which is committed with the app;\nthe review verdict names the reviewed commit. Logs stay where the run happens: on the creator&#39;s machine, in the CI\nlog of the repo, in the environment where lernapps agents run. No log or report contains personal data, and the\ntooling sends no telemetry.\u003c/p>\n"},{"kind":"prose","text":"What runs is traceable without collecting anything about people. Every validation report names the commit (or URL","line":84,"renderedHtml":""},{"kind":"prose","text":"and time) it checked; the hooks keep their counters in the plan file's front matter, which is committed with the app;","line":85,"renderedHtml":""},{"kind":"prose","text":"the review verdict names the reviewed commit. Logs stay where the run happens: on the creator's machine, in the CI","line":86,"renderedHtml":""},{"kind":"prose","text":"log of the repo, in the environment where lernapps agents run. No log or report contains personal data, and the","line":87,"renderedHtml":""},{"kind":"prose","text":"tooling sends no telemetry.","line":88,"renderedHtml":""},{"kind":"prose","text":"","line":89,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-traceability","title":"Logging and traceability","category":"operations"},"startLine":91,"endLine":95,"inArc42Fence":true},{"kind":"prose","text":"","line":97,"renderedHtml":""},{"kind":"heading","level":2,"text":"Stable contracts","line":98},{"kind":"prose","text":"","line":99,"renderedHtml":"\u003cp>What others build on does not change silently: rule ids, the commands and flags of the CLI, the subpath exports of\nthe package, the schema of the validation report and the front matter of the plan file. A breaking change gets a\nnew schema version or a new name, and Renovate brings it to every app with the evals run before. The entry schema\nbelongs to lernapps/apps; the tooling fetches it each time instead of copying it.\u003c/p>\n"},{"kind":"prose","text":"What others build on does not change silently: rule ids, the commands and flags of the CLI, the subpath exports of","line":100,"renderedHtml":""},{"kind":"prose","text":"the package, the schema of the validation report and the front matter of the plan file. A breaking change gets a","line":101,"renderedHtml":""},{"kind":"prose","text":"new schema version or a new name, and Renovate brings it to every app with the evals run before. The entry schema","line":102,"renderedHtml":""},{"kind":"prose","text":"belongs to lernapps/apps; the tooling fetches it each time instead of copying it.","line":103,"renderedHtml":""},{"kind":"prose","text":"","line":104,"renderedHtml":""},{"kind":"block","blockType":"concept","attributes":{"id":"concept-stable-contracts","title":"Stable contracts","category":"evolution"},"startLine":106,"endLine":110,"inArc42Fence":true},{"kind":"prose","text":"","line":112,"renderedHtml":""}]},{"filePath":"/home/runner/work/tooling/tooling/docs/arc42/09-decisions.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Architecture Decisions","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>Each decision in the short form of an ADR: context, decision, consequences.\u003c/p>\n"},{"kind":"prose","text":"Each decision in the short form of an ADR: context, decision, consequences.","line":3,"renderedHtml":""},{"kind":"prose","text":"","line":4,"renderedHtml":""},{"kind":"heading","level":2,"text":"Five layers around the assistant","line":5},{"kind":"prose","text":"","line":6,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> a creator&#39;s assistant needs guidance before, during and after building, and the platform needs proof\nbefore listing. \u003cstrong>Decision:\u003c/strong> process guidance, scaffolding, conventions, deterministic verification and formal\nvalidation, each in its own building blocks. \u003cstrong>Consequences:\u003c/strong> every layer can improve on its own; a rule can move\nbetween layers (\u003ccode>concept-rule-catalog\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"**Context:** a creator's assistant needs guidance before, during and after building, and the platform needs proof","line":7,"renderedHtml":""},{"kind":"prose","text":"before listing. **Decision:** process guidance, scaffolding, conventions, deterministic verification and formal","line":8,"renderedHtml":""},{"kind":"prose","text":"validation, each in its own building blocks. **Consequences:** every layer can improve on its own; a rule can move","line":9,"renderedHtml":""},{"kind":"prose","text":"between layers (`concept-rule-catalog`).","line":10,"renderedHtml":""},{"kind":"prose","text":"","line":11,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-five-layers","title":"Five layers around the assistant","status":"accepted","date":"2026-10-08","addresses":"qg-simple-to-build, qg-few-iterations, qg-checked-not-declared"},"startLine":13,"endLine":19,"inArc42Fence":true},{"kind":"prose","text":"","line":21,"renderedHtml":""},{"kind":"heading","level":2,"text":"Archetypes as the variation point","line":22},{"kind":"prose","text":"","line":23,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> a content-heavy app and a typing trainer differ in stack, rules and review. \u003cstrong>Decision:\u003c/strong> apps are\nbuilt from archetypes, named after their character; an archetype is a template, a preset, skills and the rules in\nscope. The architecture fixes the variation point, not the list of archetypes. \u003cstrong>Consequences:\u003c/strong> a new archetype\nneeds a template, a preset and skills, no new building block; it is justified only by a different set of rules,\nstack or review.\u003c/p>\n"},{"kind":"prose","text":"**Context:** a content-heavy app and a typing trainer differ in stack, rules and review. **Decision:** apps are","line":24,"renderedHtml":""},{"kind":"prose","text":"built from archetypes, named after their character; an archetype is a template, a preset, skills and the rules in","line":25,"renderedHtml":""},{"kind":"prose","text":"scope. The architecture fixes the variation point, not the list of archetypes. **Consequences:** a new archetype","line":26,"renderedHtml":""},{"kind":"prose","text":"needs a template, a preset and skills, no new building block; it is justified only by a different set of rules,","line":27,"renderedHtml":""},{"kind":"prose","text":"stack or review.","line":28,"renderedHtml":""},{"kind":"prose","text":"","line":29,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-archetypes","title":"Archetypes as the variation point","status":"accepted","date":"2026-10-08","addresses":"qg-simple-to-build, qg-few-iterations"},"startLine":31,"endLine":37,"inArc42Fence":true},{"kind":"prose","text":"","line":39,"renderedHtml":""},{"kind":"heading","level":2,"text":"EPCC in AGENTS.md with a plan file","line":40},{"kind":"prose","text":"","line":41,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> assistants run through all steps at once unless guided; the guidance must work with any assistant.\n\u003cstrong>Decision:\u003c/strong> the EPCC workflow as plain text in \u003ccode>AGENTS.md\u003c/code> and a plan file with phases, checkpoints, the creator&#39;s\nanswers for the entry, front matter counters and a retrospective; \u003ccode>@codemcp/workflows\u003c/code> stays optional.\n\u003cstrong>Consequences:\u003c/strong> no MCP server needed; the plan is readable by the creator, carries what the entry needs, and is the\nsource for measurement.\u003c/p>\n"},{"kind":"prose","text":"**Context:** assistants run through all steps at once unless guided; the guidance must work with any assistant.","line":42,"renderedHtml":""},{"kind":"prose","text":"**Decision:** the EPCC workflow as plain text in `AGENTS.md` and a plan file with phases, checkpoints, the creator's","line":43,"renderedHtml":""},{"kind":"prose","text":"answers for the entry, front matter counters and a retrospective; `@codemcp/workflows` stays optional.","line":44,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** no MCP server needed; the plan is readable by the creator, carries what the entry needs, and is the","line":45,"renderedHtml":""},{"kind":"prose","text":"source for measurement.","line":46,"renderedHtml":""},{"kind":"prose","text":"","line":47,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-epcc-plan-file","title":"EPCC in AGENTS.md with a plan file","status":"accepted","date":"2026-10-08","addresses":"qg-any-assistant, qg-simple-to-build, qg-findable, risk-assistants-skip-guidance"},"startLine":49,"endLine":55,"inArc42Fence":true},{"kind":"prose","text":"","line":57,"renderedHtml":""},{"kind":"heading","level":2,"text":"The entry schema explains itself","line":58},{"kind":"prose","text":"","line":59,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> the entry model of the app overview is tuned for discovery over time. \u003cstrong>Decision:\u003c/strong> the guidance only\ntells the assistant to fetch the published schema and fill it; field descriptions live in the schema.\n\u003cstrong>Consequences:\u003c/strong> the schema must be self-explanatory; changing it needs no change to the tooling.\u003c/p>\n"},{"kind":"prose","text":"**Context:** the entry model of the app overview is tuned for discovery over time. **Decision:** the guidance only","line":60,"renderedHtml":""},{"kind":"prose","text":"tells the assistant to fetch the published schema and fill it; field descriptions live in the schema.","line":61,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** the schema must be self-explanatory; changing it needs no change to the tooling.","line":62,"renderedHtml":""},{"kind":"prose","text":"","line":63,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-schema-explains-itself","title":"The entry schema explains itself","status":"accepted","date":"2026-10-08","addresses":"qg-list-in-minutes, qg-findable, con-entry-schema, risk-entry-schema-changes"},"startLine":65,"endLine":71,"inArc42Fence":true},{"kind":"prose","text":"","line":73,"renderedHtml":""},{"kind":"heading","level":2,"text":"One package from git","line":74},{"kind":"prose","text":"","line":75,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> a template copied once drifts; npm installs from git only a repo root. \u003cstrong>Decision:\u003c/strong> one package\n\u003ccode>@lernapps/tooling\u003c/code> at the root of lernapps/tooling with subpath exports and one CLI, installed from git at a commit\nof \u003ccode>main\u003c/code>, kept current by Renovate, as \u003ccode>@lernapps/site\u003c/code> is. \u003cstrong>Consequences:\u003c/strong> no publishing pipeline; every app gets\nchanges without edits; publishing to npm stays possible.\u003c/p>\n"},{"kind":"prose","text":"**Context:** a template copied once drifts; npm installs from git only a repo root. **Decision:** one package","line":76,"renderedHtml":""},{"kind":"prose","text":"`@lernapps/tooling` at the root of lernapps/tooling with subpath exports and one CLI, installed from git at a commit","line":77,"renderedHtml":""},{"kind":"prose","text":"of `main`, kept current by Renovate, as `@lernapps/site` is. **Consequences:** no publishing pipeline; every app gets","line":78,"renderedHtml":""},{"kind":"prose","text":"changes without edits; publishing to npm stays possible.","line":79,"renderedHtml":""},{"kind":"prose","text":"","line":80,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-one-package","title":"One package from git","status":"accepted","date":"2026-10-08","addresses":"qg-guidance-evolves, risk-git-install, con-github"},"startLine":82,"endLine":88,"inArc42Fence":true},{"kind":"prose","text":"","line":90,"renderedHtml":""},{"kind":"heading","level":2,"text":"Templates in lernapps/app-templates, logic in the package","line":91},{"kind":"prose","text":"","line":92,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> each archetype needs a starting app that can be seen and tried. \u003cstrong>Decision:\u003c/strong> lernapps/app-templates\nholds one folder per archetype; the generator in the package copies a folder at a pinned commit.\n\u003cstrong>Consequences:\u003c/strong> templates and presets change together through the pinned commit; templates stay small because the\nlogic is in the package.\u003c/p>\n"},{"kind":"prose","text":"**Context:** each archetype needs a starting app that can be seen and tried. **Decision:** lernapps/app-templates","line":93,"renderedHtml":""},{"kind":"prose","text":"holds one folder per archetype; the generator in the package copies a folder at a pinned commit.","line":94,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** templates and presets change together through the pinned commit; templates stay small because the","line":95,"renderedHtml":""},{"kind":"prose","text":"logic is in the package.","line":96,"renderedHtml":""},{"kind":"prose","text":"","line":97,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-templates-repo","title":"Templates in lernapps/app-templates, logic in the package","status":"accepted","date":"2026-10-08","addresses":"qg-simple-to-build, qg-guidance-evolves"},"startLine":99,"endLine":105,"inArc42Fence":true},{"kind":"prose","text":"","line":107,"renderedHtml":""},{"kind":"heading","level":2,"text":"vite-plus as the toolchain","line":108},{"kind":"prose","text":"","line":109,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> creators should get lint, format, type check, tests and hooks without choosing tools. \u003cstrong>Decision:\u003c/strong>\nvite-plus with its defaults, made stricter by the presets; the presets own the configuration. \u003cstrong>Consequences:\u003c/strong> one\ntoolchain and one config; the risk of a young tool is contained in the presets.\u003c/p>\n"},{"kind":"prose","text":"**Context:** creators should get lint, format, type check, tests and hooks without choosing tools. **Decision:**","line":110,"renderedHtml":""},{"kind":"prose","text":"vite-plus with its defaults, made stricter by the presets; the presets own the configuration. **Consequences:** one","line":111,"renderedHtml":""},{"kind":"prose","text":"toolchain and one config; the risk of a young tool is contained in the presets.","line":112,"renderedHtml":""},{"kind":"prose","text":"","line":113,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-vite-plus","title":"vite-plus as the toolchain","status":"accepted","date":"2026-10-08","addresses":"qg-simple-to-build, qg-few-iterations, risk-vite-plus-young"},"startLine":115,"endLine":121,"inArc42Fence":true},{"kind":"prose","text":"","line":123,"renderedHtml":""},{"kind":"heading","level":2,"text":"Strict TypeScript everywhere","line":124},{"kind":"prose","text":"","line":125,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> types give assistants the fastest feedback. \u003cstrong>Decision:\u003c/strong> every app is TypeScript only: \u003ccode>strict\u003c/code> and the\nstricter compiler options, no \u003ccode>any\u003c/code>, no JavaScript sources; data the creator supplies is typed and validated at\nbuild time. \u003cstrong>Consequences:\u003c/strong> every archetype&#39;s toolchain must support TypeScript sources end to end.\u003c/p>\n"},{"kind":"prose","text":"**Context:** types give assistants the fastest feedback. **Decision:** every app is TypeScript only: `strict` and the","line":126,"renderedHtml":""},{"kind":"prose","text":"stricter compiler options, no `any`, no JavaScript sources; data the creator supplies is typed and validated at","line":127,"renderedHtml":""},{"kind":"prose","text":"build time. **Consequences:** every archetype's toolchain must support TypeScript sources end to end.","line":128,"renderedHtml":""},{"kind":"prose","text":"","line":129,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-strict-typescript","title":"Strict TypeScript everywhere","status":"accepted","date":"2026-10-08","addresses":"qg-few-iterations, con-language-licence"},"startLine":131,"endLine":137,"inArc42Fence":true},{"kind":"prose","text":"","line":139,"renderedHtml":""},{"kind":"heading","level":2,"text":"One check command; hooks and CI run the same","line":140},{"kind":"prose","text":"","line":141,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> checks that only CI runs reach the assistant late and cost the owner&#39;s attention; checks that differ\nbetween hook and CI surprise. \u003cstrong>Decision:\u003c/strong> \u003ccode>lernapps check\u003c/code> runs every deterministic check. \u003ccode>--pre-commit\u003c/code> selects\nthe fast part (format, lint, types), \u003ccode>--pre-push\u003c/code> the heavy part (unit tests, build, checks of the built app,\nend-to-end tests with Playwright); no flag or both flags run everything. The hooks run the two parts, CI runs\neverything. A failed pre-push increments \u003ccode>prePushFailures\u003c/code> in the plan&#39;s front matter. \u003cstrong>Consequences:\u003c/strong> failures\nreach the assistant on the creator&#39;s machine, before any CI run; CI is a safety net for skipped hooks and adds no\nchecks of its own; the creator&#39;s machine needs a browser for the end-to-end tests.\u003c/p>\n"},{"kind":"prose","text":"**Context:** checks that only CI runs reach the assistant late and cost the owner's attention; checks that differ","line":142,"renderedHtml":""},{"kind":"prose","text":"between hook and CI surprise. **Decision:** `lernapps check` runs every deterministic check. `--pre-commit` selects","line":143,"renderedHtml":""},{"kind":"prose","text":"the fast part (format, lint, types), `--pre-push` the heavy part (unit tests, build, checks of the built app,","line":144,"renderedHtml":""},{"kind":"prose","text":"end-to-end tests with Playwright); no flag or both flags run everything. The hooks run the two parts, CI runs","line":145,"renderedHtml":""},{"kind":"prose","text":"everything. A failed pre-push increments `prePushFailures` in the plan's front matter. **Consequences:** failures","line":146,"renderedHtml":""},{"kind":"prose","text":"reach the assistant on the creator's machine, before any CI run; CI is a safety net for skipped hooks and adds no","line":147,"renderedHtml":""},{"kind":"prose","text":"checks of its own; the creator's machine needs a browser for the end-to-end tests.","line":148,"renderedHtml":""},{"kind":"prose","text":"","line":149,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-one-check-command","title":"One check command; hooks and CI run the same","status":"accepted","date":"2026-10-09","addresses":"qg-few-iterations, qg-any-assistant, risk-owner-bottleneck, risk-assistants-skip-guidance, risk-counter-tampering, risk-browser-at-creator"},"startLine":151,"endLine":157,"inArc42Fence":true},{"kind":"prose","text":"","line":159,"renderedHtml":""},{"kind":"heading","level":2,"text":"Conventions as skills","line":160},{"kind":"prose","text":"","line":161,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> guidance must be loaded when needed, not all at once. \u003cstrong>Decision:\u003c/strong> skills in the agentskills.io\nformat, general, per archetype and per topic, synced from the package into the creator&#39;s agent harness.\n\u003cstrong>Consequences:\u003c/strong> skills reach every app through the package; apps built otherwise can install them alone.\u003c/p>\n"},{"kind":"prose","text":"**Context:** guidance must be loaded when needed, not all at once. **Decision:** skills in the agentskills.io","line":162,"renderedHtml":""},{"kind":"prose","text":"format, general, per archetype and per topic, synced from the package into the creator's agent harness.","line":163,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** skills reach every app through the package; apps built otherwise can install them alone.","line":164,"renderedHtml":""},{"kind":"prose","text":"","line":165,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-skills","title":"Conventions as skills","status":"accepted","date":"2026-10-08","addresses":"qg-any-assistant, qg-guidance-evolves"},"startLine":167,"endLine":173,"inArc42Fence":true},{"kind":"prose","text":"","line":175,"renderedHtml":""},{"kind":"heading","level":2,"text":"Rules live in their artifacts","line":176},{"kind":"prose","text":"","line":177,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> a central rule file compiled into skills, lint configuration, checks and rubric would duplicate what\nthe artifacts already say, and skill text cannot be generated well; rules move between layers rarely.\n\u003cstrong>Decision:\u003c/strong> each rule lives where it acts, as skill text, lint rule, check or rubric item, often in several of\nthem, with a stable id and the shared vocabulary of scope and severity (\u003ccode>concept-rule-catalog\u003c/code>). Each kind of\nartifact is tested on its own; the tooling&#39;s build only reads the artifacts, tests the ids per kind and lists the\nrules by id. \u003cstrong>Rejected:\u003c/strong> a central catalog with a compile step; cross-checks between the artifacts, which would\nneed each artifact to declare how the rule is enforced elsewhere. \u003cstrong>Consequences:\u003c/strong> moving a rule is a pull request\nthat writes the new artifact and removes the old text; a rule can be told preventively and checked at the same\ntime; the artifacts can drift in wording, which an agent reading the list by id and the evals catch.\u003c/p>\n"},{"kind":"prose","text":"**Context:** a central rule file compiled into skills, lint configuration, checks and rubric would duplicate what","line":178,"renderedHtml":""},{"kind":"prose","text":"the artifacts already say, and skill text cannot be generated well; rules move between layers rarely.","line":179,"renderedHtml":""},{"kind":"prose","text":"**Decision:** each rule lives where it acts, as skill text, lint rule, check or rubric item, often in several of","line":180,"renderedHtml":""},{"kind":"prose","text":"them, with a stable id and the shared vocabulary of scope and severity (`concept-rule-catalog`). Each kind of","line":181,"renderedHtml":""},{"kind":"prose","text":"artifact is tested on its own; the tooling's build only reads the artifacts, tests the ids per kind and lists the","line":182,"renderedHtml":""},{"kind":"prose","text":"rules by id. **Rejected:** a central catalog with a compile step; cross-checks between the artifacts, which would","line":183,"renderedHtml":""},{"kind":"prose","text":"need each artifact to declare how the rule is enforced elsewhere. **Consequences:** moving a rule is a pull request","line":184,"renderedHtml":""},{"kind":"prose","text":"that writes the new artifact and removes the old text; a rule can be told preventively and checked at the same","line":185,"renderedHtml":""},{"kind":"prose","text":"time; the artifacts can drift in wording, which an agent reading the list by id and the evals catch.","line":186,"renderedHtml":""},{"kind":"prose","text":"","line":187,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-rules-in-artifacts","title":"Rules live in their artifacts","status":"accepted","date":"2026-10-09","addresses":"qg-guidance-evolves, qg-checked-not-declared, risk-oxlint-plugins, risk-rule-drift"},"startLine":189,"endLine":195,"inArc42Fence":true},{"kind":"prose","text":"","line":197,"renderedHtml":""},{"kind":"heading","level":2,"text":"A standalone check CLI with YAML output","line":198},{"kind":"prose","text":"","line":199,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> the same rules must be checked on scaffolded apps and on apps built otherwise, and people and agents\nread the result. \u003cstrong>Decision:\u003c/strong> one CLI that works on a repo, a bundle or a URL, without needing the source repo for\nthe checks of the built app; it checks an entry against the app with \u003ccode>--entry\u003c/code>; it reports in YAML; for scope\n\u003ccode>site\u003c/code> it calls \u003ccode>lernapps-check\u003c/code> of the site frame, which stays there. \u003cstrong>Consequences:\u003c/strong> the same check in hook, CI\nand listing; the report is the fitness signal and is readable without a viewer.\u003c/p>\n"},{"kind":"prose","text":"**Context:** the same rules must be checked on scaffolded apps and on apps built otherwise, and people and agents","line":200,"renderedHtml":""},{"kind":"prose","text":"read the result. **Decision:** one CLI that works on a repo, a bundle or a URL, without needing the source repo for","line":201,"renderedHtml":""},{"kind":"prose","text":"the checks of the built app; it checks an entry against the app with `--entry`; it reports in YAML; for scope","line":202,"renderedHtml":""},{"kind":"prose","text":"`site` it calls `lernapps-check` of the site frame, which stays there. **Consequences:** the same check in hook, CI","line":203,"renderedHtml":""},{"kind":"prose","text":"and listing; the report is the fitness signal and is readable without a viewer.","line":204,"renderedHtml":""},{"kind":"prose","text":"","line":205,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-check-cli","title":"A standalone check CLI with YAML output","status":"accepted","date":"2026-10-09","addresses":"qg-checked-not-declared, qg-list-in-minutes, qg-findable, con-frontend-only, con-page-rules, risk-no-shell"},"startLine":207,"endLine":213,"inArc42Fence":true},{"kind":"prose","text":"","line":215,"renderedHtml":""},{"kind":"heading","level":2,"text":"Review by an agent, results as a comment","line":216},{"kind":"prose","text":"","line":217,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> some rules need judgment; creators should be able to fix failures without the owner. \u003cstrong>Decision:\u003c/strong> the\nlisting validation comments the report on failure; a review agent in a fresh context, starting from the report,\njudges the rest; its verdict names the commit. Target: half pass on the first run, 7 of 8 on the second.\n\u003cstrong>Consequences:\u003c/strong> the owner sees only listings that passed the checks.\u003c/p>\n"},{"kind":"prose","text":"**Context:** some rules need judgment; creators should be able to fix failures without the owner. **Decision:** the","line":218,"renderedHtml":""},{"kind":"prose","text":"listing validation comments the report on failure; a review agent in a fresh context, starting from the report,","line":219,"renderedHtml":""},{"kind":"prose","text":"judges the rest; its verdict names the commit. Target: half pass on the first run, 7 of 8 on the second.","line":220,"renderedHtml":""},{"kind":"prose","text":"**Consequences:** the owner sees only listings that passed the checks.","line":221,"renderedHtml":""},{"kind":"prose","text":"","line":222,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-review-agent","title":"Review by an agent, results as a comment","status":"accepted","date":"2026-10-08","addresses":"qg-checked-not-declared, qg-list-in-minutes, risk-owner-bottleneck"},"startLine":224,"endLine":230,"inArc42Fence":true},{"kind":"prose","text":"","line":232,"renderedHtml":""},{"kind":"heading","level":2,"text":"The owner runs the review","line":233},{"kind":"prose","text":"","line":234,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> a review agent in CI needs an API key and costs money per run. \u003cstrong>Decision:\u003c/strong> the listing workflow runs\nthe deterministic checks; the owner starts the review agent in the environment for lernapps agents on a pull request\nthat passed them. \u003cstrong>Consequences:\u003c/strong> no secret in lernapps/apps; the environment can change without changing the\nprocedure.\u003c/p>\n"},{"kind":"prose","text":"**Context:** a review agent in CI needs an API key and costs money per run. **Decision:** the listing workflow runs","line":235,"renderedHtml":""},{"kind":"prose","text":"the deterministic checks; the owner starts the review agent in the environment for lernapps agents on a pull request","line":236,"renderedHtml":""},{"kind":"prose","text":"that passed them. **Consequences:** no secret in lernapps/apps; the environment can change without changing the","line":237,"renderedHtml":""},{"kind":"prose","text":"procedure.","line":238,"renderedHtml":""},{"kind":"prose","text":"","line":239,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-review-by-owner","title":"The owner runs the review","status":"accepted","date":"2026-10-08","addresses":"con-one-owner, risk-owner-bottleneck"},"startLine":241,"endLine":247,"inArc42Fence":true},{"kind":"prose","text":"","line":249,"renderedHtml":""},{"kind":"heading","level":2,"text":"Evals by hand with three assistants","line":250},{"kind":"prose","text":"","line":251,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> other people&#39;s assistants cannot be observed. \u003cstrong>Decision:\u003c/strong> the evals run by hand with Claude Code,\nCodex and Gemini CLI on their latest models; there is no automated eval pipeline. \u003cstrong>Consequences:\u003c/strong> evals before\nmerging guidance changes; the p90 of failed pre-push runs is measured there.\u003c/p>\n"},{"kind":"prose","text":"**Context:** other people's assistants cannot be observed. **Decision:** the evals run by hand with Claude Code,","line":252,"renderedHtml":""},{"kind":"prose","text":"Codex and Gemini CLI on their latest models; there is no automated eval pipeline. **Consequences:** evals before","line":253,"renderedHtml":""},{"kind":"prose","text":"merging guidance changes; the p90 of failed pre-push runs is measured there.","line":254,"renderedHtml":""},{"kind":"prose","text":"","line":255,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-evals-by-hand","title":"Evals by hand with three assistants","status":"accepted","date":"2026-10-08","addresses":"qg-any-assistant, qg-few-iterations"},"startLine":257,"endLine":263,"inArc42Fence":true},{"kind":"prose","text":"","line":265,"renderedHtml":""},{"kind":"heading","level":2,"text":"Content correctness is suggested","line":266},{"kind":"prose","text":"","line":267,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> correctness is checkable only where answers are computable. \u003cstrong>Decision:\u003c/strong> generator and checker tests,\ncited sources and verified links are \u003ccode>hint\u003c/code> rules, never a listing condition. \u003cstrong>Consequences:\u003c/strong> the review notes, but\ndoes not block, missing correctness support.\u003c/p>\n"},{"kind":"prose","text":"**Context:** correctness is checkable only where answers are computable. **Decision:** generator and checker tests,","line":268,"renderedHtml":""},{"kind":"prose","text":"cited sources and verified links are `hint` rules, never a listing condition. **Consequences:** the review notes, but","line":269,"renderedHtml":""},{"kind":"prose","text":"does not block, missing correctness support.","line":270,"renderedHtml":""},{"kind":"prose","text":"","line":271,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-correctness-suggested","title":"Content correctness is suggested","status":"accepted","date":"2026-10-08","addresses":"qg-simple-to-build"},"startLine":273,"endLine":279,"inArc42Fence":true},{"kind":"prose","text":"","line":281,"renderedHtml":""},{"kind":"heading","level":2,"text":"The tooling sends nothing","line":282},{"kind":"prose","text":"","line":283,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> sessions that never reach a listing stay invisible, but the platform collects nothing in secret.\n\u003cstrong>Decision:\u003c/strong> the tooling sends nothing about a creator, an app or a session. Measurements stay in the creator&#39;s\nrepo (plan file) and reach the platform only with a listing. Feedback from an assistant to the platform needs the\ncreator&#39;s consent for each sending and carries structured totals only, through the platform&#39;s anonymous feedback\nchannel. \u003cstrong>Consequences:\u003c/strong> measurement relies on evals, listings and conversations with creators.\u003c/p>\n"},{"kind":"prose","text":"**Context:** sessions that never reach a listing stay invisible, but the platform collects nothing in secret.","line":284,"renderedHtml":""},{"kind":"prose","text":"**Decision:** the tooling sends nothing about a creator, an app or a session. Measurements stay in the creator's","line":285,"renderedHtml":""},{"kind":"prose","text":"repo (plan file) and reach the platform only with a listing. Feedback from an assistant to the platform needs the","line":286,"renderedHtml":""},{"kind":"prose","text":"creator's consent for each sending and carries structured totals only, through the platform's anonymous feedback","line":287,"renderedHtml":""},{"kind":"prose","text":"channel. **Consequences:** measurement relies on evals, listings and conversations with creators.","line":288,"renderedHtml":""},{"kind":"prose","text":"","line":289,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-tooling-sends-nothing","title":"The tooling sends nothing","status":"accepted","date":"2026-10-08","addresses":"qg-nothing-collected, risk-invisible-failures"},"startLine":291,"endLine":297,"inArc42Fence":true},{"kind":"prose","text":"","line":299,"renderedHtml":""},{"kind":"heading","level":2,"text":"Every report is bound to a commit","line":300},{"kind":"prose","text":"","line":301,"renderedHtml":"\u003cp>\u003cstrong>Context:\u003c/strong> apps may be deployed anywhere, and a validation does not stay true when the app changes.\n\u003cstrong>Decision:\u003c/strong> every validation report names the commit (or the URL and time) it checked. Showing an entry as a\nfact sheet of an app deployed elsewhere, and re-validating listed apps, belong to the app overview and build on\nthat. \u003cstrong>Consequences:\u003c/strong> the deployed app can be traced to the validated commit.\u003c/p>\n"},{"kind":"prose","text":"**Context:** apps may be deployed anywhere, and a validation does not stay true when the app changes.","line":302,"renderedHtml":""},{"kind":"prose","text":"**Decision:** every validation report names the commit (or the URL and time) it checked. Showing an entry as a","line":303,"renderedHtml":""},{"kind":"prose","text":"fact sheet of an app deployed elsewhere, and re-validating listed apps, belong to the app overview and build on","line":304,"renderedHtml":""},{"kind":"prose","text":"that. **Consequences:** the deployed app can be traced to the validated commit.","line":305,"renderedHtml":""},{"kind":"prose","text":"","line":306,"renderedHtml":""},{"kind":"block","blockType":"decision","attributes":{"id":"dec-report-per-commit","title":"Every report is bound to a commit","status":"accepted","date":"2026-10-08","addresses":"qg-checked-not-declared"},"startLine":308,"endLine":314,"inArc42Fence":true},{"kind":"prose","text":"","line":316,"renderedHtml":""}]},{"filePath":"/home/runner/work/tooling/tooling/docs/arc42/10-quality-requirements.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Quality Requirements","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>The quality goals below decide between conflicting requirements of the app-creation tooling. Each one is grounded\nin the platform design: the value proposition of the creators&#39; journey\n\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d7-experiences.pdt42.md:el-x-list-and-hear-back\">list an app and hear it is used\u003c/a> (&quot;Build your app faster with good guidance, list it in minutes&quot;),\nthe gains of \u003ca href=\"https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants\">AI assistants\u003c/a>, and the channels \u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-listing\">effortless listing\u003c/a>,\n\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-fitness-signal\">visible fitness for use\u003c/a> and \u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-feedback\">returning use and praise to creators\u003c/a>, which\nalso states that nothing is collected in secret.\u003c/p>\n"},{"kind":"prose","text":"The quality goals below decide between conflicting requirements of the app-creation tooling. Each one is grounded","line":3,"renderedHtml":""},{"kind":"prose","text":"in the platform design: the value proposition of the creators' journey","line":4,"renderedHtml":""},{"kind":"prose","text":"[list an app and hear it is used](https://lernapps.net/docs/platform-design/#2-design/d7-experiences.pdt42.md:el-x-list-and-hear-back) (\"Build your app faster with good guidance, list it in minutes\"),","line":5,"renderedHtml":""},{"kind":"prose","text":"the gains of [AI assistants](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants), and the channels [effortless listing](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-listing),","line":6,"renderedHtml":""},{"kind":"prose","text":"[visible fitness for use](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-fitness-signal) and [returning use and praise to creators](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-feedback), which","line":7,"renderedHtml":""},{"kind":"prose","text":"also states that nothing is collected in secret.","line":8,"renderedHtml":""},{"kind":"prose","text":"","line":9,"renderedHtml":""},{"kind":"heading","level":2,"text":"How the scenarios are measured","line":10},{"kind":"prose","text":"","line":11,"renderedHtml":"\u003cp>We cannot observe other people&#39;s AI assistants, and the platform collects nothing in secret. As in the\n\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md\">MVP\u003c/a>, the scenarios are learning tests with small absolute numbers, not statistics. Each metric names its source:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Evals\u003c/strong>: we run Claude Code, Codex and Gemini CLI ourselves, by hand, with each provider&#39;s latest model, on\nsample creator prompts, one set per archetype. The only source for iterations and for comparing assistants.\u003c/li>\n\u003cli>\u003cstrong>Listing reports\u003c/strong>: the validation report of every listing pull request (first-pass rate, findings per rule).\u003c/li>\n\u003cli>\u003cstrong>Retrospective\u003c/strong>: the section the agent writes at the end of its plan file (phases, failed checks, the\ncreator&#39;s turns after the plan, where it had to guess), and the counters the git hooks keep in the plan&#39;s front\nmatter (failed pre-push runs). It stays in the creator&#39;s repo and reaches the platform only with a\nlisting.\u003c/li>\n\u003cli>\u003cstrong>Conversations\u003c/strong>: the owner talks to each creator after listing (\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md:el-a-creators-unpaid\">creators contribute without payment\u003c/a>).\u003c/li>\n\u003c/ul>\n"},{"kind":"prose","text":"We cannot observe other people's AI assistants, and the platform collects nothing in secret. As in the","line":12,"renderedHtml":""},{"kind":"prose","text":"[MVP](https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md), the scenarios are learning tests with small absolute numbers, not statistics. Each metric names its source:","line":13,"renderedHtml":""},{"kind":"prose","text":"","line":14,"renderedHtml":""},{"kind":"prose","text":"- **Evals**: we run Claude Code, Codex and Gemini CLI ourselves, by hand, with each provider's latest model, on","line":15,"renderedHtml":""},{"kind":"prose","text":"  sample creator prompts, one set per archetype. The only source for iterations and for comparing assistants.","line":16,"renderedHtml":""},{"kind":"prose","text":"- **Listing reports**: the validation report of every listing pull request (first-pass rate, findings per rule).","line":17,"renderedHtml":""},{"kind":"prose","text":"- **Retrospective**: the section the agent writes at the end of its plan file (phases, failed checks, the","line":18,"renderedHtml":""},{"kind":"prose","text":"  creator's turns after the plan, where it had to guess), and the counters the git hooks keep in the plan's front","line":19,"renderedHtml":""},{"kind":"prose","text":"  matter (failed pre-push runs). It stays in the creator's repo and reaches the platform only with a","line":20,"renderedHtml":""},{"kind":"prose","text":"  listing.","line":21,"renderedHtml":""},{"kind":"prose","text":"- **Conversations**: the owner talks to each creator after listing ([creators contribute without payment](https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md:el-a-creators-unpaid)).","line":22,"renderedHtml":""},{"kind":"prose","text":"","line":23,"renderedHtml":""},{"kind":"heading","level":2,"text":"10.1 Quality Goals","line":24},{"kind":"prose","text":"","line":25,"renderedHtml":""},{"kind":"heading","level":2,"text":"Simple to build with guidance","line":26},{"kind":"prose","text":"","line":27,"renderedHtml":"\u003cp>Creators have little time and build alongside their actual job (\u003ca href=\"https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-creators\">app creators\u003c/a>); the\njourney promises to &quot;build your app faster with good guidance&quot; (\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d7-experiences.pdt42.md:el-x-list-and-hear-back\">list an app and hear it is used\u003c/a>). This goal is about\nsimplicity for the creator: few, clear decisions, the next step always known, no need to know the platform&#39;s rules\nor the toolchain. When it conflicts with flexibility, simplicity wins: fewer choices, stricter defaults.\u003c/p>\n"},{"kind":"prose","text":"Creators have little time and build alongside their actual job ([app creators](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-creators)); the","line":28,"renderedHtml":""},{"kind":"prose","text":"journey promises to \"build your app faster with good guidance\" ([list an app and hear it is used](https://lernapps.net/docs/platform-design/#2-design/d7-experiences.pdt42.md:el-x-list-and-hear-back)). This goal is about","line":29,"renderedHtml":""},{"kind":"prose","text":"simplicity for the creator: few, clear decisions, the next step always known, no need to know the platform's rules","line":30,"renderedHtml":""},{"kind":"prose","text":"or the toolchain. When it conflicts with flexibility, simplicity wins: fewer choices, stricter defaults.","line":31,"renderedHtml":""},{"kind":"prose","text":"","line":32,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-simple-to-build","title":"Simple to build with guidance","priority":"high"},"startLine":34,"endLine":38,"inArc42Fence":true},{"kind":"prose","text":"","line":40,"renderedHtml":""},{"kind":"heading","level":2,"text":"List in minutes","line":41},{"kind":"prose","text":"","line":42,"renderedHtml":"\u003cp>Reach is no reason for creators to start (\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d4-relationships.pdt42.md\">relationships\u003c/a>), so the first listing has to cost almost nothing: &quot;Contributing an\napp takes minutes&quot; (\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-listing\">effortless listing\u003c/a>, \u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-listing-help\">help to list an app\u003c/a>). It serves the riskiest\nassumption of the MVP, \u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md:el-a-creators-list\">creators list an app when it costs minutes\u003c/a>.\u003c/p>\n"},{"kind":"prose","text":"Reach is no reason for creators to start ([relationships](https://lernapps.net/docs/platform-design/#2-design/d4-relationships.pdt42.md)), so the first listing has to cost almost nothing: \"Contributing an","line":43,"renderedHtml":""},{"kind":"prose","text":"app takes minutes\" ([effortless listing](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-listing), [help to list an app](https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-listing-help)). It serves the riskiest","line":44,"renderedHtml":""},{"kind":"prose","text":"assumption of the MVP, [creators list an app when it costs minutes](https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md:el-a-creators-list).","line":45,"renderedHtml":""},{"kind":"prose","text":"","line":46,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-list-in-minutes","title":"List in minutes","priority":"high"},"startLine":48,"endLine":52,"inArc42Fence":true},{"kind":"prose","text":"","line":54,"renderedHtml":""},{"kind":"heading","level":2,"text":"Listings help find the right app","line":55},{"kind":"prose","text":"","line":56,"renderedHtml":"\u003cp>The platform&#39;s main job is that adults \u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-t-find-app\">find an app for a topic and grade\u003c/a>, through\n\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-finding\">finding apps by topic and grade\u003c/a>. A listing helps only if it describes the app as adults search for it:\nsubject, grades, topics with deep links into the app, a summary of what learners do. The tooling asks for this while\nthe app is being shaped, not after it is built, and checks that what the entry promises exists in the app.\u003c/p>\n"},{"kind":"prose","text":"The platform's main job is that adults [find an app for a topic and grade](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-t-find-app), through","line":57,"renderedHtml":""},{"kind":"prose","text":"[finding apps by topic and grade](https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-finding). A listing helps only if it describes the app as adults search for it:","line":58,"renderedHtml":""},{"kind":"prose","text":"subject, grades, topics with deep links into the app, a summary of what learners do. The tooling asks for this while","line":59,"renderedHtml":""},{"kind":"prose","text":"the app is being shaped, not after it is built, and checks that what the entry promises exists in the app.","line":60,"renderedHtml":""},{"kind":"prose","text":"","line":61,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-findable","title":"Listings help find the right app","priority":"high"},"startLine":63,"endLine":67,"inArc42Fence":true},{"kind":"prose","text":"","line":69,"renderedHtml":""},{"kind":"heading","level":2,"text":"Checked, not declared","line":70},{"kind":"prose","text":"","line":71,"renderedHtml":"\u003cp>Adults decide whether to use an app from its listing; what an app sends to third parties is &quot;checked rather than\ndeclared&quot; (\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-fitness-signal\">visible fitness for use\u003c/a>). Teachers use an app without checking it themselves\n(\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md:el-a-trust-built-in\">teachers use an app without checking it themselves\u003c/a>), so the\nvalidation must be trustworthy: reproducible, bound to one commit, and the same for apps not built with the tooling.\u003c/p>\n"},{"kind":"prose","text":"Adults decide whether to use an app from its listing; what an app sends to third parties is \"checked rather than","line":72,"renderedHtml":""},{"kind":"prose","text":"declared\" ([visible fitness for use](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-fitness-signal)). Teachers use an app without checking it themselves","line":73,"renderedHtml":""},{"kind":"prose","text":"([teachers use an app without checking it themselves](https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md:el-a-trust-built-in)), so the","line":74,"renderedHtml":""},{"kind":"prose","text":"validation must be trustworthy: reproducible, bound to one commit, and the same for apps not built with the tooling.","line":75,"renderedHtml":""},{"kind":"prose","text":"","line":76,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-checked-not-declared","title":"Checked, not declared","priority":"high"},"startLine":78,"endLine":82,"inArc42Fence":true},{"kind":"prose","text":"","line":84,"renderedHtml":""},{"kind":"heading","level":2,"text":"Nothing collected in secret","line":85},{"kind":"prose","text":"","line":86,"renderedHtml":"\u003cp>The apps collect nothing and stay frontend-only (\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-feedback\">returning use and praise to creators\u003c/a>). The tooling follows the same rule towards creators:\nit sends nothing about a creator, an app or a session without the creator&#39;s explicit consent, and then only\nstructured totals. When this conflicts with features or convenience, it wins.\u003c/p>\n"},{"kind":"prose","text":"The apps collect nothing and stay frontend-only ([returning use and praise to creators](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-feedback)). The tooling follows the same rule towards creators:","line":87,"renderedHtml":""},{"kind":"prose","text":"it sends nothing about a creator, an app or a session without the creator's explicit consent, and then only","line":88,"renderedHtml":""},{"kind":"prose","text":"structured totals. When this conflicts with features or convenience, it wins.","line":89,"renderedHtml":""},{"kind":"prose","text":"","line":90,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-nothing-collected","title":"Nothing collected in secret","priority":"high"},"startLine":92,"endLine":96,"inArc42Fence":true},{"kind":"prose","text":"","line":98,"renderedHtml":""},{"kind":"heading","level":2,"text":"Fewer iterations for the assistant","line":99},{"kind":"prose","text":"","line":100,"renderedHtml":"\u003cp>AI assistants want to &quot;reach a working app with fewer iterations and less guessing&quot; (\u003ca href=\"https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants\">AI assistants\u003c/a>,\nconvenience gain). This goal is about cost: every iteration costs the creator time and money for their assistant.\nFast, precise feedback and a scaffold that already meets the rules keep iterations down.\u003c/p>\n"},{"kind":"prose","text":"AI assistants want to \"reach a working app with fewer iterations and less guessing\" ([AI assistants](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants),","line":101,"renderedHtml":""},{"kind":"prose","text":"convenience gain). This goal is about cost: every iteration costs the creator time and money for their assistant.","line":102,"renderedHtml":""},{"kind":"prose","text":"Fast, precise feedback and a scaffold that already meets the rules keep iterations down.","line":103,"renderedHtml":""},{"kind":"prose","text":"","line":104,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-few-iterations","title":"Fewer iterations for the assistant","priority":"medium"},"startLine":106,"endLine":110,"inArc42Fence":true},{"kind":"prose","text":"","line":112,"renderedHtml":""},{"kind":"heading","level":2,"text":"Works through any assistant","line":113},{"kind":"prose","text":"","line":114,"renderedHtml":"\u003cp>&quot;Whatever lernapps.net offers creators has to work through their AI assistants&quot; (\u003ca href=\"https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants\">AI assistants\u003c/a>), and the\nproviders compete. Guidance and enforcement must not depend on one vendor, an MCP server or agent-specific hooks.\u003c/p>\n"},{"kind":"prose","text":"\"Whatever lernapps.net offers creators has to work through their AI assistants\" ([AI assistants](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants)), and the","line":115,"renderedHtml":""},{"kind":"prose","text":"providers compete. Guidance and enforcement must not depend on one vendor, an MCP server or agent-specific hooks.","line":116,"renderedHtml":""},{"kind":"prose","text":"","line":117,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-any-assistant","title":"Works through any assistant","priority":"medium"},"startLine":119,"endLine":123,"inArc42Fence":true},{"kind":"prose","text":"","line":125,"renderedHtml":""},{"kind":"heading","level":2,"text":"The guidance evolves","line":126},{"kind":"prose","text":"","line":127,"renderedHtml":"\u003cp>Maintaining the guidance is an activity of the creators&#39; journey, paid with the owner&#39;s time\n(\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d7-experiences.pdt42.md:el-x-list-and-hear-back\">list an app and hear it is used\u003c/a>), and experienced creators bring their own practices into it\n(\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-contribute-practices\">contributing best practices\u003c/a>).\nA rule lives in one place; a change reaches every app through its dependency updates, and is tested before it\nreaches creators.\u003c/p>\n"},{"kind":"prose","text":"Maintaining the guidance is an activity of the creators' journey, paid with the owner's time","line":128,"renderedHtml":""},{"kind":"prose","text":"([list an app and hear it is used](https://lernapps.net/docs/platform-design/#2-design/d7-experiences.pdt42.md:el-x-list-and-hear-back)), and experienced creators bring their own practices into it","line":129,"renderedHtml":""},{"kind":"prose","text":"([contributing best practices](https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-contribute-practices)).","line":130,"renderedHtml":""},{"kind":"prose","text":"A rule lives in one place; a change reaches every app through its dependency updates, and is tested before it","line":131,"renderedHtml":""},{"kind":"prose","text":"reaches creators.","line":132,"renderedHtml":""},{"kind":"prose","text":"","line":133,"renderedHtml":""},{"kind":"block","blockType":"quality-goal","attributes":{"id":"qg-guidance-evolves","title":"The guidance evolves","priority":"medium"},"startLine":135,"endLine":139,"inArc42Fence":true},{"kind":"prose","text":"","line":141,"renderedHtml":""},{"kind":"heading","level":2,"text":"10.2 Qu
