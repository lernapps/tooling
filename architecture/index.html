ality Scenarios","line":142},{"kind":"prose","text":"","line":143,"renderedHtml":""},{"kind":"heading","level":2,"text":"Few turns after the plan","line":144},{"kind":"prose","text":"","line":145,"renderedHtml":"\u003cp>Turns before the plan is agreed are good assistance: the assistant explores the idea with the creator and asks what\nthe catalog needs. Once the creator has confirmed the plan, the assistant should work on its own.\u003c/p>\n"},{"kind":"prose","text":"Turns before the plan is agreed are good assistance: the assistant explores the idea with the creator and asks what","line":146,"renderedHtml":""},{"kind":"prose","text":"the catalog needs. Once the creator has confirmed the plan, the assistant should work on its own.","line":147,"renderedHtml":""},{"kind":"prose","text":"","line":148,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-few-turns-after-plan","title":"Few turns after the plan","quality":"qg-simple-to-build","stimulus":"The creator confirms the plan at the end of the Plan phase","response":"The assistant builds, checks and prepares the listing on its own and comes back to the creator only for what it cannot decide","metric":"At most 3 creator turns from the confirmed plan to the listing pull request (source - retrospective)"},"startLine":150,"endLine":157,"inArc42Fence":true},{"kind":"prose","text":"","line":159,"renderedHtml":""},{"kind":"heading","level":2,"text":"Creators name the guidance","line":160},{"kind":"prose","text":"","line":161,"renderedHtml":"\u003cp>The creators&#39; own view is the main source in the \u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md\">MVP\u003c/a>.\u003c/p>\n"},{"kind":"prose","text":"The creators' own view is the main source in the [MVP](https://lernapps.net/docs/platform-design/#2-design/d8-mvp.pdt42.md).","line":162,"renderedHtml":""},{"kind":"prose","text":"","line":163,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-guidance-named","title":"Creators name the guidance","quality":"qg-simple-to-build","stimulus":"The owner talks to a creator after their first listing","response":"The creator describes building as simpler than without the guidance","metric":"Most of the first 5 to 10 creators name the guidance as a reason it went fast (source - conversations)"},"startLine":165,"endLine":172,"inArc42Fence":true},{"kind":"prose","text":"","line":174,"renderedHtml":""},{"kind":"heading","level":2,"text":"An archetype in the evals","line":175},{"kind":"prose","text":"","line":176,"renderedHtml":"\u003cp>Iterations are compared in the evals, where we run the assistants ourselves. The pre-push hook counts its failed\nruns in the front matter of the plan file, so the same number arrives with every listing, without the assistant\nreporting it.\u003c/p>\n"},{"kind":"prose","text":"Iterations are compared in the evals, where we run the assistants ourselves. The pre-push hook counts its failed","line":177,"renderedHtml":""},{"kind":"prose","text":"runs in the front matter of the plan file, so the same number arrives with every listing, without the assistant","line":178,"renderedHtml":""},{"kind":"prose","text":"reporting it.","line":179,"renderedHtml":""},{"kind":"prose","text":"","line":180,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-eval-iterations","title":"An archetype in the evals","quality":"qg-few-iterations","stimulus":"The evals run a sample creator prompt for an archetype","response":"The assistant reaches an app that passes validation","metric":"p90 of failed pre-push runs per app below 5 (source - evals, counter in the plan's front matter)"},"startLine":182,"endLine":189,"inArc42Fence":true},{"kind":"prose","text":"","line":191,"renderedHtml":""},{"kind":"heading","level":2,"text":"A check fails","line":192},{"kind":"prose","text":"","line":193,"renderedHtml":"\u003cp>Agents fix what they understand. An error message is their prompt.\u003c/p>\n"},{"kind":"prose","text":"Agents fix what they understand. An error message is their prompt.","line":194,"renderedHtml":""},{"kind":"prose","text":"","line":195,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-actionable-failure","title":"A check fails","quality":"qg-few-iterations","stimulus":"A deterministic check fails on a commit or push","response":"The message names the rule, the file or page, what was found, and how to fix it","metric":"The assistant fixes it without asking the creator in every eval run; no listing retrospective names a check message as unclear (source - evals, retrospective)"},"startLine":197,"endLine":204,"inArc42Fence":true},{"kind":"prose","text":"","line":206,"renderedHtml":""},{"kind":"heading","level":2,"text":"The first listings","line":207},{"kind":"prose","text":"","line":208,"renderedHtml":"\u003cp>The listing is generated from the plan and the validation report, not typed by the creator. A first run that\nfails is expected for many creators; the results comment has to be enough for their assistant to fix it.\u003c/p>\n"},{"kind":"prose","text":"The listing is generated from the plan and the validation report, not typed by the creator. A first run that","line":209,"renderedHtml":""},{"kind":"prose","text":"fails is expected for many creators; the results comment has to be enough for their assistant to fix it.","line":210,"renderedHtml":""},{"kind":"prose","text":"","line":211,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-first-listings","title":"The first listings","quality":"qg-list-in-minutes","stimulus":"A creator with a working app asks their assistant to list it","response":"The assistant fills the entry from the plan and the validation report and opens the pull request to lernapps/apps; if the validation fails, it posts the deterministic check results as a comment on the pull request, and the assistant fixes the app from that comment","metric":"Half of the listing pull requests pass validation on the first run, 7 of 8 on the second run after the comment; no creator types an entry field by hand (source - listing reports, retrospective)"},"startLine":213,"endLine":220,"inArc42Fence":true},{"kind":"prose","text":"","line":222,"renderedHtml":""},{"kind":"heading","level":2,"text":"An entry promises what the app has","line":223},{"kind":"prose","text":"","line":224,"renderedHtml":"\u003cp>The entry is built from the creator&#39;s answers in Explore, and the listing validation compares it with the app.\u003c/p>\n"},{"kind":"prose","text":"The entry is built from the creator's answers in Explore, and the listing validation compares it with the app.","line":225,"renderedHtml":""},{"kind":"prose","text":"","line":226,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-entry-matches-app","title":"An entry promises what the app has","quality":"qg-findable","stimulus":"The assistant opens a listing pull request","response":"Subject, grades, topics and summary come from the plan's Explore answers; the check confirms that the app's URL and every topic link resolve","metric":"Every topic link of every listing built with the tooling resolves, and no listing needs a field corrected by the owner for discovery (source - listing reports)"},"startLine":228,"endLine":235,"inArc42Fence":true},{"kind":"prose","text":"","line":237,"renderedHtml":""},{"kind":"heading","level":2,"text":"An app not built with the tooling","line":238},{"kind":"prose","text":"","line":239,"renderedHtml":"\u003cp>Some creators already have an app, e.g. a chat assistant&#39;s artifact, a site of their own or an app built with\nanother toolchain.\u003c/p>\n"},{"kind":"prose","text":"Some creators already have an app, e.g. a chat assistant's artifact, a site of their own or an app built with","line":240,"renderedHtml":""},{"kind":"prose","text":"another toolchain.","line":241,"renderedHtml":""},{"kind":"prose","text":"","line":242,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-foreign-app","title":"An app not built with the tooling","quality":"qg-checked-not-declared","stimulus":"A listing pull request names an app that was not generated from a scaffold","response":"The validation runs on the deployed URL or the built bundle alone and produces the same report as for a scaffolded app","metric":"Every deterministic check runs without access to the app's source repository (source - listing reports)"},"startLine":244,"endLine":251,"inArc42Fence":true},{"kind":"prose","text":"","line":253,"renderedHtml":""},{"kind":"heading","level":2,"text":"Validation is repeated","line":254},{"kind":"prose","text":"","line":255,"renderedHtml":"\u003cp>The owner and adopting adults rely on the result; a check that passes once and fails the next time is no signal.\u003c/p>\n"},{"kind":"prose","text":"The owner and adopting adults rely on the result; a check that passes once and fails the next time is no signal.","line":256,"renderedHtml":""},{"kind":"prose","text":"","line":257,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-repeatable-validation","title":"Validation is repeated","quality":"qg-checked-not-declared","stimulus":"The deterministic part of the validation runs twice on the same commit","response":"Both runs give the same findings and the same fitness values; the report names the commit","metric":"Identical deterministic results for the same commit; every entry's fitness values come from a report (source - listing reports)"},"startLine":259,"endLine":266,"inArc42Fence":true},{"kind":"prose","text":"","line":268,"renderedHtml":""},{"kind":"heading","level":2,"text":"An external request slips in","line":269},{"kind":"prose","text":"","line":270,"renderedHtml":"\u003cp>A web font, a CDN script or a video thumbnail sends the learner&#39;s IP address to another server before any click.\u003c/p>\n"},{"kind":"prose","text":"A web font, a CDN script or a video thumbnail sends the learner's IP address to another server before any click.","line":271,"renderedHtml":""},{"kind":"prose","text":"","line":272,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-external-request","title":"An external request slips in","quality":"qg-nothing-collected","stimulus":"An assistant adds a resource that loads from another server on page load","response":"The pre-push hook and the validation both fail and name the page, the host and the element","metric":"0 requests to other hosts before a click in any app that passes validation (source - listing reports)"},"startLine":274,"endLine":281,"inArc42Fence":true},{"kind":"prose","text":"","line":283,"renderedHtml":""},{"kind":"heading","level":2,"text":"A session with the tooling","line":284},{"kind":"prose","text":"","line":285,"renderedHtml":"\u003cp>The tooling itself must not become a hidden channel about creators.\u003c/p>\n"},{"kind":"prose","text":"The tooling itself must not become a hidden channel about creators.","line":286,"renderedHtml":""},{"kind":"prose","text":"","line":287,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-tooling-silent","title":"A session with the tooling","quality":"qg-nothing-collected","stimulus":"A creator builds and checks an app with the tooling","response":"The tooling fetches what it needs (packages, schemas) and sends nothing about the creator, the app or the session","metric":"No request from the tooling carries data about the creator, the app or the session without the creator's consent (source - evals with recorded network)"},"startLine":289,"endLine":296,"inArc42Fence":true},{"kind":"prose","text":"","line":298,"renderedHtml":""},{"kind":"heading","level":2,"text":"A creator uses another assistant","line":299},{"kind":"prose","text":"","line":300,"renderedHtml":"\u003cp>The guidance is written for any assistant; Claude Code is only the one the owner uses.\u003c/p>\n"},{"kind":"prose","text":"The guidance is written for any assistant; Claude Code is only the one the owner uses.","line":301,"renderedHtml":""},{"kind":"prose","text":"","line":302,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-other-assistant","title":"A creator uses another assistant","quality":"qg-any-assistant","stimulus":"A creator builds an app with an assistant other than Claude Code, without an MCP server","response":"The assistant reads the workflow from AGENTS.md, writes the plan file, loads the skills, and the git hooks run the same checks","metric":"The evals pass with Claude Code, Codex and Gemini CLI, each with its provider's latest model at the time of the run (source - evals)"},"startLine":304,"endLine":311,"inArc42Fence":true},{"kind":"prose","text":"","line":313,"renderedHtml":""},{"kind":"heading","level":2,"text":"A rule changes","line":314},{"kind":"prose","text":"","line":315,"renderedHtml":"\u003cp>A template copied once drifts; the scaffold therefore refers to the versioned package (\u003ccode>dec-one-package\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"A template copied once drifts; the scaffold therefore refers to the versioned package (`dec-one-package`).","line":316,"renderedHtml":""},{"kind":"prose","text":"","line":317,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-rule-change","title":"A rule changes","quality":"qg-guidance-evolves","stimulus":"The owner tightens a rule in the tooling","response":"The change is released once; every app built from a scaffold gets it with its next dependency update pull request, and the evals run before release","metric":"No file in an app repo has to be edited by hand to receive the change (source - repos)"},"startLine":319,"endLine":326,"inArc42Fence":true},{"kind":"prose","text":"","line":328,"renderedHtml":""},{"kind":"heading","level":2,"text":"A creator contributes a practice","line":329},{"kind":"prose","text":"","line":330,"renderedHtml":"\u003cp>Whoever shapes the guidance shapes the platform (\u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-contribute-practices\">contributing best practices\u003c/a>).\u003c/p>\n"},{"kind":"prose","text":"Whoever shapes the guidance shapes the platform ([contributing best practices](https://lernapps.net/docs/platform-design/#2-design/d6-learning-engine.pdt42.md:el-s-contribute-practices)).","line":331,"renderedHtml":""},{"kind":"prose","text":"","line":332,"renderedHtml":""},{"kind":"block","blockType":"quality-scenario","attributes":{"id":"qs-practice-contributed","title":"A creator contributes a practice","quality":"qg-guidance-evolves","stimulus":"An experienced creator proposes a practice from their own app","response":"It is added where it acts - a skill section, a lint rule, a check or a rubric item - with a new rule id, scope and severity","metric":"One pull request to lernapps/tooling, touching no other repo (source - repos)"},"startLine":334,"endLine":341,"inArc42Fence":true},{"kind":"prose","text":"","line":343,"renderedHtml":""}]},{"filePath":"/home/runner/work/tooling/tooling/docs/arc42/11-risks.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Risks and Technical Debt","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>Ordered by severity.\u003c/p>\n"},{"kind":"prose","text":"Ordered by severity.","line":3,"renderedHtml":""},{"kind":"prose","text":"","line":4,"renderedHtml":""},{"kind":"heading","level":2,"text":"Assistants skip the guidance","line":5},{"kind":"prose","text":"","line":6,"renderedHtml":"\u003cp>An assistant may ignore \u003ccode>AGENTS.md\u003c/code>, run through all phases at once or skip the checkpoints. The process guidance\nis text; nothing forces an assistant to read it.\u003c/p>\n"},{"kind":"prose","text":"An assistant may ignore `AGENTS.md`, run through all phases at once or skip the checkpoints. The process guidance","line":7,"renderedHtml":""},{"kind":"prose","text":"is text; nothing forces an assistant to read it.","line":8,"renderedHtml":""},{"kind":"prose","text":"","line":9,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-assistants-skip-guidance","title":"Assistants skip the guidance","severity":"high","mitigation":"Enforcement in git hooks and CI, not in text; the scaffold already keeps the rules; the plan template guides through comments; the evals with three assistants show where guidance is ignored"},"startLine":11,"endLine":16,"inArc42Fence":true},{"kind":"prose","text":"","line":18,"renderedHtml":""},{"kind":"heading","level":2,"text":"The owner is the bottleneck","line":19},{"kind":"prose","text":"","line":20,"renderedHtml":"\u003cp>Review, evals and listing decisions run by hand, on one person&#39;s time (\u003ccode>con-one-owner\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"Review, evals and listing decisions run by hand, on one person's time (`con-one-owner`).","line":21,"renderedHtml":""},{"kind":"prose","text":"","line":22,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-owner-bottleneck","title":"The owner is the bottleneck","severity":"high","mitigation":"Deterministic checks decide everything they can and comment failures without the owner; a deep scaffold leaves little to review; the review can move into the listing workflow when listings justify its cost"},"startLine":24,"endLine":29,"inArc42Fence":true},{"kind":"prose","text":"","line":31,"renderedHtml":""},{"kind":"heading","level":2,"text":"vite-plus is before 1.0","line":32},{"kind":"prose","text":"","line":33,"renderedHtml":"\u003cp>Its configuration format and commands may still change.\u003c/p>\n"},{"kind":"prose","text":"Its configuration format and commands may still change.","line":34,"renderedHtml":""},{"kind":"prose","text":"","line":35,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-vite-plus-young","title":"vite-plus is before 1.0","severity":"medium","mitigation":"The configuration is owned by the archetype presets, so a change is made once; Renovate updates go through the evals before they reach apps"},"startLine":37,"endLine":42,"inArc42Fence":true},{"kind":"prose","text":"","line":44,"renderedHtml":""},{"kind":"heading","level":2,"text":"Oxlint JS plugins are young","line":45},{"kind":"prose","text":"","line":46,"renderedHtml":"\u003cp>Our lint rules depend on Oxlint&#39;s JavaScript plugin support.\u003c/p>\n"},{"kind":"prose","text":"Our lint rules depend on Oxlint's JavaScript plugin support.","line":47,"renderedHtml":""},{"kind":"prose","text":"","line":48,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-oxlint-plugins","title":"Oxlint JS plugins are young","severity":"medium","mitigation":"Write the rules against the ESLint-compatible API, so they can run as an ESLint plugin; keep rules that need deep analysis in the check CLI"},"startLine":50,"endLine":55,"inArc42Fence":true},{"kind":"prose","text":"","line":57,"renderedHtml":""},{"kind":"heading","level":2,"text":"A browser at the creator","line":58},{"kind":"prose","text":"","line":59,"renderedHtml":"\u003cp>The end-to-end tests and the checks of the built app run pre-push and need a browser. Downloading it costs time once,\nand some assistant sandboxes cannot run one.\u003c/p>\n"},{"kind":"prose","text":"The end-to-end tests and the checks of the built app run pre-push and need a browser. Downloading it costs time once,","line":60,"renderedHtml":""},{"kind":"prose","text":"and some assistant sandboxes cannot run one.","line":61,"renderedHtml":""},{"kind":"prose","text":"","line":62,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-browser-at-creator","title":"A browser at the creator","severity":"medium","mitigation":"The preset installs Playwright's browser once and caches it; the check says clearly when no browser can run and which part was skipped; CI runs the same checks, and the listing validation runs them against the deployed app"},"startLine":64,"endLine":69,"inArc42Fence":true},{"kind":"prose","text":"","line":71,"renderedHtml":""},{"kind":"heading","level":2,"text":"Rule artifacts drift apart","line":72},{"kind":"prose","text":"","line":73,"renderedHtml":"\u003cp>Without a central rule file, the same rule can be worded differently in a skill and a check, or a moved rule can\nstay in its old place. No program compares the artifacts of one id; the rule list grouped by id makes the\ndifferences visible to the agent that reviews it.\u003c/p>\n"},{"kind":"prose","text":"Without a central rule file, the same rule can be worded differently in a skill and a check, or a moved rule can","line":74,"renderedHtml":""},{"kind":"prose","text":"stay in its old place. No program compares the artifacts of one id; the rule list grouped by id makes the","line":75,"renderedHtml":""},{"kind":"prose","text":"differences visible to the agent that reviews it.","line":76,"renderedHtml":""},{"kind":"prose","text":"","line":77,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-rule-drift","title":"Rule artifacts drift apart","severity":"low","mitigation":"Stable rule ids and the tooling's id test (unique per artifact kind, every message linked); an agent reviews the rules grouped by id; the evals show contradicting guidance"},"startLine":79,"endLine":84,"inArc42Fence":true},{"kind":"prose","text":"","line":86,"renderedHtml":""},{"kind":"heading","level":2,"text":"Creators without a shell","line":87},{"kind":"prose","text":"","line":88,"renderedHtml":"\u003cp>Creators who build in claude.ai or another chat assistant cannot run the generator, hooks or check CLI.\u003c/p>\n"},{"kind":"prose","text":"Creators who build in claude.ai or another chat assistant cannot run the generator, hooks or check CLI.","line":89,"renderedHtml":""},{"kind":"prose","text":"","line":90,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-no-shell","title":"Creators without a shell","severity":"medium","mitigation":"The listing validation works on a URL alone; the comment with the deterministic results is readable for a chat assistant too; lernapps.net/apps/llms.txt guides listing"},"startLine":92,"endLine":97,"inArc42Fence":true},{"kind":"prose","text":"","line":99,"renderedHtml":""},{"kind":"heading","level":2,"text":"Sessions without a listing stay invisible","line":100},{"kind":"prose","text":"","line":101,"renderedHtml":"\u003cp>We learn from listings only; sessions that fail before a listing leave no trace.\u003c/p>\n"},{"kind":"prose","text":"We learn from listings only; sessions that fail before a listing leave no trace.","line":102,"renderedHtml":""},{"kind":"prose","text":"","line":103,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-invisible-failures","title":"Sessions without a listing stay invisible","severity":"medium","mitigation":"Evals cover the archetypes; conversations with creators; agent feedback sent with the creator's consent through the platform's anonymous feedback channel"},"startLine":105,"endLine":110,"inArc42Fence":true},{"kind":"prose","text":"","line":112,"renderedHtml":""},{"kind":"heading","level":2,"text":"The entry model changes","line":113},{"kind":"prose","text":"","line":114,"renderedHtml":"\u003cp>The entry schema is tuned for discovery over time.\u003c/p>\n"},{"kind":"prose","text":"The entry schema is tuned for discovery over time.","line":115,"renderedHtml":""},{"kind":"prose","text":"","line":116,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-entry-schema-changes","title":"The entry model changes","severity":"medium","mitigation":"The guidance never repeats the schema's fields; the listing skill fetches the published schema each time (`dec-schema-explains-itself`)"},"startLine":118,"endLine":123,"inArc42Fence":true},{"kind":"prose","text":"","line":125,"renderedHtml":""},{"kind":"heading","level":2,"text":"Counters can be changed by hand","line":126},{"kind":"prose","text":"","line":127,"renderedHtml":"\u003cp>An assistant could reset \u003ccode>prePushFailures\u003c/code> in the plan&#39;s front matter.\u003c/p>\n"},{"kind":"prose","text":"An assistant could reset `prePushFailures` in the plan's front matter.","line":128,"renderedHtml":""},{"kind":"prose","text":"","line":129,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-counter-tampering","title":"Counters can be changed by hand","severity":"low","mitigation":"The counter is committed with every change; the review reads its history in git; it is a learning signal, not a listing criterion"},"startLine":131,"endLine":136,"inArc42Fence":true},{"kind":"prose","text":"","line":138,"renderedHtml":""},{"kind":"heading","level":2,"text":"Installing from git","line":139},{"kind":"prose","text":"","line":140,"renderedHtml":"\u003cp>npm installs a package from git only as a whole repo root, and more slowly than from a registry.\u003c/p>\n"},{"kind":"prose","text":"npm installs a package from git only as a whole repo root, and more slowly than from a registry.","line":141,"renderedHtml":""},{"kind":"prose","text":"","line":142,"renderedHtml":""},{"kind":"block","blockType":"risk","attributes":{"id":"risk-git-install","title":"Installing from git","severity":"low","mitigation":"One package at the root of lernapps/tooling (`dec-one-package`); publish to npm under the reserved scope @lernapps when install time or size starts to hurt"},"startLine":144,"endLine":149,"inArc42Fence":true},{"kind":"prose","text":"","line":151,"renderedHtml":""}]},{"filePath":"/home/runner/work/tooling/tooling/docs/arc42/12-glossary.arc42.md","nodes":[{"kind":"heading","level":1,"text":"Glossary","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"heading","level":2,"text":"Archetype","line":3},{"kind":"prose","text":"","line":4,"renderedHtml":"\u003cp>Not &quot;template&quot;: the template is only one part of an archetype. Names describe what the app is like, not what it is used for.\u003c/p>\n"},{"kind":"prose","text":"Not \"template\": the template is only one part of an archetype. Names describe what the app is like, not what it is used for.","line":5,"renderedHtml":""},{"kind":"prose","text":"","line":6,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-archetype","title":"Archetype","definition":"A kind of app the tooling supports, named after its character; a template, a preset, skills and the rules in scope."},"startLine":8,"endLine":12,"inArc42Fence":true},{"kind":"prose","text":"","line":14,"renderedHtml":""},{"kind":"heading","level":2,"text":"Assistant","line":15},{"kind":"prose","text":"","line":16,"renderedHtml":"\u003cp>The platform design calls them \u003ca href=\"https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants\">AI assistants\u003c/a>; in the files the assistant reads, we say agent. Not part of the system.\u003c/p>\n"},{"kind":"prose","text":"The platform design calls them [AI assistants](https://lernapps.net/docs/platform-design/#1-exploration/e2-scan.pdt42.md:el-e-ai-assistants); in the files the assistant reads, we say agent. Not part of the system.","line":17,"renderedHtml":""},{"kind":"prose","text":"","line":18,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-assistant","title":"Assistant","definition":"The creator's AI coding agent (e.g. Claude Code, Codex, Gemini CLI); called \"agent\" in the plan and the skills."},"startLine":20,"endLine":24,"inArc42Fence":true},{"kind":"prose","text":"","line":26,"renderedHtml":""},{"kind":"heading","level":2,"text":"Checkpoint","line":27},{"kind":"prose","text":"","line":28,"renderedHtml":"\u003cp>After the creator confirms the plan, the assistant comes back at most three times (\u003ccode>qs-few-turns-after-plan\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"After the creator confirms the plan, the assistant comes back at most three times (`qs-few-turns-after-plan`).","line":29,"renderedHtml":""},{"kind":"prose","text":"","line":30,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-checkpoint","title":"Checkpoint","definition":"A point in the plan where the assistant stops for the creator's decision - confirming the plan, publishing, listing."},"startLine":32,"endLine":36,"inArc42Fence":true},{"kind":"prose","text":"","line":38,"renderedHtml":""},{"kind":"heading","level":2,"text":"Creator","line":39},{"kind":"prose","text":"","line":40,"renderedHtml":"\u003cp>Not &quot;developer&quot;: most creators are not professional developers.\u003c/p>\n"},{"kind":"prose","text":"Not \"developer\": most creators are not professional developers.","line":41,"renderedHtml":""},{"kind":"prose","text":"","line":42,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-creator","title":"Creator","definition":"The person who builds an app with their assistant, typically a teacher or parent."},"startLine":44,"endLine":48,"inArc42Fence":true},{"kind":"prose","text":"","line":50,"renderedHtml":""},{"kind":"heading","level":2,"text":"EPCC","line":51},{"kind":"prose","text":"","line":52,"renderedHtml":"\u003cp>Written out in \u003ccode>AGENTS.md\u003c/code> as plain instructions; the MCP server of codemcp/workflows is optional.\u003c/p>\n"},{"kind":"prose","text":"Written out in `AGENTS.md` as plain instructions; the MCP server of codemcp/workflows is optional.","line":53,"renderedHtml":""},{"kind":"prose","text":"","line":54,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-epcc","title":"EPCC","definition":"Explore, Plan, Code, Commit - the phases of the plan file, after the workflow of the same name in codemcp/workflows."},"startLine":56,"endLine":60,"inArc42Fence":true},{"kind":"prose","text":"","line":62,"renderedHtml":""},{"kind":"heading","level":2,"text":"Evals","line":63},{"kind":"prose","text":"","line":64,"renderedHtml":"\u003cp>Run by hand with Claude Code, Codex and Gemini CLI on their latest models (\u003ccode>dec-evals-by-hand\u003c/code>).\u003c/p>\n"},{"kind":"prose","text":"Run by hand with Claude Code, Codex and Gemini CLI on their latest models (`dec-evals-by-hand`).","line":65,"renderedHtml":""},{"kind":"prose","text":"","line":66,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-evals","title":"Evals","definition":"Sample creator prompts run by the owner with several assistants to test the guidance itself before a change is merged."},"startLine":68,"endLine":72,"inArc42Fence":true},{"kind":"prose","text":"","line":74,"renderedHtml":""},{"kind":"heading","level":2,"text":"Fitness values","line":75},{"kind":"prose","text":"","line":76,"renderedHtml":"\u003cp>They feed the platform&#39;s \u003ca href=\"https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-fitness-signal\">fitness signal\u003c/a>: checked, not declared.\u003c/p>\n"},{"kind":"prose","text":"They feed the platform's [fitness signal](https://lernapps.net/docs/platform-design/#2-design/d5-transactions.pdt42.md:el-ch-fitness-signal): checked, not declared.","line":77,"renderedHtml":""},{"kind":"prose","text":"","line":78,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-fitness-values","title":"Fitness values","definition":"The fitness block of an entry (what an app stores, whether it contacts third parties); taken from a validation report, not declared by the creator."},"startLine":80,"endLine":84,"inArc42Fence":true},{"kind":"prose","text":"","line":86,"renderedHtml":""},{"kind":"heading","level":2,"text":"Listing","line":87},{"kind":"prose","text":"","line":88,"renderedHtml":"\u003cp>Not &quot;registration&quot; or &quot;submission&quot;. The listing is the only way an app connects to the platform.\u003c/p>\n"},{"kind":"prose","text":"Not \"registration\" or \"submission\". The listing is the only way an app connects to the platform.","line":89,"renderedHtml":""},{"kind":"prose","text":"","line":90,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-listing","title":"Listing","definition":"An app's entry in lernapps/apps, added by a pull request, validated, and accepted by the owner."},"startLine":92,"endLine":96,"inArc42Fence":true},{"kind":"prose","text":"","line":98,"renderedHtml":""},{"kind":"heading","level":2,"text":"Plan file","line":99},{"kind":"prose","text":"","line":100,"renderedHtml":"\u003cp>Lives in the app repo and is readable by the creator; it reaches the platform only with a listing.\u003c/p>\n"},{"kind":"prose","text":"Lives in the app repo and is readable by the creator; it reaches the platform only with a listing.","line":101,"renderedHtml":""},{"kind":"prose","text":"","line":102,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-plan-file","title":"Plan file","definition":"The assistant's Markdown plan in the app repo with phases, checkpoints, front matter counters and a closing retrospective."},"startLine":104,"endLine":108,"inArc42Fence":true},{"kind":"prose","text":"","line":110,"renderedHtml":""},{"kind":"heading","level":2,"text":"Promotion path","line":111},{"kind":"prose","text":"","line":112,"renderedHtml":"\u003cp>A move is a pull request that adds the new artifact and removes the old text; the id stays.\u003c/p>\n"},{"kind":"prose","text":"A move is a pull request that adds the new artifact and removes the old text; the id stays.","line":113,"renderedHtml":""},{"kind":"prose","text":"","line":114,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-promotion-path","title":"Promotion path","definition":"How a rule moves to the layer where it works best - a recurring review finding becomes a lint rule or check, a forgotten step a question in the plan template."},"startLine":116,"endLine":120,"inArc42Fence":true},{"kind":"prose","text":"","line":122,"renderedHtml":""},{"kind":"heading","level":2,"text":"Retrospective","line":123},{"kind":"prose","text":"","line":124,"renderedHtml":"\u003cp>Explained in comments of the plan template; the counters in the front matter are written by the hooks, not by the assistant.\u003c/p>\n"},{"kind":"prose","text":"Explained in comments of the plan template; the counters in the front matter are written by the hooks, not by the assistant.","line":125,"renderedHtml":""},{"kind":"prose","text":"","line":126,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-retrospective","title":"Retrospective","definition":"The last section of the plan file, filled by the assistant at the end - phases reached, failed checks, the creator's turns after the plan, where it had to guess."},"startLine":128,"endLine":132,"inArc42Fence":true},{"kind":"prose","text":"","line":134,"renderedHtml":""},{"kind":"heading","level":2,"text":"Rule","line":135},{"kind":"prose","text":"","line":136,"renderedHtml":"\u003cp>Replaces the loose terms criterion, convention and guideline: their difference is expressed by scope and severity. One rule can be told in a skill and checked by a program at the same time, under one id. All rules together are the rule catalog (chapter 8).\u003c/p>\n"},{"kind":"prose","text":"Replaces the loose terms criterion, convention and guideline: their difference is expressed by scope and severity. One rule can be told in a skill and checked by a program at the same time, under one id. All rules together are the rule catalog (chapter 8).","line":137,"renderedHtml":""},{"kind":"prose","text":"","line":138,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-rule","title":"Rule","definition":"One requirement on an app, with a stable id, scope (listing, site, archetype), and severity (error, warning, hint); it lives as skill text, lint rule, check or rubric item, often in several of them under the same id."},"startLine":140,"endLine":144,"inArc42Fence":true},{"kind":"prose","text":"","line":146,"renderedHtml":""},{"kind":"heading","level":2,"text":"Rules in scope","line":147},{"kind":"prose","text":"","line":148,"renderedHtml":"\u003cp>Skills, checks and rubric work on the rules in scope of the app at hand.\u003c/p>\n"},{"kind":"prose","text":"Skills, checks and rubric work on the rules in scope of the app at hand.","line":149,"renderedHtml":""},{"kind":"prose","text":"","line":150,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-rules-in-scope","title":"Rules in scope","definition":"The rules that apply to one app - scope listing, its archetype, and scope site when it is served on lernapps.net."},"startLine":152,"endLine":156,"inArc42Fence":true},{"kind":"prose","text":"","line":158,"renderedHtml":""},{"kind":"heading","level":2,"text":"Validation report","line":159},{"kind":"prose","text":"","line":160,"renderedHtml":"\u003cp>Bound to the commit it checked, so a fact sheet can trace the deployed app to it.\u003c/p>\n"},{"kind":"prose","text":"Bound to the commit it checked, so a fact sheet can trace the deployed app to it.","line":161,"renderedHtml":""},{"kind":"prose","text":"","line":162,"renderedHtml":""},{"kind":"block","blockType":"glossary-term","attributes":{"id":"term-validation-report","title":"Validation report","definition":"The YAML result of the check CLI for one commit or URL - findings per rule id and the fitness values; its schema is published."},"startLine":164,"endLine":168,"inArc42Fence":true},{"kind":"prose","text":"","line":170,"renderedHtml":""}]}],"ignoreDirectives":[],"coverage":{"covered":[],"uncovered":[],"totalFiles":0,"coveredFileCount":0,"uncoveredFileCount":0},"notation":"markdown"};</script>
