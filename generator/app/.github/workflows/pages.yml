name: Pages

# Checks the app and publishes it. The job `site` runs the app check of lernapps/tooling: `lernapps check`, the same
# command the git hooks ran (format, lint, type check, unit tests, build, the checks of the built app, the end-to-end
# tests), and keeps its validation report as the artifact "validation-report". On main, the job `deploy` publishes
# the bundle it checked to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: lernapps/tooling/actions/app-check@{{tooling}} # main
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lernapps/tooling/actions/site-deploy@{{tooling}} # main
