<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" font-family="sans-serif" font-size="13">
  <title>Skizze: Baustein BruchFeld (Seite 2, Übung), Start- und Antwortzustand</title>
  <rect width="360" height="260" fill="#fff" stroke="#999"/>
  <text x="16" y="26" font-weight="bold">Färbe 3/8 des Streifens.</text>
  <text x="16" y="46" fill="#333">Tippe auf Teile, um sie zu färben. Tippe nochmal, um die Farbe zu entfernen.</text>
  <!-- start state: 8 empty parts -->
  <g stroke="#333" fill="#fff">
    <rect x="16" y="64" width="40" height="52"/><rect x="56" y="64" width="40" height="52"/><rect x="96" y="64" width="40" height="52"/><rect x="136" y="64" width="40" height="52"/>
    <rect x="176" y="64" width="40" height="52"/><rect x="216" y="64" width="40" height="52"/><rect x="256" y="64" width="40" height="52"/><rect x="296" y="64" width="40" height="52"/>
  </g>
  <text x="16" y="136" font-size="11" fill="#666">Start: Ganzes in 8 gleiche Teile geteilt, nichts gefärbt. Der Zähler steht nicht da (er wäre die Lösung).</text>
  <!-- after tapping: pattern + colour, second mark -->
  <g stroke="#333" fill="#9ecae1">
    <rect x="16" y="168" width="40" height="52"/><rect x="56" y="168" width="40" height="52"/><rect x="96" y="168" width="40" height="52"/>
  </g>
  <g stroke="#333" fill="#fff">
    <rect x="136" y="168" width="40" height="52"/><rect x="176" y="168" width="40" height="52"/><rect x="216" y="168" width="40" height="52"/><rect x="256" y="168" width="40" height="52"/><rect x="296" y="168" width="40" height="52"/>
  </g>
  <text x="29" y="200" font-size="16">✓</text><text x="69" y="200" font-size="16">✓</text><text x="109" y="200" font-size="16">✓</text>
  <text x="16" y="244" font-size="11" fill="#666">Nach dem Tippen: gefärbte Teile blau mit Haken (zweites Zeichen neben der Farbe); darunter „Prüfen“ vom Explainer.</text>
</svg>
