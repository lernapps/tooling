<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Skizze: Rechteck in 8 gleich große Felder geteilt, 3 gefärbt">
  <title>Skizze Komponente bruch-feld (Seite „Was ist ein Bruch?")</title>
  <text x="20" y="28" font-family="sans-serif" font-size="16">Aufgabe: Färbe 3/8 des Rechtecks.</text>
  <g stroke="#333" stroke-width="2">
    <rect x="20" y="50" width="100" height="60" fill="#9cf"/><rect x="120" y="50" width="100" height="60" fill="#9cf"/>
    <rect x="220" y="50" width="100" height="60" fill="#9cf"/><rect x="320" y="50" width="100" height="60" fill="#fff"/>
    <rect x="20" y="110" width="100" height="60" fill="#fff"/><rect x="120" y="110" width="100" height="60" fill="#fff"/>
    <rect x="220" y="110" width="100" height="60" fill="#fff"/><rect x="320" y="110" width="100" height="60" fill="#fff"/>
  </g>
  <text x="20" y="196" font-family="sans-serif" font-size="14">Klick auf ein Feld färbt es. [Prüfen] [Neu starten]. Zeigt vor „Prüfen" keinen Zählerstand.</text>
  <text x="20" y="214" font-family="sans-serif" font-size="12">Danach: „Du hast 3 von 8 Feldern gefärbt: 3/8." Muster zusätzlich zur Farbe: gefärbt = Schraffur.</text>
</svg>
