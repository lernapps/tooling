<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif" font-size="14">
<title>Skizze Seite 3: Bewegungslabor, Weg-Zeit-Diagramm</title>
<rect width="640" height="380" fill="#fff" stroke="#999"/>
<text x="16" y="24" font-weight="bold">Weg-Zeit-Diagramm (Bewegungslabor)</text>
<g stroke="#ccc"><path d="M60 208H380M60 166H380M60 124H380M60 82H380M140 40V250M220 40V250M300 40V250M380 40V250"/></g>
<g stroke="#333" fill="none"><path d="M60 40V250H380"/>
<path d="M60 250L140 250 L260 130 L380 130" stroke="#06c" stroke-width="3"/></g>
<text x="8" y="44">s in m</text><text x="330" y="272">t in s</text>
<text x="52" y="254" text-anchor="end">0</text><text x="52" y="86" text-anchor="end">100</text>
<text x="140" y="268" text-anchor="middle">4</text><text x="300" y="268" text-anchor="middle">8</text>
<text x="400" y="60">Abschnitt 1 (0 bis 4 s): Regler für v</text>
<rect x="400" y="70" width="200" height="14" fill="#eee" stroke="#666"/><circle cx="410" cy="77" r="9" fill="#06c"/>
<text x="400" y="120">Abschnitt 2 (4 bis 8 s): Regler für v</text>
<rect x="400" y="130" width="200" height="14" fill="#eee" stroke="#666"/><circle cx="520" cy="137" r="9" fill="#06c"/>
<text x="400" y="180">Abschnitt 3 (8 bis 12 s): Regler für v</text>
<rect x="400" y="190" width="200" height="14" fill="#eee" stroke="#666"/><circle cx="410" cy="197" r="9" fill="#06c"/>
<text x="16" y="310">Messmarke: lässt sich auf der Linie verschieben und zeigt t und s.</text>
<text x="16" y="332">Achsen bleiben fest, solange die Regler bewegt werden.</text>
<text x="16" y="360" fill="#555">Kein Text im Diagramm nennt die Antwort der Aufgabe darunter.</text>
</svg>
