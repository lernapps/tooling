<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="sans-serif" font-size="12">
  <title>Skizze: Reihenschaltung und Parallelschaltung übereinander (360 px)</title>
  <text x="16" y="20" font-weight="bold">Reihenschaltung</text>
  <path d="M40 40 H320 V120 H40 Z" fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="130" cy="40" r="12" fill="#fff" stroke="#222" stroke-width="2"/><text x="124" y="44">1</text>
  <circle cx="230" cy="40" r="12" fill="#fff" stroke="#222" stroke-width="2"/><text x="224" y="44">2</text>
  <path d="M34 72 H46 M38 82 H42" stroke="#222" stroke-width="3"/>
  <text x="16" y="146" fill="#555">Ein Weg für den Strom: fällt Lampe 1 aus, erlischt auch Lampe 2.</text>
  <text x="16" y="186" font-weight="bold">Parallelschaltung</text>
  <path d="M40 206 H320 V300 H40 Z M180 206 V300" fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="110" cy="206" r="12" fill="#fff" stroke="#222" stroke-width="2"/><text x="104" y="210">1</text>
  <circle cx="250" cy="206" r="12" fill="#fff" stroke="#222" stroke-width="2"/><text x="244" y="210">2</text>
  <text x="16" y="322" fill="#555">Zwei Wege: fällt Lampe 1 aus, leuchtet Lampe 2 weiter.</text>
</svg>
