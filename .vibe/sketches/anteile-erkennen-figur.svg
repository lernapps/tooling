<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Skizze: Rechteck in 8 gleich große Teile geteilt, 3 gefärbt">
  <title>Skizze Seite anteile-erkennen: Das Ganze, gleich große Teile, gefärbte Teile</title>
  <rect x="0" y="0" width="360" height="200" fill="#ffffff"/>
  <text x="20" y="24" font-family="sans-serif" font-size="14" fill="#222">Das Ganze: ein Rechteck</text>
  <g stroke="#222" stroke-width="2">
    <rect x="20" y="40" width="40" height="60" fill="#2b6cb0"/>
    <rect x="60" y="40" width="40" height="60" fill="#2b6cb0"/>
    <rect x="100" y="40" width="40" height="60" fill="#2b6cb0"/>
    <rect x="140" y="40" width="40" height="60" fill="#ffffff"/>
    <rect x="180" y="40" width="40" height="60" fill="#ffffff"/>
    <rect x="220" y="40" width="40" height="60" fill="#ffffff"/>
    <rect x="260" y="40" width="40" height="60" fill="#ffffff"/>
    <rect x="300" y="40" width="40" height="60" fill="#ffffff"/>
  </g>
  <text x="20" y="124" font-family="sans-serif" font-size="13" fill="#222">3 Teile sind gefärbt</text>
  <text x="20" y="144" font-family="sans-serif" font-size="13" fill="#222">8 gleich große Teile insgesamt</text>
  <text x="250" y="130" font-family="sans-serif" font-size="30" fill="#222">3</text>
  <line x1="244" y1="138" x2="280" y2="138" stroke="#222" stroke-width="2"/>
  <text x="250" y="170" font-family="sans-serif" font-size="30" fill="#222">8</text>
  <text x="290" y="130" font-family="sans-serif" font-size="12" fill="#222">Zähler</text>
  <text x="290" y="170" font-family="sans-serif" font-size="12" fill="#222">Nenner</text>
</svg>
