<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="sans-serif" font-size="13">
  <title>Skizze Seite 2: Fahrtstreifen mit Geschwindigkeitspfeilen</title>
  <rect width="560" height="330" fill="#fff" stroke="#999"/>
  <text x="20" y="24" font-weight="bold">Ausprobieren: Stelle die Fahrt ein (alle 1 s ein Foto)</text>
  <!-- Strasse -->
  <line x1="30" y1="110" x2="530" y2="110" stroke="#333" stroke-width="3"/>
  <!-- Positionen nach Geschwindigkeiten 2,4,6,6,3 m/s: 0,2,6,12,18,21 m, 20 px pro m -->
  <g fill="#1a5fb4">
    <circle cx="40" cy="110" r="7"/><circle cx="80" cy="110" r="7"/><circle cx="160" cy="110" r="7"/>
    <circle cx="280" cy="110" r="7"/><circle cx="400" cy="110" r="7"/><circle cx="460" cy="110" r="7"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="40" y="132">0 s</text><text x="80" y="132">1 s</text><text x="160" y="132">2 s</text>
    <text x="280" y="132">3 s</text><text x="400" y="132">4 s</text><text x="460" y="132">5 s</text>
  </g>
  <!-- Pfeile (Geschwindigkeit zwischen den Fotos) -->
  <g stroke="#c64600" stroke-width="3" fill="#c64600">
    <line x1="40" y1="80" x2="78" y2="80"/><line x1="80" y1="80" x2="158" y2="80"/>
    <line x1="160" y1="80" x2="278" y2="80"/><line x1="280" y1="80" x2="398" y2="80"/>
    <line x1="400" y1="80" x2="458" y2="80"/>
  </g>
  <text x="20" y="62" fill="#c64600">Pfeil = Geschwindigkeit in dieser Sekunde (länger = schneller)</text>
  <!-- Stepper -->
  <text x="20" y="175" font-weight="bold">Geschwindigkeit in jeder Sekunde (m/s, Minus = zurück):</text>
  <g stroke="#333" fill="#f4f4f4">
    <rect x="30" y="190" width="90" height="40"/><rect x="140" y="190" width="90" height="40"/>
    <rect x="250" y="190" width="90" height="40"/><rect x="360" y="190" width="90" height="40"/>
    <rect x="470" y="190" width="70" height="40"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="75" y="214">− 2 +</text><text x="185" y="214">− 4 +</text><text x="295" y="214">− 6 +</text>
    <text x="405" y="214">− 6 +</text><text x="505" y="214">− 3 +</text>
  </g>
  <text x="20" y="262" font-weight="bold">Aufgabe: Stelle eine Fahrt ein, bei der das Auto erst bremst und dann die Richtung ändert.</text>
  <rect x="20" y="276" width="90" height="32" fill="#1a5fb4"/><text x="65" y="297" text-anchor="middle" fill="#fff">Prüfen</text>
  <text x="130" y="297" fill="#555">Rückmeldung: Eigenschaft prüfen, nicht eine Musterlösung. Bremsen ist nicht "0 m/s".</text>
</svg>
