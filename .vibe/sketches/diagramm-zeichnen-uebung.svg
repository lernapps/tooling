<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" font-family="sans-serif" font-size="11">
  <title>Skizze: Übungskomponente DiagrammZeichnen (Seite 6, 360 px)</title>
  <rect width="360" height="520" fill="#fff" stroke="#999"/>
  <text x="12" y="20" font-weight="bold">Aufgabe 1 von 3</text>
  <text x="12" y="40">Der Bus fährt langsam an, fährt dann gleichmäßig und bremst</text>
  <text x="12" y="54">zuletzt bis zum Halt ab. Stelle das Geschwindigkeit-Zeit-Diagramm ein.</text>
  <text x="12" y="84" font-weight="bold">Dein Diagramm (v in m/s über t in s)</text>
  <g stroke="#bbb"><line x1="50" y1="100" x2="50" y2="230"/><line x1="50" y1="230" x2="340" y2="230"/></g>
  <text x="34" y="234">0</text><text x="34" y="170">2</text><text x="34" y="114">4</text>
  <polyline points="50,230 98,230 146,230 194,230 242,230 290,230 338,230" fill="none" stroke="#c60" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="12" y="262" fill="#555">Start: alle Punkte auf 0 (Wagen steht). Die Lösung ist nicht zu sehen.</text>
  <g stroke="#333" fill="#eee"><rect x="12" y="278" width="44" height="44" rx="4"/><rect x="62" y="278" width="44" height="44" rx="4"/><rect x="112" y="278" width="44" height="44" rx="4"/><rect x="162" y="278" width="44" height="44" rx="4"/><rect x="212" y="278" width="44" height="44" rx="4"/><rect x="262" y="278" width="44" height="44" rx="4"/></g>
  <text x="14" y="296">t=1 s</text><text x="64" y="296">t=2 s</text><text x="114" y="296">t=3 s</text><text x="164" y="296">t=4 s</text><text x="214" y="296">t=5 s</text><text x="264" y="296">t=6 s</text>
  <rect x="12" y="340" width="70" height="36" rx="4" fill="#06c"/><text x="26" y="362" fill="#fff">Prüfen</text>
  <text x="12" y="402" font-weight="bold">Hilfe (aufklappbar)</text>
  <text x="12" y="418" fill="#555">Stufe 1: Tipp zum Anfahren. Stufe 2: Tipp zum Halt. Danach Rückmeldung.</text>
  <text x="12" y="450" font-weight="bold">Rückmeldung nach „Prüfen“</text>
  <text x="12" y="466" fill="#555">z. B. „Beim Abbremsen muss die Linie fallen, nicht steigen.“</text>
  <text x="12" y="482" fill="#555">Gemeint ist die Kurve der Aufgabe, nicht die Lösung.</text>
</svg>
