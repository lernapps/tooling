<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="t d">
  <title id="t">Schaltplan eines einfachen Stromkreises</title>
  <desc id="d">Eine Batterie links und eine Lampe rechts sind mit zwei Leitungen zu einem geschlossenen Rechteck verbunden. Ein Pfeil an der oberen Leitung zeigt die technische Stromrichtung von Plus über die Lampe nach Minus.</desc>
  <g fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round">
    <path d="M80 40 H320 V92 M320 148 V200 H80 V148"/>
    <path d="M80 40 V92 M80 148 V200" />
    <path d="M60 92 H100" />
    <path d="M70 108 H90" stroke-width="7"/>
    <circle cx="320" cy="120" r="28"/>
    <path d="M300 100 L340 140 M340 100 L300 140"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#1a1a1a">
    <text x="108" y="100">+</text><text x="108" y="124">−</text>
    <text x="30" y="224">Batterie</text><text x="300" y="224">Lampe</text>
  </g>
  <path d="M170 40 L230 40" stroke="#1a1a1a" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker></defs>
</svg>
