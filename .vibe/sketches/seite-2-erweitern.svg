<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="16">
  <title>Skizze Seite 2 (und 3, 4): zwei Streifen, gleiche Fläche, feinere Unterteilung</title>
  <rect x="0" y="0" width="640" height="300" fill="#fff" stroke="#999"/>
  <text x="20" y="30" font-size="20" font-weight="bold">Erweitern: feiner einteilen</text>
  <text x="20" y="55">Oben: 3/4. Unten dasselbe Stück, jedes Viertel in 3 Teile geteilt.</text>
  <g stroke="#333" fill="#fff">
    <rect x="20" y="75" width="150" height="45"/><rect x="170" y="75" width="150" height="45"/>
    <rect x="320" y="75" width="150" height="45"/><rect x="470" y="75" width="150" height="45"/>
  </g>
  <g fill="#4a7fc1" stroke="#333"><rect x="20" y="75" width="150" height="45"/><rect x="170" y="75" width="150" height="45"/><rect x="320" y="75" width="150" height="45"/></g>
  <g stroke="#333" fill="#fff">
    <rect x="20" y="135" width="50" height="45"/><rect x="70" y="135" width="50" height="45"/><rect x="120" y="135" width="50" height="45"/>
    <rect x="170" y="135" width="50" height="45"/><rect x="220" y="135" width="50" height="45"/><rect x="270" y="135" width="50" height="45"/>
    <rect x="320" y="135" width="50" height="45"/><rect x="370" y="135" width="50" height="45"/><rect x="420" y="135" width="50" height="45"/>
    <rect x="470" y="135" width="50" height="45"/><rect x="520" y="135" width="50" height="45"/><rect x="570" y="135" width="50" height="45"/>
  </g>
  <g fill="#4a7fc1" stroke="#333">
    <rect x="20" y="135" width="450" height="45"/>
  </g>
  <text x="20" y="215">Jedes Stück wird in [ 3 ] Teile geteilt  (Knöpfe: 2, 3, 4, 5)</text>
  <text x="20" y="250" font-size="22">3/4 = 9/12   Zähler und Nenner mal 3</text>
  <text x="20" y="280" fill="#555">Gleiche gefärbte Fläche, mehr und kleinere Teile. Kürzen: Knopf zeigt den umgekehrten Weg.</text>
</svg>
