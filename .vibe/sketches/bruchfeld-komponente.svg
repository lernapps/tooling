<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Skizze: Komponente Bruchfeld, Streifen mit 8 Teilen, zwei angeklickt">
  <title>Skizze Komponente Bruchfeld (Seite anteile-darstellen)</title>
  <rect width="360" height="220" fill="#ffffff"/>
  <text x="20" y="26" font-family="sans-serif" font-size="14" fill="#222">Aufgabe: Färbe 3/8 des Streifens.</text>
  <g stroke="#222" stroke-width="2">
    <rect x="20" y="44" width="40" height="60" fill="#2b6cb0"/>
    <rect x="60" y="44" width="40" height="60" fill="#2b6cb0"/>
    <rect x="100" y="44" width="40" height="60" fill="#ffffff"/>
    <rect x="140" y="44" width="40" height="60" fill="#ffffff"/>
    <rect x="180" y="44" width="40" height="60" fill="#ffffff"/>
    <rect x="220" y="44" width="40" height="60" fill="#ffffff"/>
    <rect x="260" y="44" width="40" height="60" fill="#ffffff"/>
    <rect x="300" y="44" width="40" height="60" fill="#ffffff"/>
  </g>
  <text x="20" y="128" font-family="sans-serif" font-size="12" fill="#444">Klicke auf ein Teil, um es zu färben. Noch einmal klicken: wieder weiß.</text>
  <text x="20" y="146" font-family="sans-serif" font-size="12" fill="#444">Kein Zähler unter dem Streifen (er würde die Lösung verraten).</text>
  <rect x="20" y="164" width="70" height="30" rx="4" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="34" y="184" font-family="sans-serif" font-size="14" fill="#222">Prüfen</text>
  <rect x="104" y="164" width="110" height="30" rx="4" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="116" y="184" font-family="sans-serif" font-size="14" fill="#222">Zurücksetzen</text>
</svg>
