<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="sans-serif" font-size="16">
  <title>Skizze Komponente Streifen (Seiten „Erweitern“ und „Kürzen“)</title>
  <rect x="0" y="0" width="640" height="340" fill="#fff" stroke="#999"/>
  <text x="20" y="28" font-weight="bold">Erweitern: Schritt 1 (Start) und Schritt 2 (erweitert mit 3)</text>
  <text x="20" y="56">vorher: 2/3</text>
  <g stroke="#333" stroke-width="2">
    <rect x="20" y="64" width="200" height="40" fill="#3a6ea5"/><rect x="220" y="64" width="200" height="40" fill="#3a6ea5"/><rect x="420" y="64" width="200" height="40" fill="#fff"/>
  </g>
  <text x="20" y="136">erweitert mit 3: 6/9</text>
  <g stroke="#333" stroke-width="1.5">
    <rect x="20" y="144" width="66.6" height="40" fill="#3a6ea5"/><rect x="86.6" y="144" width="66.6" height="40" fill="#3a6ea5"/><rect x="153.2" y="144" width="66.6" height="40" fill="#3a6ea5"/>
    <rect x="219.8" y="144" width="66.6" height="40" fill="#3a6ea5"/><rect x="286.4" y="144" width="66.6" height="40" fill="#3a6ea5"/><rect x="353" y="144" width="66.6" height="40" fill="#3a6ea5"/>
    <rect x="419.6" y="144" width="66.6" height="40" fill="#fff"/><rect x="486.2" y="144" width="66.6" height="40" fill="#fff"/><rect x="552.8" y="144" width="66.6" height="40" fill="#fff"/>
  </g>
  <text x="20" y="220">Faktor (Knöpfe 1 bis 6):</text>
  <g>
    <rect x="200" y="200" width="36" height="32" fill="#eee" stroke="#333"/><text x="213" y="222">1</text>
    <rect x="240" y="200" width="36" height="32" fill="#eee" stroke="#333"/><text x="253" y="222">2</text>
    <rect x="280" y="200" width="36" height="32" fill="#cde" stroke="#333" stroke-width="3"/><text x="293" y="222">3</text>
    <rect x="320" y="200" width="36" height="32" fill="#eee" stroke="#333"/><text x="333" y="222">4</text>
  </g>
  <text x="20" y="262">Rechnung: 2/3 = (2 · 3)/(3 · 3) = 6/9  — gleich große Fläche, feinere Teile.</text>
  <text x="20" y="288" font-size="13" fill="#555">Beide Streifen bleiben sichtbar, Beschriftung „vorher“ / „erweitert mit 3“. Start: Faktor 1 (beide gleich).</text>
  <text x="20" y="312" font-size="13" fill="#555">Kürzen: derselbe Aufbau rückwärts. Gegeben 6/9; die Knöpfe zeigen nur gemeinsame Teiler (hier 1, 3); „gekürzt mit 3“ = 2/3.</text>
</svg>
