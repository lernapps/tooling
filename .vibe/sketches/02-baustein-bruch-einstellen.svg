<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="sans-serif" font-size="13">
  <title>Skizze: Baustein bruch-einstellen, Schritte</title>
  <rect width="360" height="300" fill="#fff" stroke="#999"/>
  <text x="16" y="24" font-weight="bold">Start: Nenner 4, Zähler 1</text>
  <rect x="16" y="34" width="160" height="30" fill="#fff" stroke="#333"/>
  <line x1="56" y1="34" x2="56" y2="64" stroke="#333"/><line x1="96" y1="34" x2="96" y2="64" stroke="#333"/><line x1="136" y1="34" x2="136" y2="64" stroke="#333"/>
  <rect x="16" y="34" width="40" height="30" fill="#f4a" opacity=".6"/>
  <text x="190" y="54">1/4</text>
  <text x="16" y="96" font-weight="bold">Nach „Zähler +“ zweimal: Zähler 3</text>
  <rect x="16" y="106" width="160" height="30" fill="#fff" stroke="#333"/>
  <rect x="16" y="106" width="120" height="30" fill="#f4a" opacity=".6"/>
  <text x="190" y="126">3/4</text>
  <text x="16" y="168" font-weight="bold">Nach „Nenner +“: Nenner 5 – das Ganze bleibt gleich groß</text>
  <rect x="16" y="178" width="160" height="30" fill="#fff" stroke="#333"/>
  <rect x="16" y="178" width="96" height="30" fill="#f4a" opacity=".6"/>
  <text x="190" y="198">3/5 (Teile werden kleiner)</text>
  <text x="16" y="236">Grenzen: Nenner 2 bis 12, Zähler 0 bis Nenner.</text>
  <text x="16" y="254">Sperre: Zähler darf den Nenner nicht übersteigen</text>
  <text x="16" y="272">(Taste „+“ ausgegraut, mit Hinweis).</text>
  <text x="16" y="290" fill="#555">Ohne JavaScript: Bild und Tabelle von 1/4, 3/4 und 3/5.</text>
</svg>
