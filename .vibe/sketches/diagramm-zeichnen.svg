<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif" font-size="14">
  <title>Skizze Übung „Eine Bewegung im Diagramm darstellen“: Geschwindigkeit-Zeit-Diagramm einstellen</title>
  <rect width="640" height="380" fill="#fff" stroke="#999"/>
  <text x="16" y="24" font-weight="bold">Übung: Stelle das v-t-Diagramm ein</text>
  <text x="16" y="48">Aufgabe: Ein Fahrrad fährt 3 s lang an, fährt 3 s gleich schnell und bremst dann 3 s bis zum Stillstand.</text>
  <line x1="60" y1="310" x2="60" y2="80" stroke="#333"/><line x1="60" y1="310" x2="400" y2="310" stroke="#333"/>
  <text x="14" y="94">v in m/s</text><text x="360" y="332">t in s</text>
  <g stroke="#ccc"><line x1="60" y1="250" x2="400" y2="250"/><line x1="60" y1="190" x2="400" y2="190"/><line x1="60" y1="130" x2="400" y2="130"/></g>
  <text x="34" y="254">3</text><text x="34" y="194">6</text><text x="34" y="134">9</text>
  <text x="100" y="326">3</text><text x="180" y="326">6</text><text x="260" y="326">9</text>
  <polyline points="60,310 100,250 180,250 260,310" fill="none" stroke="#2a6fdb" stroke-width="3"/>
  <g fill="#2a6fdb"><circle cx="60" cy="310" r="6"/><circle cx="140" cy="250" r="6"/><circle cx="220" cy="250" r="6"/><circle cx="300" cy="310" r="6"/></g>
  <text x="430" y="100" font-weight="bold">Geschwindigkeit zu jeder Zeit</text>
  <text x="430" y="130">bei 3 s</text><line x1="500" y1="124" x2="620" y2="124" stroke="#333" stroke-width="3"/><circle cx="560" cy="124" r="9" fill="#2a6fdb"/>
  <text x="430" y="170">bei 6 s</text><line x1="500" y1="164" x2="620" y2="164" stroke="#333" stroke-width="3"/><circle cx="560" cy="164" r="9" fill="#2a6fdb"/>
  <text x="430" y="210">bei 9 s</text><line x1="500" y1="204" x2="620" y2="204" stroke="#333" stroke-width="3"/><circle cx="500" cy="204" r="9" fill="#2a6fdb"/>
  <rect x="430" y="250" width="90" height="34" fill="#eee" stroke="#333"/><text x="452" y="272">Prüfen</text>
  <text x="430" y="310" font-size="12">Nach „Prüfen“: richtig, oder ein Hinweis,</text><text x="430" y="326" font-size="12">welcher Abschnitt nicht passt (ohne Lösung).</text>
</svg>
