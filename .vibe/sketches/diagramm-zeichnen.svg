<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif" font-size="14">
<title>Skizze Seite 5: Diagramm zeichnen (Übungsbaustein)</title>
<rect width="640" height="380" fill="#fff" stroke="#999"/>
<text x="16" y="24" font-weight="bold">Ein Fahrrad fährt 4 s an, rollt 4 s gleichmäßig und bremst 4 s ab.</text>
<g stroke="#ccc"><path d="M60 208H380M60 166H380M60 124H380M60 82H380M140 40V250M220 40V250M300 40V250M380 40V250"/></g>
<g stroke="#333" fill="none"><path d="M60 40V250H380"/></g>
<g fill="#06c"><circle cx="60" cy="250" r="6"/><circle cx="140" cy="130" r="6"/><circle cx="220" cy="130" r="6"/></g>
<circle cx="380" cy="130" r="6" fill="#fff" stroke="#06c" stroke-width="2"/>
<text x="8" y="44">v in m/s</text><text x="330" y="272">t in s</text>
<text x="400" y="60">Punkt bei t = 12 s verschieben:</text>
<rect x="400" y="70" width="40" height="36" fill="#eee" stroke="#666"/><text x="414" y="94">-</text>
<rect x="450" y="70" width="70" height="36" fill="#fff" stroke="#666"/><text x="466" y="94">12 m/s</text>
<rect x="530" y="70" width="40" height="36" fill="#eee" stroke="#666"/><text x="544" y="94">+</text>
<text x="400" y="140">Auch mit Pfeiltasten bedienbar.</text>
<rect x="400" y="160" width="100" height="36" fill="#06c"/><text x="424" y="184" fill="#fff">Prüfen</text>
<text x="16" y="310">Nach Prüfen: Rückmeldung nennt den Fehler, z. B. "Beim Abbremsen fällt die Linie, sie bleibt nicht oben."</text>
</svg>
