<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="sans-serif" font-size="13">
  <title>Skizze: Baustein „Bewegungslabor“ (Seite Weg-Zeit-Diagramm, Startzustand)</title>
  <rect width="720" height="560" fill="#fff" stroke="#999"/>
  <text x="20" y="28" font-size="16" font-weight="bold">Bewegungslabor (Startzustand: du fährst 4 Abschnitte à 5 s mit 10 m/s)</text>

  <!-- Reglerzeile -->
  <text x="20" y="58">Stelle ein, wie schnell du am ENDE jedes Abschnitts bist:</text>
  <g stroke="#666" fill="none">
    <rect x="20" y="70" width="155" height="96"/><rect x="190" y="70" width="155" height="96"/>
    <rect x="360" y="70" width="155" height="96"/><rect x="530" y="70" width="170" height="96"/>
  </g>
  <g fill="#000">
    <text x="30" y="90">Abschnitt 1 (0–5 s)</text><text x="200" y="90">Abschnitt 2 (5–10 s)</text>
    <text x="370" y="90">Abschnitt 3 (10–15 s)</text><text x="540" y="90">Abschnitt 4 (15–20 s)</text>
    <text x="30" y="132">Endtempo: 10 m/s</text><text x="200" y="132">Endtempo: 10 m/s</text>
    <text x="370" y="132">Endtempo: 10 m/s</text><text x="540" y="132">Endtempo: 10 m/s</text>
    <text x="30" y="156">gleichbleibend</text><text x="200" y="156">gleichbleibend</text>
    <text x="370" y="156">gleichbleibend</text><text x="540" y="156">gleichbleibend</text>
  </g>
  <g stroke="#333"><line x1="30" y1="108" x2="160" y2="108"/><line x1="200" y1="108" x2="330" y2="108"/>
    <line x1="370" y1="108" x2="500" y2="108"/><line x1="540" y1="108" x2="680" y2="108"/></g>
  <g fill="#333"><circle cx="95" cy="108" r="7"/><circle cx="265" cy="108" r="7"/><circle cx="435" cy="108" r="7"/><circle cx="610" cy="108" r="7"/></g>
  <text x="20" y="188">☐ Abschnitt rückwärts fahren (erscheint, sobald das Tempo größer als 0 ist)   [Zurücksetzen]</text>

  <!-- Diagramm s-t -->
  <text x="20" y="222" font-weight="bold">Weg-Zeit-Diagramm</text>
  <g stroke="#bbb"><line x1="70" y1="240" x2="70" y2="520"/><line x1="70" y1="520" x2="400" y2="520"/></g>
  <text x="14" y="236">s in m</text><text x="360" y="540">t in s</text>
  <text x="38" y="524">0</text><text x="30" y="380">100</text><text x="30" y="250">200</text>
  <text x="66" y="536">0</text><text x="150" y="536">5</text><text x="225" y="536">10</text><text x="300" y="536">15</text><text x="378" y="536">20</text>
  <polyline points="70,520 395,260" fill="none" stroke="#0a5" stroke-width="3"/>
  <!-- Diagramm v-t -->
  <text x="430" y="222" font-weight="bold">Geschwindigkeit-Zeit-Diagramm</text>
  <g stroke="#bbb"><line x1="470" y1="240" x2="470" y2="520"/><line x1="470" y1="520" x2="700" y2="520"/></g>
  <text x="430" y="236">v in m/s</text><text x="660" y="540">t in s</text>
  <text x="440" y="524">0</text><text x="440" y="452">10</text><text x="440" y="384">20</text><text x="440" y="316">30</text>
  <polyline points="470,452 690,452" fill="none" stroke="#06c" stroke-width="3"/>
  <text x="430" y="560" fill="#555" font-size="11">Beide Achsen behalten ihre Skala, wenn die Regler bewegt werden (Skala bleibt fest).</text>
  <text x="20" y="560" fill="#555" font-size="11">Seite Weg-Zeit-Diagramm zeigt nur links; Seite Geschwindigkeit-Zeit nur rechts; Seite „verbinden“ beide untereinander.</text>
</svg>
