<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" font-family="sans-serif" font-size="11">
  <title>Skizze: Komponente BewegungsDiagramm (360 px, untereinander)</title>
  <rect width="360" height="640" fill="#fff" stroke="#999"/>
  <text x="12" y="20" font-weight="bold">1 Die Fahrt (Wagen auf der Bahn)</text>
  <line x1="20" y1="60" x2="340" y2="60" stroke="#333" stroke-width="2"/>
  <g fill="#36c"><circle cx="20" cy="50" r="5"/><circle cx="40" cy="50" r="5"/><circle cx="75" cy="50" r="5"/><circle cx="125" cy="50" r="5"/><circle cx="190" cy="50" r="5"/><circle cx="265" cy="50" r="5"/><circle cx="340" cy="50" r="5"/></g>
  <text x="12" y="80" fill="#555">Punkte = Ort des Wagens nach 0, 1, 2 ... 6 s. Weite Abstände = schnell.</text>

  <text x="12" y="112" font-weight="bold">2 Geschwindigkeit-Zeit-Diagramm</text>
  <g stroke="#bbb"><line x1="50" y1="130" x2="50" y2="250"/><line x1="50" y1="250" x2="340" y2="250"/></g>
  <text x="14" y="135">v in m/s</text><text x="300" y="268">t in s</text>
  <text x="34" y="254">0</text><text x="34" y="190">2</text><text x="34" y="134">4</text>
  <polyline points="50,250 98,220 146,190 194,160 242,160 290,205 338,250" fill="none" stroke="#c60" stroke-width="3"/>
  <g fill="#c60"><circle cx="50" cy="250" r="4"/><circle cx="98" cy="220" r="4"/><circle cx="146" cy="190" r="4"/><circle cx="194" cy="160" r="4"/><circle cx="242" cy="160" r="4"/><circle cx="290" cy="205" r="4"/><circle cx="338" cy="250" r="4"/></g>

  <text x="12" y="296" font-weight="bold">3 Weg-Zeit-Diagramm (Skala bleibt fest)</text>
  <g stroke="#bbb"><line x1="50" y1="314" x2="50" y2="434"/><line x1="50" y1="434" x2="340" y2="434"/></g>
  <text x="14" y="319">s in m</text><text x="300" y="452">t in s</text>
  <path d="M50,434 C120,430 160,410 210,380 C260,350 300,330 338,322" fill="none" stroke="#36c" stroke-width="3"/>

  <text x="12" y="482" font-weight="bold">4 Tempo zu jeder Sekunde einstellen</text>
  <g stroke="#333" fill="#eee">
    <rect x="12" y="494" width="44" height="44" rx="4"/><rect x="62" y="494" width="44" height="44" rx="4"/><rect x="112" y="494" width="44" height="44" rx="4"/>
    <rect x="162" y="494" width="44" height="44" rx="4"/><rect x="212" y="494" width="44" height="44" rx="4"/><rect x="262" y="494" width="44" height="44" rx="4"/>
  </g>
  <text x="14" y="512">t=1 s</text><text x="64" y="512">t=2 s</text><text x="114" y="512">t=3 s</text><text x="164" y="512">t=4 s</text><text x="214" y="512">t=5 s</text><text x="264" y="512">t=6 s</text>
  <text x="14" y="580" fill="#555">Pro Sekunde: Tempo + / - (Schritt 1 m/s). Start t = 0 s ist fest. 44 px hohe Tasten.</text>
  <rect x="12" y="596" width="100" height="32" rx="4" fill="#eee" stroke="#333"/><text x="22" y="616">Zurücksetzen</text>
</svg>
