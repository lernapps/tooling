<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" font-family="sans-serif" font-size="12">
  <title>Skizze: Schaltplan Messen von Stromstärke und Spannung</title>
  <g fill="none" stroke="#222" stroke-width="2">
    <path d="M60 60 H300 V240 H60 Z"/>
  </g>
  <!-- Batterie links -->
  <rect x="40" y="130" width="40" height="40" fill="#fff" stroke="none"/>
  <path d="M46 138 H74 M54 150 H66" stroke="#222" stroke-width="3"/>
  <text x="84" y="148">Batterie</text>
  <!-- Lampe oben -->
  <rect x="150" y="40" width="40" height="40" fill="#fff" stroke="none"/>
  <circle cx="170" cy="60" r="14" fill="#fff" stroke="#222" stroke-width="2"/>
  <path d="M160 50 L180 70 M180 50 L160 70" stroke="#222" stroke-width="2"/>
  <text x="152" y="28">Lampe</text>
  <!-- Amperemeter rechts in Reihe -->
  <circle cx="300" cy="150" r="18" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="294" y="155" font-weight="bold">A</text>
  <text x="248" y="120" fill="#444">in Reihe</text>
  <!-- Voltmeter parallel zur Lampe -->
  <path d="M130 60 V12 H210 V60" fill="none" stroke="#06c" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="170" cy="12" r="14" fill="#fff" stroke="#06c" stroke-width="2"/>
  <text x="165" y="17" font-weight="bold" fill="#06c">V</text>
  <text x="216" y="16" fill="#06c">parallel</text>
  <text x="16" y="285" fill="#555" font-size="11">Skizze: Schaltplan mit Amperemeter (in Reihe) und Voltmeter (parallel zur Lampe)</text>
</svg>
