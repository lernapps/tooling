<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="sans-serif" font-size="13">
  <title>Skizze Seite 3: Werkstatt Weg-Zeit-Diagramm, Fahrt und Diagramm nebeneinander</title>
  <rect width="560" height="420" fill="#fff" stroke="#999"/>
  <text x="20" y="24" font-weight="bold">Ausprobieren: Fahre die Strecke und sieh das Diagramm entstehen</text>
  <!-- Fahrt -->
  <text x="20" y="52" font-weight="bold">Fahrt (gerade Straße)</text>
  <line x1="30" y1="80" x2="530" y2="80" stroke="#333" stroke-width="3"/>
  <rect x="236" y="68" width="30" height="14" fill="#1a5fb4"/>
  <text x="251" y="102" text-anchor="middle" font-size="11">bei t = 5 s: 28 m</text>
  <!-- Zeitregler -->
  <text x="20" y="130">Zeit t:</text>
  <line x1="70" y1="126" x2="400" y2="126" stroke="#999" stroke-width="4"/>
  <circle cx="235" cy="126" r="9" fill="#c64600"/>
  <!-- Diagramm: Ursprung (70,350), t: 0-10 s = 30 px/s, s: 0-60 m = 3.5 px/m -->
  <text x="20" y="160" font-weight="bold">Weg-Zeit-Diagramm (Weg s in m über Zeit t in s)</text>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="70" y1="350" x2="380" y2="350"/><line x1="70" y1="350" x2="70" y2="170"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="70" y="366">0</text><text x="130" y="366">2</text><text x="190" y="366">4</text><text x="250" y="366">6</text>
    <text x="310" y="366">8</text><text x="370" y="366">10</text><text x="225" y="384" font-size="12">t in s</text>
    <text x="55" y="354" text-anchor="end">0</text><text x="55" y="284" text-anchor="end">20</text><text x="55" y="214" text-anchor="end">40</text>
  </g>
  <text x="20" y="188" font-size="12">s in m</text>
  <!-- Linienzug fuer v = 2,4,8,8,4 m/s -> s = 0,4,12,28,44,52 : y = 350 - 3.5*s -->
  <polyline points="70,350 130,336 190,308 250,252 310,196 370,168" fill="none" stroke="#1a5fb4" stroke-width="3"/>
  <circle cx="235" cy="215" r="6" fill="#c64600"/>
  <!-- Regler Geschwindigkeit -->
  <rect x="400" y="170" width="140" height="200" fill="#f4f4f4" stroke="#999"/>
  <text x="410" y="190" font-weight="bold">v je 2 s (m/s)</text>
  <g fill="#fff" stroke="#333">
    <rect x="410" y="200" width="120" height="26"/><rect x="410" y="232" width="120" height="26"/>
    <rect x="410" y="264" width="120" height="26"/><rect x="410" y="296" width="120" height="26"/>
    <rect x="410" y="328" width="120" height="26"/>
  </g>
  <g fill="#111"><text x="418" y="218">0–2 s: − 2 +</text><text x="418" y="250">2–4 s: − 4 +</text><text x="418" y="282">4–6 s: − 8 +</text>
    <text x="418" y="314">6–8 s: − 8 +</text><text x="418" y="346">8–10 s: − 4 +</text></g>
  <text x="20" y="405" fill="#555">Die Fahrt bleibt gerade, die Kurve im Diagramm knickt: Das Diagramm ist kein Bild der Strecke.</text>
</svg>
