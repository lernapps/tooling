<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="sans-serif" font-size="13">
  <title>Skizze: Baustein BruchErweitern (Seite 3 Erweitern; Seite 4 Kürzen in Gegenrichtung)</title>
  <rect width="360" height="330" fill="#fff" stroke="#999"/>
  <text x="16" y="26" font-weight="bold">Erweitere 2/3 mit dem Faktor 1, 2, 3 …</text>
  <text x="16" y="46" fill="#333">Der Regler „Faktor“ teilt jedes Teil feiner. Das Gefärbte bleibt gleich groß.</text>
  <text x="16" y="74" font-size="11" fill="#666">vorher: 2/3 (Faktor 1)</text>
  <g stroke="#333" fill="#9ecae1"><rect x="16" y="80" width="109" height="34"/><rect x="125" y="80" width="109" height="34"/></g>
  <rect x="234" y="80" width="109" height="34" fill="#fff" stroke="#333"/>
  <text x="16" y="146" font-size="11" fill="#666">erweitert mit 3: 6/9</text>
  <g stroke="#333" fill="#9ecae1">
    <rect x="16" y="152" width="36.3" height="34"/><rect x="52.3" y="152" width="36.3" height="34"/><rect x="88.6" y="152" width="36.3" height="34"/>
    <rect x="125" y="152" width="36.3" height="34"/><rect x="161.3" y="152" width="36.3" height="34"/><rect x="197.6" y="152" width="36.3" height="34"/>
  </g>
  <g stroke="#333" fill="#fff">
    <rect x="234" y="152" width="36.3" height="34"/><rect x="270.3" y="152" width="36.3" height="34"/><rect x="306.6" y="152" width="36.4" height="34"/>
  </g>
  <text x="16" y="216" font-size="11" fill="#666">Beide Streifen untereinander, gleich lang: so sieht man „gleich viel“.</text>
  <text x="16" y="244">Faktor: [ − ]  3  [ + ]      (Regler, 1 bis 6)</text>
  <text x="16" y="272" font-size="15">Zähler 2 · 3 = 6      Nenner 3 · 3 = 9</text>
  <text x="16" y="296" font-size="15">2/3 = 6/9</text>
  <text x="16" y="318" font-size="11" fill="#666">Beim Kürzen: Regler „Teiler“ (nur Teiler von Zähler und Nenner), Streifen werden gröber.</text>
</svg>
