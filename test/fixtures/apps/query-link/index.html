<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brüche üben</title>
  <link rel="stylesheet" href="https://fonts.example.org/css2?family=Inter">
</head>
<body>
  <main>
    <h1>Brüche üben</h1>
    <p>Hier übst du, Brüche zu kürzen. Du bekommst Aufgaben und siehst sofort, ob du richtig liegst.</p>
    <p><a id="neu" href="./">Neue Aufgaben</a></p>
  </main>
  <script>
    // a new random order on every visit, as a quiz's link to start again
    document.getElementById("neu").href = "?seed=" + (1 + Math.floor(Math.random() * 999999));
  </script>
</body>
</html>
