<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brüche üben</title>
  <script>
    // keeps its own progress, and reads every key on the origin: also those of other apps
    localStorage.setItem("lernapps:brueche:fortschritt", "3");
    for (const key of Object.keys(localStorage)) localStorage.getItem(key);
  </script>
</head>
<body>
  <main>
    <h1>Brüche üben</h1>
    <p>Hier übst du, Brüche zu kürzen. Du bekommst Aufgaben und siehst sofort, ob du richtig liegst.</p>
    <p><a href="kuerzen/">Brüche kürzen</a></p>
  </main>
</body>
</html>
