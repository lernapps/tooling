name: lernapps app check
description: >-
  Checks an app the same way its git hooks did: `lernapps check` without a flag, the command of the pre-commit and
  the pre-push hook together, nothing more. Around it only the environment: checkout, Node 26, npm ci, the Playwright
  browser from the cache. Uploads the validation report the check writes (node_modules/.cache/lernapps/), passing or
  not, as the artifact "validation-report". On main, and on a pull request from the same repo, it also uploads the
  bundle it checked (dist/) as the artifact "app" for app-publish and app-preview, so the app publishes and previews
  what was checked and builds it once. Use it as the only step of the job
  "app" in the app's workflow pages.yml, which lernapps create writes:
  `uses: lernapps/tooling/actions/app-check@<commit>`, pinned to a commit that Renovate moves forward.
  First it asks the change scope of the event, with the classifier of the action's own commit (`lernapps changes
  --ci`, changes/main.ts): a pull request against its merge base, a push before..after; a new branch,
  workflow_dispatch and every other event check everything. When the change is only the plan (.vibe/**) or only
  docs (docs/**/*.md, which an app does not bundle), the job succeeds without installing, building or checking,
  with a notice; it uploads neither report nor bundle, and app-publish and app-preview then publish nothing. So the app's
  workflow runs on every push and pull request, needs no paths filter, and its check never stays "Pending".
  The output scope says what was decided.
  A push to main does not check again what a pull request has checked already: after its check passed, the run of a
  pull request from this repo keeps its report also as the artifact "lernapps-checked-<tree>" (<tree>: the tree of
  the commit it checked). A push to main whose commit has the same tree (the pull request was up to date with main
  when it was merged) takes the bundle and the report from that run and checks nothing (checked.ts). Only a run of
  this repo counts, not one from a fork. The lookup needs the permission actions: read in the job; without it, or
  when no such run is found, the push checks as before. The output reused names the run taken.
inputs:
  working-directory:
    description: The app's folder in the workspace
    default: "."
  checkout:
    description: Check out the repo first (false when an earlier step put the app in place)
    default: "true"
  report-artifact:
    description: The name of the report's artifact (unique per workflow run)
    default: validation-report
  upload:
    description: >-
      Upload the checked bundle dist/ as the artifact "app" for app-publish and app-preview (default on main and on
      a pull request from the same repo)
    default: ${{ github.ref == 'refs/heads/main' || github.event.pull_request.head.repo.full_name == github.repository }}
outputs:
  scope:
    description: The change scope of the event (none, docs or all); only all checks the app
    value: ${{ steps.changes.outputs.scope }}
  reused:
    description: The run whose check of the same tree a push to main took instead of checking (empty when it checked)
    value: ${{ steps.checked.outputs.run-id }}
runs:
  using: composite
  steps:
    - if: inputs.checkout == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
    # The change scope, from the action's own checkout: nothing installed yet (test/changes.test.ts runs this line).
    - id: changes
      run: node "$GITHUB_ACTION_PATH/../../changes/main.ts" --ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    # Every step below runs only when the change can affect the app (output code: scope all).
    # The tree of the commit checked out: the same tree is the same app, the same tooling and the same workflow.
    - if: steps.changes.outputs.code == 'true'
      id: tree
      run: echo "tree=$(git rev-parse 'HEAD^{tree}' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    # A push to main: a run of this repo that has checked the same tree and passed (checked.ts); never fails.
    - if: steps.changes.outputs.code == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tree.outputs.tree != ''
      id: checked
      run: node "$GITHUB_ACTION_PATH/checked.ts" find
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        LERNAPPS_TREE: ${{ steps.tree.outputs.tree }}
    - if: steps.changes.outputs.code == 'true' && steps.checked.outputs.run-id != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: app
        path: ${{ inputs.working-directory }}/dist
        run-id: ${{ steps.checked.outputs.run-id }}
        github-token: ${{ github.token }}
    - if: steps.changes.outputs.code == 'true' && steps.checked.outputs.run-id != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: lernapps-checked-${{ steps.tree.outputs.tree }}
        path: ${{ inputs.working-directory }}/node_modules/.cache/lernapps
        run-id: ${{ steps.checked.outputs.run-id }}
        github-token: ${{ github.token }}
    # Every step up to the check runs only when no run was taken.
    - if: steps.changes.outputs.code == 'true' && steps.checked.outputs.run-id == ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
    - if: steps.changes.outputs.code == 'true' && steps.checked.outputs.run-id == ''
      run: npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    # The browser of the checks and the end-to-end tests: `lernapps check` installs it when it is missing.
    - if: steps.changes.outputs.code == 'true' && steps.checked.outputs.run-id == ''
      id: browser
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: playwright-${{ runner.os }}-
    # The check: exactly the command of the hooks (test/app-check.e2e.test.ts runs this line on the fixture apps).
    - if: steps.changes.outputs.code == 'true' && steps.checked.outputs.run-id == ''
      id: check
      run: npx --no -- lernapps check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - if: always() && steps.changes.outputs.code == 'true' && steps.browser.outcome == 'success' && steps.browser.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browser.outputs.cache-primary-key }}
    - if: always() && steps.changes.outputs.code == 'true' && (steps.check.outcome != 'skipped' || steps.checked.outputs.run-id != '')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-artifact }}
        path: ${{ inputs.working-directory }}/node_modules/.cache/lernapps/validation-report.yaml
        include-hidden-files: true # the report is below node_modules/.cache/
        if-no-files-found: warn # the check stopped before its report; its log says why
    - if: inputs.upload == 'true' && steps.changes.outputs.code == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: app
        path: ${{ inputs.working-directory }}/dist
        include-hidden-files: true
    # A pull request from this repo whose check passed: its report under the name of the tree it checked, which a
    # push to main with the same tree takes instead of checking again (checked.ts).
    - if: inputs.upload == 'true' && steps.changes.outputs.code == 'true' && github.event_name == 'pull_request' && steps.check.outcome == 'success' && steps.tree.outputs.tree != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: lernapps-checked-${{ steps.tree.outputs.tree }}
        path: ${{ inputs.working-directory }}/node_modules/.cache/lernapps/validation-report.yaml
        include-hidden-files: true
        overwrite: true # a re-run of the same run
