name: lernapps site deploy
description: >-
  Publishes the artifact "site" (from site-check) to the root of the gh-pages branch, which GitHub Pages
  serves (Settings → Pages → Deploy from a branch → gh-pages, / (root)), at lernapps.net/<repo>/. Leaves the previews
  alone. Use it in the job "deploy" of the site's pages.yml, on main, after the job "site" (needs: site), pinned to
  a commit. The job needs permissions: contents: write.
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: site
        path: _site
    - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
      with:
        branch: gh-pages
        folder: _site
        clean-exclude: pr-preview/
        force: false
