name: lernapps site deploy
description: >-
  Publishes the artifact "site" (from site-check) to the root of the gh-pages branch, which GitHub Pages
  serves (Settings → Pages → Deploy from a branch → gh-pages, / (root)), at lernapps.net/<repo>/. Leaves the previews
  alone, and the copies of listed apps that lernapps/apps publishes into the root site (copies.txt, one "<id> <commit>"
  per line, and a directory <id>/ per copy). Use it in the job "deploy" of the site's pages.yml, on main, after the job "site" (needs: site), pinned to
  a commit. The job needs permissions: contents: write.
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: site
        path: _site
    - name: What the deploy keeps
      id: keep
      shell: bash
      run: |
        {
          echo "patterns<<KEEP"
          echo "pr-preview/"
          if git fetch --quiet --depth=1 origin gh-pages 2>/dev/null && git cat-file -e FETCH_HEAD:copies.txt 2>/dev/null; then
            echo "copies.txt"
            git show FETCH_HEAD:copies.txt | awk '$1 ~ /^[a-z0-9]+(-[a-z0-9]+)*$/ { print $1 "/" }'
          fi
          echo "KEEP"
        } >> "$GITHUB_OUTPUT"
    - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
      with:
        branch: gh-pages
        folder: _site
        clean-exclude: ${{ steps.keep.outputs.patterns }}
        force: false
