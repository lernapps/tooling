name: lernapps site preview
description: >-
  A preview of a pull request at https://lernapps.net/<site>pr-preview/pr-<number>/, on the gh-pages branch
  next to the published site; removed when the pull request closes. Builds like site-check, with
  SITE_PATH_PREFIX (links stay inside the preview) and SITE_PREVIEW (banner, noindex) set.
  The job needs permissions: contents: write, pull-requests: write.
inputs:
  check-script:
    description: The npm script that checks the built site (a repo whose `check` checks its code names another one)
    default: check
  site:
    description: Where the repo is served on lernapps.net, e.g. "/", "/apps/", "/docs/"
    required: true
  fetch-depth:
    description: Commits to fetch (0 for the docs, whose build compares with the base branch)
    default: "1"
  comment:
    description: Let the preview action comment on the pull request (false if the repo writes its own)
    default: "true"
outputs:
  url:
    description: The URL of the preview
    value: ${{ steps.prefix.outputs.url }}
runs:
  using: composite
  steps:
    - id: prefix
      shell: bash
      env:
        SITE: ${{ inputs.site }}
        NUMBER: ${{ github.event.pull_request.number }}
      run: |
        prefix="${SITE}pr-preview/pr-${NUMBER}/"
        echo "SITE_PATH_PREFIX=$prefix" >> "$GITHUB_ENV"
        echo "SITE_PREVIEW=1" >> "$GITHUB_ENV"
        echo "url=https://lernapps.net$prefix" >> "$GITHUB_OUTPUT"
        base="lernapps.net${SITE%/}"
        echo "base=$base" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
    - if: github.event.action != 'closed'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
    - if: github.event.action != 'closed'
      run: npm ci && npm run build && npm run "$CHECK_SCRIPT"
      shell: bash
      env:
        CHECK_SCRIPT: ${{ inputs.check-script }}
    - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
      with:
        source-dir: _site
        preview-branch: gh-pages
        umbrella-dir: pr-preview
        pages-base-url: ${{ steps.prefix.outputs.base }}
        qr-code: false
        comment: ${{ inputs.comment }}
        action: auto
