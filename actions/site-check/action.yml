name: lernapps site check
description: >-
  Builds a lernapps.net site and checks the output, the same way for every site: checkout, Node 22,
  npm ci, npm run build, npm run check (or the script named by check-script). The contract with the repo: npm run
  build writes the static site into _site/, and the check script checks it (lernapps-check of the shared site frame).
  On main it uploads _site/ as the artifact "site" for site-deploy. Use it in the job "site" of the site's pages.yml
  (on push to main, pull_request and workflow_dispatch), pinned to a commit.
inputs:
  check-script:
    description: The npm script that checks the built site (a repo whose `check` checks its code names another one)
    default: check
  fetch-depth:
    description: Commits to fetch (0 for the docs, whose build compares with the base branch)
    default: "1"
  upload:
    description: Upload _site/ as the artifact "site" (default on main)
    default: ${{ github.ref == 'refs/heads/main' }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
    # Renovate can reuse a stale branch whose pull request changes nothing once merged; automerged, that
    # loops (mrsimpson/pdt42, 2026-10-10: 100 empty merges in four hours). Such a pull request must not turn
    # green. On pull_request the checkout is the merge commit, so its first parent is the base it merges into.
    - name: A Renovate pull request must change something
      if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
      shell: bash
      env:
        BASE: ${{ github.base_ref }}
      run: |
        git fetch --no-tags --quiet --deepen=1 origin
        if git diff --quiet HEAD^1 HEAD; then
          echo "::error::This pull request changes nothing compared with $BASE (stale Renovate branch). Delete the branch; Renovate recreates it."
          exit 1
        fi
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      shell: bash
    - run: npm run build
      shell: bash
    - run: npm run "$CHECK_SCRIPT"
      shell: bash
      env:
        CHECK_SCRIPT: ${{ inputs.check-script }}
    - if: inputs.upload == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: site
        path: _site
        include-hidden-files: true # .nojekyll
