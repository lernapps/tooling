name: lernapps site check
description: >-
  Builds a lernapps.net site and checks the output, the same way for every site: checkout, Node 22,
  npm ci, npm run build, npm run check (or the script named by check-script). On main it uploads _site/ as the artifact "site" for site-deploy.
inputs:
  check-script:
    description: The npm script that checks the built site (a repo whose `check` checks its code names another one)
    default: check
  fetch-depth:
    description: Commits to fetch (0 for the docs, whose build compares with the base branch)
    default: "1"
  upload:
    description: Upload _site/ as the artifact "site" (default on main)
    default: ${{ github.ref == 'refs/heads/main' }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      shell: bash
    - run: npm run build
      shell: bash
    - run: npm run "$CHECK_SCRIPT"
      shell: bash
      env:
        CHECK_SCRIPT: ${{ inputs.check-script }}
    - if: inputs.upload == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: site
        path: _site
        include-hidden-files: true # .nojekyll
