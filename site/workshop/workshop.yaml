# The page "A workshop, not a factory" (site/workshop/): the phases of the plan and what the person decides in each.
# What supports a phase comes from docs/arc42: every element (building block or interface) with `x-phase` (a list of
# the ids below), `x-agent` and, where the person works with it, `x-person`. Its box shows its title and its technology
# (a block) or protocol (an interface), in the order of the chapters, and links its card. scripts/workshop.ts renders
# the page into its template (template.html) and fails the build when an element names an unknown phase, says nothing
# for agent or person, or when a skill's phase is not that of its group (bb-skills-<phase>).
#   across    what runs through every phase, before the timeline; `catalog` what follows the listing pull request
#   phases    in the order of the plan: `question`, what `you` decide, the checkpoint (`gate`) if any
across: { label: Across all phases, question: What runs through every phase? }
phases:
  - id: explore
    title: Explore
    question: What should learners be able to do?
    you: "What the app teaches and for whom: the goal, the learners, your own material, the mistakes your learners make."
    gate: "Checkpoint research: you confirm what the app teaches."
  - id: plan
    title: Plan
    question: How will learners practise?
    you: "In one read: the tasks, the sketches and the content method."
    gate: "Checkpoint plan: nothing is built before your yes."
  - id: code
    title: Code
    question: Built locally, by the agent
    you: "Nothing. Time for a coffee: the agent builds on its own and may come back with a question only you can answer."
  - id: commit
    title: Commit
    question: Online at your yes
    you: "Whether the app goes online: you look at the preview and say yes."
    gate: "Checkpoints publish and list: the listing pull request is the review."
catalog: { label: "Then, in the catalog", question: Is it listed? }
