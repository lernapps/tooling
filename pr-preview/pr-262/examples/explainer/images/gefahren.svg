<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img">
  <title>Vier Gefahrensituationen im Umgang mit Strom</title>
  <rect width="360" height="320" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#111111">
    <rect x="6" y="6" width="168" height="150" rx="8" fill="#fdf1e7" stroke="#c55a11" stroke-width="2"/>
    <text x="14" y="26" font-weight="bold">1 Nasse Hände</text>
    <g stroke="#1f4e79" stroke-width="2" fill="none">
      <path d="M40 50 q10 18 0 30 q-10 -12 0 -30z" fill="#9dc3e6"/>
      <path d="M58 58 q10 18 0 30 q-10 -12 0 -30z" fill="#9dc3e6"/>
    </g>
    <rect x="80" y="60" width="50" height="40" rx="5" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <line x1="92" y1="60" x2="92" y2="48" stroke="#111111" stroke-width="3"/>
    <line x1="118" y1="60" x2="118" y2="48" stroke="#111111" stroke-width="3"/>
    <text x="14" y="126">Wasser leitet Strom.</text>
    <text x="14" y="144">Nasse Hände: nein.</text>

    <rect x="186" y="6" width="168" height="150" rx="8" fill="#fdf1e7" stroke="#c55a11" stroke-width="2"/>
    <text x="194" y="26" font-weight="bold">2 Beschädigtes Kabel</text>
    <path d="M200 84 H250" stroke="#111111" stroke-width="5"/>
    <path d="M268 84 H326" stroke="#111111" stroke-width="5"/>
    <path d="M250 84 l8 -10 l4 20 l8 -10" stroke="#c00000" stroke-width="2" fill="none"/>
    <text x="194" y="126">Kabel nicht anfassen.</text>
    <text x="194" y="144">Gerät nicht benutzen.</text>

    <rect x="6" y="164" width="168" height="150" rx="8" fill="#fdf1e7" stroke="#c55a11" stroke-width="2"/>
    <text x="14" y="184" font-weight="bold">3 Steckdose</text>
    <rect x="54" y="206" width="70" height="60" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <circle cx="74" cy="232" r="6" fill="#111111"/>
    <circle cx="104" cy="232" r="6" fill="#111111"/>
    <rect x="80" y="244" width="18" height="8" fill="#111111"/>
    <path d="M130 216 l18 8 l-8 6 l8 8 l-14 4 l-6 -18z" fill="#c55a11"/>
    <text x="14" y="290">Nichts hineinstecken.</text>
    <text x="14" y="306">Kinder fernhalten.</text>

    <rect x="186" y="164" width="168" height="150" rx="8" fill="#fdf1e7" stroke="#c55a11" stroke-width="2"/>
    <text x="194" y="184" font-weight="bold">4 Stromunfall</text>
    <circle cx="220" cy="214" r="12" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <path d="M220 226 V262 M208 240 H232 M220 262 L208 284 M220 262 L232 284" stroke="#111111" stroke-width="2" fill="none"/>
    <path d="M258 206 l-14 26 h12 l-10 26 l22 -32 h-12 l10 -20z" fill="#c00000"/>
    <text x="250" y="288" font-size="14" font-weight="bold">112</text>
    <text x="194" y="304">Erst Strom aus, dann 112.</text>
  </g>
</svg>
