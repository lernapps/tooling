<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img">
  <title>Reihenschaltung und Parallelschaltung</title>
  <rect width="360" height="320" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#111111">
    <text x="8" y="18" font-weight="bold">Reihenschaltung: ein Weg</text>
    <path d="M40 50 H110" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M150 50 H210" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M250 50 H320 V120 H40 V50" stroke="#1f4e79" stroke-width="2" fill="none"/>

    <line x1="32" y1="62" x2="32" y2="108" stroke="#111111" stroke-width="2"/>
    <line x1="40" y1="70" x2="40" y2="100" stroke="#111111" stroke-width="2"/>
    <text x="6" y="60">+</text>
    <text x="24" y="118">−</text>

    <circle cx="130" cy="50" r="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <line x1="120" y1="40" x2="140" y2="60" stroke="#111111" stroke-width="2"/>
    <line x1="140" y1="40" x2="120" y2="60" stroke="#111111" stroke-width="2"/>
    <text x="112" y="34">Lampe 1</text>

    <circle cx="230" cy="50" r="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <line x1="220" y1="40" x2="240" y2="60" stroke="#111111" stroke-width="2"/>
    <line x1="240" y1="40" x2="220" y2="60" stroke="#111111" stroke-width="2"/>
    <text x="212" y="34">Lampe 2</text>

    <circle cx="180" cy="120" r="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="175" y="125">A</text>
    <text x="130" y="150">Ein Weg: überall gleicher Strom.</text>

    <text x="8" y="188" font-weight="bold">Parallelschaltung: zwei Wege</text>
    <path d="M40 218 H120" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M120 218 H240" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M240 218 H320 V285 H40 V218" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M120 218 V270 H240 V218" stroke="#1f4e79" stroke-width="2" fill="none"/>

    <line x1="32" y1="230" x2="32" y2="276" stroke="#111111" stroke-width="2"/>
    <line x1="40" y1="238" x2="40" y2="268" stroke="#111111" stroke-width="2"/>
    <text x="6" y="228">+</text>
    <text x="24" y="286">−</text>

    <circle cx="180" cy="218" r="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <line x1="170" y1="208" x2="190" y2="228" stroke="#111111" stroke-width="2"/>
    <line x1="190" y1="208" x2="170" y2="228" stroke="#111111" stroke-width="2"/>
    <text x="162" y="202">Lampe 1</text>

    <circle cx="180" cy="270" r="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <line x1="170" y1="260" x2="190" y2="280" stroke="#111111" stroke-width="2"/>
    <line x1="190" y1="260" x2="170" y2="280" stroke="#111111" stroke-width="2"/>
    <text x="162" y="300">Lampe 2</text>

    <circle cx="280" cy="285" r="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="275" y="290">A</text>
    <text x="88" y="315">Zwei Wege: der Strom teilt sich auf.</text>
  </g>
</svg>
