<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180" role="img">
  <title>Zwei Stromkreise A und B</title>
  <rect width="360" height="180" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#111111">
    <text x="8" y="18" font-weight="bold">A</text>
    <path d="M30 45 H150 V120 H30 V45" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <line x1="22" y1="62" x2="22" y2="103" stroke="#111111" stroke-width="2"/>
    <line x1="30" y1="72" x2="30" y2="93" stroke="#111111" stroke-width="2"/>
    <circle cx="95" cy="45" r="12" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <line x1="87" y1="37" x2="103" y2="53" stroke="#111111" stroke-width="2"/>
    <line x1="103" y1="37" x2="87" y2="53" stroke="#111111" stroke-width="2"/>

    <text x="188" y="18" font-weight="bold">B</text>
    <path d="M210 45 H330 V120 H210 V45" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <line x1="202" y1="62" x2="202" y2="103" stroke="#111111" stroke-width="2"/>
    <line x1="210" y1="72" x2="210" y2="93" stroke="#111111" stroke-width="2"/>
    <circle cx="275" cy="45" r="12" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <line x1="267" y1="37" x2="283" y2="53" stroke="#111111" stroke-width="2"/>
    <line x1="283" y1="37" x2="267" y2="53" stroke="#111111" stroke-width="2"/>
    <path d="M250 120 l10 -10 v20 z" fill="#111111"/>
    <line x1="260" y1="120" x2="278" y2="120" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
