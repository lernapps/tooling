<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="Zwei gleich lange Balken, jeder in sechs gleich große Felder geteilt: oben drei Felder blau, unten zwei Felder grün.">
  <rect width="720" height="220" fill="#ffffff"/>
  <text x="10" y="42" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a">1/2 = 3/6</text>
  <text x="10" y="132" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a">1/3 = 2/6</text>
  <g stroke="#0f172a" stroke-width="2">
    <rect x="130" y="10" width="90" height="50" fill="#3b82f6"/>
    <rect x="220" y="10" width="90" height="50" fill="#3b82f6"/>
    <rect x="310" y="10" width="90" height="50" fill="#3b82f6"/>
    <rect x="400" y="10" width="90" height="50" fill="#f1f5f9"/>
    <rect x="490" y="10" width="90" height="50" fill="#f1f5f9"/>
    <rect x="580" y="10" width="90" height="50" fill="#f1f5f9"/>
  </g>
  <g stroke="#0f172a" stroke-width="2">
    <rect x="130" y="100" width="90" height="50" fill="#22c55e"/>
    <rect x="220" y="100" width="90" height="50" fill="#22c55e"/>
    <rect x="310" y="100" width="90" height="50" fill="#f1f5f9"/>
    <rect x="400" y="100" width="90" height="50" fill="#f1f5f9"/>
    <rect x="490" y="100" width="90" height="50" fill="#f1f5f9"/>
    <rect x="580" y="100" width="90" height="50" fill="#f1f5f9"/>
  </g>
  <text x="10" y="195" font-family="system-ui, sans-serif" font-size="16" fill="#334155">Beide Balken sind gleich lang und in gleich große Sechstel geteilt.</text>
</svg>
