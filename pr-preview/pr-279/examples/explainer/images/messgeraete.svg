<svg xmlns="http://www.w3.org/2000/svg" width="360" height="270" viewBox="0 0 360 270" role="img">
  <title>Amperemeter in Reihe und Voltmeter parallel</title>
  <rect width="360" height="270" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#111111">
    <text x="8" y="18" font-weight="bold">Richtig messen</text>

    <path d="M40 50 H145" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M195 50 H276" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M304 50 H320 V140 H40 V50" stroke="#1f4e79" stroke-width="2" fill="none"/>

    <line x1="32" y1="65" x2="32" y2="125" stroke="#111111" stroke-width="2"/>
    <line x1="40" y1="75" x2="40" y2="115" stroke="#111111" stroke-width="2"/>
    <text x="6" y="62">+</text>
    <text x="24" y="138">−</text>
    <text x="6" y="158">Batterie</text>

    <circle cx="170" cy="50" r="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <line x1="160" y1="40" x2="180" y2="60" stroke="#111111" stroke-width="2"/>
    <line x1="180" y1="40" x2="160" y2="60" stroke="#111111" stroke-width="2"/>
    <text x="146" y="32">Lampe</text>

    <circle cx="290" cy="50" r="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="285" y="55">A</text>

    <path d="M150 50 V95 H190 V50" stroke="#c55a11" stroke-width="2" fill="none"/>
    <circle cx="170" cy="95" r="14" fill="#ffffff" stroke="#c55a11" stroke-width="2"/>
    <text x="165" y="100" fill="#c55a11">V</text>


    <rect x="200" y="170" width="140" height="58" rx="8" fill="#f2f2f2" stroke="#111111" stroke-width="2"/>
    <text x="212" y="192" font-size="13">Anzeige</text>
    <text x="212" y="218" font-size="20">0,30 A</text>
  </g>
</svg>
