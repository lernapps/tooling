<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img">
  <title>Geschlossener und offener Stromkreis</title>
  <rect width="360" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#111111">
    <text x="8" y="18" font-weight="bold">Geschlossen: Der Kreis ist vollständig.</text>

    <path d="M40 60 H105" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M145 60 H215" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M255 60 H320 V125" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M320 125 H230" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M190 125 H130" stroke="#1f4e79" stroke-width="2" fill="none"/>
    <path d="M90 125 H40 V60" stroke="#1f4e79" stroke-width="2" fill="none"/>

    <line x1="32" y1="75" x2="32" y2="110" stroke="#111111" stroke-width="2"/>
    <line x1="40" y1="82" x2="40" y2="103" stroke="#111111" stroke-width="2"/>
    <text x="6" y="70">+</text>
    <text x="24" y="122">−</text>

    <circle cx="125" cy="60" r="13" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <line x1="116" y1="51" x2="134" y2="69" stroke="#111111" stroke-width="2"/>
    <line x1="134" y1="51" x2="116" y2="69" stroke="#111111" stroke-width="2"/>
    <text x="114" y="88">Lampe</text>

    <circle cx="235" cy="60" r="13" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="230" y="65">A2</text>

    <circle cx="110" cy="125" r="13" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="105" y="130">A1</text>

    <circle cx="210" cy="125" r="13" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="205" y="130">A3</text>

    <path d="M60 125 l12 -10 v20 z" fill="#111111"/>
    <text x="45" y="155">Schalter</text>

    <text x="140" y="105" font-size="14">gleicher Wert an allen drei Messern</text>

    <text x="8" y="180" font-weight="bold">Offen: Der Kreis ist unterbrochen.</text>
    <path d="M40 222 H105" stroke="#777777" stroke-width="2" fill="none"/>
    <path d="M145 222 H215" stroke="#777777" stroke-width="2" fill="none"/>
    <path d="M255 222 H320 V287" stroke="#777777" stroke-width="2" fill="none"/>
    <path d="M320 287 H230" stroke="#777777" stroke-width="2" fill="none"/>
    <path d="M190 287 H130" stroke="#777777" stroke-width="2" fill="none"/>
    <path d="M90 287 H40 V222" stroke="#777777" stroke-width="2" fill="none"/>

    <line x1="32" y1="237" x2="32" y2="272" stroke="#111111" stroke-width="2"/>
    <line x1="40" y1="244" x2="40" y2="265" stroke="#111111" stroke-width="2"/>
    <text x="6" y="232">+</text>
    <text x="24" y="284">−</text>

    <circle cx="180" cy="222" r="13" fill="#ffffff" stroke="#999999" stroke-width="2"/>
    <line x1="171" y1="213" x2="189" y2="231" stroke="#999999" stroke-width="2"/>
    <line x1="189" y1="213" x2="171" y2="231" stroke="#999999" stroke-width="2"/>
    <text x="169" y="250">Lampe aus</text>

    <path d="M60 287 l12 -10 v20 z" fill="#111111"/>
    <text x="52" y="277">offen</text>
  </g>
</svg>
