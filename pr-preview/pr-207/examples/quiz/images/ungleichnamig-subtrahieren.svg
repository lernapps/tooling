<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="Ein Balken aus zwölf gleich großen Feldern: neun Felder blau, zwei Felder rot, ein Feld leer.">
  <rect width="720" height="180" fill="#ffffff"/>
  <text x="10" y="30" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a">3/4 = 9/12</text>
  <text x="140" y="30" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a">−</text>
  <text x="165" y="30" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a">1/6 = 2/12</text>
  <g stroke="#0f172a" stroke-width="2">
    <rect x="10" y="50" width="57" height="80" fill="#3b82f6"/>
    <rect x="69" y="50" width="57" height="80" fill="#3b82f6"/>
    <rect x="128" y="50" width="57" height="80" fill="#3b82f6"/>
    <rect x="187" y="50" width="57" height="80" fill="#3b82f6"/>
    <rect x="246" y="50" width="57" height="80" fill="#3b82f6"/>
    <rect x="305" y="50" width="57" height="80" fill="#3b82f6"/>
    <rect x="364" y="50" width="57" height="80" fill="#3b82f6"/>
    <rect x="423" y="50" width="57" height="80" fill="#3b82f6"/>
    <rect x="482" y="50" width="57" height="80" fill="#3b82f6"/>
    <rect x="541" y="50" width="57" height="80" fill="#ef4444"/>
    <rect x="600" y="50" width="57" height="80" fill="#ef4444"/>
    <rect x="659" y="50" width="57" height="80" fill="#f1f5f9"/>
  </g>
  <text x="10" y="165" font-family="system-ui, sans-serif" font-size="16" fill="#334155">Erst gleich große Zwölftel bilden, dann die roten Felder wegnehmen.</text>
</svg>
