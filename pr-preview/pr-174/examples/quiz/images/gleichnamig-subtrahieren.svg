<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="Ein Balken aus sieben gleich großen Feldern: drei Felder blau, zwei Felder rot, zwei Felder leer.">
  <rect width="720" height="180" fill="#ffffff"/>
  <text x="10" y="30" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a">5/7</text>
  <text x="70" y="30" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a">−</text>
  <text x="95" y="30" font-family="system-ui, sans-serif" font-size="18" fill="#0f172a">2/7</text>
  <g stroke="#0f172a" stroke-width="2">
    <rect x="10" y="50" width="98" height="80" fill="#3b82f6"/>
    <rect x="110" y="50" width="98" height="80" fill="#3b82f6"/>
    <rect x="210" y="50" width="98" height="80" fill="#3b82f6"/>
    <rect x="310" y="50" width="98" height="80" fill="#ef4444"/>
    <rect x="410" y="50" width="98" height="80" fill="#ef4444"/>
    <rect x="510" y="50" width="98" height="80" fill="#f1f5f9"/>
    <rect x="610" y="50" width="98" height="80" fill="#f1f5f9"/>
  </g>
  <text x="10" y="165" font-family="system-ui, sans-serif" font-size="16" fill="#334155">Die zwei roten Felder werden weggenommen. Die gleich großen Felder bleiben.</text>
</svg>
